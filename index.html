<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صرافی من — داشبورد شخصی ارز دیجیتال</title>
<meta name="description" content="داشبورد شخصی مدیریت و تحلیل دارایی‌های ارز دیجیتال، متصل به حساب نوبیتکس">
<meta name="theme-color" content="#0a0e17">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<style>
/* ===================================================================
   توکن‌های طراحی
   =================================================================== */
:root{
  --bg:            #0a0e17;
  --bg-soft:       #0d1220;
  --surface:       #121a2b;
  --surface-2:     #17203399;
  --surface-hover: #1a2338;
  --border:        #202a40;
  --border-soft:   #192234;

  --accent:        #17c3b2;
  --accent-strong: #0ea89a;
  --accent-soft:   #17c3b21a;
  --blue:          #4f8cff;
  --blue-soft:     #4f8cff1a;

  --green:         #2ecc82;
  --green-soft:    #2ecc821a;
  --red:           #f0555f;
  --red-soft:      #f0555f1a;
  --amber:         #e7a33e;
  --amber-soft:    #e7a33e1a;

  --text:          #e9eef6;
  --text-dim:      #93a0b8;
  --text-faint:    #5c6680;

  --radius-sm:     8px;
  --radius-md:     12px;
  --radius-lg:     16px;

  --shadow-card:   0 1px 0 0 #ffffff05 inset, 0 8px 24px -12px #00000080;

  --sidebar-w:     248px;
  --topbar-h:      64px;

  --ease: cubic-bezier(.4,0,.2,1);
}

[data-theme="light"]{
  --bg:            #f4f6fa;
  --bg-soft:       #eef1f6;
  --surface:       #ffffff;
  --surface-2:     #ffffffcc;
  --surface-hover: #f1f4f9;
  --border:        #e2e7f0;
  --border-soft:   #ebeef4;
  --text:          #121a2b;
  --text-dim:      #5c6680;
  --text-faint:    #8a93a8;
  --shadow-card:   0 1px 0 0 #ffffff inset, 0 8px 24px -14px #0f172a26;
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Vazirmatn", "Vazirmatn FD", sans-serif;
  font-size:15px;
  line-height:1.7;
  direction:rtl;
  -webkit-font-smoothing:antialiased;
  transition:background .25s var(--ease), color .25s var(--ease);
}

img{ max-width:100%; display:block; }
button{ font-family:inherit; }
input,select{ font-family:inherit; }
a{ color:inherit; text-decoration:none; }

::selection{ background:var(--accent-soft); color:var(--accent); }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
::-webkit-scrollbar-thumb:hover{ background:var(--text-faint); }

:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
  border-radius:4px;
}

.num{
  direction:ltr;
  unicode-bidi:isolate;
  font-variant-numeric:tabular-nums;
}

.mono-num{
  direction:ltr;
  unicode-bidi:isolate;
  font-variant-numeric:tabular-nums;
}

h1,h2,h3,h4{ margin:0; font-weight:700; letter-spacing:-.01em; }
p{ margin:0; }

.text-dim{ color:var(--text-dim); }
.text-faint{ color:var(--text-faint); }
.text-green{ color:var(--green); }
.text-red{ color:var(--red); }

.up{ color:var(--green); }
.down{ color:var(--red); }

.sr-only{
  position:absolute; width:1px; height:1px;
  padding:0; margin:-1px; overflow:hidden;
  clip:rect(0,0,0,0); white-space:nowrap; border:0;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}
/* ===================================================================
   اسکلت برنامه
   =================================================================== */
#app{ min-height:100%; }

/* ---------- صفحه اتصال (بدون سایدبار) ---------- */
.connect-shell{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(1100px 500px at 85% -10%, #17c3b214, transparent 60%),
    radial-gradient(900px 500px at 10% 110%, #4f8cff10, transparent 60%),
    var(--bg);
}

/* ---------- داشبورد (با سایدبار) ---------- */
.shell{
  display:grid;
  grid-template-columns: 1fr var(--sidebar-w);
  min-height:100vh;
}

.sidebar{
  grid-column:2;
  border-inline-start:1px solid var(--border-soft);
  background:var(--bg-soft);
  padding:20px 16px;
  display:flex;
  flex-direction:column;
  gap:4px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 10px 20px;
}
.brand-mark{
  width:34px; height:34px; border-radius:10px;
  background:linear-gradient(135deg, var(--accent), var(--blue));
  display:flex; align-items:center; justify-content:center;
  color:#061513; font-weight:700; font-size:15px;
  flex:none;
}
.brand-name{ font-weight:700; font-size:15px; }
.brand-sub{ font-size:11px; color:var(--text-faint); }

.nav-group{ margin-bottom:10px; }
.nav-label{
  font-size:11px; color:var(--text-faint); padding:10px 10px 6px;
}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px;
  border-radius:var(--radius-sm);
  color:var(--text-dim);
  font-size:13.5px;
  cursor:pointer;
  transition:background .15s var(--ease), color .15s var(--ease);
  position:relative;
}
.nav-item .ic{ width:18px; height:18px; flex:none; opacity:.9; }
.nav-item:hover{ background:var(--surface-hover); color:var(--text); }
.nav-item.active{
  background:var(--accent-soft);
  color:var(--accent);
}
.nav-item.active::before{
  content:"";
  position:absolute; inset-inline-end:-16px; top:50%; transform:translateY(-50%);
  width:3px; height:18px; border-radius:3px;
  background:var(--accent);
}

.sidebar-foot{
  margin-top:auto;
  padding-top:14px;
  border-top:1px solid var(--border-soft);
}

/* ---------- محتوای اصلی ---------- */
.main{
  grid-column:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:var(--topbar-h);
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  gap:14px;
  padding:0 24px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
}
.topbar-left{ display:flex; align-items:center; gap:12px; min-width:0; }
.topbar-title{ font-size:16px; font-weight:700; white-space:nowrap; }
.topbar-right{ display:flex; align-items:center; gap:10px; }

.menu-btn{
  display:none;
  width:36px; height:36px; border-radius:var(--radius-sm);
  align-items:center; justify-content:center;
  background:var(--surface); border:1px solid var(--border);
  color:var(--text); cursor:pointer;
}

.content{
  flex:1;
  padding:22px 24px 90px;
  max-width:1280px;
  width:100%;
  margin:0 auto;
}

.page-head{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:12px; margin-bottom:18px; flex-wrap:wrap;
}
.page-head h1{ font-size:20px; }
.page-head .sub{ font-size:13px; color:var(--text-dim); margin-top:4px; }

/* ---------- نوار پایین موبایل ---------- */
.bottom-nav{
  display:none;
  position:fixed; inset-inline:0; bottom:0; z-index:30;
  background:color-mix(in srgb, var(--bg-soft) 92%, transparent);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--border-soft);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  justify-content:space-around;
}
.bottom-nav .bn-item{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10.5px; color:var(--text-faint);
  padding:6px 8px; border-radius:10px; cursor:pointer;
}
.bottom-nav .bn-item.active{ color:var(--accent); }
.bottom-nav .bn-item .ic{ width:19px; height:19px; }

/* ---------- واکنش‌گرایی ---------- */
@media (max-width: 1020px){
  .sidebar{ width:220px; }
}

@media (max-width: 860px){
  .shell{ grid-template-columns:1fr; }
  .sidebar{
    position:fixed; inset-inline-end:0; top:0; height:100vh;
    width:260px; z-index:50;
    transform:translateX(104%);
    transition:transform .28s var(--ease);
    box-shadow:-20px 0 50px -20px #00000080;
  }
  [dir="rtl"] .sidebar{ transform:translateX(-104%); }
  .sidebar.open{ transform:translateX(0); }
  .sidebar-scrim{
    display:none; position:fixed; inset:0; background:#00000066;
    z-index:40;
  }
  .sidebar-scrim.open{ display:block; }
  .menu-btn{ display:inline-flex; }
  .main{ grid-column:1; }
  .content{ padding:16px 14px 90px; }
  .bottom-nav{ display:flex; }
}

@media (max-width: 520px){
  .topbar{ padding:0 14px; }
  .topbar-title{ font-size:14.5px; }
}
/* ===================================================================
   کامپوننت‌های پایه
   =================================================================== */

.card{
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
}
.card-pad{ padding:18px; }
.card-head{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; margin-bottom:14px;
}
.card-title{ font-size:14px; font-weight:700; }
.card-title .sub{ font-size:11.5px; color:var(--text-faint); font-weight:400; margin-top:2px; }

/* ---------- دکمه‌ها ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  height:38px; padding:0 16px;
  border-radius:var(--radius-sm);
  border:1px solid transparent;
  font-size:13.5px; font-weight:600;
  cursor:pointer;
  transition:transform .12s var(--ease), background .15s var(--ease), border-color .15s var(--ease), opacity .15s;
  white-space:nowrap;
}
.btn:active{ transform:scale(.97); }
.btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }

.btn-primary{ background:var(--accent); color:#06231f; }
.btn-primary:hover:not(:disabled){ background:var(--accent-strong); }

.btn-ghost{ background:var(--surface-hover); color:var(--text); border-color:var(--border); }
.btn-ghost:hover:not(:disabled){ background:var(--border-soft); }

.btn-outline{ background:transparent; color:var(--text-dim); border-color:var(--border); }
.btn-outline:hover:not(:disabled){ color:var(--text); border-color:var(--text-faint); }

.btn-danger-ghost{ background:var(--red-soft); color:var(--red); }
.btn-danger-ghost:hover:not(:disabled){ background:#f0555f2b; }

.btn-sm{ height:32px; padding:0 12px; font-size:12.5px; }
.btn-icon{ width:38px; padding:0; flex:none; }
.btn-block{ width:100%; }

.btn .spin{
  width:14px; height:14px; border-radius:50%;
  border:2px solid currentColor; border-inline-end-color:transparent;
  animation:spin .7s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---------- فرم‌ها ---------- */
.field{ display:flex; flex-direction:column; gap:7px; }
.field label{ font-size:12.5px; color:var(--text-dim); font-weight:600; }
.field-hint{ font-size:11.5px; color:var(--text-faint); }
.field-error{ font-size:11.5px; color:var(--red); display:flex; align-items:center; gap:5px; }

.input-wrap{ position:relative; display:flex; align-items:center; }
.input{
  width:100%; height:44px;
  background:var(--bg-soft);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  color:var(--text);
  padding:0 14px;
  font-size:13.5px;
  outline:none;
  transition:border-color .15s var(--ease), background .15s var(--ease);
}
.input::placeholder{ color:var(--text-faint); }
.input:focus{ border-color:var(--accent); background:var(--surface); }
.input.has-error{ border-color:var(--red); }
.input-wrap.api-field .input{ padding-left:84px; font-family:monospace; letter-spacing:.3px; direction:ltr; text-align:left; }
.input-actions{
  position:absolute; left:8px; top:50%; transform:translateY(-50%);
  display:flex; gap:4px;
}
.input-icon-btn{
  width:28px; height:28px; border-radius:7px;
  display:flex; align-items:center; justify-content:center;
  background:transparent; border:none; color:var(--text-faint);
  cursor:pointer;
}
.input-icon-btn:hover{ background:var(--surface-hover); color:var(--text); }

.select{
  height:38px; border-radius:var(--radius-sm);
  background:var(--bg-soft); border:1px solid var(--border);
  color:var(--text); padding:0 10px; font-size:13px; outline:none;
}

.search-wrap{ position:relative; flex:1; min-width:180px; }
.search-wrap .ic{
  position:absolute; inset-inline-start:13px; top:50%; transform:translateY(-50%);
  width:16px; height:16px; color:var(--text-faint); pointer-events:none;
}
.search-wrap .input{ padding-inline-start:38px; }

/* ---------- نشان‌ها ---------- */
.badge{
  display:inline-flex; align-items:center; gap:6px;
  font-size:11.5px; font-weight:600;
  padding:5px 10px; border-radius:999px;
}
.badge-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }
.badge-green{ background:var(--green-soft); color:var(--green); }
.badge-red{ background:var(--red-soft); color:var(--red); }
.badge-amber{ background:var(--amber-soft); color:var(--amber); }
.badge-blue{ background:var(--blue-soft); color:var(--blue); }
.badge-gray{ background:var(--surface-hover); color:var(--text-dim); }

.chip{
  display:inline-flex; align-items:center; gap:6px;
  height:32px; padding:0 13px; border-radius:999px;
  background:var(--surface-hover); border:1px solid var(--border);
  color:var(--text-dim); font-size:12.5px; cursor:pointer;
  transition:all .15s var(--ease);
}
.chip.active{ background:var(--accent-soft); color:var(--accent); border-color:transparent; }
.chip:hover:not(.active){ color:var(--text); }

/* ---------- جدول ---------- */
.table-wrap{ overflow-x:auto; }
table.tbl{ width:100%; border-collapse:collapse; font-size:13px; min-width:640px; }
.tbl thead th{
  text-align:start; font-weight:600; color:var(--text-faint);
  font-size:11.5px; padding:0 14px 10px; white-space:nowrap;
}
.tbl tbody td{ padding:13px 14px; border-top:1px solid var(--border-soft); white-space:nowrap; }
.tbl tbody tr{ transition:background .12s var(--ease); cursor:pointer; }
.tbl tbody tr:hover{ background:var(--surface-hover); }
.tbl .cell-asset{ display:flex; align-items:center; gap:10px; cursor:pointer; }
.coin-ic{
  width:28px; height:28px; border-radius:50%; flex:none;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; color:#061513;
  background:linear-gradient(135deg, var(--accent), var(--blue));
}
.tbl th.sortable{ cursor:pointer; user-select:none; }
.tbl th.sortable .ic{ width:11px; height:11px; opacity:.5; vertical-align:middle; margin-inline-start:3px; }

/* ---------- وضعیت‌های خالی / خطا / بارگذاری ---------- */
.state-box{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:10px;
  padding:46px 20px;
  color:var(--text-dim);
}
.state-box .ic{ width:34px; height:34px; color:var(--text-faint); margin-bottom:4px; }
.state-box .title{ font-size:14px; font-weight:700; color:var(--text); }
.state-box .desc{ font-size:12.5px; color:var(--text-faint); max-width:320px; }

.skel{
  background:linear-gradient(90deg, var(--surface-hover) 25%, var(--border-soft) 37%, var(--surface-hover) 63%);
  background-size:400% 100%;
  animation:skel-sheen 1.4s ease infinite;
  border-radius:8px;
}
@keyframes skel-sheen{ 0%{ background-position:100% 50%; } 100%{ background-position:0 50%; } }

.toast-host{
  position:fixed; bottom:22px; inset-inline-end:22px; z-index:200;
  display:flex; flex-direction:column; gap:8px; max-width:340px;
}
@media (max-width:860px){ .toast-host{ bottom:76px; inset-inline-end:14px; inset-inline-start:14px; max-width:none; } }
.toast{
  display:flex; align-items:flex-start; gap:10px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-md); padding:13px 14px;
  box-shadow:0 12px 30px -10px #000000aa;
  font-size:12.5px;
  animation:toast-in .22s var(--ease);
}
@keyframes toast-in{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
.toast .ic{ width:17px; height:17px; flex:none; margin-top:1px; }
.toast.success .ic{ color:var(--green); }
.toast.error .ic{ color:var(--red); }
.toast.info .ic{ color:var(--blue); }

/* ---------- نشانگر داده آزمایشی ---------- */
.mock-flag{
  display:inline-flex; align-items:center; gap:5px;
  font-size:10.5px; color:var(--amber);
  background:var(--amber-soft); padding:3px 8px; border-radius:6px;
  font-weight:600;
}

/* ---------- تب‌ها ---------- */
.tabs{ display:flex; gap:4px; background:var(--bg-soft); padding:4px; border-radius:10px; border:1px solid var(--border-soft); width:fit-content; }
.tab-btn{
  padding:8px 14px; border-radius:7px; font-size:12.5px; font-weight:600;
  color:var(--text-faint); cursor:pointer; border:none; background:transparent;
}
.tab-btn.active{ background:var(--surface); color:var(--text); box-shadow:0 1px 0 var(--border); }

/* ---------- سوییچ ---------- */
.switch{ position:relative; width:42px; height:24px; flex:none; }
.switch input{ opacity:0; width:0; height:0; position:absolute; }
.switch .track{
  position:absolute; inset:0; background:var(--border); border-radius:999px;
  cursor:pointer; transition:background .18s var(--ease);
}
.switch .thumb{
  position:absolute; width:18px; height:18px; border-radius:50%; background:#fff;
  top:3px; inset-inline-start:3px; transition:inset-inline-start .18s var(--ease);
}
.switch input:checked + .track{ background:var(--accent); }
.switch input:checked + .track .thumb{ inset-inline-start:21px; }

/* ---------- ردیف تنظیمات ---------- */
.set-row{
  display:flex; align-items:center; justify-content:space-between;
  gap:14px; padding:15px 2px;
  border-top:1px solid var(--border-soft);
}
.set-row:first-child{ border-top:none; }
.set-row .label{ font-size:13.5px; font-weight:600; }
.set-row .desc{ font-size:11.5px; color:var(--text-faint); margin-top:2px; }

/* ---------- مودال ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:#060a12cc; backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center; z-index:300;
  padding:20px;
}
.modal{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-lg); width:100%; max-width:420px;
  padding:22px; box-shadow:0 30px 70px -20px #000000cc;
  animation:modal-in .18s var(--ease);
}
@keyframes modal-in{ from{ opacity:0; transform:scale(.96); } to{ opacity:1; transform:none; } }
.modal h3{ font-size:15.5px; margin-bottom:8px; }
.modal p{ font-size:13px; color:var(--text-dim); line-height:1.8; }
.modal-actions{ display:flex; gap:10px; margin-top:20px; }
.modal-actions .btn{ flex:1; }

.icon-btn{
  width:34px; height:34px; border-radius:var(--radius-sm);
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--surface-hover); border:1px solid var(--border);
  color:var(--text-dim); cursor:pointer;
}
.icon-btn:hover{ color:var(--text); }
.icon-btn .ic{ width:17px; height:17px; }

hr.sep{ border:none; border-top:1px solid var(--border-soft); margin:16px 0; }
/* ===================================================================
   صفحه اتصال
   =================================================================== */
.connect-card{ width:100%; max-width:460px; }
.connect-logo{
  display:flex; align-items:center; gap:10px; justify-content:center;
  margin-bottom:22px;
}
.connect-logo .brand-mark{ width:40px; height:40px; border-radius:12px; font-size:17px; }
.connect-logo-text{ text-align:right; }
.connect-logo-text b{ font-size:16px; display:block; }
.connect-logo-text span{ font-size:11px; color:var(--text-faint); }

.connect-title{ text-align:center; font-size:19px; margin-bottom:6px; }
.connect-desc{ text-align:center; font-size:13px; color:var(--text-dim); margin-bottom:24px; line-height:1.9; }

.guide-toggle{
  display:flex; align-items:center; justify-content:space-between;
  padding:13px 14px; background:var(--bg-soft); border:1px solid var(--border-soft);
  border-radius:var(--radius-sm); cursor:pointer; font-size:12.5px; font-weight:600;
  color:var(--text-dim); margin-bottom:14px;
}
.guide-steps{

<script>
// ===================================================================
// توابع کمکی عمومی: قالب‌بندی عدد، تاریخ، ابزارهای DOM
// ===================================================================

const Utils = (() => {

  function formatNumber(value, { decimals = 2, compact = false } = {}){
    if(value === null || value === undefined || Number.isNaN(value)) return "—";
    const num = Number(value);
    if(compact){
      const abs = Math.abs(num);
      if(abs >= 1e9) return (num/1e9).toLocaleString("en-US",{maximumFractionDigits:2}) + " میلیارد";
      if(abs >= 1e6) return (num/1e6).toLocaleString("en-US",{maximumFractionDigits:2}) + " میلیون";
      if(abs >= 1e3) return (num/1e3).toLocaleString("en-US",{maximumFractionDigits:1}) + " هزار";
    }
    return num.toLocaleString(numberLocale(), { maximumFractionDigits: decimals, minimumFractionDigits: 0 });
  }

  // نرخ تبدیل آزمایشی تومان به تتر — بر اساس آخرین قیمت USDT/IRT در داده بازار
  function usdtRate(){
    const usdt = (typeof MockData !== "undefined") ? MockData.coins.find(c => c.id === "usdt") : null;
    return (usdt && usdt.price) ? usdt.price : 60000;
  }

  function numberLocale(){
    const fmt = (typeof State !== "undefined") ? State.get().settings.numberFormat : "latin";
    return fmt === "fa" ? "fa-IR" : "en-US";
  }

  function formatPrice(value, currency = "تومان"){
    if(value === null || value === undefined || Number.isNaN(value)) return "—";
    let num = Number(value);
    let unitLabel = currency;

    const priceUnit = (typeof State !== "undefined") ? State.get().settings.priceUnit : "irt";
    if(priceUnit === "usdt"){
      num = num / usdtRate();
      if(currency === "تومان") unitLabel = "تتر";
    }

    let decimals = 2;
    if(priceUnit === "usdt"){
      decimals = num >= 1 ? 2 : 4;
    }else{
      if(num >= 1000) decimals = 0;
      else if(num < 1) decimals = 4;
    }
    const formatted = num.toLocaleString(numberLocale(), { maximumFractionDigits: decimals });
    return unitLabel ? `${formatted} ${unitLabel}` : formatted;
  }

  function formatPercent(value){
    if(value === null || value === undefined || Number.isNaN(value)) return "—";
    const num = Number(value);
    const sign = num > 0 ? "+" : "";
    return `${sign}${num.toFixed(2)}٪`;
  }

  function formatDateTime(isoString){
    if(!isoString) return "—";
    const d = new Date(isoString);
    if(Number.isNaN(d.getTime())) return "—";
    const fmt = new Intl.DateTimeFormat("fa-IR", {
      year:"numeric", month:"2-digit", day:"2-digit",
      hour:"2-digit", minute:"2-digit"
    });
    return fmt.format(d);
  }

  function formatDate(isoString){
    if(!isoString) return "—";
    const d = new Date(isoString);
    if(Number.isNaN(d.getTime())) return "—";
    return new Intl.DateTimeFormat("fa-IR", { year:"numeric", month:"2-digit", day:"2-digit" }).format(d);
  }

  function timeAgo(isoString){
    if(!isoString) return "—";
    const d = new Date(isoString);
    const diffSec = Math.floor((Date.now() - d.getTime())/1000);
    if(diffSec < 10) return "همین الان";
    if(diffSec < 60) return `${diffSec} ثانیه پیش`;
    const diffMin = Math.floor(diffSec/60);
    if(diffMin < 60) return `${diffMin} دقیقه پیش`;
    const diffHr = Math.floor(diffMin/60);
    if(diffHr < 24) return `${diffHr} ساعت پیش`;
    const diffDay = Math.floor(diffHr/24);
    return `${diffDay} روز پیش`;
  }

  function el(tag, attrs = {}, children = []){
    const node = document.createElement(tag);
    for(const [k,v] of Object.entries(attrs)){
      if(k === "class") node.className = v;
      else if(k === "html") node.innerHTML = v;
      else if(k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
      else if(v !== false && v !== null && v !== undefined) node.setAttribute(k, v);
    }
    (Array.isArray(children) ? children : [children]).forEach(c => {
      if(c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  function debounce(fn, wait = 250){
    let t;
    return (...args) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...args), wait);
    };
  }

  function initials(name){
    if(!name) return "—";
    return name.trim().slice(0,2);
  }

  function maskSecret(value, visibleStart = 4, visibleEnd = 4){
    if(!value) return "";
    if(value.length <= visibleStart + visibleEnd) return "•".repeat(value.length);
    return value.slice(0, visibleStart) + "•".repeat(Math.max(6, value.length - visibleStart - visibleEnd)) + value.slice(-visibleEnd);
  }

  function maskPhone(phone){
    if(!phone) return "—";
    const digits = phone.replace(/\D/g, "");
    if(digits.length < 6) return phone;
    return digits.slice(0,4) + "***" + digits.slice(-3);
  }

  return { formatNumber, formatPrice, formatPercent, formatDateTime, formatDate, timeAgo, el, debounce, initials, maskSecret, maskPhone };
})();

// مدیریت وضعیت کلی برنامه
// -------------------------------------------------------------------
// فقط تنظیمات غیرحساس (تم، واحد قیمت، بازه به‌روزرسانی و ...) در
// localStorage ذخیره می‌شوند. وضعیت اتصال و هر داده مرتبط با حساب
// صرافی فقط در حافظه (در طول یک نشست مرورگر) نگه‌داری می‌شود و با
// رفرش صفحه از بین می‌رود — دقیقاً همان رفتاری که از یک معماری امن
// مبتنی بر نشست سمت سرور انتظار می‌رود.
// ===================================================================

const STORAGE_KEY = "nx_dashboard_settings_v1";

const State = (() => {
  const listeners = new Set();

  function loadSettings(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultSettings();
      return { ...defaultSettings(), ...JSON.parse(raw) };
    }catch(e){
      return defaultSettings();
    }
  }

  function defaultSettings(){
    return {
      theme: "dark",
      priceUnit: "irt",        // irt | usdt
      numberFormat: "latin",   // latin | fa
      refreshInterval: 60,     // ثانیه
      notifyPriceAlerts: true,
      notifyConnection: true,
      language: "fa",
    };
  }

  function persistSettings(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store.settings)); }catch(e){ /* ignore */ }
  }

  const store = {
    route: { name:"connect", params:{} },
    connection: { status:"disconnected", exchangeName:null, connectedAt:null, lastChecked:null },
    settings: loadSettings(),
    sidebarOpen: false,
  };

  function get(){ return store; }

  function set(patch){
    for(const [k,v] of Object.entries(patch)){
      if(typeof v === "object" && v !== null && !Array.isArray(v) && typeof store[k] === "object"){
        store[k] = { ...store[k], ...v };
      }else{
        store[k] = v;
      }
    }
    if("settings" in patch) persistSettings();
    emit();
  }

  function subscribe(fn){
    listeners.add(fn);
    return () => listeners.delete(fn);
  }

  function emit(){
    listeners.forEach(fn => fn(store));
  }

  return { get, set, subscribe };
})();

// لایه اتصال به داده (Api)
// -------------------------------------------------------------------
// این فایل جای‌گزین لایه فنی واقعی اتصال به نوبیتکس است که طبق
// طراحی پروژه، جداگانه و در سمت سرور (مثلاً یک Cloudflare Worker)
// پیاده‌سازی می‌شود:
//
//   مرورگر کاربر → Worker (امضای درخواست با API Secret) → نوبیتکس
//
// نکات امنیتی که این فایل رعایت می‌کند و باید در پیاده‌سازی واقعی هم
// رعایت شوند:
//   • کلید/سیکرت API هرگز در localStorage یا کد سمت کلاینت ذخیره
//     نمی‌شود؛ فقط برای یک درخواست اتصال اولیه به سرور ارسال و سپس
//     از حافظه کلاینت پاک می‌شود.
//   • پس از اتصال موفق، فقط یک «نشانه جلسه» (session token) بدون
//     اطلاعات حساس در حافظه (نه storage) نگه‌داری می‌شود.
//   • تمام متدهای زیر async هستند و دقیقاً همان قراردادی را دارند
//     که نسخه واقعی (فراخوانی Worker) باید داشته باشد؛ برای اتصال
//     نسخه واقعی فقط کافیست بدنه هر متد با fetch به Worker واقعی
//     جایگزین شود و امضای تابع حفظ بماند.
//
// در این نسخه (چون بک‌اند واقعی در دسترس نیست) همه متدها با تاخیر
// شبیه‌سازی‌شده از MockData پاسخ می‌دهند و خروجی isMock:true دارد.
// ===================================================================

const Api = (() => {

  const LATENCY = 550;
  let sessionToken = null; // فقط در حافظه؛ هرگز در storage ذخیره نمی‌شود

  function delay(ms = LATENCY){
    return new Promise(res => setTimeout(res, ms));
  }

  function isValidKeyFormat(key){
    // بررسی ظاهری ساده؛ اعتبارسنجی واقعی کلید همیشه سمت سرور انجام می‌شود
    return typeof key === "string" && key.trim().length >= 20;
  }

  async function connect(apiKey){
    if(!isValidKeyFormat(apiKey)){
      const err = new Error("فرمت کلید API نامعتبر است.");
      err.code = "INVALID_FORMAT";
      throw err;
    }
    await delay(1100);

    // --- در نسخه واقعی: ---
    // const res = await fetch(`${WORKER_URL}/connect`, {
    //   method: "POST",
    //   body: JSON.stringify({ apiKey }),
    // });
    // کلید apiKey پس از این فراخوانی از حافظه کلاینت حذف می‌شود.

    sessionToken = "sess_" + Math.random().toString(36).slice(2);
    State.set({
      connection: {
        status: "connected",
        exchangeName: "نوبیتکس",
        connectedAt: new Date().toISOString(),
        lastChecked: new Date().toISOString(),
      }
    });
    return { ok:true, sessionToken };
  }

  async function disconnect(){
    await delay(300);
    sessionToken = null;
    State.set({ connection: { status:"disconnected", exchangeName:null, connectedAt:null, lastChecked:null } });
    return { ok:true };
  }

  async function checkConnection(){
    await delay(500);
    const conn = State.get().connection;
    if(conn.status !== "connected") return conn;
    const updated = { ...conn, lastChecked: new Date().toISOString() };
    State.set({ connection: updated });
    return updated;
  }

  async function getMarketList(){
    await delay();
    return { data: MockData.coins, isMock:true, fetchedAt:new Date().toISOString() };
  }

  async function getCoin(coinId){
    await delay();
    const coin = MockData.coins.find(c => c.id === coinId) || null;
    return { data: coin, isMock:true, fetchedAt:new Date().toISOString() };
  }

  async function getCoinHistory(coinId, range = "30d"){
    await delay(650);
    const days = { "7d":7, "30d":30, "90d":90 }[range] || 30;
    return { data: MockData.coinHistory(coinId, days), range, isMock:true, fetchedAt:new Date().toISOString() };
  }

  async function getPortfolioSummary(){
    await delay();
    const assets = MockData.walletAssets;
    const totalValueIrt = 412850000; // ساختگی — فقط برای نمایش ساختار
    return {
      data:{
        totalValueIrt,
        availableValueIrt: Math.round(totalValueIrt * 0.82),
        assetCount: assets.length,
        openOrders: MockData.openOrdersCount,
        change24hPercent: 1.86,
      },
      isMock:true,
      fetchedAt:new Date().toISOString()
    };
  }

  async function getPortfolioHistory(range = "7d"){
    await delay(650);
    return { data: MockData.portfolioHistory(range), range, isMock:true, fetchedAt:new Date().toISOString() };
  }

  async function getWalletAssets(){
    await delay();
    return { data: MockData.walletAssets, isMock:true, fetchedAt:new Date().toISOString() };
  }

  async function getTransactions(filters = {}){
    await delay();
    let rows = [...MockData.transactions];
    if(filters.type && filters.type !== "all") rows = rows.filter(r => r.type === filters.type);
    if(filters.coin && filters.coin !== "all") rows = rows.filter(r => r.coin === filters.coin);
    if(filters.status && filters.status !== "all") rows = rows.filter(r => r.status === filters.status);
    return { data: rows, isMock:true, fetchedAt:new Date().toISOString() };
  }

  async function getProfile(){
    await delay();
    return { data: MockData.profile, isMock:true, fetchedAt:new Date().toISOString() };
  }

  return {
    connect, disconnect, checkConnection,
    getMarketList, getCoin, getCoinHistory,
    getPortfolioSummary, getPortfolioHistory,
    getWalletAssets, getTransactions, getProfile,
  };
})();

const Toast = (() => {
  let host = null;

  function ensureHost(){
    if(host) return host;
    host = Utils.el("div", { class:"toast-host" });
    document.body.appendChild(host);
    return host;
  }

  const ICONS = { success:"check", error:"alert", info:"info" };

  function show(type, title, desc = "", timeout = 4200){
    ensureHost();
    const node = Utils.el("div", { class:`toast ${type}` }, [
      Utils.el("div", { html: ic(ICONS[type] || "info") }),
      Utils.el("div", {}, [
        Utils.el("div", { style:"font-weight:700;margin-bottom:2px;" }, title),
        desc ? Utils.el("div", { class:"text-faint" }, desc) : null,
      ])
    ]);
    host.appendChild(node);
    setTimeout(() => {
      node.style.transition = "opacity .2s ease, transform .2s ease";
      node.style.opacity = "0";
      node.style.transform = "translateY(6px)";
      setTimeout(() => node.remove(), 200);
    }, timeout);
  }

  return {
    success:(t,d) => show("success", t, d),
    error:(t,d) => show("error", t, d),
    info:(t,d) => show("info", t, d),
  };
})();

const Charts = (() => {
  const instances = new Map();

  function cssVar(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function destroy(key){
    if(instances.has(key)){
      instances.get(key).destroy();
      instances.delete(key);
    }
  }

  function lineChart(key, canvas, points, { color, currency = "تومان", fill = true } = {}){
    destroy(key);
    if(!canvas || typeof Chart === "undefined") return null;
    const accent = color || cssVar("--accent") || "#17c3b2";
    const grid = cssVar("--border-soft") || "#1b2436";
    const textFaint = cssVar("--text-faint") || "#5c6680";

    const ctx = canvas.getContext("2d");
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.clientHeight || 220);
    gradient.addColorStop(0, accent + "33");
    gradient.addColorStop(1, accent + "00");

    const chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: points.map(p => p.t),
        datasets: [{
          data: points.map(p => p.v),
          borderColor: accent,
          backgroundColor: fill ? gradient : "transparent",
          borderWidth: 2,
          pointRadius: 0,
          pointHoverRadius: 4,
          pointHoverBackgroundColor: accent,
          pointHoverBorderColor: "#fff",
          tension: 0.35,
          fill,
        }]
      },
      options: {
        responsive:true,
        maintainAspectRatio:false,
        interaction:{ mode:"index", intersect:false },
        plugins:{
          legend:{ display:false },
          tooltip:{
            rtl:true,
            backgroundColor: cssVar("--surface") || "#121a2b",
            borderColor: grid,
            borderWidth:1,
            titleColor: textFaint,
            bodyColor: "#e9eef6",
            titleFont:{ family:"Vazirmatn", size:11 },
            bodyFont:{ family:"Vazirmatn", size:12, weight:"700" },
            padding:10,
            displayColors:false,
            callbacks:{
              title:(items) => Utils.formatDateTime(items[0].label),
              label:(item) => Utils.formatPrice(item.raw, currency),
            }
          }
        },
        scales:{
          x:{ display:false },
          y:{ display:false }
        },
        elements:{ line:{ capBezierPoints:true } }
      }
    });
    instances.set(key, chart);
    return chart;
  }

  function sparkline(canvas, points, positive = true){
    if(!canvas || typeof Chart === "undefined") return null;
    const key = "spark_" + (canvas.dataset.key || Math.random());
    destroy(key);
    const color = positive ? (cssVar("--green") || "#2ecc82") : (cssVar("--red") || "#f0555f");
    const chart = new Chart(canvas.getContext("2d"), {
      type:"line",
      data:{
        labels:points.map((_,i) => i),
        datasets:[{ data:points.map(p => p.v), borderColor:color, borderWidth:1.6, pointRadius:0, tension:0.4 }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{enabled:false} },
        scales:{ x:{display:false}, y:{display:false} },
        elements:{ line:{ borderJoinStyle:"round" } }
      }
    });
    instances.set(key, chart);
    return chart;
  }

  return { lineChart, sparkline, destroy };
})();

  function coinAvatar(symbol, size = 28){
    const letters = (symbol || "?").replace(/[^A-Za-z]/g,"").slice(0,3) || "?";
    return Utils.el("div", { class:"coin-ic", style:`width:${size}px;height:${size}px;font-size:${Math.round(size*0.36)}px;` }, letters);
  }

  function statusBadge(status){
    const map = {
      "موفق": "badge-green", "در انتظار": "badge-amber", "ناموفق": "badge-red",
      "connected": "badge-green", "disconnected": "badge-gray", "checking": "badge-blue",
    };
    const labelMap = { connected:"متصل", disconnected:"قطع شده", checking:"در حال بررسی" };
    return Utils.el("span", { class:`badge ${map[status] || "badge-gray"}` }, [
      Utils.el("span", { class:"badge-dot" }),
      labelMap[status] || status,
    ]);
  }

  return { skeleton, skeletonCard, stateBox, empty, errorState, loading, mockFlag, changeBadge, coinAvatar, statusBadge };
})();

const Router = (() => {
  const routes = [
    { pattern: /^connect$/,        name:"connect",  page:() => PageConnect },
    { pattern: /^dashboard$/,      name:"dashboard",page:() => PageDashboard },
    { pattern: /^market$/,         name:"market",   page:() => PageMarket },
    { pattern: /^coin\/([\w-]+)$/, name:"coin",     page:() => PageCoin },
    { pattern: /^wallet$/,         name:"wallet",   page:() => PageWallet },
    { pattern: /^history$/,        name:"history",  page:() => PageHistory },
    { pattern: /^profile$/,        name:"profile",  page:() => PageProfile },
    { pattern: /^settings$/,       name:"settings", page:() => PageSettings },
  ];

  function current(){
    const hash = (location.hash || "#connect").replace(/^#\/?/, "");
    for(const r of routes){
      const m = hash.match(r.pattern);
      if(m) return { name:r.name, page:r.page(), params:{ id: m[1] } };
    }
    return { name:"dashboard", page:PageDashboard, params:{} };
  }

  function go(path){
    location.hash = "#/" + path.replace(/^#\/?/, "");
  }

  function start(onChange){
    window.addEventListener("hashchange", () => onChange(current()));
    onChange(current());
  }

  return { go, current, start };
})();

      ]);

      const btn = Utils.el("button", {

const PageMarket = {
  async mount(container){
    container.innerHTML = "";
    let allCoins = [];
    let query = "";
    let marketFilter = "all";
    let sortKey = "volume24h";
    let sortDir = "desc";
    let pageSize = 6;
    let visibleCount = pageSize;
    let loadError = false;

    container.appendChild(Utils.el("div", { class:"page-head" }, [
      Utils.el("div", {}, [
        Utils.el("h1", {}, "بازار ارزهای دیجیتال"),
        Utils.el("div", { class:"sub" }, "قیمت لحظه‌ای ارزهای پشتیبانی‌شده توسط نوبیتکس"),
      ]),
      Utils.el("button", { class:"btn btn-ghost btn-sm", id:"mkRefresh", html:"" }, [Utils.el("span",{html:ic("refresh")}), " به‌روزرسانی"]),
    ]));

    const toolbar = Utils.el("div", { class:"market-toolbar" });
    container.appendChild(toolbar);

    const card = Utils.el("div", { class:"card card-pad" });
    container.appendChild(card);
    card.appendChild(UI.loading("در حال بارگذاری بازار…"));

    container.querySelector("#mkRefresh").addEventListener("click", load);

    function buildToolbar(){
      toolbar.innerHTML = "";
      toolbar.appendChild(Utils.el("div", { class:"search-wrap" }, [
        Utils.el("span", { html: ic("search") }),
        Utils.el("input", {
          class:"input", placeholder:"جست‌وجوی نام یا نماد ارز…",
          value:query,
          onInput: Utils.debounce((e) => { query = e.target.value; visibleCount = pageSize; renderTable(); }, 200),
        }),
      ]));
      toolbar.appendChild(Utils.el("div", { style:"display:flex;gap:6px;flex-wrap:wrap;" }, [
        chip("all","همه بازارها"), chip("IRT","بازار تومانی"), chip("USDT","بازار تتری"),
      ]));
    }

    function chip(val, label){
      return Utils.el("button", {
        class:`chip ${marketFilter===val?"active":""}`,
        onClick: () => { marketFilter = val; visibleCount = pageSize; buildToolbar(); renderTable(); }
      }, label);
    }

    async function load(){
      card.innerHTML = "";
      card.appendChild(UI.loading("در حال بارگذاری بازار…"));
      try{
        const res = await Api.getMarketList();
        allCoins = res.data.map(c => ({ ...c, _spark: MockData.history30d(c.id).slice(-14) }));
        loadError = false;
        buildToolbar();
        renderTable(res.isMock);
      }catch(e){
        loadError = true;
        card.innerHTML = "";
        card.appendChild(UI.errorState("دریافت بازار ناموفق بود", "", load));
      }
    }

    function applyFilters(){
      let rows = allCoins.filter(c => {
        if(marketFilter !== "all" && !c.symbol.includes(marketFilter)) return false;
        if(query && !(c.name.includes(query) || c.symbol.toLowerCase().includes(query.toLowerCase()))) return false;
        return true;
      });
      rows.sort((a,b) => {
        const d = sortDir === "asc" ? 1 : -1;
        return (a[sortKey] - b[sortKey]) * d;
      });
      return rows;
    }

    function setSort(key){
      if(sortKey === key) sortDir = sortDir === "asc" ? "desc" : "asc";
      else { sortKey = key; sortDir = "desc"; }
      renderTable();
    }

    function renderTable(isMock){
      card.innerHTML = "";
      const rows = applyFilters();

      card.appendChild(Utils.el("div", { class:"card-head" }, [
        Utils.el("div", { class:"card-title" }, [
          `${rows.length} ارز `,
          isMock ? UI.mockFlag() : null,

        return;
      }

      const th = (label, key) => Utils.el("th", {
        class: key ? "sortable" : "",
        onClick: key ? () => setSort(key) : null,
      }, [label, key && sortKey===key ? Utils.el("span", { html: ic(sortDir==="asc"?"chevronDown":"chevronDown") }) : ""]);

      const wrap = Utils.el("div", { class:"table-wrap" });
      const table = Utils.el("table", { class:"tbl" }, [
        Utils.el("thead", {}, Utils.el("tr", {}, [
          th("نام ارز"), th("نماد"),
          th("قیمت فعلی","price"), th("تغییر ۲۴ساعته","change24h"),
          th("بالاترین ۲۴ساعته"), th("پایین‌ترین ۲۴ساعته"),
          th("حجم معاملات","volume24h"), th("روند"), th(""),
        ])),
      ]);
      const tbody = Utils.el("tbody");
      rows.slice(0, visibleCount).forEach(c => {

const PageCoin = {

      headCard.appendChild(Utils.el("div", { class:"coin-head" }, [

          Utils.el("div", {}, [
            Utils.el("div", { style:"display:flex;align-items:center;gap:8px;" }, [
              Utils.el("h2", { style:"font-size:17px;" }, coin.name),
              isMock ? UI.mockFlag() : null,
            ]),
            Utils.el("div", { class:"text-faint num", style:"font-size:12.5px;margin-top:3px;" }, coin.symbol),
          ]),
        ]),
        Utils.el("div", { style:"text-align:left;" }, [
          Utils.el("div", { class:"coin-price-row" }, [
            Utils.el("div", { class:"coin-price num" }, Utils.formatPrice(coin.price, "")),
            UI.changeBadge(coin.change24h),
          ]),
          Utils.el("div", { class:"text-faint", style:"font-size:11.5px;margin-top:4px;" },
            `آخرین به‌روزرسانی: ${Utils.timeAgo(new Date().toISOString())}`),
        ]),
      ]));
      headCard.appendChild(Utils.el("div", { class:"coin-stats-row" }, [
        stat("بالاترین ۲۴ساعته", Utils.formatPrice(coin.high24h, "")),
        stat("پایین‌ترین ۲۴ساعته", Utils.formatPrice(coin.low24h, "")),
        stat("حجم معاملات ۲۴ساعته", Utils.formatNumber(coin.volume24h, { compact:true })),
      ]));
    }

    function stat(label, value){
      return Utils.el("div", { class:"coin-stat" }, [
        Utils.el("div", { class:"lbl" }, label),
        Utils.el("div", { class:"val num" }, value),
      ]);
    }

    function renderChart(histRes, coin){
      chartCard.innerHTML = "";
      const points = histRes.data;

      chartCard.appendChild(Utils.el("div", { class:"coin-chart-controls" }, [
        Utils.el("div", { class:"card-title" }, [
          `نمودار قیمت `,
          histRes.isMock ? UI.mockFlag() : null,
        ]),
        Utils.el("div", { class:"range-tabs" }, ["7d","30d","90d"].map(r =>
          Utils.el("button", {
            class:`chip ${r===range?"active":""}`,
            onClick: async () => {
              range = r;
              const hRes = await Api.getCoinHistory(coinId, range);
              renderChart(hRes, coin);
            }
          }, r === "7d" ? "۷ روز" : r === "30d" ? "۳۰ روز" : "۹۰ روز")
        )),
      ]));

      if(!points || points.length < 2){
        chartCard.appendChild(UI.empty("داده تاریخی کافی در دسترس نیست", "اطلاعات این بازه هنوز از صرافی دریافت نشده است."));
        return;
      }

      const first = points[0].v, last = points[points.length-1].v;
      const pct = ((last-first)/first)*100;
      chartCard.appendChild(Utils.el("div", { style:"margin:6px 0 2px;" }, [
        Utils.el("span", { class:`num ${pct>=0?"up":"down"}`, style:"font-size:13px;font-weight:700;" }, Utils.formatPercent(pct)),
        Utils.el("span", { class:"text-faint", style:"font-size:12px;" }, ` در بازه انتخاب‌شده`),
      ]));

      const wrap = Utils.el("div", { class:"chart-canvas-wrap" }, [ Utils.el("canvas", { id:"coinChart" }) ]);
      chartCard.appendChild(wrap);
      requestAnimationFrame(() => {
        Charts.lineChart("coinChart", document.getElementById("coinChart"), points, { color: pct>=0 ? null : getComputedStyle(document.documentElement).getPropertyValue("--red"), currency:"" });
      });
    }

    function renderSide(coin, walletRes){
      sideCol.innerHTML = "";

      const holding = (walletRes.data || []).find(a => a.coinId === coin.id);

        Utils.el("div", { class:"card-title" }, "موجودی شما از این ارز"),

          Utils.el("div", { class:"num", style:"font-size:19px;font-weight:700;" }, `${Utils.formatNumber(holding.total,{decimals:6})} ${holding.symbol}`),
          Utils.el("div", { class:"text-faint", style:"font-size:12px;margin-top:4px;" }, `≈ ${Utils.formatPrice(holding.total * coin.price, "")}`),
          walletRes.isMock ? Utils.el("div", { style:"margin-top:10px;" }, UI.mockFlag()) : null,
        ]));
      }else{
        holdCard.appendChild(UI.empty("موجودی از این ارز ندارید", ""));
      }
      sideCol.appendChild(holdCard);

      const ordersCard = Utils.el("div", { class:"card card-pad" }, [
        Utils.el("div", { class:"card-title" }, "سفارش‌های باز مرتبط"),
        UI.empty("سفارش فعالی برای این ارز نیست", "سفارش‌های باز در این نسخه فقط برای کل حساب نمایش داده می‌شوند."),
      ]);
      sideCol.appendChild(ordersCard);
    }
  }
};

        ])),
      ]);

      rows.forEach(a => {

          Utils.el("td", { class:"num" }, hideValues ? "••••" : Utils.formatPrice(value, "")),
          Utils.el("td", {}, UI.changeBadge(a.change24h)),

      card.dataset.card = "exchange";
      if(old) rightCol.replaceChild(card, old); else rightCol.appendChild(card);

      function row2(k,v,node){
        return Utils.el("div", { class:"info-row" }, [
          Utils.el("span", { class:"k" }, k),
          node || Utils.el("span", { class:"v" }, v),
        ]);
      }
    }

    function renderSecurity(){
      const card = Utils.el("div", { class:"card card-pad", "data-card":"security" }, [
        Utils.el("div", { class:"card-title" }, "امنیت اتصال"),
        Utils.el("div", { class:"notice-box", style:"margin-top:12px;" }, [
          Utils.el("div", { html: ic("shield") }),
          Utils.el("p", {}, "کلید API شما رمزنگاری‌شده و فقط در سرور نگه‌داری می‌شود. این برنامه هرگز کلید کامل، رمز عبور یا کد یک‌بارمصرف شما را نمایش نمی‌دهد."),
        ]),
        Utils.el("button", { class:"btn btn-danger-ghost btn-sm btn-block", style:"margin-top:4px;", onClick: confirmDisconnect },
          [Utils.el("span",{html:ic("trash")}), " حذف اتصال ذخیره‌شده"]),
      ]);
      rightCol.appendChild(card);
    }

    function confirmDisconnect(){
      const backdrop = Utils.el("div", { class:"modal-backdrop", onClick:(e) => { if(e.target===backdrop) backdrop.remove(); } });
      backdrop.appendChild(Utils.el("div", { class:"modal" }, [
        Utils.el("h3", {}, "قطع اتصال حساب نوبیتکس؟"),
        Utils.el("p", {}, "پس از قطع اتصال، برای مشاهده دوباره اطلاعات باید کلید API را مجدداً وارد کنید."),
        Utils.el("div", { class:"modal-actions" }, [
          Utils.el("button", { class:"btn btn-outline", onClick: () => backdrop.remove() }, "انصراف"),
          Utils.el("button", { class:"btn btn-danger-ghost", onClick: async () => {
            await Api.disconnect();
            backdrop.remove();
            Toast.info("اتصال قطع شد", "حساب نوبیتکس شما از برنامه جدا شد.");
            Router.go("connect");
          }}, "قطع اتصال"),
        ]),
      ]));
      document.body.appendChild(backdrop);
    }
  }
};
// ===================================================================
// صفحه تنظیمات
// ===================================================================

const APP_VERSION = "۱.۰.۰ (نسخه اول)";

const PageSettings = {
  mount(container){
    container.innerHTML = "";
    container.appendChild(Utils.el("div", { class:"page-head" }, [
      Utils.el("div", {}, [
        Utils.el("h1", {}, "تنظیمات"),
        Utils.el("div", { class:"sub" }, "شخصی‌سازی نمایش و رفتار برنامه"),
      ]),
    ]));

    const s = State.get().settings;
    const card = Utils.el("div", { class:"card card-pad" });
    container.appendChild(card);

    function update(patch){
      State.set({ settings: patch });
      ThemeManager.apply();
      paint();
    }

    function paint(){
      const cur = State.get().settings;
      card.innerHTML = "";

      card.appendChild(settingRow("تم رابط کاربری", "روشن یا تیره", themeToggle(cur)));
      card.appendChild(settingRow("واحد نمایش قیمت", "تومان یا تتر", select(["irt","usdt"], cur.priceUnit, {irt:"تومان", usdt:"تتر"}, v => update({priceUnit:v}))));
      card.appendChild(settingRow("نحوه نمایش اعداد", "ارقام لاتین یا فارسی", select(["latin","fa"], cur.numberFormat, {latin:"لاتین (1234)", fa:"فارسی (۱۲۳۴)"}, v => update({numberFormat:v}))));
      card.appendChild(settingRow("بازه به‌روزرسانی خودکار", "فاصله زمانی دریافت اطلاعات جدید", select([30,60,120,300], cur.refreshInterval, {30:"۳۰ ثانیه",60:"۱ دقیقه",120:"۲ دقیقه",300:"۵ دقیقه"}, v => update({refreshInterval:Number(v)})) ));
      card.appendChild(settingRow("اعلان تغییرات قیمت", "دریافت اعلان برای نوسانات مهم بازار", switchEl(cur.notifyPriceAlerts, v => update({notifyPriceAlerts:v}))));
      card.appendChild(settingRow("اعلان وضعیت اتصال", "اطلاع از قطع یا برقراری اتصال صرافی", switchEl(cur.notifyConnection, v => update({notifyConnection:v}))));
      card.appendChild(settingRow("زبان برنامه", "در نسخه اول فقط فارسی پشتیبانی می‌شود", Utils.el("span", { class:"badge badge-gray" }, "فارسی")));
      card.appendChild(settingRow("نسخه برنامه", "", Utils.el("span", { class:"text-dim num" }, APP_VERSION)));

      card.appendChild(Utils.el("div", { style:"margin-top:18px;" }, [
        Utils.el("button", { class:"btn btn-danger-ghost btn-block", onClick: logout },
          [Utils.el("span", { html: ic("logout") }), " خروج از حساب"]),
      ]));
    }

    function settingRow(label, desc, control){
      return Utils.el("div", { class:"set-row" }, [
        Utils.el("div", {}, [
          Utils.el("div", { class:"label" }, label),
          desc ? Utils.el("div", { class:"desc" }, desc) : null,
        ]),
        control,
      ]);
    }

    function select(values, current, labels, onChange){
      return Utils.el("select", { class:"select", onChange:(e) => onChange(e.target.value) },
        values.map(v => Utils.el("option", { value:v, selected: String(v)===String(current) }, labels[v])));
    }

    function switchEl(checked, onChange){
      return Utils.el("label", { class:"switch" }, [
        Utils.el("input", { type:"checkbox", checked: checked ? "checked" : false, onChange:(e) => onChange(e.target.checked) }),
        Utils.el("span", { class:"track" }, Utils.el("span", { class:"thumb" })),
      ]);
    }

    function themeToggle(cur){
      return Utils.el("div", { class:"tabs" }, [
        Utils.el("button", { class:`tab-btn ${cur.theme==="dark"?"active":""}`, onClick: () => update({theme:"dark"}), html: ic("moon") + " تیره" }),
        Utils.el("button", { class:`tab-btn ${cur.theme==="light"?"active":""}`, onClick: () => update({theme:"light"}), html: ic("sun") + " روشن" }),
      ]);
    }

    async function logout(){
      await Api.disconnect();
      Toast.info("خارج شدید", "برای ورود دوباره، کلید API را وارد کنید.");
      Router.go("connect");
    }

    paint();
  }
};

const ThemeManager = {
  apply(){
    const theme = State.get().settings.theme;
    document.documentElement.setAttribute("data-theme", theme === "light" ? "light" : "dark");
  }
};
// ===================================================================
// راه‌اندازی برنامه: اسکلت، سایدبار، نوار بالا، مسیریابی
// ===================================================================

const NAV_ITEMS = [
  { key:"dashboard", label:"داشبورد",            icon:"dashboard" },
  { key:"market",    label:"بازار ارزها",         icon:"market" },
  { key:"wallet",    label:"کیف پول",             icon:"wallet" },
  { key:"history",   label:"تاریخچه تراکنش‌ها",   icon:"history" },
  { key:"profile",   label:"پروفایل",             icon:"profile" },
  { key:"settings",  label:"تنظیمات",             icon:"settings" },
];

const PAGE_TITLES = {
  dashboard:"داشبورد", market:"بازار ارزهای دیجیتال", coin:"جزئیات ارز",
  wallet:"کیف پول", history:"تاریخچه تراکنش‌ها", profile:"پروفایل", settings:"تنظیمات",
};

const App = (() => {
  const root = document.getElementById("app");
  let refreshTimer = null;

  function buildShell(){
    root.innerHTML = "";

    const scrim = Utils.el("div", { class:"sidebar-scrim", onClick: closeSidebar });
    const sidebar = Utils.el("aside", { class:"sidebar" });
    sidebar.appendChild(Utils.el("div", { class:"brand" }, [
      Utils.el("div", { class:"brand-mark", html: ic("logo") }),
      Utils.el("div", {}, [
        Utils.el("div", { class:"brand-name" }, "صرافی من"),
        Utils.el("div", { class:"brand-sub" }, "داشبورد شخصی ارز دیجیتال"),
      ]),
    ]));

    const navGroup = Utils.el("div", { class:"nav-group" });
    NAV_ITEMS.forEach(item => {
      navGroup.appendChild(Utils.el("div", {
        class:"nav-item", "data-key":item.key,
        html: ic(item.icon) + `<span>${item.label}</span>`,
        onClick: () => { Router.go(item.key); closeSidebar(); },
      }));
    });
    sidebar.appendChild(navGroup);

    sidebar.appendChild(Utils.el("div", { class:"sidebar-foot" }, [
      Utils.el("div", { class:"nav-item", html: ic("unlink") + `<span>قطع اتصال و خروج</span>`, onClick: handleLogout }),
    ]));

    const main = Utils.el("main", { class:"main" });
    const topbar = Utils.el("header", { class:"topbar" }, [
      Utils.el("div", { class:"topbar-left" }, [
        Utils.el("button", { class:"menu-btn", html: ic("menu"), onClick: openSidebar }),
        Utils.el("div", { class:"topbar-title", id:"pageTitle" }, "داشبورد"),
      ]),
      Utils.el("div", { class:"topbar-right" }, [
        Utils.el("span", { id:"connBadge" }),
        Utils.el("span", { class:"text-faint", id:"lastUpdate", style:"font-size:11.5px;white-space:nowrap;" }),
        Utils.el("button", { class:"icon-btn", title:"به‌روزرسانی اطلاعات", html: ic("refresh"), onClick: refreshCurrentPage, id:"refreshBtn" }),
        Utils.el("button", { class:"icon-btn", title:"پروفایل", html: ic("profile"), onClick: () => Router.go("profile") }),
      ]),
    ]);

    const content = Utils.el("div", { class:"content", id:"pageContent" });
    main.append(topbar, content);

    const bottomNav = Utils.el("nav", { class:"bottom-nav" });
    ["dashboard","market","wallet","history","profile"].forEach(key => {
      const item = NAV_ITEMS.find(n => n.key === key);
      bottomNav.appendChild(Utils.el("div", {
        class:"bn-item", "data-key":key,
        html: ic(item.icon) + `<span>${item.label.replace("تاریخچه تراکنش‌ها","تاریخچه")}</span>`,
        onClick: () => Router.go(key),
      }));
    });

    const shell = Utils.el("div", { class:"shell" }, [main, sidebar]);
    root.append(shell, scrim, bottomNav);

    updateConnBadge();
  }

  function openSidebar(){ document.querySelector(".sidebar").classList.add("open"); document.querySelector(".sidebar-scrim").classList.add("open"); }
  function closeSidebar(){ document.querySelector(".sidebar")?.classList.remove("open"); document.querySelector(".sidebar-scrim")?.classList.remove("open"); }

  function updateConnBadge(){
    const badge = document.getElementById("connBadge");
    const lastUpdate = document.getElementById("lastUpdate");
    if(!badge) return;
    badge.innerHTML = "";
    badge.appendChild(UI.statusBadge(State.get().connection.status));
    if(lastUpdate){
      lastUpdate.textContent = State.get().connection.lastChecked
        ? `به‌روزرسانی ${Utils.timeAgo(State.get().connection.lastChecked)}`
        : "";
    }
  }

  function setActiveNav(name){
    document.querySelectorAll(".nav-item[data-key]").forEach(n => n.classList.toggle("active", n.dataset.key === name));
    document.querySelectorAll(".bn-item[data-key]").forEach(n => n.classList.toggle("active", n.dataset.key === name));
    const title = document.getElementById("pageTitle");
    if(title) title.textContent = PAGE_TITLES[name] || "";
  }

  let currentRoute = null;

  async function refreshCurrentPage(){
    const btn = document.getElementById("refreshBtn");
    if(btn) btn.classList.add("spin");
    await Api.checkConnection();
    updateConnBadge();
    if(currentRoute) await currentRoute.page.mount(document.getElementById("pageContent"), currentRoute.params);
    if(btn) btn.classList.remove("spin");
    Toast.success("به‌روزرسانی شد", "اطلاعات صفحه به‌روزرسانی شد.");
  }

  async function handleLogout(){
    await Api.disconnect();
    closeSidebar();
    Router.go("connect");
  }

  function startAutoRefresh(){
    if(refreshTimer) clearInterval(refreshTimer);
    const sec = State.get().settings.refreshInterval || 60;
    refreshTimer = setInterval(async () => {
      if(State.get().connection.status !== "connected") return;
      await Api.checkConnection();
      updateConnBadge();
    }, sec * 1000);
  }

  function onRouteChange(route){
    const connected = State.get().connection.status === "connected";

    if(route.name === "connect" || !connected){
      if(refreshTimer) clearInterval(refreshTimer);
      root.innerHTML = "";
      PageConnect.mount(root);
      return;
    }

    if(!root.querySelector(".shell")) buildShell();
    currentRoute = route;
    setActiveNav(route.name);
    updateConnBadge();
    const content = document.getElementById("pageContent");
    route.page.mount(content, route.params);
  }

  function init(){
    ThemeManager.apply();
    Router.start(onRouteChange);
    startAutoRefresh();
    State.subscribe((s) => {
      updateConnBadge();
    });
  }

  return { init };
})();

document.addEventListener("DOMContentLoaded", App.init);
</script>
</body>
</html>
