name: ساخت APK اندروید

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: نصب Java (برای Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: نصب وابستگی‌های Capacitor
        run: npm install

      - name: افزودن پلتفرم اندروید (در صورت نبود)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: همگام‌سازی فایل‌های وب با پروژه اندروید
        run: npx cap sync android

      - name: ساخت APK (نسخه دیباگ)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: آپلود APK به‌عنوان artifact
        uses: actions/upload-artifact@v4
        with:
          name: nobitex-dashboard-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
