// ===================================================================
// توابع کمکی عمومی: قالب‌بندی عدد، تاریخ، ابزارهای DOM
// ===================================================================

const Utils = (() => {

  function formatNumber(value, { decimals = 2, compact = false } = {}){
    if(value === null || value === undefined || Number.isNaN(value)) return "—";
    const num = Number(value);
    if(compact){
      const abs = Math.abs(num);
      if(abs >= 1e9) return (num/1e9).toLocaleString("en-US",{maximumFractionDigits:2}) + " میلیارد";
      if(abs >= 1e6) return (num/1e6).toLocaleString("en-US",{maximumFractionDigits:2}) + " میلیون";
      if(abs >= 1e3) return (num/1e3).toLocaleString("en-US",{maximumFractionDigits:1}) + " هزار";
    }
    return num.toLocaleString(numberLocale(), { maximumFractionDigits: decimals, minimumFractionDigits: 0 });
  }

  // نرخ تتر (تومان) از آخرین پاسخ واقعی بازار؛ اگر موجود نباشد null و قیمت تتری نمایش داده نمی‌شود
  let _usdtRate = null;
  function setUsdtRate(v){ _usdtRate = (Number(v) > 0) ? Number(v) : null; }
  function usdtRate(){ return _usdtRate; }

  function numberLocale(){
    const fmt = (typeof State !== "undefined") ? State.get().settings.numberFormat : "latin";
    return fmt === "fa" ? "fa-IR" : "en-US";
  }

  function formatPrice(value, currency = "تومان"){
    if(value === null || value === undefined || Number.isNaN(value)) return "—";
    let num = Number(value);
    let unitLabel = currency;

    const priceUnit = (typeof State !== "undefined") ? State.get().settings.priceUnit : "irt";
    if(priceUnit === "usdt"){
      if(!usdtRate()) return "—";
      num = num / usdtRate();
      if(currency === "تومان") unitLabel = "تتر";
    }

    let decimals = 2;
    if(priceUnit === "usdt"){
      decimals = num >= 1 ? 2 : 4;
    }else{
      if(num >= 1000) decimals = 0;
      else if(num < 1) decimals = 4;
    }
    const formatted = num.toLocaleString(numberLocale(), { maximumFractionDigits: decimals });
    return unitLabel ? `${formatted} ${unitLabel}` : formatted;
  }

  function formatPercent(value){
    if(value === null || value === undefined || Number.isNaN(value)) return "—";
    const num = Number(value);
    const sign = num > 0 ? "+" : "";
    return `${sign}${num.toFixed(2)}٪`;
  }

  function formatDateTime(isoString){
    if(!isoString) return "—";
    const d = new Date(isoString);
    if(Number.isNaN(d.getTime())) return "—";
    const fmt = new Intl.DateTimeFormat("fa-IR", {
      year:"numeric", month:"2-digit", day:"2-digit",
      hour:"2-digit", minute:"2-digit"
    });
    return fmt.format(d);
  }

  function formatDate(isoString){
    if(!isoString) return "—";
    const d = new Date(isoString);
    if(Number.isNaN(d.getTime())) return "—";
    return new Intl.DateTimeFormat("fa-IR", { year:"numeric", month:"2-digit", day:"2-digit" }).format(d);
  }

  function timeAgo(isoString){
    if(!isoString) return "—";
    const d = new Date(isoString);
    const diffSec = Math.floor((Date.now() - d.getTime())/1000);
    if(diffSec < 10) return "همین الان";
    if(diffSec < 60) return `${diffSec} ثانیه پیش`;
    const diffMin = Math.floor(diffSec/60);
    if(diffMin < 60) return `${diffMin} دقیقه پیش`;
    const diffHr = Math.floor(diffMin/60);
    if(diffHr < 24) return `${diffHr} ساعت پیش`;
    const diffDay = Math.floor(diffHr/24);
    return `${diffDay} روز پیش`;
  }

  function el(tag, attrs = {}, children = []){
    const node = document.createElement(tag);
    for(const [k,v] of Object.entries(attrs)){
      if(k === "class") node.className = v;
      else if(k === "html") node.innerHTML = v;
      else if(k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
      else if(v !== false && v !== null && v !== undefined) node.setAttribute(k, v);
    }
    (Array.isArray(children) ? children : [children]).forEach(c => {
      if(c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  function debounce(fn, wait = 250){
    let t;
    return (...args) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...args), wait);
    };
  }

  function initials(name){
    if(!name) return "—";
    return name.trim().slice(0,2);
  }

  function maskSecret(value, visibleStart = 4, visibleEnd = 4){
    if(!value) return "";
    if(value.length <= visibleStart + visibleEnd) return "•".repeat(value.length);
    return value.slice(0, visibleStart) + "•".repeat(Math.max(6, value.length - visibleStart - visibleEnd)) + value.slice(-visibleEnd);
  }

  function maskPhone(phone){
    if(!phone) return "—";
    const digits = phone.replace(/\D/g, "");
    if(digits.length < 6) return phone;
    return digits.slice(0,4) + "***" + digits.slice(-3);
  }

  return { setUsdtRate, formatNumber, formatPrice, formatPercent, formatDateTime, formatDate, timeAgo, el, debounce, initials, maskSecret, maskPhone };
})();

const Q = {
  E: Utils.el,
  reduced: () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches,
  countUp(el, to, render, dur = 1200){
    if(!isFinite(to) || Q.reduced()){ el.textContent = render(to); return; }
    const t0 = performance.now();
    const step = (t) => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4); el.textContent = render(to * e); if(p < 1 && document.body.contains(el)) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  },
  section(title, linkText, onLink){
    return Utils.el("div", { class:"q-section" }, [Utils.el("h3", {}, title), linkText ? Utils.el("button", { onClick:onLink }, linkText) : null]);
  },
  orb(big){ return Utils.el("div", { class:"q-orb" + (big ? " big" : "") }, [Utils.el("i", { class:"o3" }), Utils.el("i", { class:"o2" }), Utils.el("i", { class:"o1" }), Utils.el("b", {}, "Q")]); },
  chg(v){
    if(v === null || v === undefined) return Utils.el("span", { class:"q-chg" }, "—");
    return Utils.el("span", { class:`q-chg ${v >= 0 ? "up" : "down"}` }, Utils.formatPercent(v));
  },
  coinRow(c, withSpark = true){
    const E = Utils.el;
    const row = E("div", { class:"q-row", onClick: () => Router.go(`coin/${c.id}`) }, [
      UI.coinAvatar(c.symbol, 40),
      E("div", { class:"q-id" }, [E("div", { class:"q-nm" }, c.name), E("div", { class:"q-sy" }, c.symbol)]),
      withSpark ? E("canvas", { class:"q-sp", "data-key":"row_" + c.id }) : null,
      E("div", { class:"q-pr" }, [E("div", { class:"p num" }, Utils.formatPrice(c.price, "")), E("div", { class:`c ${(c.change24h ?? 0) >= 0 ? "up" : "down"}` }, Utils.formatPercent(c.change24h))]),
    ]);
    return row;
  },
  paintSparks(root, coins){
    const ids = coins.map(c => c.id);
    if(!ids.length) return;
    Api.getSparklines(ids).then(sp => {
      coins.forEach(c => { const cv = root.querySelector(`canvas[data-key="row_${c.id}"]`); const pts = sp.data && sp.data[c.id]; if(cv && pts) Charts.sparkline(cv, pts, (c.change24h ?? 0) >= 0); });
    }).catch(() => {});
  },
};

// فقط تنظیمات غیرحساس (تم، واحد قیمت، بازه به‌روزرسانی و ...) در
// localStorage ذخیره می‌شوند. وضعیت اتصال و هر داده مرتبط با حساب
// صرافی فقط در حافظه (در طول یک نشست مرورگر) نگه‌داری می‌شود و با
// رفرش صفحه از بین می‌رود — دقیقاً همان رفتاری که از یک معماری امن
// مبتنی بر نشست سمت سرور انتظار می‌رود.
// ===================================================================

const STORAGE_KEY = "nx_dashboard_settings_v1";

const State = (() => {
  const listeners = new Set();

  function loadSettings(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultSettings();
      return { ...defaultSettings(), ...JSON.parse(raw) };
    }catch(e){
      return defaultSettings();
    }
  }

  function defaultSettings(){
    return {
      theme: "dark",
      priceUnit: "irt",        // irt | usdt
      numberFormat: "latin",   // latin | fa
      refreshInterval: 60,     // ثانیه
      notifyPriceAlerts: true,
      notifyConnection: true,
      language: "fa",
    };
  }

  function persistSettings(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store.settings)); }catch(e){ /* ignore */ }
  }

  const store = {
    route: { name:"auth-phone", params:{} },
    account: { loggedIn:false, phone:null },
    connection: { status:"disconnected", exchangeName:null, connectedAt:null, lastChecked:null },
    settings: loadSettings(),
    sidebarOpen: false,
  };

  function get(){ return store; }

  function set(patch){
    for(const [k,v] of Object.entries(patch)){
      if(typeof v === "object" && v !== null && !Array.isArray(v) && typeof store[k] === "object"){
        store[k] = { ...store[k], ...v };
      }else{
        store[k] = v;
      }
    }
    if("settings" in patch) persistSettings();
    emit();
  }

  function subscribe(fn){
    listeners.add(fn);
    return () => listeners.delete(fn);
  }

  function emit(){
    listeners.forEach(fn => fn(store));
  }

  return { get, set, subscribe };
})();
// ===================================================================
// لایه اتصال به سرور (Cloudflare Worker) — بدون هیچ داده آزمایشی
// ===================================================================
// آدرس Worker از config.js می‌آید (خالی = همین دامنه). هیچ کلید والکسی در مرورگر وجود ندارد.
const API_BASE = String(window.__API_BASE__ || "").replace(/\/$/, "");

const Api = (() => {
  // توکن نشست (کوتاه‌مدت، ۱۲ ساعت) در sessionStorage می‌ماند تا با رفرش صفحه دوباره پیامک نخواهید؛ با بستن تب پاک می‌شود.
  // کلید والکس، رمز عبور و کد پیامکی هرگز در هیچ storage ذخیره نمی‌شوند.
  const SESS_KEY = "nx_session_v1";
  let sessionToken = null;
  function clearSession(){ sessionToken = null; try{ sessionStorage.removeItem(SESS_KEY); }catch(e){ /* ignore */ } }
  function setSession(s){
    sessionToken = s.token;
    try{ sessionStorage.setItem(SESS_KEY, JSON.stringify({ token:s.token, expiresAt:s.expiresAt, phone:s.phone || null })); }catch(e){ /* ignore */ }
    State.set({ account: { loggedIn:true, phone:s.phone || null } });
  }

  async function request(path, { method = "GET", body, auth = true } = {}){
    const headers = { Accept: "application/json" };
    if(body !== undefined) headers["Content-Type"] = "application/json";
    if(auth && sessionToken) headers.Authorization = "Bearer " + sessionToken;
    let res;
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 35000); // جلوگیری از اسکلتون بی‌پایان
    try{
      res = await fetch(API_BASE + path, { method, headers, signal: ctl.signal, body: body !== undefined ? JSON.stringify(body) : undefined });
    }catch(e){
      const timedOut = e && e.name === "AbortError";
      const err = new Error(timedOut ? "پاسخی از سرور نرسید (زمان انتظار تمام شد)؛ احتمالاً والکس کند یا در دسترس نیست." : "اتصال به سرور برقرار نشد. اینترنت یا آدرس Worker را بررسی کنید.");
      err.code = timedOut ? "TIMEOUT" : "NETWORK"; throw err;
    }finally{ clearTimeout(timer); }
    let json = null;
    try{ json = await res.json(); }catch(e){ /* غیر JSON */ }
    if(!res.ok || !json || json.ok !== true){
      const e = (json && json.error) || {};
      const err = new Error(e.message || `خطای سرور (HTTP ${res.status})`);
      err.code = e.code || ("HTTP_" + res.status); err.status = res.status; err.detail = e;
      if(res.status === 401 && err.code === "SESSION_INVALID"){
        clearSession();
        State.set({ account: { loggedIn:false, phone:null }, connection: { status:"disconnected", exchangeName:null, connectedAt:null, lastChecked:null } });
        window.dispatchEvent(new Event("hashchange")); // مسیریاب را به صفحه ورود برمی‌گرداند
      }
      throw err;
    }
    return json;
  }
  const wrap = (json) => ({ data: json.data, meta: json.meta || null, fetchedAt: json.fetchedAt, isMock: false });
  const get = async (path) => wrap(await request(path));

  const authPost = (path, body) => request(path, { method:"POST", body, auth:false }).then(j => j.data);

  // اتصال واقعی به والکس: کلید فقط یک‌بار به سرور می‌رود؛ سرور با یک درخواست واقعی به والکس آن را آزمایش و رمزنگاری‌شده ذخیره می‌کند
  async function connect(apiKey){
    const json = await request("/api/connect", { method:"POST", body:{ apiKey } });
    State.set({ connection: { status:"connected", exchangeName:"والکس", connectedAt:new Date().toISOString(), lastChecked:new Date().toISOString() } });
    return json.data;
  }
  async function disconnectExchange(){
    await request("/api/disconnect", { method:"POST", body:{} });
    return checkConnection();
  }
  // خروج از حساب برنامه (پایان نشست)
  async function disconnect(){
    clearSession();
    State.set({ connection: { status:"disconnected", exchangeName:null, connectedAt:null, lastChecked:null } });
    return { ok:true };
  }
  async function checkConnection(){
    if(!sessionToken) return State.get().connection;
    try{
      const j = await request("/api/session/check");
      const now = new Date().toISOString();
      State.set({ connection: j.data.exchangeKeyConfigured
        ? { status:"connected", exchangeName:"والکس", connectedAt:j.data.keyConnectedAt || State.get().connection.connectedAt || now, lastChecked:now }
        : { status:"disconnected", exchangeName:null, connectedAt:null, lastChecked:now } });
    }catch(e){ /* در قطعی شبکه، زمان آخرین بررسی موفق تغییر نمی‌کند */ }
    return State.get().connection;
  }
  async function restore(){
    try{
      const raw = sessionStorage.getItem(SESS_KEY); if(!raw) return false;
      const sv = JSON.parse(raw);
      if(!sv.token || !(sv.expiresAt > Date.now())){ clearSession(); return false; }
      sessionToken = sv.token; State.set({ account: { loggedIn:true, phone:sv.phone || null } });
      await checkConnection(); return State.get().account.loggedIn;
    }catch(e){ clearSession(); return false; }
  }

  async function getMarketList(){
    const res = await get("/api/market");
    if(res.meta && res.meta.stale){
      if(!Api._staleShown){ Api._staleShown = true; Toast.info("قیمت‌ها قدیمی‌اند", "والکس موقتاً درخواست را رد کرد؛ آخرین قیمت دریافت‌شده نمایش داده می‌شود: " + Utils.timeAgo(res.fetchedAt)); }
    }else Api._staleShown = false;
    const usdt = res.data.find(c => c.id === "usdt");
    Utils.setUsdtRate(usdt ? usdt.price : null);
    return res;
  }
  async function getCoin(id){
    const res = await getMarketList();
    return { ...res, data: res.data.find(c => c.id === id) || null };
  }
  const getCoinHistory   = (id, range) => get(`/api/history/${encodeURIComponent(id)}?range=${range}`);
  const getSparklines    = (ids) => get(`/api/sparklines?ids=${ids.join(",")}`);
  const getOrderbook     = (id) => get(`/api/orderbook/${encodeURIComponent(id)}`);
  const getPortfolioSummary = () => get("/api/portfolio");
  const getPortfolioHistory = (range) => get(`/api/portfolio/history?range=${range}`);
  const getWalletAssets  = () => get("/api/wallets");
  const getOpenOrders    = () => get("/api/orders/open");
  const getProfile       = () => get("/api/profile");

  async function getTransactions(filters = {}){
    const res = await get("/api/orders/history");
    const rows = res.data.filter(t =>
      (!filters.type   || filters.type   === "all" || t.type   === filters.type) &&
      (!filters.coin   || filters.coin   === "all" || t.coin   === filters.coin) &&
      (!filters.status || filters.status === "all" || t.status === filters.status));
    return { ...res, data: rows };
  }

  // --- سفارش‌گذاری (همه‌ی اعتبارسنجی و تصمیم‌ها سمت سرور است) ---
  const getTradeConfig = () => get("/api/trade/config");
  const previewOrder   = (order) => request("/api/trade/preview", { method:"POST", body:{ order } }).then(j => j.data);
  const submitOrder    = (order, clientOrderId, confirmToken) =>
    request("/api/trade/submit", { method:"POST", body:{ order, clientOrderId, confirmToken } }).then(j => j.data);
  const getOrderStatus = (id) => request("/api/trade/status", { method:"POST", body:{ id } }).then(j => j.data);

  // --- هوش مصنوعی معاملاتی (همه‌ی منطق و ریسک سمت سرور) ---
  const aiGet  = (path) => request("/api/trading" + path).then(j => j.data);
  const aiCall = (method, path, body) => request("/api/trading" + path, { method, body: body === undefined ? {} : body }).then(j => j.data);

  const api = { aiGet, aiCall, authPost, setSession, restore, connect, disconnect, disconnectExchange, checkConnection, getMarketList, getCoin, getCoinHistory, getSparklines, getOrderbook,
    getPortfolioSummary, getPortfolioHistory, getWalletAssets, getOpenOrders, getProfile, getTransactions,
    getTradeConfig, previewOrder, submitOrder, getOrderStatus };
  return api;
})();

// لایه حساب کاربری برنامه (جدا از اتصال صرافی)
// -------------------------------------------------------------------
// این بخش مسئول ثبت‌نام/ورود با شماره موبایل ایرانی است — کاملاً
// مجزا از اتصال به صرافی (که در api.js مدیریت می‌شود). در نسخه واقعی
// باید با یک سرویس پیامکی و بک‌اند احراز هویت واقعی جایگزین شود؛
// اینجا فقط رفتار و قرارداد توابع شبیه‌سازی شده است.
// ===================================================================

const AuthFlow = {
  phone: null,
  otpVerified: false,
  otpToken: null,       // اثبات موقت تأیید شماره (فقط در حافظه)
  hasAccount: null,     // آیا برای این شماره قبلاً حساب ساخته شده؟
  resetAllowed: false,
  resendAfterSec: 60,
  otpLength: 6,
};

// ورود و ثبت‌نام واقعی: همه‌ی کارها (ارسال پیامک، بررسی کد، رمز) سمت سرور انجام می‌شود.
const AppAuth = (() => {
  function isValidIranianPhone(phone){
    return /^09\d{9}$/.test((phone || "").trim());
  }
  const toEn = (v) => String(v || "").replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 0x06F0)).replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x0660)).trim();
  const fail = (code, message) => { const err = new Error(message); err.code = code; return err; };

  async function sendOtp(phone){
    phone = toEn(phone);
    if(!isValidIranianPhone(phone)) throw fail("INVALID_PHONE", "شماره موبایل باید با ۰۹ شروع شود و ۱۱ رقم باشد.");
    const r = await Api.authPost("/api/auth/otp/send", { phone });
    AuthFlow.phone = phone; AuthFlow.otpVerified = false; AuthFlow.otpToken = null; AuthFlow.hasAccount = null; AuthFlow.resetAllowed = false;
    AuthFlow.resendAfterSec = r.resendAfterSec || 60; AuthFlow.otpLength = r.length || 6;
    return { ok:true };
  }

  async function verifyOtp(code){
    code = toEn(code);
    if(!new RegExp("^\\d{" + AuthFlow.otpLength + "}$").test(code)) throw fail("INVALID_OTP", `کد تایید ${AuthFlow.otpLength} رقمی را به‌درستی وارد کنید.`);
    const r = await Api.authPost("/api/auth/otp/verify", { phone: AuthFlow.phone, code });
    AuthFlow.otpToken = r.otpToken; AuthFlow.hasAccount = !!r.hasAccount; AuthFlow.resetAllowed = !!r.resetAllowed; AuthFlow.otpVerified = true;
    return { ok:true };
  }

  function finish(session){
    Api.setSession(session);
    AuthFlow.otpToken = null; AuthFlow.otpVerified = false; // توکن یک‌بار مصرف بود
    return { ok:true };
  }
  async function createAccount(password){
    if(!password || password.length < 8) throw fail("WEAK_PASSWORD", "رمز عبور باید حداقل ۸ کاراکتر باشد.");
    return finish(await Api.authPost("/api/auth/register", { phone: AuthFlow.phone, otpToken: AuthFlow.otpToken, password }));
  }
  async function login(password){
    if(!password) throw fail("BAD_PASSWORD", "رمز عبور را وارد کنید.");
    return finish(await Api.authPost("/api/auth/login", { phone: AuthFlow.phone, otpToken: AuthFlow.otpToken, password }));
  }
  async function resetPassword(password){
    if(!password || password.length < 8) throw fail("WEAK_PASSWORD", "رمز عبور باید حداقل ۸ کاراکتر باشد.");
    return finish(await Api.authPost("/api/auth/reset", { phone: AuthFlow.phone, otpToken: AuthFlow.otpToken, password }));
  }

  function logout(){
    AuthFlow.phone = null; AuthFlow.otpVerified = false; AuthFlow.otpToken = null; AuthFlow.hasAccount = null;
    State.set({ account: { loggedIn:false, phone:null } });
  }

  return { isValidIranianPhone, sendOtp, verifyOtp, createAccount, login, resetPassword, logout };
})();

const Toast = (() => {
  let host = null;

  function ensureHost(){
    if(host) return host;
    host = Utils.el("div", { class:"toast-host" });
    document.body.appendChild(host);
    return host;
  }

  const ICONS = { success:"check", error:"alert", info:"info" };

  function show(type, title, desc = "", timeout = 4200){
    ensureHost();
    const node = Utils.el("div", { class:`toast ${type}` }, [
      Utils.el("div", { html: ic(ICONS[type] || "info") }),
      Utils.el("div", {}, [
        Utils.el("div", { style:"font-weight:700;margin-bottom:2px;" }, title),
        desc ? Utils.el("div", { class:"text-faint" }, desc) : null,
      ])
    ]);
    host.appendChild(node);
    setTimeout(() => {
      node.style.transition = "opacity .2s ease, transform .2s ease";
      node.style.opacity = "0";
      node.style.transform = "translateY(6px)";
      setTimeout(() => node.remove(), 200);
    }, timeout);
  }

  return {
    success:(t,d) => show("success", t, d),
    error:(t,d) => show("error", t, d),
    info:(t,d) => show("info", t, d),
  };
})();

const Charts = (() => {
  const instances = new Map();

  function cssVar(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function destroy(key){
    if(instances.has(key)){
      instances.get(key).destroy();
      instances.delete(key);
    }
  }

  function lineChart(key, canvas, points, { color, currency = "تومان", fill = true, minimal = false } = {}){
    if(!canvas || typeof Chart === "undefined"){ destroy(key); return null; }
    // اگر نمودار با همین کلید روی همین بوم هست، فقط داده‌ها را نرم به‌روز کن
    const existing = instances.get(key);
    if(existing && existing.canvas === canvas){
      existing.data.labels = points.map(p => p.t);
      existing.data.datasets[0].data = points.map(p => p.v);
      existing.update();
      return existing;
    }
    destroy(key);
    const accent = color || cssVar("--accent") || "#4d8bff";
    const grid = cssVar("--border-soft") || "#1b2436";
    const textFaint = cssVar("--text-faint") || "#5c6680";

    const ctx = canvas.getContext("2d");
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.clientHeight || 220);
    gradient.addColorStop(0, accent + "55");
    gradient.addColorStop(0.6, accent + "14");
    gradient.addColorStop(1, accent + "00");

    const chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: points.map(p => p.t),
        datasets: [{
          data: points.map(p => p.v),
          borderColor: accent,
          backgroundColor: fill ? gradient : "transparent",
          borderWidth: 2.5,
          borderCapStyle: "round",
          pointRadius: (ctx) => ctx.dataIndex === points.length - 1 ? 4 : 0,
          pointBackgroundColor: accent,
          pointBorderColor: "#fff",
          pointBorderWidth: 1.5,
          pointHoverRadius: 5,
          pointHoverBackgroundColor: accent,
          pointHoverBorderColor: "#fff",
          tension: 0.35,
          fill,
        }]
      },
      options: {
        responsive:true,
        maintainAspectRatio:false,
        interaction:{ mode:"index", intersect:false, axis:"x" },
        animation:{ duration:1050, easing:"easeOutQuart", delay:(context) => context.type === "data" ? Math.min(context.dataIndex * 42, 720) : 0 },
        transitions:{ active:{ animation:{ duration:180 } }, resize:{ animation:{ duration:250 } } },
        plugins:{
          legend:{ display:false },
          tooltip:{
            rtl:true,
            backgroundColor: cssVar("--surface") || "#121a2b",
            borderColor: accent,
            borderWidth:1,
            titleColor: textFaint,
            bodyColor: cssVar("--text") || "#e9eef6",
            caretPadding:8,
            cornerRadius:12,
            boxPadding:4,
            titleFont:{ family:"Vazirmatn", size:11 },
            bodyFont:{ family:"Vazirmatn", size:12, weight:"700" },
            padding:10,
            displayColors:false,
            callbacks:{
              title:(items) => Utils.formatDateTime(items[0].label),
              label:(item) => Utils.formatPrice(item.raw, currency),
            }
          }
        },
        scales:{
          x:{ display:false },
          y:{
            display:!minimal,
            position:"right",
            grid:{ color: grid, drawTicks:false },
            border:{ display:false },
            ticks:{
              color: textFaint,
              font:{ family:"Vazirmatn", size:10 },
              maxTicksLimit:4,
              callback:(v) => Utils.formatNumber(v, { compact:true }),
            }
          }
        },
        elements:{ line:{ capBezierPoints:true } }
      }
    });
    instances.set(key, chart);
    return chart;
  }

  function sparkline(canvas, points, positive = true){
    if(!canvas || typeof Chart === "undefined") return null;
    const key = "spark_" + (canvas.dataset.key || Math.random());
    destroy(key);
    const color = positive ? (cssVar("--green") || "#29c080") : (cssVar("--red") || "#ea4f60");
    const sCtx = canvas.getContext("2d");
    const sGrad = sCtx.createLinearGradient(0, 0, 0, canvas.clientHeight || 32);
    sGrad.addColorStop(0, color + "40");
    sGrad.addColorStop(1, color + "00");
    const chart = new Chart(sCtx, {
      type:"line",
      data:{
        labels:points.map((_,i) => i),
        datasets:[{ data:points.map(p => p.v), borderColor:color, backgroundColor:sGrad, fill:true, borderWidth:2, pointRadius:0, tension:0.4 }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{enabled:false} },
        scales:{ x:{display:false}, y:{display:false} },
        elements:{ line:{ borderJoinStyle:"round" } }
      }
    });
    instances.set(key, chart);
    return chart;
  }

  return { lineChart, sparkline, destroy };
})();

  }

  function loading(title = "در حال دریافت اطلاعات…"){
    return Utils.el("div", { class:"state-box" }, [
      Utils.el("div", { class:"spin", style:"width:22px;height:22px;border-width:2.5px;color:var(--accent);" }),
      Utils.el("div", { class:"title", style:"margin-top:4px;" }, title),
    ]);

  function mockFlag(){
    return Utils.el("span", { class:"mock-flag" }, [
      Utils.el("span", { html: ic("info") }),
      "داده آزمایشی",
    ]);
  }

  function changeBadge(value){
    if(value === null || value === undefined) return Utils.el("span", { class:"badge badge-gray" }, "—");
    const positive = value >= 0;
    return Utils.el("span", { class:`badge ${positive ? "badge-green" : "badge-red"}` }, [
      Utils.el("span", { html: ic(positive ? "trendUp" : "trendDown") }),
      Utils.formatPercent(value),
    ]);
  }

  // تولید یک رنگ ثابت و متمایز برای هر نماد ارز (حس برند بیشتر نسبت به رنگ یکسان)
  function coinHue(symbol){
    const s = symbol || "?";
    let hash = 0;
    for(let i=0;i<s.length;i++) hash = (hash * 31 + s.charCodeAt(i)) % 360;
    return hash;
  }

  function coinAvatar(symbol, size = 28){
    const letters = (symbol || "?").replace(/[^A-Za-z]/g,"").slice(0,3) || "?";
    const hue = coinHue(symbol);
    const bg = `linear-gradient(135deg, hsl(${hue} 72% 52%), hsl(${(hue+40)%360} 72% 42%))`;
    const glow = `0 3px 10px -2px hsl(${hue} 72% 45% / .55), inset 0 1px 0 #ffffff30`;
    return Utils.el("div", {
      class:"coin-ic",
      style:`width:${size}px;height:${size}px;font-size:${Math.round(size*0.36)}px;background:${bg};box-shadow:${glow};color:#ffffffe8;`,
    }, letters);
  }

  function statusBadge(status){
    const map = {
      "موفق": "badge-green", "در انتظار": "badge-amber", "ناموفق": "badge-red",
      "connected": "badge-green", "disconnected": "badge-gray", "checking": "badge-blue",
    };
    const labelMap = { connected:"متصل", disconnected:"قطع شده", checking:"در حال بررسی" };
    return Utils.el("span", { class:`badge ${map[status] || "badge-gray"}` }, [
      Utils.el("span", { class:"badge-dot" }),
      Utils.el("span", { class:"badge-label" }, labelMap[status] || status),
    ]);
  }

  // منوی کشویی سفارشی — جایگزین <select> بومی که در اندروید/iOS با
  // ظاهر سیستم‌عامل (نه تم برنامه) باز می‌شود.
  // options: [{value, label}] | onChange(value) | title: عنوان بالای ورق کشویی
  function dropdown({ value, options, onChange, title }){
    let current = value;

    const labelOf = (v) => {
      const opt = options.find(o => String(o.value) === String(v));
      return opt ? opt.label : "";
    };

    const triggerLabel = Utils.el("span", {}, labelOf(current));
    const trigger = Utils.el("button", { type:"button", class:"dropdown-trigger" }, [
      triggerLabel,
      Utils.el("span", { class:"chev", html: ic("chevronDown") }),
    ]);

    function openSheet(){
      trigger.classList.add("open");
      const backdrop = Utils.el("div", {
        class:"dropdown-sheet-backdrop",
        onClick:(e) => { if(e.target === backdrop) close(); },
      });
      const sheet = Utils.el("div", { class:"dropdown-sheet" });
      if(title) sheet.appendChild(Utils.el("div", { class:"dropdown-sheet-title" }, title));
      options.forEach(opt => {
        const isSel = String(opt.value) === String(current);
        const row = Utils.el("div", { class:`dropdown-option ${isSel ? "selected" : ""}` }, [
          Utils.el("span", {}, opt.label),
          Utils.el("span", { class:"radio" }),
        ]);
        row.addEventListener("click", () => {
          current = opt.value;
          triggerLabel.textContent = opt.label;
          close();
          onChange(opt.value);
        });
        sheet.appendChild(row);
      });
      backdrop.appendChild(sheet);
      document.body.appendChild(backdrop);
      function close(){ trigger.classList.remove("open"); backdrop.remove(); }
    }

    trigger.addEventListener("click", openSheet);
    return trigger;
  }

  return { skeleton, skeletonCard, skeletonRow, skeletonRows, skeletonChart, skeletonHead, stateBox, empty, errorState, loading, mockFlag, changeBadge, coinAvatar, statusBadge, dropdown };
})();

const Router = (() => {
  const routes = [
    { pattern: /^auth-phone$/,     name:"auth-phone",    page:() => PageAuthPhone },
    { pattern: /^auth-otp$/,       name:"auth-otp",      page:() => PageAuthOtp },
    { pattern: /^auth-password$/,  name:"auth-password", page:() => PageAuthPassword },
    { pattern: /^connect$/,        name:"connect",  page:() => PageConnect },
    { pattern: /^dashboard$/,      name:"dashboard",page:() => PageDashboard },
    { pattern: /^market$/,         name:"market",   page:() => PageMarket },
    { pattern: /^coin\/([\w-]+)$/, name:"coin",     page:() => PageCoin },
    { pattern: /^trade(?:\/([\w-]+))?$/, name:"trade", page:() => PageTrade },
    { pattern: /^wallet$/,         name:"wallet",   page:() => PageWallet },
    { pattern: /^history$/,        name:"history",  page:() => PageHistory },
    { pattern: /^profile$/,        name:"profile",  page:() => PageProfile },
    { pattern: /^ai$/,             name:"ai",       page:() => PageAI },
    { pattern: /^settings$/,       name:"settings", page:() => PageSettings },
  ];

  function current(){
    const hash = (location.hash || "#auth-phone").replace(/^#\/?/, "");
    for(const r of routes){
      const m = hash.match(r.pattern);
      if(m) return { name:r.name, page:r.page(), params:{ id: m[1] } };
    }
    return { name:"dashboard", page:PageDashboard, params:{} };
  }

  function go(path){
    location.hash = "#/" + path.replace(/^#\/?/, "");
  }

  function start(onChange){
    window.addEventListener("hashchange", () => onChange(current()));
    onChange(current());
  }

  return { go, current, start };
})();

          disabled: countdown > 0 ? "true" : false,
          onClick: handleResend,
        }, countdown > 0 ? `ارسال مجدد (${countdown})` : "ارسال مجدد کد"),
      ]));

      startCountdown();
    }

    async function handleVerify(){
      const input = card.querySelector("#otpInput");
      const code = input.value.trim();
      status = "loading"; errorMsg = ""; paint();
      try{
        await AppAuth.verifyOtp(code);
        clearInterval(timer);
        Router.go("auth-password");
      }catch(e){
        status = "error";
        errorMsg = e && e.message ? e.message : "کد وارد شده نامعتبر است.";
        paint();
      }
    }

    async function handleResend(){
      try{
        await AppAuth.sendOtp(AuthFlow.phone);
        Toast.info("کد دوباره ارسال شد", "");
        startCountdown();
      }catch(e){ Toast.error("ارسال مجدد انجام نشد", e && e.message ? e.message : ""); }
    }

    paint();
  }
};

const PageAuthPassword = {

        : mode === "login" ? `شماره ${AuthFlow.phone || ""} تأیید شد. رمز عبور حساب خود را وارد کنید.`

          ]),
        ]),

      ]);
      card.appendChild(pwField);
      if(needConfirm){
        card.appendChild(Utils.el("div", { class:"field", style:"margin-top:14px;" }, [
          Utils.el("label", { for:"pwConfirmInput" }, "تکرار رمز عبور"),
          Utils.el("div", { class:"input-wrap" }, [Utils.el("input", { id:"pwConfirmInput", class:"input", type: showPw ? "text" : "password", placeholder:"رمز عبور را دوباره وارد کنید", autocomplete:"new-password" })]),
          status === "error" ? Utils.el("span", { class:"field-error" }, [Utils.el("span",{html:ic("alert")}), errorMsg]) : null,
        ]));
      }
      card.appendChild(Utils.el("button", {
        class:"btn btn-primary btn-block", style:"margin-top:16px;height:44px;",
        disabled: status === "loading" ? "true" : false, onClick: handleSubmit,
      }, status === "loading" ? [Utils.el("span",{class:"spin"}), mode === "login" ? "در حال ورود…" : "در حال ذخیره…"] : (mode === "register" ? "ثبت‌نام و ورود" : mode === "login" ? "ورود" : "تغییر رمز و ورود")));
      if(mode === "login" && AuthFlow.resetAllowed){
        card.appendChild(Utils.el("div", { style:"text-align:center;margin-top:12px;" }, [
          Utils.el("button", { class:"btn btn-ghost btn-sm", onClick: () => { mode = "reset"; status = "idle"; errorMsg = ""; paint(); } }, "رمز عبور را فراموش کرده‌ام"),
        ]));
      }
      card.appendChild(Utils.el("div", { style:"text-align:center;margin-top:8px;" }, [
        Utils.el("button", { class:"btn btn-ghost btn-sm", onClick: () => Router.go("auth-phone") }, "تغییر شماره"),
      ]));
    }

    async function handleSubmit(){
      const pw = card.querySelector("#pwInput").value;
      const confirmEl = card.querySelector("#pwConfirmInput");
      if(confirmEl && pw !== confirmEl.value){ status = "error"; errorMsg = "رمز عبور و تکرار آن یکسان نیستند."; paint(); return; }
      status = "loading"; errorMsg = ""; paint();
      try{
        if(mode === "register") await AppAuth.createAccount(pw);
        else if(mode === "login") await AppAuth.login(pw);
        else await AppAuth.resetPassword(pw);
        await Api.checkConnection(); // اگر کلید والکس قبلاً روی سرور ذخیره/تنظیم شده باشد، مستقیم به داشبورد می‌رویم
        Toast.success(mode === "register" ? "خوش آمدید" : "ورود موفق", mode === "register" ? "حساب شما ساخته شد." : "با موفقیت وارد شدید.");
        Router.go("dashboard");
      }catch(e){
        status = "error";
        errorMsg = e && e.message ? e.message : "عملیات با خطا مواجه شد.";
        if(e && (e.code === "OTP_TOKEN_INVALID")){ AuthFlow.otpVerified = false; }
        paint();
      }
    }

    paint();
  }
};

const PageConnect = {

          }),
          Utils.el("div", { class:"input-actions" }, [
            Utils.el("button", {
              class:"input-icon-btn", type:"button", title: showKey ? "مخفی کردن" : "نمایش",
              html: ic(showKey ? "eyeOff" : "eye"),

            }),

      ]);
      card.appendChild(field);

      const btn = Utils.el("button", {
        class:"btn btn-primary btn-block", style:"margin-top:16px;height:44px;",
        disabled: status === "loading" ? "true" : false,
        onClick: handleConnect,
      }, status === "loading" ? [Utils.el("span",{class:"spin"}), "در حال آزمایش با والکس…"] : "اتصال به والکس");
      card.appendChild(btn);

      const st = renderStatus();

      ])));
      list.innerHTML = "";
      const top = [...coins].sort((a, b) => Math.abs(b.change24h) - Math.abs(a.change24h)).slice(0, 6);
      top.forEach(c => list.appendChild(Q.coinRow(c)));
      if(!top.length) list.appendChild(UI.empty("بازاری یافت نشد", ""));
      Q.paintSparks(root, [...new Map([...(pick.length ? pick : coins.slice(0, 3)), ...top].map(c => [c.id, c])).values()]);
      State.set({ connection: { lastChecked: new Date().toISOString() } });
    }else{
      overview.remove(); list.innerHTML = "";
      list.appendChild(UI.errorState("دریافت اطلاعات بازار ناموفق بود", marketS.reason && marketS.reason.message, () => PageDashboard.mount(container)));
    }
  }
};

const PageMarket = {
  async mount(container){
    container.innerHTML = "";
    const E = Utils.el;
    let allCoins = [], query = "", mode = "all", pageSize = 8, visible = pageSize;
    const root = E("div", { class:"q-stagger" });
    container.appendChild(root);
    const search = E("div", { class:"q-search" }, [
      E("span", { html: ic("search") }),
      E("input", { class:"input", placeholder:"جست‌وجوی نام یا نماد ارز…", onInput: Utils.debounce((e) => { query = e.target.value.trim(); visible = pageSize; paint(); }, 180) }),
    ]);
    const filters = E("div", { class:"q-filters" });
    const list = E("div", { class:"q-list" }, UI.skeletonRows(7));
    root.append(search, filters, list);

    const MODES = [["all", "همه"], ["up", "رشد"], ["down", "افت"], ["vol", "حجم"], ["irt", "تومان"]];
    function paintFilters(){
      filters.innerHTML = "";
      MODES.forEach(([k, l]) => filters.appendChild(E("button", { class:`chip ${mode === k ? "active" : ""}`, onClick: () => { mode = k; visible = pageSize; paintFilters(); paint(); } }, l)));
    }
    function rows(){
      let r = allCoins.filter(c => !query || c.name.includes(query) || c.symbol.toLowerCase().includes(query.toLowerCase()));
      if(mode === "up") r = r.filter(c => c.change24h > 0).sort((a, b) => b.change24h - a.change24h);
      else if(mode === "down") r = r.filter(c => c.change24h < 0).sort((a, b) => a.change24h - b.change24h);
      else if(mode === "irt") r = r.filter(c => c.symbol.includes("IRT")).sort((a, b) => b.volume24h - a.volume24h);
      else r = r.sort((a, b) => b.volume24h - a.volume24h);
      return r;
    }
    function paint(){
      list.innerHTML = "";
      const r = rows();
      if(!r.length){ list.appendChild(UI.empty("نتیجه‌ای یافت نشد", "عبارت جست‌وجو یا فیلتر را تغییر دهید.")); return; }
      const shown = r.slice(0, visible);
      shown.forEach(c => list.appendChild(Q.coinRow(c)));
      if(visible < r.length) list.appendChild(E("button", { class:"btn btn-outline btn-block", onClick: () => { visible += pageSize; paint(); } }, "نمایش موارد بیشتر"));
      requestAnimationFrame(() => {
        shown.forEach(c => { const cv = list.querySelector(`canvas[data-key="row_${c.id}"]`); if(cv && c._spark) Charts.sparkline(cv, c._spark, (c.change24h ?? 0) >= 0); });
      });
    }
    async function load(){
      try{
        const res = await Api.getMarketList();
        allCoins = res.data.map(c => ({ ...c, _spark:null }));
        paintFilters(); paint();
        Api.getSparklines(allCoins.map(c => c.id)).then(sp => { allCoins.forEach(c => { c._spark = (sp.data && sp.data[c.id]) || null; }); paint(); }).catch(() => {});
      }catch(e){
        list.innerHTML = ""; list.appendChild(UI.errorState("دریافت بازار ناموفق بود", e.message, load));
      }
    }
    load();
  }
};

const PageCoin = {

        UI.coinAvatar(coin.symbol, 44),
        E("div", { class:"q-id" }, [E("h2", {}, [coin.name, " ", isMock ? UI.mockFlag() : null]), E("span", { class:"num" }, coin.symbol)]),
      );
      priceBox.innerHTML = "";
      const p = E("div", { class:"q-bigprice num" }, "0");
      priceBox.append(p, E("div", { style:"display:flex;gap:10px;align-items:center;margin:0 2px;" }, [

    }
    function stats(coin){
      statsBox.innerHTML = "";

      statsBox.appendChild(E("div", { class:"q-stats" }, [
        s("بالاترین ۲۴س", Utils.formatPrice(coin.high24h, "")), s("پایین‌ترین ۲۴س", Utils.formatPrice(coin.low24h, "")), s("حجم ۲۴س", Utils.formatNumber(coin.volume24h, { compact:true }))]));
    }
    function renderChart(histRes, coin){
      chartCard.innerHTML = "";
      const ranges = [["7d", "۷ روز"], ["30d", "۳۰ روز"], ["90d", "۹۰ روز"]];
      bar = E("div", { class:"range-tabs", style:"padding:0 6px;" }, ranges.map(([r, l]) => E("button", {
        class:`chip ${r === range ? "active" : ""}`, style:"padding:5px 13px;font-size:11.5px;",
        onClick: async () => { range = r; let h; try{ h = await Api.getCoinHistory(coinId, r); }catch(e){ h = { data:[] }; } renderChart(h, coin); } }, l)));
      chartCard.appendChild(bar);
      const pts = histRes.data;
      if(!pts || pts.length < 2){ chartCard.appendChild(UI.empty("داده‌ی تاریخی کافی در دسترس نیست", "")); return; }
      const pct = ((pts[pts.length - 1].v - pts[0].v) / pts[0].v) * 100;
      chartCard.appendChild(E("div", { class:"chart-canvas-wrap" }, E("canvas", { id:"coinChart" })));
      requestAnimationFrame(() => Charts.lineChart("coinChart", document.getElementById("coinChart"), pts, { color: pct >= 0 ? "#1fe08f" : "#ff5d7a", currency:"" , minimal:false }));
    }
    function side(coin, walletRes, ordersRes){
      sideCol.innerHTML = "";
      const holding = walletRes ? (walletRes.data || []).find(a => a.coinId === coin.id) : null;
      sideCol.appendChild(E("div", { class:"card card-pad" }, [E("div", { class:"card-title" }, "موجودی شما"),
        holding ? E("div", { style:"margin-top:8px;" }, [E("div", { class:"num", style:"font-size:18px;font-weight:800;" }, `${Utils.formatNumber(holding.total, { decimals:6 })} ${holding.symbol}`), E("div", { class:"text-faint", style:"font-size:12px;" }, `≈ ${Utils.formatPrice(holding.valueIrt, "")}`)])
        : (walletRes ? UI.empty("از این ارز موجودی ندارید", "") : UI.empty("موجودی در دسترس نیست", ""))]));
      const mine = ordersRes ? (ordersRes.data || []).filter(o => o.coin === coin.id.toUpperCase()) : null;
      sideCol.appendChild(E("div", { class:"card card-pad" }, [E("div", { class:"card-title" }, "سفارش‌های باز"),
        mine === null ? UI.empty("سفارش‌ها در دسترس نیست", "") : mine.length === 0 ? UI.empty("سفارش فعالی ندارید", "")
        : E("div", {}, mine.map(o => E("div", { class:"info-row" }, [E("span", {}, `${o.type} ${Utils.formatNumber(o.amount, { decimals:6 })}`), E("span", { class:"num" }, o.desc)])))]));
      sideCol.appendChild(E("div", { style:"height:70px;" }));
    }
    function mountTradeBar(coin){
      document.querySelectorAll(".q-trade-bar").forEach(n => n.remove());
      const go = (side) => () => { TradePrefill.value = { coinId:coin.id, side }; Router.go("trade/" + coin.id); };
      const bar = E("div", { class:"q-trade-bar" }, [E("button", { class:"q-buy", onClick:go("buy") }, "خرید"), E("button", { class:"q-sell", onClick:go("sell") }, "فروش")]);
      document.body.appendChild(bar);
    }
  }
};

const PageTrade = {
  async mount(container, params){
    container.innerHTML = "";
    container.appendChild(Utils.el("div", { class:"page-head" }, [
      Utils.el("div", {}, [
        Utils.el("h1", {}, "خرید و فروش"),
        Utils.el("div", { class:"sub" }, "آماده‌سازی و ثبت سفارش در بازار تومانی والکس"),
      ]),
    ]));

    body.appendChild(UI.skeletonRows(5));

    let coins = [], cfg = null, assets = null, book = null;
    const st = { coinId: (params && params.id) || "btc", side:"buy", execution:"limit", amount:"", price:"" };
    let busy = false;

    try{
      const [mRes, cRes, wRes] = await Promise.all([
        Api.getMarketList(),

      return;
    }
    if(!coins.find(c => c.id === st.coinId)) st.coinId = coins[0].id;
    if(TradePrefill.value){ // پیشنهاد هوش مصنوعی: مقادیر پر می‌شوند ولی کاملاً قابل ویرایش‌اند
      const pf = TradePrefill.value; TradePrefill.value = null;
      if(coins.find(c => c.id === pf.coinId)) st.coinId = pf.coinId;
      st.side = pf.side === "sell" ? "sell" : "buy"; st.execution = "limit";
      st.amount = String(pf.qty || ""); st.price = String(pf.price || "");
      st.aiNote = `این مقادیر پیشنهاد هوش مصنوعی هستند (${st.side === "buy" ? "خرید" : "فروش"} ${st.coinId.toUpperCase()}). می‌توانید هر کدام را تغییر دهید؛ سفارش فقط پس از پیش‌نمایش و تأیید خودتان ثبت می‌شود.`;
    }
    loadBook();

    const coin = () => coins.find(c => c.id === st.coinId);
    const fmtAmount = (n) => { let s = Number(n).toFixed(8); return s.includes(".") ? s.replace(/0+$/,"").replace(/\.$/,"") : s; };

    async function loadBook(){
      try{ book = (await Api.getOrderbook(st.coinId)).data; }catch(e){ book = null; }
      paint();
    }

    function balanceInfo(){
      if(!assets) return { text:"نامشخص (دریافت موجودی ممکن نشد)", value:null };
      const key = st.side === "buy" ? "irt" : st.coinId;
      const a = assets.find(x => x.coinId === key);
      const v = a ? a.available : 0;
      return { value:v, text: st.side === "buy" ? Utils.formatPrice(v, "تومان") : `${Utils.formatNumber(v,{decimals:8})} ${st.coinId.toUpperCase()}` };
    }

    function estimate(){
      const amt = Number(st.amount); const c = coin();
      if(!(amt > 0)) return null;
      if(st.execution === "limit"){ const p = Number(st.price); return p > 0 ? amt * p : null; }
      const unit = (st.side === "buy" ? c.bestSell : c.bestBuy) || c.price; return amt * unit;
    }

    function paint(){
      body.innerHTML = "";
      const c = coin();
      const enabled = cfg && cfg.tradingEnabled;
      body.appendChild(Utils.el("div", { class:"notice-box", style:"margin-bottom:14px;" }, [
        Utils.el("div", { html: ic("shield") }),
        Utils.el("p", {}, !cfg
          ? "وضعیت سفارش‌گذاری از سرور دریافت نشد؛ ارسال سفارش در دسترس نیست."
          : enabled
            ? "ثبت سفارش واقعی روی سرور فعال است. هر سفارش با پول واقعی انجام می‌شود و پیش از ارسال باید صریحاً تأیید شود."
            : "ثبت سفارش واقعی روی سرور غیرفعال است. می‌توانید سفارش را آماده و پیش‌نمایش کنید، اما ارسال نمی‌شود."),
      ]));

      if(st.aiNote) body.appendChild(Utils.el("div", { class:"notice-box", style:"margin-bottom:14px;" }, [
        Utils.el("div", { html: ic("bot") }), Utils.el("p", {}, st.aiNote)]));

      const grid = Utils.el("div", { class:"coin-grid" });

      const side = Utils.el("div", { style:"display:flex;flex-direction:column;gap:14px;" });

      form.appendChild(Utils.el("div", { class:"field" }, [
        Utils.el("label", {}, "بازار"),
        UI.dropdown({ value: st.coinId, title:"انتخاب بازار", options: coins.map(x => ({ value:x.id, label:`${x.name} (${x.symbol})` })),

        Utils.el("button", { class:`tab-btn ${st.side==="buy"?"active":""}`, onClick:() => { st.side = "buy"; paint(); } }, "خرید"),
        Utils.el("button", { class:`tab-btn ${st.side==="sell"?"active":""}`, onClick:() => { st.side = "sell"; paint(); } }, "فروش"),
      ]));
      form.appendChild(Utils.el("div", { class:"tabs", style:"margin-top:8px;" }, [
        Utils.el("button", { class:`tab-btn ${st.execution==="limit"?"active":""}`, onClick:() => { st.execution = "limit"; paint(); } }, "سفارش محدود"),
        Utils.el("button", { class:`tab-btn ${st.execution==="market"?"active":""}`, onClick:() => { st.execution = "market"; paint(); } }, "سفارش بازار"),
      ]));

      const amountInput = Utils.el("input", { class:"input num", inputmode:"decimal", placeholder:"مثلاً 0.001", value: st.amount, autocomplete:"off",
        onInput:(e) => { st.amount = e.target.value.trim(); updateEstimate(); } });
      form.appendChild(Utils.el("div", { class:"field", style:"margin-top:12px;" }, [
        Utils.el("label", {}, `مقدار (${st.coinId.toUpperCase()})`), amountInput,

        ]));
      }

      const est = Utils.el("div", { class:"info-row", style:"margin-top:12px;" });
      form.appendChild(est);

        modal.appendChild(row(sm.execution === "limit" ? "مبلغ سفارش" : "مبلغ تقریبی", Utils.formatPrice(sm.estimateIrt, "تومان")));

        if(!pv.tradingEnabled){
          modal.appendChild(Utils.el("div", { class:"notice-box", style:"margin-top:12px;" }, [

const PageWallet = {
  async mount(container){
    container.innerHTML = "";
    const E = Utils.el;
    let hide = false, query = "", assets = [], coinMap = {}, tab = "assets";
    const root = E("div", { class:"q-stagger" });
    container.appendChild(root);
    const totalCard = E("div", { class:"card q-portfolio" }, UI.skeletonChart(80));
    const donutCard = E("div", { class:"card q-donut-card" });
    const seg = E("div", { class:"q-seg" });
    const body = E("div");
    root.append(totalCard, donutCard, seg, body);
    body.appendChild(UI.skeletonRows(5));
    const sumOf = (fn) => assets.reduce((s, a) => s + (a.valueIrt === null ? 0 : fn(a)), 0);
    const mask = (v, f) => hide ? "••••" : f(v);

    try{
      const [w, m] = await Promise.all([Api.getWalletAssets(), Api.getMarketList()]);
      assets = w.data; coinMap = Object.fromEntries(m.data.map(c => [c.id, c]));
      paintTop(w.isMock); paintDonut(); paintSeg(); paintBody();
    }catch(e){
      totalCard.remove(); donutCard.remove(); seg.remove(); body.innerHTML = "";
      body.appendChild(UI.errorState("دریافت دارایی‌ها ناموفق بود", e.message, () => PageWallet.mount(container)));
    }
    function paintTop(isMock){
      totalCard.innerHTML = "";
      const total = sumOf(a => a.valueIrt);
      const avail = sumOf(a => a.available * a.priceIrt), locked = sumOf(a => a.locked * a.priceIrt);
      const t = E("span", { class:"num" }, "0");
      totalCard.append(
        E("div", { style:"display:flex;justify-content:space-between;align-items:center;" }, [
          E("div", { class:"q-lbl" }, ["ارزش کل دارایی‌های من ", isMock ? UI.mockFlag() : null]),
          E("button", { class:"icon-btn", style:"width:34px;height:34px;", html: ic(hide ? "eyeOff" : "eye"), onClick: () => { hide = !hide; paintTop(isMock); paintBody(); } })]),
        E("div", { class:"q-total" }, [t, E("small", {}, State.get().settings.priceUnit === "usdt" ? "تتر" : "تومان")]),
        E("div", { class:"q-stats", style:"grid-template-columns:1fr 1fr;" }, [
          E("div", { class:"q-stat" }, [E("div", { class:"l" }, "قابل‌استفاده"), E("div", { class:"v num" }, mask(avail, v => Utils.formatPrice(v, "")))]),
          E("div", { class:"q-stat" }, [E("div", { class:"l" }, "درگیر سفارش"), E("div", { class:"v num" }, mask(locked, v => Utils.formatPrice(v, "")))])]),
        E("button", { class:"btn btn-primary btn-block", style:"margin-top:12px;", onClick: openCharge }, "شارژ حساب"));
      if(hide) t.textContent = "••••••"; else Q.countUp(t, total, v => Utils.formatPrice(v, "").trim());
    }
    function paintDonut(){
      donutCard.innerHTML = "";
      const priced = assets.filter(a => a.valueIrt > 0).sort((a, b) => b.valueIrt - a.valueIrt);
      if(!priced.length){ donutCard.remove(); return; }
      const total = priced.reduce((s, a) => s + a.valueIrt, 0);
      const top = priced.slice(0, 4), rest = priced.slice(4).reduce((s, a) => s + a.valueIrt, 0);
      const items = top.map(a => ({ l:a.symbol, v:a.valueIrt })); if(rest > 0) items.push({ l:"سایر", v:rest });
      const colors = ["#2f6bff", "#7a4dff", "#27d6ee", "#1fe08f", "#ffc24d"];
      const cv = E("canvas");
      donutCard.append(E("div", { class:"q-donut" }, [cv, E("div", { class:"mid" }, [E("span", {}, "توزیع"), E("span", {}, "دارایی‌ها")])]),
        E("div", { class:"q-legend" }, items.map((it, i) => E("div", {}, [E("i", { style:`background:${colors[i]}` }), E("span", {}, it.l), E("b", {}, ((it.v / total) * 100).toFixed(0) + "%")]))));
      requestAnimationFrame(() => { if(typeof Chart === "undefined") return; Charts.destroy("walletDonut");
        new Chart(cv.getContext("2d"), { type:"doughnut", data:{ labels:items.map(i => i.l), datasets:[{ data:items.map(i => i.v), backgroundColor:colors, borderWidth:0, spacing:3, borderRadius:6 }] },
          options:{ cutout:"70%", responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false }, tooltip:{ enabled:false } }, animation:{ animateRotate:true, duration:1400, easing:"easeOutQuart" } } }); });
    }
    function paintSeg(){
      seg.innerHTML = "";
      [["assets", "دارایی‌ها"], ["pl", "سود و زیان"]].forEach(([k, l]) => seg.appendChild(E("button", { class: tab === k ? "active" : "", onClick: () => { tab = k; paintSeg(); paintBody(); } }, l)));
    }
    function paintBody(){
      body.innerHTML = "";
      body.appendChild(E("div", { class:"q-search" }, [E("span", { html: ic("search") }),
        E("input", { class:"input", placeholder:"جست‌وجوی دارایی…", value:query, onInput: Utils.debounce((e) => { query = e.target.value; paintList(); }, 180) })]));
      body.appendChild(E("div", { class:"q-list", id:"wList" }));
      paintList();
    }
    function paintList(){
      const l = document.getElementById("wList"); if(!l) return; l.innerHTML = "";
      if(!assets.length){ l.appendChild(UI.empty("دارایی‌ای یافت نشد", "پس از واریز، دارایی‌ها اینجا نمایش داده می‌شود.")); return; }
      const rows = assets.filter(a => !query || a.name.includes(query) || a.symbol.toLowerCase().includes(query.toLowerCase()));
      if(!rows.length){ l.appendChild(UI.empty("نتیجه‌ای یافت نشد", "")); return; }
      rows.forEach(a => l.appendChild(E("div", { class:"q-row", onClick: () => { if(coinMap[a.coinId]) Router.go(`coin/${a.coinId}`); } }, [
        UI.coinAvatar(a.symbol, 40),
        E("div", { class:"q-id" }, [E("div", { class:"q-nm" }, a.name), E("div", { class:"q-sy num" }, mask(a.total, v => Utils.formatNumber(v, { decimals:6 })) + " " + a.symbol)]),
        E("div", { class:"q-pr" }, tab === "pl"
          ? [E("div", { class:`p ${(a.change24h ?? 0) >= 0 ? "up" : "down"}` }, Utils.formatPercent(a.change24h)), E("div", { class:"c text-faint" }, "۲۴ساعت")]
          : [E("div", { class:"p num" }, mask(a.valueIrt, v => Utils.formatPrice(v, ""))), E("div", { class:`c ${(a.change24h ?? 0) >= 0 ? "up" : "down"}` }, Utils.formatPercent(a.change24h))]),
      ])));
    }
    function openCharge(){
      const bd = E("div", { class:"modal-backdrop", onClick: (e) => { if(e.target === bd) bd.remove(); } });
      bd.appendChild(E("div", { class:"modal" }, [E("h3", {}, "انتقال به وب‌سایت صرافی"),
        E("p", {}, "برای شارژ حساب به وب‌سایت رسمی صرافی هدایت می‌شوید. این برنامه هیچ اطلاعات بانکی یا پرداختی دریافت نمی‌کند."),
        E("div", { class:"modal-actions" }, [E("button", { class:"btn btn-outline", onClick: () => bd.remove() }, "انصراف"),
          E("button", { class:"btn btn-primary", onClick: () => { window.open(NOBITEX_OFFICIAL_URL, "_blank", "noopener"); bd.remove(); } }, [E("span", { html: ic("externalLink") }), " رفتن به وب‌سایت"])])]));
      document.body.appendChild(bd);
    }
  }
};

        field("بازه (روز)", E("div", { class:"tabs" }, [7,30,60,90].map(d => { const b = E("button", { class:`tab-btn ${st.days === d ? "active" : ""}`, onClick:() => { st.days = d; [...b.parentNode.children].forEach(x => x.classList.toggle("active", x === b)); } }, `${d} روز`); return b; }))));
      form.appendChild(E("button", { class:"btn btn-primary", style:"margin-top:14px;", onClick: async () => {
        out.innerHTML = ""; out.appendChild(UI.skeletonRows(4));
        try{ const r = await Api.aiCall("POST", "/backtest", { coinId: st.coinId, days: st.days }); out.innerHTML = ""; renderBacktest(out, r); }
        catch(e){ out.innerHTML = ""; out.appendChild(UI.errorState("بک‌تست ناموفق بود", errMsg(e), null)); } } }, "اجرای بک‌تست"));
    }
    function renderBacktest(out, r){
      const card = E("div", { class:"card card-pad" }); out.appendChild(card);
      if(!r.ok){ card.appendChild(E("div", { class:"text-red" }, r.error)); return; }
      card.appendChild(E("div", { class:"card-head" }, E("div", { class:"card-title" }, `${r.coinId.toUpperCase()} — ${r.bars} کندل (${Utils.formatDateTime(r.from)} تا ${Utils.formatDateTime(r.to)})`)));
      const g = E("div", { class:"ai-grid2" }); card.appendChild(g);
      [["کل دوره", r.all], ["درون‌نمونه (۷۰٪ اول)", r.inSample], ["برون‌نمونه (۳۰٪ آخر)", r.outOfSample]].forEach(([label, m]) => {
        const col = E("div", {}, [E("div", { style:"font-weight:700;margin-bottom:6px;" }, label)]);
        col.append(kv("تعداد معاملات", fmt(m.trades)), kv("نرخ برد", m.winRatePct === null ? "—" : pct(m.winRatePct, 0)), kv("بازده خالص", pct(m.netReturnPct), pnlCls(m.netReturnPct)), kv("میانگین هر معامله", pct(m.avgTradePct)), kv("ضریب سود", m.profitFactor === null ? "—" : fmt(m.profitFactor, 2)), kv("بیشینه افت", pct(m.maxDrawdownPct))); g.appendChild(col); });
      card.appendChild(E("div", { style:"margin-top:10px;" }, [kv("مبنای مقایسه: نگه‌داری (Buy & Hold) کل دوره", pct(r.buyAndHold.allPct), pnlCls(r.buyAndHold.allPct)), kv("نگه‌داری در بازه‌ی برون‌نمونه", pct(r.buyAndHold.outOfSamplePct), pnlCls(r.buyAndHold.outOfSamplePct))]));
      if(r.warnings.length) card.appendChild(E("ul", { class:"ai-reasons text-red" }, r.warnings.map(w => E("li", {}, w))));
      card.appendChild(E("div", { class:"text-faint", style:"font-size:12px;margin-top:8px;" }, "فرض‌ها: " + r.assumptions.join(" • ")));
      card.appendChild(E("div", { class:"text-faint", style:"font-size:12px;margin-top:4px;" }, r.disclaimer));
    }

    // ---------- چرخه‌ی به‌روزرسانی ----------
    function paintBody(){
      if(ui.tab === "status") paintStatus(); else if(ui.tab === "signals") paintSignals(); else if(ui.tab === "trades") paintTrades();
      else if(ui.tab === "settings") paintSettings(); else if(ui.tab === "smart") paintSmart(); else paintBacktest();
    }
    async function refresh(){
      try{
        const [s, set] = await Promise.all([Api.aiGet("/status"), ui.settings ? Promise.resolve(null) : Api.aiGet("/settings")]);
        if(gone()) return; ui.status = s;
        if(set){ ui.settings = set.settings; ui.defaults = set.defaults; ui.allowed = set.allowedCoins; ui.serverCap = set.serverCapIrt; }
        paintBanner(); if(ui.tab === "status") paintStatus();
      }catch(e){
        if(gone()) return; banner.innerHTML = ""; banner.appendChild(UI.errorState("اتصال به موتور معاملاتی برقرار نشد", errMsg(e), refresh));
      }
    }
    paintTabs(); paintBanner(); paintBody(); await refresh();
    PageAI._timer = setInterval(() => { if(gone()){ clearInterval(PageAI._timer); PageAI._timer = null; return; } if(ui.tab === "status") refresh(); }, 15000);
  }
};

// ===================================================================
// دکمه‌ی شناور هوش مصنوعی + صفحه‌ی گزارش (گفتگوی فقط‌خواندنی)
// • کاربر نمی‌تواند پیام بفرستد؛ فقط گزارش‌های موتور را می‌خواند.
// • حالت خودکار (Paper/Live): گزارش همه‌ی خرید و فروش‌ها و هشدارها
// • حالت تحلیل و پیشنهاد: چه ارزی، چقدر، کی بفروشد + دکمه‌ی انتقال به صفحه‌ی خرید با مقادیر پرشده
// همه‌ی متن‌ها از سرور می‌آیند و فقط با textContent نمایش داده می‌شوند.
// ===================================================================
const TradePrefill = { value: null };

const AIChat = (() => {
  const E = Utils.el;
  const SEEN_KEY = "aiChatSeenAt"; // فقط یک زمان‌نگار (نه داده‌ی حساس)
  let fab = null, panel = null, feedEl = null, timer = null, badgeTimer = null, last = null, open = false;

  const getSeen = () => { try{ return localStorage.getItem(SEEN_KEY); }catch(_){ return null; } };
  const setSeen = (v) => { try{ if(v) localStorage.setItem(SEEN_KEY, v); }catch(_){ /* بی‌اهمیت */ } };

  function goToTrade(action){
    TradePrefill.value = action;
    close();
    const target = "#/trade/" + action.coinId;
    if(location.hash === target) window.dispatchEvent(new HashChangeEvent("hashchange"));
    else Router.go("trade/" + action.coinId);
  }

  function messageEl(m, isLastSuggestion){
    const sev = m.severity || "info";
    const box = E("div", { class:`ai-msg ai-msg-${sev} ${m.kind === "suggestion_past" || m.kind === "analysis" ? "ai-msg-dim" : ""}` });
    box.appendChild(E("div", { class:"ai-msg-head" }, [E("span", { class:"ai-msg-title" }, m.title), E("span", { class:"ai-msg-time num" }, Utils.formatDateTime(m.t))]));
    (m.lines || []).forEach(l => box.appendChild(E("div", { class:"ai-msg-line" }, l)));
    if(m.sellPlan && m.sellPlan.length){
      box.appendChild(E("div", { class:"ai-msg-sub" }, m.kind === "suggestion" && m.action && m.action.side === "sell" ? "چرا فروش؟" : "کی بفروشید؟"));
      box.appendChild(E("ul", { class:"ai-reasons" }, m.sellPlan.map(x => E("li", {}, x))));
    }
    (m.notes || []).forEach(n => box.appendChild(E("div", { class:"ai-msg-note" }, n)));
    if(m.action && m.kind === "suggestion"){
      const a = m.action;
      const btn = E("button", { class:`btn btn-sm ${a.side === "buy" ? "btn-primary" : "btn-danger-ghost"} ai-msg-btn`, onClick:() => goToTrade(a) },
        a.side === "buy" ? "پیشنهاد: برو به صفحه‌ی خرید با این مقادیر" : "پیشنهاد: برو به صفحه‌ی فروش با این مقادیر");
      if(!isLastSuggestion) btn.classList.add("ai-msg-btn-old");
      box.appendChild(btn);
      box.appendChild(E("div", { class:"ai-msg-note" }, "مقادیر در صفحه‌ی خرید پر می‌شوند و می‌توانید تغییرشان دهید؛ سفارش فقط با تأیید خودتان ثبت می‌شود."));
    }
    return E("div", { class:"ai-msg-row" }, [E("div", { class:"ai-avatar", html: ic("bot") }), box]);
  }

  function renderFeed(data){
    if(!feedEl) return;
    const nearBottom = feedEl.scrollHeight - feedEl.scrollTop - feedEl.clientHeight < 80;
    const first = !feedEl.dataset.ready;
    feedEl.innerHTML = "";
    const modeFa = data.mode === "live" ? "معامله‌ی واقعی" : data.mode === "paper" ? "معامله‌ی آزمایشی" : "تحلیل و پیشنهاد";
    feedEl.appendChild(E("div", { class:"ai-chat-intro" }, data.mode === "suggest"
      ? `حالت «${modeFa}»: من فقط تحلیل می‌کنم و پیشنهاد می‌دهم؛ هیچ سفارشی ثبت نمی‌شود. تصمیم نهایی با شماست و هیچ سودی تضمین نیست.`
      : `حالت «${modeFa}»${data.running ? "" : " (موتور متوقف است)"}: همه‌ی خرید و فروش‌ها و هشدارها اینجا گزارش می‌شود.${data.killed ? " توقف اضطراری فعال است." : ""}`));
    if(!data.messages.length) feedEl.appendChild(E("div", { class:"ai-chat-empty" }, data.emptyHint));
    const lastSug = [...data.messages].reverse().find(m => m.kind === "suggestion");
    data.messages.forEach(m => feedEl.appendChild(messageEl(m, lastSug && m.id === lastSug.id)));
    feedEl.dataset.ready = "1";
    if(first || nearBottom) feedEl.scrollTop = feedEl.scrollHeight;
  }

  async function load(){
    try{
      last = await Api.aiGet("/feed");
      if(!document.body.contains(fab)) return stop();
      if(open) renderFeed(last);
      updateBadge();
    }catch(e){
      if(open && feedEl){ feedEl.innerHTML = ""; feedEl.appendChild(E("div", { class:"ai-chat-empty" }, "دریافت گزارش هوش مصنوعی ممکن نشد: " + ((e && e.message) || "خطا"))); }
    }
  }

  function updateBadge(){
    if(!fab || !last) return;
    if(getSeen() === null) setSeen(last.serverTime); // سابقه‌ی قدیمی نشانگر ایجاد نکند
    const seen = getSeen();
    const unread = !open && last.latestImportantAt && seen && Date.parse(last.latestImportantAt) > Date.parse(seen);
    fab.classList.toggle("has-unread", !!unread);
  }

  function openPanel(){
    if(open) return; open = true;
    panel = E("div", { class:"ai-chat", role:"dialog", "aria-label":"گزارش هوش مصنوعی معاملاتی" });
    feedEl = E("div", { class:"ai-chat-feed" });
    panel.append(
      E("div", { class:"ai-chat-head" }, [
        E("div", { class:"ai-avatar", html: ic("bot") }),
        E("div", { style:"flex:1;min-width:0;" }, [E("div", { style:"font-weight:700;" }, "هوش مصنوعی معاملاتی"), E("div", { class:"text-faint", style:"font-size:12px;" }, "گزارش‌ها فقط برای مشاهده‌اند")]),
        E("button", { class:"ai-chat-x", "aria-label":"بستن", html: ic("close"), onClick: close }),
      ]),
      feedEl,
      E("div", { class:"ai-chat-foot" }, [
        E("input", { class:"input", disabled:"disabled", placeholder:"ارسال پیام ممکن نیست — این صفحه فقط گزارش نمایش می‌دهد" }),
        E("button", { class:"btn btn-primary btn-sm", disabled:"disabled" }, "ارسال"),
      ]),
    );
    document.body.appendChild(panel);
    feedEl.appendChild(UI.skeletonRows(4));
    fab.classList.add("open"); fab.classList.remove("has-unread");
    if(last){ renderFeed(last); setSeen(last.serverTime); }
    load().then(() => { if(last) setSeen(last.serverTime); });
    timer = setInterval(load, 15000);
  }
  function close(){
    if(!open) return; open = false;
    if(last) setSeen(last.serverTime);
    if(timer){ clearInterval(timer); timer = null; }
    if(panel){ panel.remove(); panel = null; feedEl = null; }
    if(fab) fab.classList.remove("open");
  }
  function stop(){ close(); if(badgeTimer){ clearInterval(badgeTimer); badgeTimer = null; } }

  function mount(host){
    stop(); last = null;
    fab = E("button", { class:"ai-fab", "aria-label":"گزارش هوش مصنوعی معاملاتی", title:"هوش مصنوعی معاملاتی", html: ic("bot") + '<span class="ai-fab-dot"></span>', onClick:() => (open ? close() : openPanel()) });
    host.appendChild(fab);
    load();
    badgeTimer = setInterval(() => { if(!document.body.contains(fab)){ stop(); return; } if(!open) load(); }, 60000);
  }
  return { mount, close };
})();

const App = (() => {
  const root = document.getElementById("app");
  let refreshTimer = null;

  function buildShell(){
    root.innerHTML = "";
    root.className = ""; // کلاس connect-shell (با padding:24px) از صفحه‌ی ورود/اتصال نباید روی داشبورد بماند

      Utils.el("div", { class:"brand-mark", html: ic("qlogo") }),
      Utils.el("div", {}, [

    ]));

    const navGroup = Utils.el("div", { class:"nav-group" });

      navGroup.appendChild(Utils.el("div", {

    });
    sidebar.appendChild(navGroup);

    sidebar.appendChild(Utils.el("div", { class:"sidebar-foot" }, [
      Utils.el("div", { class:"nav-item", html: ic("unlink") + `<span>قطع اتصال و خروج</span>`, onClick: handleLogout }),
    ]));

    const sidebarLayer = Utils.el("div", { class:"sidebar-layer" }, [sidebar]);

    const main = Utils.el("main", { class:"main" });
    const topbar = Utils.el("header", { class:"topbar" }, [
      Utils.el("div", { class:"topbar-left" }, [
        Utils.el("button", { class:"menu-btn", html: ic("menu"), onClick: openSidebar }),
        Utils.el("div", { class:"topbar-title", id:"pageTitle" }, "داشبورد"),
      ]),
      Utils.el("div", { class:"topbar-right" }, [
        Utils.el("span", { id:"connBadge" }),
        Utils.el("span", { class:"text-faint", id:"lastUpdate", style:"font-size:11.5px;white-space:nowrap;" }),
        Utils.el("button", { class:"icon-btn", title:"به‌روزرسانی اطلاعات", html: ic("refresh"), onClick: refreshCurrentPage, id:"refreshBtn" }),
        Utils.el("button", { class:"icon-btn", title:"پروفایل", html: ic("profile"), onClick: () => Router.go("profile") }),
      ]),
    ]);

    const content = Utils.el("div", { class:"content", id:"pageContent" });
    main.append(topbar, content);

    const bottomNav = Utils.el("nav", { class:"bottom-nav" });
    ["dashboard","market","ai","wallet","settings"].forEach(key => {
      const item = NAV_ITEMS.find(n => n.key === key);
      const center = key === "ai";
      bottomNav.appendChild(Utils.el("div", {
        class:"bn-item" + (center ? " bn-center" : ""), "data-key":key,
        html: center ? `<div class="bn-orb">${ic(item.icon)}</div><span class="bn-lbl">${item.label}</span>` : ic(item.icon) + `<span>${item.label}</span>`,
        onClick: () => Router.go(key),
      }));
    });

    const shell = Utils.el("div", { class:"shell" }, [main, sidebarLayer]);
    root.append(shell, scrim, bottomNav);
    shell.classList.add("nx-shell-enter"); bottomNav.classList.add("nx-shell-enter");
    window.setTimeout(() => { shell.classList.remove("nx-shell-enter"); bottomNav.classList.remove("nx-shell-enter"); }, 1100);
    AIChat.mount(root); // دکمه‌ی شناور گزارش هوش مصنوعی

    updateConnBadge();
  }

  function openSidebar(){ document.querySelector(".sidebar").classList.add("open"); document.querySelector(".sidebar-scrim").classList.add("open"); }
  function closeSidebar(){ document.querySelector(".sidebar")?.classList.remove("open"); document.querySelector(".sidebar-scrim")?.classList.remove("open"); }

  function updateConnBadge(){
    const badge = document.getElementById("connBadge");
    const lastUpdate = document.getElementById("lastUpdate");
    if(!badge) return;
    badge.innerHTML = "";
    badge.appendChild(UI.statusBadge(State.get().connection.status));
    if(lastUpdate){
      lastUpdate.textContent = State.get().connection.lastChecked
        ? `به‌روزرسانی ${Utils.timeAgo(State.get().connection.lastChecked)}`
        : "";
    }
  }

  function setActiveNav(name){
    const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.querySelectorAll(".nav-item[data-key]").forEach((n, i) => {
      const active = n.dataset.key === name; n.classList.toggle("active", active);
      if(active) n.setAttribute("aria-current", "page"); else n.removeAttribute("aria-current");
      n.classList.remove("nx-nav-stagger"); n.style.setProperty("--nx-nav-delay", `${Math.min(i * 32, 320)}ms`);
      if(!reducedMotion){ void n.offsetWidth; n.classList.add("nx-nav-stagger"); }
    });
    document.querySelectorAll(".bn-item[data-key]").forEach(n => {
      const active = n.dataset.key === name; n.classList.toggle("active", active);
      if(active) n.setAttribute("aria-current", "page"); else n.removeAttribute("aria-current");
    });
    const title = document.getElementById("pageTitle");
    if(title) title.textContent = PAGE_TITLES[name] || "";
  }

  let currentRoute = null;

  async function refreshCurrentPage(){
    const btn = document.getElementById("refreshBtn");
    if(btn) btn.classList.add("spin");
    await Api.checkConnection();
    updateConnBadge();
    if(currentRoute) await currentRoute.page.mount(document.getElementById("pageContent"), currentRoute.params);
    if(btn) btn.classList.remove("spin");
    Toast.success("به‌روزرسانی شد", "اطلاعات صفحه به‌روزرسانی شد.");
  }

  async function handleLogout(){
    await Api.disconnect();
    AppAuth.logout();
    closeSidebar();
    Router.go("auth-phone");
  }

  let pageTransitionToken = 0;

  function playPageEnter(el){
    if(!el) return;
    el.classList.remove("page-enter", "nx-assembling");
    const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const pieces = Array.from(el.children);
    el.querySelectorAll("tbody tr").forEach((row, i) => {
      row.classList.remove("nx-row-reveal");
      row.style.setProperty("--nx-row-delay", `${Math.min(i * 42, 720)}ms`);
      if(!reduced){ void row.offsetWidth; row.classList.add("nx-row-reveal"); }
    });
    el.querySelectorAll(".chart-canvas-wrap, .chart-container, .chart-wrap, .portfolio-chart-wrap").forEach((chart, i) => {
      chart.style.setProperty("--nx-chart-delay", `${120 + Math.min(i * 70, 280)}ms`);
    });
    el.querySelectorAll("button, .btn, [role=button]").forEach(btn => btn.classList.add("nx-interactive"));
    pieces.forEach((piece, i) => {
      piece.classList.add("nx-piece");
      piece.style.setProperty("--nx-delay", `${Math.min(i * 85, 680)}ms`);
      piece.style.setProperty("--nx-duration", `${680 + Math.min(i * 25, 180)}ms`);
      Array.from(piece.children).forEach((child, j) => { // اجزای داخلی هر بخش، کوتاه و پشت‌سرهم ظاهر می‌شوند
        if(child.nodeType === 1 && !child.matches("script,style")){
          child.classList.add("nx-child");
          child.style.setProperty("--nx-child-delay", `${90 + j * 65}ms`);
        }
      });
    });
    void el.offsetWidth;
    if(!reduced) el.classList.add("nx-assembling");
    if(!reduced) window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function startAutoRefresh(){
    if(refreshTimer) clearInterval(refreshTimer);
    const sec = State.get().settings.refreshInterval || 60;
    refreshTimer = setInterval(async () => {
      if(State.get().connection.status !== "connected") return;
      await Api.checkConnection();
      updateConnBadge();
    }, sec * 1000);
  }

  const AUTH_ROUTES = ["auth-phone", "auth-otp", "auth-password"];

  function onRouteChange(route){
    const accountReady = State.get().account.loggedIn;
    const exchangeConnected = State.get().connection.status === "connected";

    // مرحله ۱: ابتدا باید وارد حساب برنامه شود (شماره موبایل → کد → رمز)
    if(!accountReady){
      if(refreshTimer) clearInterval(refreshTimer);
      if(route.name === "auth-otp" && !AuthFlow.phone){ Router.go("auth-phone"); return; }
      if(route.name === "auth-password" && !AuthFlow.otpVerified){ Router.go("auth-phone"); return; }
      root.innerHTML = "";
      const page = route.name === "auth-otp" ? PageAuthOtp
        : route.name === "auth-password" ? PageAuthPassword
        : PageAuthPhone;
      page.mount(root);
      return;
    }

    // مرحله ۲: بعد از ورود، باید حساب صرافی متصل شود
    if(!exchangeConnected){
      if(refreshTimer) clearInterval(refreshTimer);
      root.innerHTML = "";
      PageConnect.mount(root);
      return;
    }

    // مرحله ۳: هر دو انجام شده — اگر کاربر دستی به مسیرهای ورود/اتصال برگردد، به داشبورد هدایتش کن
    if(AUTH_ROUTES.includes(route.name) || route.name === "connect"){
      Router.go("dashboard");
      return;
    }

    if(!root.querySelector(".shell")) buildShell();
    const previousRoute = currentRoute;
    currentRoute = route;
    document.querySelectorAll(".q-trade-bar").forEach(n => n.remove());
    setActiveNav(route.name);
    updateConnBadge();
    const content = document.getElementById("pageContent");
    const routeToken = ++pageTransitionToken;
    const mountNext = () => {
      if(routeToken !== pageTransitionToken) return; // مسیر جدیدتری آمده؛ این یکی را رها کن
      route.page.mount(content, route.params);
      playPageEnter(content);
      content.classList.remove("nx-page-exit");
      content.classList.add("nx-page-enter");
      window.setTimeout(() => content.classList.remove("nx-page-enter"), 760);
    };
    const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(!reduced && content.childElementCount && previousRoute && previousRoute.name !== route.name){
      content.classList.remove("nx-page-enter"); content.classList.add("nx-page-exit");
      window.setTimeout(mountNext, 190);
    } else {
      mountNext();
    }
  }

  async function init(){
    ThemeManager.apply();
    await Api.restore(); // اگر نشست معتبر (۱۲ ساعته) در همین تب باشد، بدون پیامک دوباره وارد می‌شویم
    Router.start(onRouteChange);
    startAutoRefresh();
    State.subscribe((s) => {
      updateConnBadge();
    });
  }

  return { init };
})();

document.addEventListener("DOMContentLoaded", App.init);
</script>
</body>
