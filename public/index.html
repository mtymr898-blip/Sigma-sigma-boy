<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صرافی من — داشبورد شخصی ارز دیجیتال</title>
<meta name="description" content="داشبورد شخصی مدیریت و تحلیل دارایی‌های ارز دیجیتال">
<meta name="theme-color" content="#080b13">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<style>
/* ===================================================================
   توکن‌های طراحی
   =================================================================== */
:root{
  --bg:            #080b13;
  --bg-soft:       #0c1019;
  --surface:       #141c2e;
  --surface-raised:#182236;
  --surface-2:     #1a243899;
  --surface-hover: #1e2a42;
  --border:        #2a3550;
  --border-soft:   #212c44;
  --border-strong: #37456655;

  --accent:        #1ed4bf;
  --accent-strong: #0eb8a3;
  --accent-dim:    #129688;
  --accent-soft:   #1ed4bf1f;
  --accent-soft-strong: #1ed4bf33;
  --blue:          #5b93ff;
  --blue-soft:     #5b93ff1f;

  --green:         #29c080;
  --green-strong:  #1fa06a;
  --green-soft:    #29c0801f;
  --red:           #ea4f60;
  --red-strong:    #d23f50;
  --red-soft:      #ea4f601f;
  --amber:         #e2a23c;
  --amber-soft:    #e2a23c1f;

  --text:          #eef2f9;
  --text-dim:      #9aa7c4;
  --text-faint:    #4d5872;

  --radius-sm:     9px;
  --radius-md:     13px;
  --radius-lg:     18px;

  --shadow-card:   0 1px 0 0 #ffffff08 inset, 0 1px 0 0 #00000030, 0 14px 34px -16px #000000a0;
  --shadow-raised: 0 1px 0 0 #ffffff0c inset, 0 24px 60px -20px #000000c0, 0 2px 8px -2px #00000090;
  --shadow-pop:    0 30px 80px -24px #000000e0, 0 2px 10px -2px #000000a0;

  --sidebar-w:     248px;
  --topbar-h:      72px;

  --ease: cubic-bezier(.4,0,.2,1);
  --ease-pop: cubic-bezier(.2,.9,.3,1.2);
}

[data-theme="light"]{
  --bg:            #eef1f7;
  --bg-soft:       #e7ebf3;
  --surface:       #ffffff;
  --surface-raised:#ffffff;
  --surface-2:     #ffffffcc;
  --surface-hover: #f1f4fa;
  --border:        #d8dfec;
  --border-soft:   #e4e9f2;
  --border-strong: #c4ccdd88;
  --accent:        #0ea89a;
  --accent-strong: #0b8f84;
  --accent-dim:    #0a7a71;
  --accent-soft:   #0ea89a1f;
  --accent-soft-strong: #0ea89a38;
  --blue-soft:     #3568e01f;
  --green:         #1aa366;
  --green-strong:  #148a56;
  --green-soft:    #1aa3661e;
  --red:           #d8394d;
  --red-strong:    #c22b3e;
  --red-soft:      #d8394d1a;
  --amber-soft:    #c7860f22;
  --text:          #141b2c;
  --text-dim:      #5c6782;
  --text-faint:    #8891a8;
  --shadow-card:   0 1px 0 0 #ffffff inset, 0 1px 2px 0 #1a233a10, 0 16px 32px -18px #1a233a30;
  --shadow-raised: 0 1px 0 0 #ffffff inset, 0 30px 60px -20px #1a233a40;
  --shadow-pop:    0 30px 70px -20px #1a233a55;
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; max-width:100%; overflow-x:hidden; }
body{
  margin:0;
  width:100%;
  touch-action:pan-y;
  background:
    radial-gradient(1200px 600px at 100% -8%, #1ed4bf0d, transparent 55%),
    radial-gradient(900px 500px at -10% 15%, #5b93ff08, transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  font-family:"Vazirmatn", "Vazirmatn FD", sans-serif;
  font-size:15px;
  line-height:1.7;
  direction:rtl;
  -webkit-font-smoothing:antialiased;
  transition:background-color .25s var(--ease), color .25s var(--ease);
}

img{ max-width:100%; display:block; }
button{ font-family:inherit; }
input,select{ font-family:inherit; }
a{ color:inherit; text-decoration:none; }

::selection{ background:var(--accent-soft-strong); color:var(--accent); }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
::-webkit-scrollbar-thumb:hover{ background:var(--text-faint); }

:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
  border-radius:4px;
  transition:outline-offset .1s var(--ease);
}

.num{
  direction:ltr;
  unicode-bidi:isolate;
  font-variant-numeric:tabular-nums;
}

.mono-num{
  direction:ltr;
  unicode-bidi:isolate;
  font-variant-numeric:tabular-nums;
}

h1,h2,h3,h4{ margin:0; font-weight:700; letter-spacing:0; }
p{ margin:0; }

.text-dim{ color:var(--text-dim); }
.text-faint{ color:var(--text-faint); }
.text-green{ color:var(--green); }
.text-red{ color:var(--red); }

.up{ color:var(--green); }
.down{ color:var(--red); }

.sr-only{
  position:absolute; width:1px; height:1px;
  padding:0; margin:-1px; overflow:hidden;
  clip:rect(0,0,0,0); white-space:nowrap; border:0;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}
/* ===================================================================
   اسکلت برنامه
   =================================================================== */
#app{ min-height:100%; max-width:100vw; overflow-x:hidden; }

@keyframes page-enter-anim{ from{ opacity:0; transform:translateY(22px) scale(.98); } to{ opacity:1; transform:none; } }
.page-enter > *{ animation:page-enter-anim .5s var(--ease-pop) both; }
.page-enter > *:nth-child(1){ animation-delay:.02s; }
.page-enter > *:nth-child(2){ animation-delay:.08s; }
.page-enter > *:nth-child(3){ animation-delay:.14s; }
.page-enter > *:nth-child(4){ animation-delay:.2s; }
.page-enter > *:nth-child(n+5){ animation-delay:.25s; }

/* ---------- صفحه اتصال (بدون سایدبار) ---------- */
.connect-shell{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(1100px 500px at 85% -10%, #1ed4bf1c, transparent 60%),
    radial-gradient(900px 500px at 10% 110%, #5b93ff14, transparent 60%),
    transparent;
}

/* ---------- داشبورد (با سایدبار) ---------- */
.shell{
  display:grid;
  grid-template-columns: 1fr var(--sidebar-w);
  min-height:100vh;
}

/* در دسکتاپ این لایه خودش ستون دوم گرید .shell است (یک جعبه‌ی
   معمولی)؛ سایدبار داخلش کل عرض/ارتفاع را پر می‌کند. تنها زیر ۸۶۰px
   این لایه به یک جعبه‌ی fixed تمام‌صفحه تبدیل می‌شود تا سایدبار واقعاً
   نسبت به صفحه‌نمایش (نه نسبت به کل سند قابل‌اسکرول) جابه‌جا شود —
   از display:contents به‌عمد استفاده نشده چون در برخی WebViewها
   به‌درستی پشتیبانی نمی‌شود. */
.sidebar-layer{ grid-column:2; }

.sidebar{
  width:100%;
  border-inline-start:1px solid var(--border-soft);
  background:linear-gradient(180deg, var(--bg-soft), var(--bg));
  padding:20px 16px;
  display:flex;
  flex-direction:column;
  gap:4px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:8px 10px 22px;
}
.brand-mark{
  width:36px; height:36px; border-radius:11px;
  background:linear-gradient(135deg, var(--accent), var(--blue));
  display:flex; align-items:center; justify-content:center;
  color:#04201c; font-weight:700; font-size:15px;
  flex:none;
  box-shadow:0 1px 0 0 #ffffff40 inset, 0 6px 16px -6px #1ed4bf80;
}
.brand-name{ font-weight:700; font-size:15px; }
.brand-sub{ font-size:11px; color:var(--text-faint); margin-top:1px; }

.nav-group{ margin-bottom:10px; }
.nav-label{
  font-size:11px; color:var(--text-faint); padding:10px 10px 6px;
}
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:11px 13px;
  border-radius:var(--radius-sm);
  color:var(--text-dim);
  font-size:13.5px;
  font-weight:500;
  cursor:pointer;
  transition:background .15s var(--ease), color .15s var(--ease), transform .15s var(--ease);
  position:relative;
}
.nav-item .ic{ width:18px; height:18px; flex:none; opacity:.75; transition:opacity .15s var(--ease); }
.nav-item:hover{ background:var(--surface-hover); color:var(--text); transform:translateX(-2px); }
[dir="rtl"] .nav-item:hover{ transform:translateX(2px); }
.nav-item:hover .ic{ opacity:1; }
.nav-item.active{
  background:linear-gradient(90deg, var(--accent-soft-strong), var(--accent-soft) 70%, transparent);
  color:var(--accent);
  font-weight:700;
}
.nav-item.active .ic{ opacity:1; }
.nav-item.active::before{
  content:"";
  position:absolute; inset-inline-end:-16px; top:50%; transform:translateY(-50%);
  width:3px; height:20px; border-radius:3px;
  background:var(--accent);
  box-shadow:0 0 10px 1px var(--accent-soft-strong);
}

.sidebar-foot{
  margin-top:auto;
  padding-top:14px;
  border-top:1px solid var(--border-soft);
}

/* ---------- محتوای اصلی ---------- */
.main{
  grid-column:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:var(--topbar-h);
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  gap:14px;
  padding:0 26px;
  background:var(--bg-soft);
  border-bottom:1px solid var(--border-soft);
  box-shadow:0 1px 0 0 var(--border-soft);
}
.topbar-left{ display:flex; align-items:center; gap:13px; min-width:0; flex:1 1 auto; overflow:hidden; }
.topbar-title{
  font-size:18px; font-weight:800; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; min-width:0;
  letter-spacing:-.01em;
}
.topbar-right{ display:flex; align-items:center; gap:9px; flex:none; }

.menu-btn{
  display:none;
  width:38px; height:38px; border-radius:var(--radius-sm);
  align-items:center; justify-content:center;
  background:var(--surface-hover); border:1px solid var(--border);
  color:var(--text); cursor:pointer;
}

.content{
  flex:1;
  padding:26px 26px 96px;
  max-width:1280px;
  width:100%;
  margin:0 auto;
}

.page-head{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:12px; margin-bottom:22px; flex-wrap:wrap;
}
.page-head h1{ font-size:23px; letter-spacing:-.01em; }
.page-head .sub{ font-size:13px; color:var(--text-faint); margin-top:5px; }

/* ---------- نوار پایین موبایل ---------- */
.bottom-nav{
  display:none;
  position:fixed; inset-inline:0; bottom:0; z-index:30;
  background:var(--bg-soft);
  border-top:1px solid var(--border-soft);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom));
  justify-content:space-around;
}
.bottom-nav .bn-item{
  display:flex; flex-direction:column; align-items:center; gap:4px;
  font-size:10.5px; color:var(--text-faint); font-weight:600;
  padding:7px 10px; border-radius:12px; cursor:pointer;
  transition:background .15s var(--ease), color .15s var(--ease);
}
.bottom-nav .bn-item.active{ color:var(--accent); background:var(--accent-soft); }
.bottom-nav .bn-item .ic{ width:19px; height:19px; }
.bottom-nav .bn-item .ic *{ stroke-width:2.2; }

/* ---------- واکنش‌گرایی ---------- */
@media (max-width: 1020px){
  .sidebar{ width:220px; }
}

@media (max-width: 860px){
  .shell{ grid-template-columns:1fr; }
  /* لایه‌ی مخصوص سایدبار: خودش واقعاً نسبت به viewport فیکس و overflow:hidden
     است، تا سایدبار بسته (که با transform به بیرون می‌رود) هرگز باعث
     اسکرول افقی کل صفحه نشود و همیشه نسبت به صفحه‌نمایش (نه کل سند) ثابت
     بماند — بدون این‌که روی نوار پایین یا toastها که باید دقیقاً نسبت
     به viewport فیکس بمانند اثر بگذارد. */
  .sidebar-layer{
    grid-column:auto;
    position:fixed; inset:0; z-index:50;
    overflow:hidden; pointer-events:none;
  }
  .sidebar{
    position:absolute; inset-inline-end:0; top:0; height:100%;
    width:260px; pointer-events:auto;
    transform:translateX(104%);
    transition:transform .28s var(--ease);
    box-shadow:-20px 0 50px -20px #00000080;
  }
  [dir="rtl"] .sidebar{ transform:translateX(-104%); }
  .sidebar.open{ transform:translateX(0); }
  .sidebar-scrim{
    display:none; position:fixed; inset:0; background:#00000066;
    z-index:40;
  }
  .sidebar-scrim.open{ display:block; }
  .menu-btn{ display:inline-flex; }
  .main{ grid-column:1; }
  .content{ padding:16px 14px 90px; }
  .bottom-nav{ display:flex; }
}

@media (max-width: 520px){
  .topbar{ padding:0 14px; gap:8px; }
  .topbar-title{ font-size:14.5px; }
  #lastUpdate{ display:none; }
}

@media (max-width: 400px){
  .topbar-right{ gap:6px; }
  #connBadge .badge-label{ display:none; }
  #connBadge .badge{ padding:7px; }
}
/* ===================================================================
   کامپوننت‌های پایه
   =================================================================== */

.card{
  background:linear-gradient(180deg, var(--surface-raised), var(--surface));
  border:1px solid var(--border-soft);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
  transition:border-color .2s var(--ease), box-shadow .2s var(--ease), transform .2s var(--ease);
}
.card-pad{ padding:22px; }
.card-head{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; margin-bottom:16px;
}
.card-title{ font-size:14.5px; font-weight:600; letter-spacing:.01em; }
.card-title .sub{ font-size:11.5px; color:var(--text-faint); font-weight:400; margin-top:2px; }

.kpi-card{ transition:transform .2s var(--ease-pop), border-color .2s var(--ease), box-shadow .2s var(--ease); }
.kpi-card:hover{ transform:translateY(-3px); border-color:var(--border-strong); box-shadow:var(--shadow-raised); }

/* ---------- دکمه‌ها ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  height:40px; padding:0 17px;
  border-radius:var(--radius-sm);
  border:1px solid transparent;
  font-size:13.5px; font-weight:600;
  cursor:pointer;
  transition:transform .14s var(--ease), background .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease), opacity .15s, filter .15s;
  white-space:nowrap;
}
.btn:active{ transform:scale(.96); }
.btn:disabled{ opacity:.42; filter:saturate(.5); cursor:not-allowed; transform:none; box-shadow:none; }

.btn-primary{
  background:linear-gradient(180deg, var(--accent), var(--accent-strong));
  color:#04201c;
  box-shadow:0 1px 0 0 #ffffff33 inset, 0 8px 20px -10px #1ed4bf70;
}
.btn-primary:hover:not(:disabled){ filter:brightness(1.07); box-shadow:0 1px 0 0 #ffffff33 inset, 0 10px 26px -10px #1ed4bf90; transform:translateY(-1px); }

.btn-ghost{ background:var(--surface-hover); color:var(--text); border-color:var(--border); }
.btn-ghost:hover:not(:disabled){ background:var(--border-soft); border-color:var(--border-strong); }

.btn-outline{ background:transparent; color:var(--text-dim); border-color:var(--border); }
.btn-outline:hover:not(:disabled){ color:var(--text); border-color:var(--accent-dim); background:var(--accent-soft); }

.btn-danger-ghost{ background:var(--red-soft); color:var(--red); }
.btn-danger-ghost:hover:not(:disabled){ background:#ea4f602e; }

.btn-sm{ height:33px; padding:0 13px; font-size:12.5px; }
.btn-icon{ width:40px; padding:0; flex:none; }
.btn-block{ width:100%; }

.btn .spin{
  width:14px; height:14px; border-radius:50%;
  border:2px solid currentColor; border-inline-end-color:transparent;
  animation:spin .7s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---------- فرم‌ها ---------- */
.field{ display:flex; flex-direction:column; gap:7px; }
.field label{ font-size:12.5px; color:var(--text-dim); font-weight:600; }
.field-hint{ font-size:11.5px; color:var(--text-faint); }
.field-error{ font-size:11.5px; color:var(--red); display:flex; align-items:center; gap:5px; }

.input-wrap{ position:relative; display:flex; align-items:center; }
.input{
  width:100%; height:46px;
  background:var(--bg-soft);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  color:var(--text);
  padding:0 14px;
  font-size:13.5px;
  outline:none;
  transition:border-color .15s var(--ease), background .15s var(--ease), box-shadow .15s var(--ease);
}
.input::placeholder{ color:var(--text-faint); }
.input:focus{ border-color:var(--accent); background:var(--surface); box-shadow:0 0 0 3px var(--accent-soft); }
.input.has-error{ border-color:var(--red); }
.input-wrap.api-field .input{ padding-left:84px; font-family:monospace; letter-spacing:.3px; direction:ltr; text-align:left; }
.input-actions{
  position:absolute; left:8px; top:50%; transform:translateY(-50%);
  display:flex; gap:4px;
}
.input-icon-btn{
  width:28px; height:28px; border-radius:7px;
  display:flex; align-items:center; justify-content:center;
  background:transparent; border:none; color:var(--text-faint);
  cursor:pointer; transition:background .15s var(--ease), color .15s var(--ease);
}
.input-icon-btn:hover{ background:var(--surface-hover); color:var(--text); }

.select{
  height:40px; border-radius:var(--radius-sm);
  background:var(--bg-soft); border:1px solid var(--border);
  color:var(--text); padding:0 11px; font-size:13px; outline:none;
  transition:border-color .15s var(--ease);
}
.select:focus{ border-color:var(--accent); }

/* ---------- منوی کشویی سفارشی (جایگزین select بومی) ---------- */
.dropdown-trigger{
  height:40px; min-width:128px;
  display:inline-flex; align-items:center; justify-content:space-between; gap:10px;
  padding:0 13px; border-radius:var(--radius-sm);
  background:var(--bg-soft); border:1px solid var(--border);
  color:var(--text); font-size:13px; font-weight:600; cursor:pointer;
  transition:border-color .15s var(--ease), background .15s var(--ease);
}
.dropdown-trigger:hover{ border-color:var(--border-strong); background:var(--surface-hover); }
.dropdown-trigger.open{ border-color:var(--accent); }
.dropdown-trigger .chev{ width:14px; height:14px; color:var(--text-faint); flex:none; transition:transform .2s var(--ease); }
.dropdown-trigger.open .chev{ transform:rotate(180deg); color:var(--accent); }

.dropdown-sheet-backdrop{
  position:fixed; inset:0; background:#050811dd; backdrop-filter:blur(4px);
  display:flex; align-items:flex-end; justify-content:center; z-index:300;
  animation:backdrop-in .2s var(--ease);
}
.dropdown-sheet{
  width:100%; max-width:480px;
  background:var(--surface-raised); border:1px solid var(--border); border-bottom:none;
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  padding:6px 0 calc(10px + env(safe-area-inset-bottom));
  max-height:72vh; overflow-y:auto;
  box-shadow:var(--shadow-pop);
  animation:sheet-in .28s var(--ease-pop);
}
@keyframes sheet-in{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
.dropdown-sheet-title{ font-size:12.5px; font-weight:700; color:var(--text-faint); padding:14px 20px 8px; }
.dropdown-option{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:15px 20px; font-size:14px; font-weight:600; color:var(--text); cursor:pointer;
  transition:background .12s var(--ease);
  border-top:1px solid var(--border-soft);
}
.dropdown-sheet-title + .dropdown-option{ border-top:none; }
.dropdown-option:first-child{ border-top:none; }
.dropdown-option:hover{ background:var(--surface-hover); }
.dropdown-option.selected{ color:var(--accent); }
.dropdown-option .radio{
  width:20px; height:20px; border-radius:50%; border:2px solid var(--border-strong);
  flex:none; position:relative; transition:border-color .15s var(--ease);
}
.dropdown-option.selected .radio{ border-color:var(--accent); }
.dropdown-option.selected .radio::after{
  content:""; position:absolute; inset:3px; border-radius:50%; background:var(--accent);
}

.search-wrap{ position:relative; flex:1; min-width:180px; }
.search-wrap > span{
  position:absolute; inset-inline-start:13px; top:50%; transform:translateY(-50%);
  width:16px; height:16px; color:var(--text-faint); pointer-events:none;
  display:flex;
}
.search-wrap .input{ padding-inline-start:38px; }

/* ---------- نشان‌ها ---------- */
.badge{
  display:inline-flex; align-items:center; gap:6px;
  font-size:11.5px; font-weight:700;
  padding:6px 12px; border-radius:999px;
  letter-spacing:.01em;
}
.badge-dot{ width:7px; height:7px; border-radius:50%; background:currentColor; flex:none; box-shadow:0 0 0 3px currentColor22; }
.badge-green{ background:var(--green-soft); color:var(--green); }
.badge-red{ background:var(--red-soft); color:var(--red); }
.badge-amber{ background:var(--amber-soft); color:var(--amber); }
.badge-blue{ background:var(--blue-soft); color:var(--blue); }
.badge-gray{ background:var(--surface-hover); color:var(--text-dim); }

.chip{
  display:inline-flex; align-items:center; gap:6px;
  height:33px; padding:0 14px; border-radius:999px;
  background:var(--surface-hover); border:1px solid var(--border);
  color:var(--text-dim); font-size:12.5px; cursor:pointer;
  transition:all .15s var(--ease);
}
.chip.active{ background:var(--accent-soft-strong); color:var(--accent); border-color:transparent; box-shadow:inset 0 0 0 1px var(--accent-dim)44; }
.chip:hover:not(.active){ color:var(--text); border-color:var(--border-strong); }

/* ---------- جدول ---------- */
.table-wrap{
  overflow-x:auto;
  background:
    linear-gradient(to left, var(--surface) 0%, transparent 24px) left / 24px 100% no-repeat local,
    linear-gradient(to right, var(--surface) 0%, transparent 24px) right / 24px 100% no-repeat local,
    linear-gradient(to left, #0007, transparent 24px) left / 24px 100% no-repeat scroll,
    linear-gradient(to right, #0007, transparent 24px) right / 24px 100% no-repeat scroll;
}
table.tbl{ width:100%; border-collapse:collapse; font-size:13px; min-width:640px; }
.tbl thead th{
  text-align:start; font-weight:600; color:var(--text-faint);
  font-size:11px; letter-spacing:.03em;
  padding:0 15px 12px; white-space:nowrap;
  border-bottom:1px solid var(--border-soft);
}
.tbl tbody td{ padding:15px; border-top:1px solid var(--border-soft); white-space:nowrap; }
.tbl tbody tr{ transition:background .12s var(--ease); cursor:pointer; }
.tbl tbody tr:hover{ background:var(--surface-hover); }
.tbl tbody tr:hover td:first-child{ box-shadow:inset 2px 0 0 var(--accent); }
.tbl .cell-asset{ display:flex; align-items:center; gap:10px; cursor:pointer; }
.coin-ic{
  width:29px; height:29px; border-radius:50%; flex:none;
  display:flex; align-items:center; justify-content:center;
  font-size:10.5px; font-weight:700; color:#fff;
  box-shadow:0 2px 6px -1px #00000060, inset 0 1px 0 #ffffff30;
}
.tbl th.sortable{ cursor:pointer; user-select:none; transition:color .15s var(--ease); }
.tbl th.sortable:hover{ color:var(--text); }
.tbl th.sortable .ic{ width:11px; height:11px; opacity:.6; vertical-align:middle; margin-inline-start:3px; }

/* ستون‌های غیرضروری که در موبایل حذف می‌شوند تا اسکرول افقی تا حد
   ممکن کم یا حذف شود؛ جدول هم به‌جای عرض ثابت، عرض واقعی کارت را پر می‌کند. */
@media (max-width:760px){
  .col-opt{ display:none; }
  table.tbl{ min-width:0; width:100%; }
  .tbl thead th{ padding:0 8px 11px; font-size:10.5px; }
  .tbl tbody td{ padding:13px 8px; font-size:12.5px; }
  .coin-ic{ width:25px; height:25px; font-size:9.5px; }

  /* جدول تا لبه‌ی کارت باز می‌شود تا بیشترین عرض ممکن را بگیرد؛
     ستون اول و آخر با padding جبرانی با بقیه محتوای کارت هم‌تراز می‌مانند. */
  .card-pad .table-wrap{
    margin-inline:-22px;
    width:calc(100% + 44px);
  }
  .tbl thead th:first-child, .tbl tbody td:first-child{ padding-inline-start:22px; }
  .tbl thead th:last-child, .tbl tbody td:last-child{ padding-inline-end:22px; }
}

@media (max-width:420px){
  .card-pad{ padding:17px; }
  .card-pad .table-wrap{ margin-inline:-17px; width:calc(100% + 34px); }
  .tbl thead th:first-child, .tbl tbody td:first-child{ padding-inline-start:17px; }
  .tbl thead th:last-child, .tbl tbody td:last-child{ padding-inline-end:17px; }
}

/* ---------- وضعیت‌های خالی / خطا / بارگذاری ---------- */
.state-box{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:10px;
  padding:50px 20px;
  color:var(--text-dim);
}
.state-box .ic{ width:36px; height:36px; color:var(--text-faint); margin-bottom:4px; }
.state-box .title{ font-size:14.5px; font-weight:700; color:var(--text); }
.state-box .desc{ font-size:12.5px; color:var(--text-faint); max-width:320px; }

.skel{
  background:linear-gradient(90deg, var(--surface-hover) 25%, var(--border-soft) 37%, var(--surface-hover) 63%);
  background-size:400% 100%;
  animation:skel-sheen 1.4s ease infinite;
  border-radius:8px;
}
@keyframes skel-sheen{ 0%{ background-position:100% 50%; } 100%{ background-position:0 50%; } }

.toast-host{
  position:fixed; bottom:22px; inset-inline-end:22px; z-index:200;
  display:flex; flex-direction:column; gap:9px; max-width:340px;
}
@media (max-width:860px){ .toast-host{ bottom:76px; inset-inline-end:14px; inset-inline-start:14px; max-width:none; } }
.toast{
  display:flex; align-items:flex-start; gap:10px;
  background:var(--surface-raised); border:1px solid var(--border);
  border-radius:var(--radius-md); padding:14px 15px;
  box-shadow:var(--shadow-pop);
  font-size:12.5px;
  animation:toast-in .32s var(--ease-pop);
}
@keyframes toast-in{ from{ opacity:0; transform:translateY(14px) scale(.96); } to{ opacity:1; transform:none; } }
.toast .ic{ width:17px; height:17px; flex:none; margin-top:1px; }
.toast.success .ic{ color:var(--green); }
.toast.error .ic{ color:var(--red); }
.toast.info .ic{ color:var(--blue); }

/* ---------- نشانگر داده آزمایشی ---------- */
.mock-flag{
  display:inline-flex; align-items:center; gap:4px;
  font-size:10px; color:var(--amber);
  background:var(--amber-soft); padding:3px 7px; border-radius:6px;
  font-weight:600; letter-spacing:.01em;
  line-height:1;
}
.mock-flag .ic{ width:10px; height:10px; }
.mock-flag .ic *{ stroke-width:2.4; }

/* ---------- تب‌ها ---------- */
.tabs{ display:flex; gap:4px; background:var(--bg-soft); padding:4px; border-radius:11px; border:1px solid var(--border-soft); width:fit-content; }
.tab-btn{
  padding:9px 15px; border-radius:8px; font-size:12.5px; font-weight:600;
  color:var(--text-faint); cursor:pointer; border:none; background:transparent;
  display:flex; align-items:center; gap:6px;
  transition:background .15s var(--ease), color .15s var(--ease);
}
.tab-btn .ic{ width:14px; height:14px; }
.tab-btn.active{ background:var(--surface-raised); color:var(--text); box-shadow:0 1px 0 var(--border), 0 4px 10px -4px #00000060; }

/* ---------- سوییچ ---------- */
.switch{ position:relative; width:44px; height:25px; flex:none; }
.switch input{ opacity:0; width:0; height:0; position:absolute; }
.switch .track{
  position:absolute; inset:0; background:var(--border); border-radius:999px;
  cursor:pointer; transition:background .18s var(--ease);
}
.switch .thumb{
  position:absolute; width:19px; height:19px; border-radius:50%; background:#fff;
  top:3px; inset-inline-start:3px; transition:inset-inline-start .18s var(--ease-pop);
  box-shadow:0 2px 4px -1px #00000050;
}
.switch input:checked + .track{ background:var(--accent); }
.switch input:checked + .track .thumb{ inset-inline-start:22px; }

/* ---------- ردیف تنظیمات ---------- */
.set-row{
  display:flex; align-items:center; justify-content:space-between;
  gap:14px; padding:17px 2px;
  border-top:1px solid var(--border-soft);
}
.set-row:first-child{ border-top:none; }
.set-row .label{ font-size:13.5px; font-weight:600; }
.set-row .desc{ font-size:11.5px; color:var(--text-faint); margin-top:3px; }

/* ---------- مودال ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:#050811dd; backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; z-index:300;
  padding:20px;
  animation:backdrop-in .2s var(--ease);
}
@keyframes backdrop-in{ from{ opacity:0; } to{ opacity:1; } }
.modal{
  background:var(--surface-raised); border:1px solid var(--border);
  border-radius:var(--radius-lg); width:100%; max-width:420px;
  padding:24px; box-shadow:var(--shadow-pop);
  animation:modal-in .28s var(--ease-pop);
}
@keyframes modal-in{ from{ opacity:0; transform:scale(.92) translateY(8px); } to{ opacity:1; transform:none; } }
.modal h3{ font-size:16px; margin-bottom:9px; }
.modal p{ font-size:13px; color:var(--text-dim); line-height:1.85; }
.modal-actions{ display:flex; gap:10px; margin-top:22px; }
.modal-actions .btn{ flex:1; }

.icon-btn{
  width:38px; height:38px; border-radius:var(--radius-sm);
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--surface-hover); border:1px solid var(--border);
  color:var(--text-dim); cursor:pointer;
  transition:background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease), transform .15s var(--ease);
}
.icon-btn:hover{ color:var(--text); border-color:var(--border-strong); transform:translateY(-1px); }
.icon-btn:active{ transform:scale(.94); }
.icon-btn .ic{ width:17px; height:17px; }

hr.sep{ border:none; border-top:1px solid var(--border-soft); margin:18px 0; }
/* ===================================================================
   صفحه اتصال
   =================================================================== */
.connect-card{ width:100%; max-width:460px; animation:card-rise .4s var(--ease-pop); }
@keyframes card-rise{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }

.connect-logo{
  display:flex; align-items:center; gap:11px; justify-content:center;
  margin-bottom:24px;
}
.connect-logo .brand-mark{ width:42px; height:42px; border-radius:13px; font-size:18px; }
.connect-logo-text{ text-align:right; }
.connect-logo-text b{ font-size:16px; display:block; }
.connect-logo-text span{ font-size:11px; color:var(--text-faint); }

.connect-title{ text-align:center; font-size:20px; margin-bottom:7px; }
.connect-desc{ text-align:center; font-size:13px; color:var(--text-dim); margin-bottom:26px; line-height:1.95; }

.guide-toggle{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 15px; background:var(--bg-soft); border:1px solid var(--border-soft);
  border-radius:var(--radius-sm); cursor:pointer; font-size:12.5px; font-weight:700;
  color:var(--text-dim); margin-bottom:14px;
  transition:border-color .15s var(--ease), color .15s var(--ease);
}
.guide-toggle:hover{ color:var(--text); border-color:var(--border-strong); }
.guide-steps{
  list-style:none; margin:-2px 0 18px; padding:15px 15px 13px;
  display:flex; flex-direction:column; gap:13px;
  border-inline-start:2px solid var(--accent-soft-strong);
  margin-inline-start:4px;
  background:var(--bg-soft);
  border-start-end-radius:var(--radius-sm);
  border-end-end-radius:var(--radius-sm);
}
.guide-steps li{
  display:flex; gap:11px; font-size:12.5px; color:var(--text-dim); line-height:1.9;
}
.guide-num{
  flex:none; width:21px; height:21px; border-radius:50%;
  background:var(--accent-soft-strong); color:var(--accent); font-size:10.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center; margin-top:1px;
}

.notice-box{
  display:flex; gap:11px; padding:14px 15px;
  background:linear-gradient(135deg, var(--amber-soft), transparent);
  border:1px solid #e2a23c35;
  border-radius:var(--radius-sm); margin-bottom:20px;
}
.notice-box .ic{ width:17px; height:17px; color:var(--amber); flex:none; margin-top:1px; }
.notice-box p{ font-size:12px; color:var(--text-dim); line-height:1.9; font-weight:600; }
.notice-box ul{ margin:7px 0 0; padding-inline-start:18px; font-size:12px; color:var(--text-dim); line-height:2.05; font-weight:400; }

.connect-status{
  display:flex; align-items:center; gap:10px;
  padding:13px 14px; border-radius:var(--radius-sm);
  font-size:12.5px; margin-top:16px; font-weight:600;
}
.connect-status.loading{ background:var(--blue-soft); color:var(--blue); }
.connect-status.success{ background:var(--green-soft); color:var(--green); }
.connect-status.error{ background:var(--red-soft); color:var(--red); }

.connect-foot{
  text-align:center; margin-top:20px; font-size:11.5px; color:var(--text-faint);
}
.connect-foot a{ color:var(--accent); font-weight:600; }

/* ===================================================================
   داشبورد
   =================================================================== */
.kpi-grid{
  display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px; margin-bottom:18px;
}
.kpi-card{ padding:19px 20px; min-width:0; }
.kpi-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.kpi-ic{
  width:38px; height:38px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  background:var(--accent-soft); color:var(--accent);
  box-shadow:inset 0 0 0 1px var(--accent-dim)33;
}
.kpi-ic.blue{ background:var(--blue-soft); color:var(--blue); box-shadow:inset 0 0 0 1px #5b93ff33; }
.kpi-ic.green{ background:var(--green-soft); color:var(--green); box-shadow:inset 0 0 0 1px var(--green-strong)33; }
.kpi-ic.amber{ background:var(--amber-soft); color:var(--amber); box-shadow:inset 0 0 0 1px #e2a23c33; }
.kpi-label{ font-size:12px; color:var(--text-faint); margin-bottom:8px; font-weight:500; }
.kpi-value{ font-size:25px; font-weight:800; letter-spacing:-.01em; }
.kpi-change{ font-size:11.5px; margin-top:8px; display:flex; align-items:center; gap:4px; font-weight:700; }

.dash-grid{ display:grid; grid-template-columns:2fr 1fr; gap:16px; align-items:start; }

.chart-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:6px; }
.chart-value{ font-size:27px; font-weight:800; letter-spacing:-.01em; }
.chart-value-sub{ font-size:12.5px; margin-top:4px; font-weight:700; }
.chart-canvas-wrap{ height:260px; margin-top:16px; position:relative; }
.range-tabs{ display:flex; gap:4px; }

.mini-list{ display:flex; flex-direction:column; }
.mini-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 9px; border-top:1px solid var(--border-soft);
  border-radius:9px; margin:0 -9px; cursor:pointer;
  transition:background .15s var(--ease);
}
.mini-row:hover{ background:var(--surface-hover); }
.mini-row:first-child{ border-top:none; padding-top:3px; }
.mini-left{ display:flex; align-items:center; gap:11px; min-width:0; }
.mini-name{ font-size:13px; font-weight:700; }
.mini-sym{ font-size:11px; color:var(--text-faint); margin-top:1px; }
.mini-right{ text-align:left; }
.mini-price{ font-size:13px; font-weight:700; margin-bottom:5px; }

/* ===================================================================
   بازار
   =================================================================== */
.market-toolbar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:18px;
}
.sparkline{ width:88px; height:32px; }

/* ===================================================================
   صفحه ارز
   =================================================================== */
.coin-head{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
.coin-id{ display:flex; align-items:center; gap:13px; }
.coin-price-row{ display:flex; align-items:baseline; gap:11px; flex-wrap:wrap; }
.coin-price{ font-size:31px; font-weight:800; letter-spacing:-.01em; }
.coin-stats-row{ display:flex; gap:26px; flex-wrap:wrap; margin-top:16px; }
.coin-stat .lbl{ font-size:11px; color:var(--text-faint); margin-bottom:5px; font-weight:500; }
.coin-stat .val{ font-size:14px; font-weight:700; }

.coin-grid{ display:grid; grid-template-columns:2fr 1fr; gap:16px; align-items:start; }
.coin-chart-controls{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px; }

/* ===================================================================
   کیف پول
   =================================================================== */
.wallet-summary{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:18px; }
.wallet-head-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

/* ===================================================================
   پروفایل
   =================================================================== */
.profile-head{ display:flex; align-items:center; gap:17px; margin-bottom:24px; flex-wrap:wrap; }
.avatar{
  width:60px; height:60px; border-radius:50%;
  background:linear-gradient(135deg, var(--accent), var(--blue));
  display:flex; align-items:center; justify-content:center;
  font-size:21px; font-weight:700; color:#fff; flex:none;
  box-shadow:0 4px 14px -4px #1ed4bf60, inset 0 1px 0 #ffffff30;
}
.info-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 2px; border-top:1px solid var(--border-soft); }
.info-row:first-child{ border-top:none; }
.info-row .k{ font-size:12.5px; color:var(--text-faint); font-weight:500; }
.info-row .v{ font-size:13.5px; font-weight:700; }

.profile-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }

/* ===================================================================
   واکنش‌گرایی صفحات
   =================================================================== */
@media (max-width:1020px){
  .kpi-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
  .dash-grid{ grid-template-columns:1fr; }
  .coin-grid{ grid-template-columns:1fr; }
  .profile-grid{ grid-template-columns:1fr; }
  .wallet-summary{ grid-template-columns:repeat(3,1fr); gap:12px; }
}
@media (max-width:860px){
  .kpi-grid{ gap:12px; }
  .wallet-summary{ gap:10px; }
}
@media (max-width:620px){
  .kpi-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px; }
  .kpi-card{ padding:15px 14px; }
  .kpi-value{ font-size:19px; overflow-wrap:anywhere; }
  .kpi-top{ gap:6px; }
  .wallet-summary{ grid-template-columns:1fr; gap:12px; }
  .coin-price{ font-size:24px; }
  .chart-value{ font-size:21px; }
}

/* ---------- هوش مصنوعی معاملاتی ---------- */
.ai-banner{ margin-bottom:0; }
.ai-grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
.ai-grid2 .field{ margin-top:0 !important; }
.ai-modes{ display:grid; gap:10px; }
.ai-mode-card{ border:1.5px solid var(--border); border-radius:var(--radius-md); padding:12px 14px; cursor:pointer; background:var(--surface); transition:border-color .15s var(--ease), background .15s var(--ease); }
.ai-mode-card:hover{ background:var(--surface-hover); }
.ai-mode-card.selected{ border-color:var(--accent); background:var(--accent-soft); }
.ai-mode-card.locked{ opacity:.65; }
.ai-kv{ display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-top:1px solid var(--border-soft); font-size:13px; }
.ai-kv:first-of-type{ border-top:none; }
.ai-reasons{ margin:10px 0 0; padding-inline-start:20px; font-size:12.5px; line-height:1.9; color:var(--text-dim); }
details > summary{ list-style:none; }
@media (max-width:760px){ .ai-grid2{ grid-template-columns:1fr; } }

/* ---------- دکمه‌ی شناور و گزارش هوش مصنوعی ---------- */
.ai-fab{ position:fixed; left:16px; bottom:calc(86px + env(safe-area-inset-bottom)); z-index:40; width:54px; height:54px; border-radius:50%; border:none; cursor:pointer;
  background:linear-gradient(145deg,#2f7bff,#1a5df0); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 22px rgba(30,100,255,.45); transition:transform .15s var(--ease); }
.ai-fab:hover{ transform:scale(1.06); }
.ai-fab .ic{ width:26px; height:26px; } .ai-fab .ic *{ stroke-width:1.9; }
.ai-fab-dot{ display:none; position:absolute; top:3px; inset-inline-end:3px; width:13px; height:13px; border-radius:50%; background:#ff4d5e; border:2px solid #fff; }
.ai-fab.has-unread .ai-fab-dot{ display:block; }
.ai-fab.open{ background:linear-gradient(145deg,#4b556b,#343d52); box-shadow:none; }
.ai-chat{ position:fixed; z-index:55; inset-inline:0; bottom:0; height:84vh; display:flex; flex-direction:column; background:var(--bg-soft); border:1px solid var(--border); border-radius:18px 18px 0 0; box-shadow:0 -10px 40px rgba(0,0,0,.35); }
.ai-chat-head{ display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--border-soft); }
.ai-chat-x{ flex:none; width:36px; height:36px; display:flex; align-items:center; justify-content:center; background:var(--surface); border:1px solid var(--border); color:var(--text); cursor:pointer; border-radius:10px; }

.ai-chat-x:hover{ background:var(--surface-hover); }

// ===================================================================
// توابع کمکی عمومی: قالب‌بندی عدد، تاریخ، ابزارهای DOM
// ===================================================================

const Utils = (() => {

  function formatNumber(value, { decimals = 2, compact = false } = {}){
    if(value === null || value === undefined || Number.isNaN(value)) return "—";
    const num = Number(value);
    if(compact){
      const abs = Math.abs(num);
      if(abs >= 1e9) return (num/1e9).toLocaleString("en-US",{maximumFractionDigits:2}) + " میلیارد";
      if(abs >= 1e6) return (num/1e6).toLocaleString("en-US",{maximumFractionDigits:2}) + " میلیون";
      if(abs >= 1e3) return (num/1e3).toLocaleString("en-US",{maximumFractionDigits:1}) + " هزار";
    }
    return num.toLocaleString(numberLocale(), { maximumFractionDigits: decimals, minimumFractionDigits: 0 });
  }

  // نرخ تتر (تومان) از آخرین پاسخ واقعی بازار؛ اگر موجود نباشد null و قیمت تتری نمایش داده نمی‌شود
  let _usdtRate = null;
  function setUsdtRate(v){ _usdtRate = (Number(v) > 0) ? Number(v) : null; }
  function usdtRate(){ return _usdtRate; }

  function numberLocale(){
    const fmt = (typeof State !== "undefined") ? State.get().settings.numberFormat : "latin";
    return fmt === "fa" ? "fa-IR" : "en-US";
  }

  function formatPrice(value, currency = "تومان"){
    if(value === null || value === undefined || Number.isNaN(value)) return "—";
    let num = Number(value);
    let unitLabel = currency;

    const priceUnit = (typeof State !== "undefined") ? State.get().settings.priceUnit : "irt";
    if(priceUnit === "usdt"){
      if(!usdtRate()) return "—";
      num = num / usdtRate();
      if(currency === "تومان") unitLabel = "تتر";
    }

    let decimals = 2;
    if(priceUnit === "usdt"){
      decimals = num >= 1 ? 2 : 4;
    }else{
      if(num >= 1000) decimals = 0;
      else if(num < 1) decimals = 4;
    }
    const formatted = num.toLocaleString(numberLocale(), { maximumFractionDigits: decimals });
    return unitLabel ? `${formatted} ${unitLabel}` : formatted;
  }

  function formatPercent(value){
    if(value === null || value === undefined || Number.isNaN(value)) return "—";
    const num = Number(value);
    const sign = num > 0 ? "+" : "";
    return `${sign}${num.toFixed(2)}٪`;
  }

  function formatDateTime(isoString){
    if(!isoString) return "—";
    const d = new Date(isoString);
    if(Number.isNaN(d.getTime())) return "—";
    const fmt = new Intl.DateTimeFormat("fa-IR", {
      year:"numeric", month:"2-digit", day:"2-digit",
      hour:"2-digit", minute:"2-digit"
    });
    return fmt.format(d);
  }

  function formatDate(isoString){
    if(!isoString) return "—";
    const d = new Date(isoString);
    if(Number.isNaN(d.getTime())) return "—";
    return new Intl.DateTimeFormat("fa-IR", { year:"numeric", month:"2-digit", day:"2-digit" }).format(d);
  }

  function timeAgo(isoString){
    if(!isoString) return "—";
    const d = new Date(isoString);
    const diffSec = Math.floor((Date.now() - d.getTime())/1000);
    if(diffSec < 10) return "همین الان";
    if(diffSec < 60) return `${diffSec} ثانیه پیش`;
    const diffMin = Math.floor(diffSec/60);
    if(diffMin < 60) return `${diffMin} دقیقه پیش`;
    const diffHr = Math.floor(diffMin/60);
    if(diffHr < 24) return `${diffHr} ساعت پیش`;
    const diffDay = Math.floor(diffHr/24);
    return `${diffDay} روز پیش`;
  }

  function el(tag, attrs = {}, children = []){
    const node = document.createElement(tag);
    for(const [k,v] of Object.entries(attrs)){
      if(k === "class") node.className = v;
      else if(k === "html") node.innerHTML = v;
      else if(k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
      else if(v !== false && v !== null && v !== undefined) node.setAttribute(k, v);
    }
    (Array.isArray(children) ? children : [children]).forEach(c => {
      if(c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  function debounce(fn, wait = 250){
    let t;
    return (...args) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...args), wait);
    };
  }

  function initials(name){
    if(!name) return "—";
    return name.trim().slice(0,2);
  }

  function maskSecret(value, visibleStart = 4, visibleEnd = 4){
    if(!value) return "";
    if(value.length <= visibleStart + visibleEnd) return "•".repeat(value.length);
    return value.slice(0, visibleStart) + "•".repeat(Math.max(6, value.length - visibleStart - visibleEnd)) + value.slice(-visibleEnd);
  }

  function maskPhone(phone){
    if(!phone) return "—";
    const digits = phone.replace(/\D/g, "");
    if(digits.length < 6) return phone;
    return digits.slice(0,4) + "***" + digits.slice(-3);
  }

  return { setUsdtRate, formatNumber, formatPrice, formatPercent, formatDateTime, formatDate, timeAgo, el, debounce, initials, maskSecret, maskPhone };
})();

// مدیریت وضعیت کلی برنامه
// -------------------------------------------------------------------
// فقط تنظیمات غیرحساس (تم، واحد قیمت، بازه به‌روزرسانی و ...) در
// localStorage ذخیره می‌شوند. وضعیت اتصال و هر داده مرتبط با حساب
// صرافی فقط در حافظه (در طول یک نشست مرورگر) نگه‌داری می‌شود و با
// رفرش صفحه از بین می‌رود — دقیقاً همان رفتاری که از یک معماری امن
// مبتنی بر نشست سمت سرور انتظار می‌رود.
// ===================================================================

const STORAGE_KEY = "nx_dashboard_settings_v1";

const State = (() => {
  const listeners = new Set();

  function loadSettings(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultSettings();
      return { ...defaultSettings(), ...JSON.parse(raw) };
    }catch(e){
      return defaultSettings();
    }
  }

  function defaultSettings(){
    return {
      theme: "dark",
      priceUnit: "irt",        // irt | usdt
      numberFormat: "latin",   // latin | fa
      refreshInterval: 60,     // ثانیه
      notifyPriceAlerts: true,
      notifyConnection: true,
      language: "fa",
    };
  }

  function persistSettings(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store.settings)); }catch(e){ /* ignore */ }
  }

  const store = {
    route: { name:"auth-phone", params:{} },
    account: { loggedIn:false, phone:null },
    connection: { status:"disconnected", exchangeName:null, connectedAt:null, lastChecked:null },
    settings: loadSettings(),
    sidebarOpen: false,
  };

  function get(){ return store; }

  function set(patch){
    for(const [k,v] of Object.entries(patch)){
      if(typeof v === "object" && v !== null && !Array.isArray(v) && typeof store[k] === "object"){
        store[k] = { ...store[k], ...v };
      }else{
        store[k] = v;
      }
    }
    if("settings" in patch) persistSettings();
    emit();
  }

  function subscribe(fn){
    listeners.add(fn);
    return () => listeners.delete(fn);
  }

  function emit(){
    listeners.forEach(fn => fn(store));
  }

  return { get, set, subscribe };
})();

// ===================================================================
// آدرس Worker از config.js می‌آید (خالی = همین دامنه). هیچ کلید والکسی در مرورگر وجود ندارد.
const API_BASE = String(window.__API_BASE__ || "").replace(/\/$/, "");

const Api = (() => {
  let sessionToken = null; // فقط در حافظه؛ هرگز در storage ذخیره نمی‌شود

  async function request(path, { method = "GET", body, auth = true } = {}){
    const headers = { Accept: "application/json" };
    if(body !== undefined) headers["Content-Type"] = "application/json";
    if(auth && sessionToken) headers.Authorization = "Bearer " + sessionToken;
    let res;
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 35000); // جلوگیری از اسکلتون بی‌پایان
    try{
      res = await fetch(API_BASE + path, { method, headers, signal: ctl.signal, body: body !== undefined ? JSON.stringify(body) : undefined });
    }catch(e){
      const timedOut = e && e.name === "AbortError";
      const err = new Error(timedOut ? "پاسخی از سرور نرسید (زمان انتظار تمام شد)؛ احتمالاً والکس کند یا در دسترس نیست." : "اتصال به سرور برقرار نشد. اینترنت یا آدرس Worker را بررسی کنید.");
      err.code = timedOut ? "TIMEOUT" : "NETWORK"; throw err;
    }finally{ clearTimeout(timer); }
    let json = null;
    try{ json = await res.json(); }catch(e){ /* غیر JSON */ }
    if(!res.ok || !json || json.ok !== true){
      const e = (json && json.error) || {};
      const err = new Error(e.message || `خطای سرور (HTTP ${res.status})`);
      err.code = e.code || ("HTTP_" + res.status); err.status = res.status; err.detail = e;
      if(res.status === 401 && err.code === "SESSION_INVALID"){
        sessionToken = null;
        State.set({ connection: { status:"disconnected", exchangeName:null, connectedAt:null, lastChecked:null } });
        window.dispatchEvent(new Event("hashchange")); // مسیریاب را به صفحه ورود برمی‌گرداند
      }
      throw err;
    }
    return json;
  }
  const wrap = (json) => ({ data: json.data, meta: json.meta || null, fetchedAt: json.fetchedAt, isMock: false });
  const get = async (path) => wrap(await request(path));

  async function connect(passcode){
    const json = await request("/api/session", { method:"POST", body:{ passcode }, auth:false });
    sessionToken = json.data.token;
    State.set({ connection: { status:"connected", exchangeName:"والکس", connectedAt:new Date().toISOString(), lastChecked:new Date().toISOString() } });
    return { ok:true };
  }

  async function disconnect(){
    sessionToken = null;
    State.set({ connection: { status:"disconnected", exchangeName:null, connectedAt:null, lastChecked:null } });
    return { ok:true };
  }

  async function checkConnection(){
    if(!sessionToken) return State.get().connection;
    try{
      await request("/api/session/check");
      State.set({ connection: { status:"connected", lastChecked:new Date().toISOString() } });
    }catch(e){ /* در قطعی شبکه، زمان آخرین بررسی موفق تغییر نمی‌کند */ }
    return State.get().connection;
  }

  async function getMarketList(){
    const res = await get("/api/market");
    if(res.meta && res.meta.stale){
      if(!Api._staleShown){ Api._staleShown = true; Toast.info("قیمت‌ها قدیمی‌اند", "والکس موقتاً درخواست را رد کرد؛ آخرین قیمت دریافت‌شده نمایش داده می‌شود: " + Utils.timeAgo(res.fetchedAt)); }
    }else Api._staleShown = false;
    const usdt = res.data.find(c => c.id === "usdt");
    Utils.setUsdtRate(usdt ? usdt.price : null);
    return res;
  }
  async function getCoin(id){
    const res = await getMarketList();
    return { ...res, data: res.data.find(c => c.id === id) || null };
  }
  const getCoinHistory   = (id, range) => get(`/api/history/${encodeURIComponent(id)}?range=${range}`);
  const getSparklines    = (ids) => get(`/api/sparklines?ids=${ids.join(",")}`);
  const getOrderbook     = (id) => get(`/api/orderbook/${encodeURIComponent(id)}`);
  const getPortfolioSummary = () => get("/api/portfolio");
  const getPortfolioHistory = (range) => get(`/api/portfolio/history?range=${range}`);
  const getWalletAssets  = () => get("/api/wallets");
  const getOpenOrders    = () => get("/api/orders/open");
  const getProfile       = () => get("/api/profile");

  async function getTransactions(filters = {}){
    const res = await get("/api/orders/history");
    const rows = res.data.filter(t =>
      (!filters.type   || filters.type   === "all" || t.type   === filters.type) &&
      (!filters.coin   || filters.coin   === "all" || t.coin   === filters.coin) &&
      (!filters.status || filters.status === "all" || t.status === filters.status));
    return { ...res, data: rows };
  }

  // --- سفارش‌گذاری (همه‌ی اعتبارسنجی و تصمیم‌ها سمت سرور است) ---
  const getTradeConfig = () => get("/api/trade/config");
  const previewOrder   = (order) => request("/api/trade/preview", { method:"POST", body:{ order } }).then(j => j.data);
  const submitOrder    = (order, clientOrderId, confirmToken) =>
    request("/api/trade/submit", { method:"POST", body:{ order, clientOrderId, confirmToken } }).then(j => j.data);
  const getOrderStatus = (id) => request("/api/trade/status", { method:"POST", body:{ id } }).then(j => j.data);

  // --- هوش مصنوعی معاملاتی (همه‌ی منطق و ریسک سمت سرور) ---
  const aiGet  = (path) => request("/api/trading" + path).then(j => j.data);
  const aiCall = (method, path, body) => request("/api/trading" + path, { method, body: body === undefined ? {} : body }).then(j => j.data);

  const api = { aiGet, aiCall, connect, disconnect, checkConnection, getMarketList, getCoin, getCoinHistory, getSparklines, getOrderbook,
    getPortfolioSummary, getPortfolioHistory, getWalletAssets, getOpenOrders, getProfile, getTransactions,
    getTradeConfig, previewOrder, submitOrder, getOrderStatus };
  return api;
})();

// مجزا از اتصال به صرافی (که در api.js مدیریت می‌شود). در نسخه واقعی
// باید با یک سرویس پیامکی و بک‌اند احراز هویت واقعی جایگزین شود؛

const AuthFlow = {
  phone: null,
  otpVerified: false,
};

const AppAuth = (() => {
  const LATENCY = 700;
  function delay(ms = LATENCY){ return new Promise(res => setTimeout(res, ms)); }

  function isValidIranianPhone(phone){
    return /^09\d{9}$/.test((phone || "").trim());
  }

  async function sendOtp(phone){
    if(!isValidIranianPhone(phone)){
      const err = new Error("شماره موبایل باید با ۰۹ شروع شود و ۱۱ رقم باشد.");
      err.code = "INVALID_PHONE";
      throw err;
    }
    await delay(900);
    AuthFlow.phone = phone.trim();
    AuthFlow.otpVerified = false;
    // --- در نسخه واقعی: درخواست ارسال پیامک به سرویس احراز هویت ---
    return { ok:true };
  }

  async function verifyOtp(code){
    if(!/^\d{4,6}$/.test((code || "").trim())){
      const err = new Error("کد تایید را به‌درستی وارد کنید.");
      err.code = "INVALID_OTP";
      throw err;
    }
    await delay(700);
    AuthFlow.otpVerified = true;
    return { ok:true };
  }

  async function createAccount(password){
    if(!password || password.length < 8){
      const err = new Error("رمز عبور باید حداقل ۸ کاراکتر باشد.");
      err.code = "WEAK_PASSWORD";
      throw err;
    }
    await delay(900);
    State.set({ account: { loggedIn:true, phone: AuthFlow.phone } });
    return { ok:true };
  }

  function logout(){
    AuthFlow.phone = null;
    AuthFlow.otpVerified = false;
    State.set({ account: { loggedIn:false, phone:null } });
  }

  return { isValidIranianPhone, sendOtp, verifyOtp, createAccount, logout };
})();

const Toast = (() => {
  let host = null;

  function ensureHost(){
    if(host) return host;
    host = Utils.el("div", { class:"toast-host" });
    document.body.appendChild(host);
    return host;
  }

  const ICONS = { success:"check", error:"alert", info:"info" };

  function show(type, title, desc = "", timeout = 4200){
    ensureHost();
    const node = Utils.el("div", { class:`toast ${type}` }, [
      Utils.el("div", { html: ic(ICONS[type] || "info") }),
      Utils.el("div", {}, [
        Utils.el("div", { style:"font-weight:700;margin-bottom:2px;" }, title),
        desc ? Utils.el("div", { class:"text-faint" }, desc) : null,
      ])
    ]);
    host.appendChild(node);
    setTimeout(() => {
      node.style.transition = "opacity .2s ease, transform .2s ease";
      node.style.opacity = "0";
      node.style.transform = "translateY(6px)";
      setTimeout(() => node.remove(), 200);
    }, timeout);
  }

  return {
    success:(t,d) => show("success", t, d),
    error:(t,d) => show("error", t, d),
    info:(t,d) => show("info", t, d),
  };
})();

const Charts = (() => {
  const instances = new Map();

  function cssVar(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function destroy(key){
    if(instances.has(key)){
      instances.get(key).destroy();
      instances.delete(key);
    }
  }

  function lineChart(key, canvas, points, { color, currency = "تومان", fill = true } = {}){
    destroy(key);
    if(!canvas || typeof Chart === "undefined") return null;
    const accent = color || cssVar("--accent") || "#17c3b2";
    const grid = cssVar("--border-soft") || "#1b2436";
    const textFaint = cssVar("--text-faint") || "#5c6680";

    const ctx = canvas.getContext("2d");
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.clientHeight || 220);
    gradient.addColorStop(0, accent + "55");
    gradient.addColorStop(0.6, accent + "14");
    gradient.addColorStop(1, accent + "00");

    const chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: points.map(p => p.t),
        datasets: [{
          data: points.map(p => p.v),
          borderColor: accent,
          backgroundColor: fill ? gradient : "transparent",
          borderWidth: 2,
          pointRadius: (ctx) => ctx.dataIndex === points.length - 1 ? 4 : 0,
          pointBackgroundColor: accent,
          pointBorderColor: "#fff",
          pointBorderWidth: 1.5,
          pointHoverRadius: 5,
          pointHoverBackgroundColor: accent,
          pointHoverBorderColor: "#fff",
          tension: 0.35,
          fill,
        }]
      },
      options: {
        responsive:true,
        maintainAspectRatio:false,
        interaction:{ mode:"index", intersect:false },
        plugins:{
          legend:{ display:false },
          tooltip:{
            rtl:true,
            backgroundColor: cssVar("--surface") || "#121a2b",
            borderColor: grid,
            borderWidth:1,
            titleColor: textFaint,
            bodyColor: "#e9eef6",
            titleFont:{ family:"Vazirmatn", size:11 },
            bodyFont:{ family:"Vazirmatn", size:12, weight:"700" },
            padding:10,
            displayColors:false,
            callbacks:{
              title:(items) => Utils.formatDateTime(items[0].label),
              label:(item) => Utils.formatPrice(item.raw, currency),
            }
          }
        },
        scales:{
          x:{ display:false },
          y:{
            display:true,
            position:"right",
            grid:{ color: grid, drawTicks:false },
            border:{ display:false },
            ticks:{
              color: textFaint,
              font:{ family:"Vazirmatn", size:10 },
              maxTicksLimit:4,
              callback:(v) => Utils.formatNumber(v, { compact:true }),
            }
          }
        },
        elements:{ line:{ capBezierPoints:true } }
      }
    });
    instances.set(key, chart);
    return chart;
  }

  function sparkline(canvas, points, positive = true){
    if(!canvas || typeof Chart === "undefined") return null;
    const key = "spark_" + (canvas.dataset.key || Math.random());
    destroy(key);
    const color = positive ? (cssVar("--green") || "#29c080") : (cssVar("--red") || "#ea4f60");
    const sCtx = canvas.getContext("2d");
    const sGrad = sCtx.createLinearGradient(0, 0, 0, canvas.clientHeight || 32);
    sGrad.addColorStop(0, color + "40");
    sGrad.addColorStop(1, color + "00");
    const chart = new Chart(sCtx, {
      type:"line",
      data:{
        labels:points.map((_,i) => i),
        datasets:[{ data:points.map(p => p.v), borderColor:color, backgroundColor:sGrad, fill:true, borderWidth:2, pointRadius:0, tension:0.4 }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{enabled:false} },
        scales:{ x:{display:false}, y:{display:false} },
        elements:{ line:{ borderJoinStyle:"round" } }
      }
    });
    instances.set(key, chart);
    return chart;
  }

  return { lineChart, sparkline, destroy };
})();

  function stateBox({ icon = "info", title, desc, actionLabel, onAction }){

      Utils.el("div", { html: ic(icon) }),
      Utils.el("div", { class:"title" }, title),
      desc ? Utils.el("div", { class:"desc" }, desc) : null,

      box.appendChild(btn);
    }
    return box;
  }

  function empty(title, desc, action){
    return stateBox({ icon:"empty", title, desc, ...(action || {}) });
  }

  function errorState(title, desc, onRetry){
    return stateBox({ icon:"alert", title: title || "خطا در دریافت اطلاعات", desc: desc || "اتصال برقرار نشد یا پاسخی دریافت نشد.", actionLabel: onRetry ? "تلاش مجدد" : null, onAction:onRetry });
  }

  function loading(title = "در حال دریافت اطلاعات…"){
    return Utils.el("div", { class:"state-box" }, [
      Utils.el("div", { class:"spin", style:"width:22px;height:22px;border-width:2.5px;color:var(--accent);" }),
      Utils.el("div", { class:"title", style:"margin-top:4px;" }, title),
    ]);

  function mockFlag(){
    return Utils.el("span", { class:"mock-flag" }, [
      Utils.el("span", { html: ic("info") }),
      "داده آزمایشی",
    ]);
  }

  function changeBadge(value){
    if(value === null || value === undefined) return Utils.el("span", { class:"badge badge-gray" }, "—");
    const positive = value >= 0;
    return Utils.el("span", { class:`badge ${positive ? "badge-green" : "badge-red"}` }, [
      Utils.el("span", { html: ic(positive ? "trendUp" : "trendDown") }),
      Utils.formatPercent(value),
    ]);
  }

  // تولید یک رنگ ثابت و متمایز برای هر نماد ارز (حس برند بیشتر نسبت به رنگ یکسان)
  function coinHue(symbol){
    const s = symbol || "?";
    let hash = 0;
    for(let i=0;i<s.length;i++) hash = (hash * 31 + s.charCodeAt(i)) % 360;
    return hash;
  }

  function coinAvatar(symbol, size = 28){
    const letters = (symbol || "?").replace(/[^A-Za-z]/g,"").slice(0,3) || "?";
    const hue = coinHue(symbol);
    const bg = `linear-gradient(135deg, hsl(${hue} 72% 52%), hsl(${(hue+40)%360} 72% 42%))`;
    const glow = `0 3px 10px -2px hsl(${hue} 72% 45% / .55), inset 0 1px 0 #ffffff30`;
    return Utils.el("div", {
      class:"coin-ic",
      style:`width:${size}px;height:${size}px;font-size:${Math.round(size*0.36)}px;background:${bg};box-shadow:${glow};color:#ffffffe8;`,
    }, letters);
  }

  function statusBadge(status){
    const map = {
      "موفق": "badge-green", "در انتظار": "badge-amber", "ناموفق": "badge-red",
      "connected": "badge-green", "disconnected": "badge-gray", "checking": "badge-blue",
    };
    const labelMap = { connected:"متصل", disconnected:"قطع شده", checking:"در حال بررسی" };
    return Utils.el("span", { class:`badge ${map[status] || "badge-gray"}` }, [
      Utils.el("span", { class:"badge-dot" }),
      Utils.el("span", { class:"badge-label" }, labelMap[status] || status),
    ]);
  }

  // منوی کشویی سفارشی — جایگزین <select> بومی که در اندروید/iOS با
  // ظاهر سیستم‌عامل (نه تم برنامه) باز می‌شود.
  // options: [{value, label}] | onChange(value) | title: عنوان بالای ورق کشویی
  function dropdown({ value, options, onChange, title }){
    let current = value;

    const labelOf = (v) => {
      const opt = options.find(o => String(o.value) === String(v));
      return opt ? opt.label : "";
    };

    const triggerLabel = Utils.el("span", {}, labelOf(current));
    const trigger = Utils.el("button", { type:"button", class:"dropdown-trigger" }, [
      triggerLabel,
      Utils.el("span", { class:"chev", html: ic("chevronDown") }),
    ]);

    function openSheet(){
      trigger.classList.add("open");
      const backdrop = Utils.el("div", {
        class:"dropdown-sheet-backdrop",
        onClick:(e) => { if(e.target === backdrop) close(); },
      });
      const sheet = Utils.el("div", { class:"dropdown-sheet" });
      if(title) sheet.appendChild(Utils.el("div", { class:"dropdown-sheet-title" }, title));
      options.forEach(opt => {
        const isSel = String(opt.value) === String(current);
        const row = Utils.el("div", { class:`dropdown-option ${isSel ? "selected" : ""}` }, [
          Utils.el("span", {}, opt.label),
          Utils.el("span", { class:"radio" }),
        ]);
        row.addEventListener("click", () => {
          current = opt.value;
          triggerLabel.textContent = opt.label;
          close();
          onChange(opt.value);
        });
        sheet.appendChild(row);
      });
      backdrop.appendChild(sheet);
      document.body.appendChild(backdrop);
      function close(){ trigger.classList.remove("open"); backdrop.remove(); }
    }

    trigger.addEventListener("click", openSheet);
    return trigger;
  }

  return { skeleton, skeletonCard, skeletonRow, skeletonRows, skeletonChart, skeletonHead, stateBox, empty, errorState, loading, mockFlag, changeBadge, coinAvatar, statusBadge, dropdown };
})();

const Router = (() => {
  const routes = [
    { pattern: /^auth-phone$/,     name:"auth-phone",    page:() => PageAuthPhone },
    { pattern: /^auth-otp$/,       name:"auth-otp",      page:() => PageAuthOtp },
    { pattern: /^auth-password$/,  name:"auth-password", page:() => PageAuthPassword },
    { pattern: /^connect$/,        name:"connect",  page:() => PageConnect },
    { pattern: /^dashboard$/,      name:"dashboard",page:() => PageDashboard },
    { pattern: /^market$/,         name:"market",   page:() => PageMarket },
    { pattern: /^coin\/([\w-]+)$/, name:"coin",     page:() => PageCoin },
    { pattern: /^trade(?:\/([\w-]+))?$/, name:"trade", page:() => PageTrade },
    { pattern: /^wallet$/,         name:"wallet",   page:() => PageWallet },
    { pattern: /^history$/,        name:"history",  page:() => PageHistory },
    { pattern: /^profile$/,        name:"profile",  page:() => PageProfile },
    { pattern: /^ai$/,             name:"ai",       page:() => PageAI },
    { pattern: /^settings$/,       name:"settings", page:() => PageSettings },
  ];

  function current(){
    const hash = (location.hash || "#auth-phone").replace(/^#\/?/, "");
    for(const r of routes){
      const m = hash.match(r.pattern);
      if(m) return { name:r.name, page:r.page(), params:{ id: m[1] } };
    }
    return { name:"dashboard", page:PageDashboard, params:{} };
  }

  function go(path){
    location.hash = "#/" + path.replace(/^#\/?/, "");
  }

  function start(onChange){
    window.addEventListener("hashchange", () => onChange(current()));
    onChange(current());
  }

  return { go, current, start };
})();

const PageAuthOtp = {
  mount(container){
    let status = "idle";
    let errorMsg = "";
    let countdown = 60;
    let timer = null;
    const card = authShellStart(container);

    function startCountdown(){
      clearInterval(timer);
      countdown = 60;
      timer = setInterval(() => {
        countdown -= 1;
        const el = card.querySelector("#resendBtn");
        if(el) el.textContent = countdown > 0 ? `ارسال مجدد (${countdown})` : "ارسال مجدد کد";
        if(countdown <= 0) clearInterval(timer);
      }, 1000);
    }

    function paint(){
      while(card.children.length > 1) card.removeChild(card.lastChild);

      card.appendChild(Utils.el("h1", { class:"connect-title" }, "کد تایید را وارد کنید"));
      card.appendChild(Utils.el("p", { class:"connect-desc" },
        `کد ۵ رقمی ارسال‌شده به شماره ${AuthFlow.phone || ""} را وارد کنید.`
      ));

      const field = Utils.el("div", { class:"field" }, [
        Utils.el("label", { for:"otpInput" }, "کد تایید"),
        Utils.el("div", { class:"input-wrap" }, [
          Utils.el("input", {
            id:"otpInput", class:"input", type:"text", inputmode:"numeric",
            placeholder:"— — — — —", maxlength:"6", autocomplete:"one-time-code",
            style:"direction:ltr;text-align:center;letter-spacing:8px;font-size:18px;font-weight:700;",
          }),
        ]),
        status === "error" ? Utils.el("span", { class:"field-error" }, [Utils.el("span",{html:ic("alert")}), errorMsg]) : null,
      ]);
      card.appendChild(field);

      const btn = Utils.el("button", {
        class:"btn btn-primary btn-block", style:"margin-top:16px;height:44px;",
        disabled: status === "loading" ? "true" : false,
        onClick: handleVerify,
      }, status === "loading" ? [Utils.el("span",{class:"spin"}), "در حال بررسی…"] : "تایید کد");
      card.appendChild(btn);

      card.appendChild(Utils.el("div", { style:"display:flex;justify-content:space-between;margin-top:16px;" }, [
        Utils.el("button", { class:"btn btn-ghost btn-sm", onClick: () => { clearInterval(timer); Router.go("auth-phone"); } }, "تغییر شماره"),
        Utils.el("button", {
          id:"resendBtn", class:"btn btn-outline btn-sm",
          disabled: countdown > 0 ? "true" : false,
          onClick: handleResend,
        }, countdown > 0 ? `ارسال مجدد (${countdown})` : "ارسال مجدد کد"),
      ]));

      startCountdown();
    }

    async function handleVerify(){
      const input = card.querySelector("#otpInput");
      const code = input.value.trim();
      status = "loading"; errorMsg = ""; paint();
      try{
        await AppAuth.verifyOtp(code);
        clearInterval(timer);
        Router.go("auth-password");
      }catch(e){
        status = "error";
        errorMsg = e && e.message ? e.message : "کد وارد شده نامعتبر است.";
        paint();
      }
    }

    async function handleResend(){
      try{
        await AppAuth.sendOtp(AuthFlow.phone);
        Toast.info("کد دوباره ارسال شد", "");
        startCountdown();
      }catch(e){ /* نادیده گرفته می‌شود */ }
    }

    paint();
  }
};

const PageConnect = {
  mount(container){

          Utils.el("span", { html: ic("check") }),
          "ورود انجام شد. در حال انتقال به داشبورد…",
        ]);

      if(status === "error"){
        return Utils.el("div", { class:"connect-status error" }, [

      errorMsg = "";

      card.appendChild(renderNotice());

      const field = Utils.el("div", { class:"field" }, [
        Utils.el("label", { for:"apiKeyInput" }, "رمز دسترسی داشبورد"),

          Utils.el("input", {
            id:"apiKeyInput", class:"input", type: showKey ? "text" : "password",
            placeholder:"رمز دسترسی را وارد کنید", autocomplete:"off", spellcheck:"false",
          }),
          Utils.el("div", { class:"input-actions" }, [
            Utils.el("button", {
              class:"input-icon-btn", type:"button", title: showKey ? "مخفی کردن" : "نمایش",
              html: ic(showKey ? "eyeOff" : "eye"),
              onClick: () => { showKey = !showKey; const inp = card.querySelector("#apiKeyInput"); const val = inp.value; paint(); const ni = card.querySelector("#apiKeyInput"); ni.value = val; ni.focus(); },
            }),
          ]),
        ]),
        Utils.el("span", { class:"field-hint" }, "این مقدار در مرورگر ذخیره نمی‌شود؛ پس از ورود فقط یک توکن نشست کوتاه‌مدت در حافظه می‌ماند."),
      ]);
      card.appendChild(field);

      const btn = Utils.el("button", {
        class:"btn btn-primary btn-block", style:"margin-top:16px;height:44px;",
        disabled: status === "loading" ? "true" : false,
        onClick: handleConnect,
      }, status === "loading" ? [Utils.el("span",{class:"spin"}), "در حال ورود…"] : "ورود");
      card.appendChild(btn);

      const st = renderStatus();
      if(st) card.appendChild(st);

      card.appendChild(Utils.el("div", { class:"connect-foot" }, [
        "برای ساخت کلید API، ",
        Utils.el("a", { href: NOBITEX_API_GUIDE_URL, target:"_blank", rel:"noopener" }, "راهنمای رسمی والکس"),
        " را مطالعه کنید.",
      ]));
    }

    paint();
  }
};

const PageDashboard = {
  async mount(container){
    container.innerHTML = "";
    const head = Utils.el("div", { class:"page-head" }, [
      Utils.el("div", {}, [
        Utils.el("h1", {}, "داشبورد"),
        Utils.el("div", { class:"sub" }, "نمای کلی دارایی‌ها و بازار"),
      ]),
    ]);
    container.appendChild(head);

    const kpiGrid = Utils.el("div", { class:"kpi-grid" });
    const dashGrid = Utils.el("div", { class:"dash-grid" });
    const chartCard = Utils.el("div", { class:"card card-pad" });
    const sideCard = Utils.el("div", { class:"card card-pad" });
    dashGrid.append(chartCard, sideCard);
    container.append(kpiGrid, dashGrid);

    const marketCard = Utils.el("div", { class:"card card-pad", style:"margin-top:14px;" });
    container.appendChild(marketCard);

    // --- اسکلت بارگذاری اولیه ---
    for(let i=0;i<4;i++) kpiGrid.appendChild(UI.skeletonCard());
    chartCard.appendChild(UI.skeletonChart());
    sideCard.appendChild(UI.skeletonRows(6));
    marketCard.appendChild(UI.skeletonRows(6));

    let range = "7d";

    const [summaryS, historyS, marketS] = await Promise.allSettled([
      Api.getPortfolioSummary(),
      Api.getPortfolioHistory(range),
      Api.getMarketList(),
    ]);

    if(marketS.status === "fulfilled"){
      renderSideMarket(marketS.value);
      renderMarketTable(marketS.value);
    }else{
      sideCard.innerHTML = ""; marketCard.innerHTML = "";
      marketCard.appendChild(UI.errorState("دریافت اطلاعات بازار ناموفق بود", marketS.reason && marketS.reason.message, () => PageDashboard.mount(container)));
    }
    if(summaryS.status === "fulfilled"){
      renderKpis(summaryS.value);
    }else{
      kpiGrid.innerHTML = "";
      kpiGrid.appendChild(UI.errorState("دریافت اطلاعات حساب ناموفق بود", summaryS.reason && summaryS.reason.message, () => PageDashboard.mount(container)));
    }
    if(historyS.status === "fulfilled"){
      renderChart(historyS.value, summaryS.value);
    }else{
      chartCard.innerHTML = "";
      chartCard.appendChild(UI.empty("تاریخچه پرتفو در دسترس نیست", historyS.reason && historyS.reason.message));
    }
    if(marketS.status === "fulfilled") State.set({ connection: { lastChecked: new Date().toISOString() } });

    function renderKpis(summaryRes){
      kpiGrid.innerHTML = "";
      const s = summaryRes.data;
      const items = [
        { label:"ارزش کل دارایی‌ها", value:Utils.formatPrice(s.totalValueIrt), ic:"wallet", change:s.change24hPercent, color:"" },
        { label:"موجودی قابل‌استفاده", value:Utils.formatPrice(s.availableValueIrt), ic:"zap", color:"blue" },
        { label:"تعداد دارایی‌ها", value:Utils.formatNumber(s.assetCount), ic:"market", color:"green" },
        { label:"سفارش‌های باز", value:Utils.formatNumber(s.openOrders), ic:"history", color:"amber" },
      ];
      items.forEach((it, idx) => {
        const card = Utils.el("div", { class:"card kpi-card" }, [
          Utils.el("div", { class:"kpi-top" }, [
            Utils.el("div", { class:`kpi-ic ${it.color}`, html: ic(it.ic) }),
            (idx === 0 && summaryRes.isMock) ? UI.mockFlag() : null,
          ]),
          Utils.el("div", { class:"kpi-label" }, it.label),
          Utils.el("div", { class:"kpi-value num" }, it.value),
          (it.change !== undefined && it.change !== null) ? Utils.el("div", { class:`kpi-change ${it.change >= 0 ? "up":"down"}` }, [
            Utils.el("span", { html: ic(it.change >= 0 ? "trendUp" : "trendDown") }),
            Utils.formatPercent(it.change) + " (۲۴ ساعت، بر اساس موجودی فعلی)",
          ]) : null,
        ]);
        kpiGrid.appendChild(card);
      });
    }

    function renderChart(historyRes, summaryRes){
      chartCard.innerHTML = "";
      const points = historyRes.data;
      if(!points || points.length < 2){
        chartCard.appendChild(UI.empty("داده تاریخی کافی نیست", "والکس تاریخچه ارزش پرتفو ارائه نمی‌دهد؛ این نمودار از نمونه‌هایی ساخته می‌شود که سرور از زمان فعال‌سازی ذخیره کرده است."));
        return;
      }
      const last = points[points.length-1].v;
      const first = points[0].v;
      const pct = ((last - first) / first) * 100;

      chartCard.appendChild(Utils.el("div", { class:"chart-head" }, [
        Utils.el("div", {}, [
          Utils.el("div", { class:"card-title" }, [
            "ارزش کل پرتفو ",
            historyRes.isMock ? UI.mockFlag() : null,
          ]),
          Utils.el("div", { class:"chart-value num" }, Utils.formatPrice(last)),
          Utils.el("div", { class:`chart-value-sub ${pct>=0?"up":"down"}` }, `${Utils.formatPercent(pct)} در این بازه`),
        ]),
        Utils.el("div", { class:"range-tabs" }, ["24h","7d","30d","90d"].map(r =>
          Utils.el("button", {
            class:`chip ${r===range?"active":""}`,
            onClick: async () => {
              range = r;
              const wrap = chartCard.querySelector(".chart-canvas-wrap");
              if(wrap) wrap.innerHTML = "";
              if(wrap) wrap.appendChild(UI.skeleton("100%","100%","border-radius:14px;"));
              chartCard.querySelectorAll(".range-tabs .chip").forEach(c=>c.classList.remove("active"));
              let hRes; try{ hRes = await Api.getPortfolioHistory(range); }catch(e){ hRes = { data:[] }; }
              renderChart(hRes, summaryRes);
            }
          }, r)
        )),
      ]));

      const wrap = Utils.el("div", { class:"chart-canvas-wrap" }, [ Utils.el("canvas", { id:"portfolioChart" }) ]);
      chartCard.appendChild(wrap);
      requestAnimationFrame(() => {
        Charts.lineChart("portfolioChart", document.getElementById("portfolioChart"), points, { currency:"تومان" });
      });
    }

    function renderSideMarket(marketRes){
      sideCard.innerHTML = "";
      sideCard.appendChild(Utils.el("div", { class:"card-head" }, [
        Utils.el("div", { class:"card-title" }, "رصد سریع بازار"),
      ]));
      const top = [...marketRes.data].sort((a,b) => Math.abs(b.change24h) - Math.abs(a.change24h)).slice(0,6);
      if(top.length === 0){
        sideCard.appendChild(UI.empty("بازاری یافت نشد", ""));
        return;
      }
      const list = Utils.el("div", { class:"mini-list" });
