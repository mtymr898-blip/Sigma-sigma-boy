@keyframes q-ripple{ 0%{ transform:scale(.82); opacity:0; } 12%{ opacity:.8; } 70%,100%{ transform:scale(1.5); opacity:0; } }
.hv-sphere{ position:relative; width:66%; aspect-ratio:1; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 34% 28%,#aabcfd 0%,#8ba6ff 16%,#8ba6ff 42%,#142974 72%,#222222 100%);
  box-shadow:0 0 0 1px #6b8afb66 inset, inset 0 -18px 40px #17171799;
  animation:q-heartbeat 1.6s ease-in-out infinite; will-change:transform; }
.hv-sphere .hv-shine{ position:absolute; top:9%; left:16%; width:40%; height:26%; border-radius:50%; background:radial-gradient(ellipse at 50% 40%,#ffffffcc,transparent 70%); transform:rotate(-24deg); }
.hv-sphere img{ width:48%; height:48%; object-fit:contain; border-radius:50%; position:relative; z-index:1; box-shadow:none; }
@keyframes q-heartbeat{
  0%{ transform:scale(1); box-shadow:0 0 0 1px #6b8afb66 inset, inset 0 -18px 40px #17171799; }
  12%{ transform:scale(1.12); box-shadow:0 0 0 1px #6b8afb99 inset, inset 0 -18px 40px #17171799; }
  24%{ transform:scale(1.01); }
  36%{ transform:scale(1.075); box-shadow:0 0 0 1px #6b8afb88 inset, inset 0 -18px 40px #17171799; }
  52%,100%{ transform:scale(1); box-shadow:0 0 0 1px #6b8afb66 inset, inset 0 -18px 40px #17171799; }
}
@media (max-height:640px){ .q-heart{ width:min(52vw,210px); } .wl-logo{ width:70px; height:70px; } }
.card{ background:linear-gradient(150deg,#303030cc 0%,#262626e6 60%,#1f1f1ff2 100%); }
[data-theme="light"] .card{ background:#fff; }
.wl-logo{ display:block; margin:0 auto; }
.q-brand img,.brand-mark img{ filter:none!important; box-shadow:none !important; border-radius:0; }

/* ===================================================================
   SPLASH 2 — ورود سینمایی لوگو: ذرات، کره‌ی سه‌بعدی، رمزگشایی متن،
   نمودار زنده و پرواز لوگو به نوار بالا
   =================================================================== */
#splash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;
  background:#0e0e0e;color:#edf1fd;
  transition:background-color .8s ease,opacity .5s ease;cursor:pointer;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#splash::before{content:"";position:absolute;inset:0;z-index:0;opacity:.5;
  background-image:linear-gradient(rgba(178,178,178,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(178,178,178,.045) 1px,transparent 1px);background-size:44px 44px;
  -webkit-mask-image:radial-gradient(circle at 50% 42%,#000 0,transparent 62%);mask-image:radial-gradient(circle at 50% 42%,#000 0,transparent 62%);
  animation:sp-grid 2.4s ease-out both;transition:opacity .5s}
#splash.leaving{background:transparent;pointer-events:none}
#splash.leaving::before,#splash.leaving .sp-word,#splash.leaving .sp-tag,#splash.leaving .sp-chart,#splash.leaving .sp-cv{opacity:0!important;transition:opacity .45s ease}
#splash.out{opacity:0}
.sp-cv,.sp-chart{position:absolute;inset:0;z-index:1;pointer-events:none}
.sp-chart{z-index:0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.sp-chart path{fill:none;stroke:#8ba6ff;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;opacity:.42;stroke-dasharray:1;stroke-dashoffset:1;
  filter:none;animation:sp-chartdraw 1.6s .1s cubic-bezier(.5,0,.2,1) forwards}
@keyframes sp-chartdraw{to{stroke-dashoffset:0}}

.sp-mark{position:relative;z-index:2;width:156px;height:156px;perspective:720px}
.sp-3d{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.sp-orbit{position:absolute;left:50%;top:50%;border-radius:50%;border:1px solid rgba(139,166,255,.42);opacity:0;transform-style:preserve-3d}
.sp-orbit::after{content:"";position:absolute;top:-3.5px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#8ba6ff;box-shadow:none}
.sp-o1{width:128px;height:128px;margin:-64px 0 0 -64px;animation:sp-in .8s 1.1s forwards,sp-o1 7s linear infinite}
.sp-o2{width:152px;height:152px;margin:-76px 0 0 -76px;border-color:rgba(178,178,178,.38);animation:sp-in .8s 1.25s forwards,sp-o2 10s linear infinite reverse}
.sp-o2::after{background:#b2b2b2;box-shadow:0 0 10px rgba(178,178,178,.8);width:5px;height:5px;margin-left:-2.5px;top:-2.5px}
.sp-o3{width:176px;height:176px;margin:-88px 0 0 -88px;border:1px dashed rgba(139,166,255,.26);animation:sp-in .8s 1.4s forwards,sp-o3 14s linear infinite}
.sp-o3::after{display:none}
@keyframes sp-o1{from{transform:rotateX(72deg) rotateZ(0)}to{transform:rotateX(72deg) rotateZ(360deg)}}
@keyframes sp-o2{from{transform:rotateY(70deg) rotateZ(0)}to{transform:rotateY(70deg) rotateZ(360deg)}}
@keyframes sp-o3{from{transform:rotateX(48deg) rotateY(48deg) rotateZ(0)}to{transform:rotateX(48deg) rotateY(48deg) rotateZ(360deg)}}
@keyframes sp-in{to{opacity:1}}
.sp-core{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#f4f7fb 0%,#c5d3ff 15%,#8ba6ff 44%,#2a4bbd 76%,#0e0e0e 100%);
  box-shadow:0 0 0 1px rgba(237,241,253,.16) inset;
  opacity:0;transform:scale(.3);filter:blur(12px);animation:sp-core 1s .55s cubic-bezier(.2,.9,.2,1) forwards,sp-beat 2.4s 1.8s ease-in-out infinite}
.sp-core::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse 55% 38% at 32% 22%,rgba(255,255,255,.6),transparent 70%);pointer-events:none}
.sp-core::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset -10px -12px 20px rgba(0,0,0,.5), inset 2px 2px 7px rgba(255,255,255,.22);pointer-events:none}
.sp-core img{position:absolute;inset:15px;width:calc(100% - 30px);height:calc(100% - 30px);object-fit:contain;border-radius:50%}
.sp-core.flash{animation:sp-core 0s forwards,sp-flash .9s ease-out,sp-beat 2.4s .9s ease-in-out infinite}
@keyframes sp-core{to{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes sp-beat{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes sp-flash{0%{filter:brightness(2.3) blur(0);box-shadow:0 0 0 1px rgba(255,255,255,.4) inset}100%{filter:brightness(1) blur(0)}}

.sp-word{position:relative;z-index:2;display:flex;direction:ltr;gap:.2em;font:800 34px/1 "Inter","Vazirmatn",system-ui,sans-serif;
  -webkit-mask-image:linear-gradient(100deg,#000 40%,rgba(0,0,0,.35) 50%,#000 60%);-webkit-mask-size:250% 100%;mask-size:250% 100%;animation:sp-sweep 1.5s 2.1s ease-out both}
.sp-word span{display:inline-block;width:.84em;text-align:center;opacity:0;transform:translateY(10px);
  background:linear-gradient(180deg,#fff,#b2b2b2);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:sp-letter .6s cubic-bezier(.2,.8,.2,1) forwards}
.sp-word span:nth-child(1){animation-delay:.60s}.sp-word span:nth-child(2){animation-delay:.64s}.sp-word span:nth-child(3){animation-delay:.68s}
.sp-word span:nth-child(4){animation-delay:.72s}.sp-word span:nth-child(5){animation-delay:.76s}
.sp-word span.scr{background:none;-webkit-text-fill-color:#8ba6ff;color:#8ba6ff;text-shadow:none}
.sp-word span.lock{animation:sp-letter .01s forwards,sp-lock .5s ease-out}
@keyframes sp-lock{0%{transform:scale(1.28);filter:brightness(1.8)}100%{transform:none;filter:none}}
@keyframes sp-letter{to{opacity:1;transform:none}}
@keyframes sp-sweep{from{-webkit-mask-position:120% 0;mask-position:120% 0}to{-webkit-mask-position:-20% 0;mask-position:-20% 0}}
.sp-tag{position:relative;z-index:2;margin-top:-6px;font:500 10.5px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.1em;color:#b2b2b2;direction:ltr;white-space:nowrap;opacity:0;animation:sp-in .5s 1.45s forwards}
.sp-tag i{font-style:normal;display:inline-block;width:.62em;text-align:center}
.sp-tag i.scr{color:#8ba6ff;text-shadow:none}
@keyframes sp-grid{from{opacity:0;transform:scale(1.15)}to{opacity:.5;transform:none}}

.sp-flyer{position:fixed;left:0;top:0;z-index:100000;border-radius:50%;pointer-events:none;will-change:transform,width,height}
.sp-flyer::before{content:"";position:absolute;inset:0;border-radius:50%;opacity:var(--sph,1);
  background:radial-gradient(circle at 34% 28%,#f4f7fb 0%,#c5d3ff 16%,#8ba6ff 44%,#2a4bbd 76%,#0a0a0a 100%);
  box-shadow:0 0 0 1px rgba(241,245,249,.16) inset}
.sp-flyer img{position:absolute;inset:20%;width:60%;height:60%;object-fit:contain;border-radius:50%}

@media (prefers-reduced-motion:reduce){
  #splash *,#splash::before{animation-duration:.01s!important;animation-delay:0s!important}
  .sp-chart path{stroke-dashoffset:0}
}

/* ===================================================================
   قوانین و مقررات — صفحه‌ی توافق‌نامه
   =================================================================== */
.q-legal-link{ background:none; border:0; padding:0; margin:0; font:inherit; font-weight:800; color:var(--accent-text); cursor:pointer; text-decoration:underline; text-decoration-thickness:1.5px; text-underline-offset:4px; text-decoration-color:currentColor; }
.q-legal-link:hover{ filter:brightness(1.15); }
.q-legal-link:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:4px; }
:root[data-theme="light"] .q-legal-link{ color:#183086; }

.q-legal{ position:fixed; inset:0; z-index:400; display:flex; flex-direction:column; background:var(--q-bg, var(--bg)); animation:q-legal-in .26s var(--ease); }
@keyframes q-legal-in{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
.q-legal-top{ flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 14px 10px; border-bottom:1px solid var(--border-soft); background:var(--surface); }
.q-legal-x{ width:38px; height:38px; flex:0 0 38px; border-radius:50%; border:1px solid var(--border); background:var(--surface-hover); color:var(--text); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.q-legal-top h2{ font-size:14.5px; font-weight:800; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.q-legal-scroll{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:18px 16px 28px; }
.q-legal-doc{ max-width:720px; margin:0 auto; }
.q-legal-switch{ width:100%; display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:18px; }
.q-legal-title{ font-size:21px; font-weight:900; line-height:1.5; margin-bottom:10px; }
.q-legal-lead{ font-size:13.5px; line-height:2; color:var(--text-dim); margin-bottom:6px; }
.q-legal-sec{ margin-top:22px; padding-top:20px; border-top:1px solid var(--border-soft); }
.q-legal-sec-h{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.q-legal-num{ flex:0 0 28px; height:28px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; background:var(--accent-soft-strong); color:var(--accent-text); }
:root[data-theme="light"] .q-legal-num{ color:#183086; }
.q-legal-sec-h h3{ font-size:15px; font-weight:800; line-height:1.6; }
.q-legal-sec p{ font-size:13.5px; line-height:2.05; color:var(--text-dim); margin-top:8px; text-align:justify; }
.q-legal-sec p.warn{ color:var(--text); background:var(--amber-soft); border:1px solid #e2a23c40; border-radius:12px; padding:11px 13px; }
.q-legal-final{ margin-top:26px; padding:16px; border-radius:var(--radius-lg); background:var(--surface); border:1px solid var(--border); }
.q-legal-final h3{ font-size:15px; font-weight:800; margin-bottom:6px; }
.q-legal-final p{ font-size:13.5px; line-height:2.05; color:var(--text-dim); text-align:justify; }
.q-legal-empty{ margin-top:18px; padding:26px 16px; text-align:center; border:1px dashed var(--border); border-radius:var(--radius-lg); color:var(--text-dim); font-size:13.5px; line-height:2; }
.q-legal-sub{ font-size:13px; color:var(--text-dim); margin-bottom:6px; }
.q-legal-meta{ margin:14px 0 6px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface); overflow:hidden; }
.q-legal-meta > div{ display:flex; gap:12px; justify-content:space-between; align-items:baseline; padding:9px 13px; font-size:12.5px; color:var(--text-dim); border-top:1px solid var(--border-soft); }
.q-legal-meta > div:first-child{ border-top:0; }
.q-legal-meta b{ color:var(--text); font-weight:700; text-align:end; }
.q-legal-sec p .q-legal-cn{ font-weight:800; color:var(--accent-text); margin-inline-end:6px; white-space:nowrap; }
:root[data-theme="light"] .q-legal-sec p .q-legal-cn{ color:#183086; }
.q-legal-doc .q-legal-meta:last-child{ margin-top:24px; }
.q-legal-bar{ flex:0 0 auto; display:flex; flex-wrap:wrap; gap:10px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--border-soft); background:var(--surface); }
.q-legal-bar .btn{ flex:1 1 150px; }
.q-legal-bar .btn-priv{ flex-basis:100%; }

/* ===================================================================
   تم نهایی: مشکی خنثی + یک سبز مشخص. قاعده‌ها:
   ۱) فقط یک رنگ تأکید (سبز)؛ قرمز فقط برای افت/خطا.
   ۲) باکس فقط جایی که لازم است (فهرست، فرم، جدول)؛ بقیه‌ی عناصر آزاد روی صفحه‌اند.
   =================================================================== */
:root,:root[data-theme="dark"]{
  --bg:#0a0a0a; --bg-soft:#0f0f0f; --surface:#121212; --surface-raised:#181818; --surface-2:#181818cc; --surface-hover:#1c1c1c;
  --border:#262626; --border-soft:#1c1c1c; --border-strong:#333333;
  --ice:#8ba6ff; --ice-glow:0 0 8px 0 #8ba6ff70, 0 0 20px -3px #8ba6ff60; --on-ice:#0a1024;
  --accent:#8ba6ff; --accent-strong:#7f9bf8; --accent-dim:#2443a8; --accent-soft:#8ba6ff1f; --accent-soft-strong:#8ba6ff3d; --accent-text:#3867ff;
  --blue:#a3a3a3; --blue-soft:#ffffff14;
  --green:#8ba6ff; --green-strong:#7f9bf8; --green-soft:#8ba6ff1f;
  --red:#e5534b; --red-strong:#cf3f38; --red-soft:#e5534b1a;
  --amber:#d9a441; --amber-soft:#d9a4411a;
  --text:#f4f7fb; --text-dim:#a3a3a3; --text-faint:#6b6b6b;
  --shadow-card:none; --shadow-raised:0 12px 32px -14px #000000c0; --shadow-pop:0 24px 60px -20px #000000e0;
  --q-bg:#0a0a0a; --q-bg2:#0f0f0f; --q-card:#121212; --q-card2:#181818; --q-line:#262626; --q-line2:#1c1c1c;
  --q-blue:#8ba6ff; --q-blue2:#8ba6ff; --q-violet:#8ba6ff; --q-cyan:#8ba6ff; --q-teal:#7f9bf8; --q-navy:#0f0f0f;
  --q-up:#8ba6ff; --q-down:#e5534b; --q-amber:#d9a441;
  --q-grad:#8ba6ff; --q-grad-up:#7f9bf8; --q-grad-down:#cf3f38; --q-glow:none;
}
:root[data-theme="light"]{
  --bg:#f6f6f6; --bg-soft:#efefef; --surface:#ffffff; --surface-raised:#ffffff; --surface-2:#ffffffcc; --surface-hover:#f1f1f1;
  --border:#e2e2e2; --border-soft:#ececec; --border-strong:#d2d2d2;
  --ice:#8ba6ff; --ice-glow:0 0 8px 0 #8ba6ff90, 0 0 18px -3px #8ba6ff80; --on-ice:#0a1024;
  --accent:#8ba6ff; --accent-strong:#7f9bf8; --accent-dim:#2443a8; --accent-soft:#8ba6ff33; --accent-soft-strong:#8ba6ff4d; --accent-text:#2c54d6;
  --blue:#666666; --blue-soft:#00000010;
  --green:#2c54d6; --green-strong:#7f9bf8; --green-soft:#8ba6ff2e;
  --red:#d0443c; --red-strong:#b53a33; --red-soft:#d0443c1a;
  --amber:#b9852a; --amber-soft:#b9852a1a;
  --text:#141414; --text-dim:#5c5c5c; --text-faint:#8c8c8c;
  --shadow-card:none; --shadow-raised:0 12px 30px -16px #00000040; --shadow-pop:0 24px 60px -24px #00000055;
  --q-bg:#f6f6f6; --q-bg2:#efefef; --q-card:#ffffff; --q-card2:#f1f1f1; --q-line:#e2e2e2; --q-line2:#ececec;
  --q-blue:#8ba6ff; --q-blue2:#8ba6ff; --q-violet:#8ba6ff; --q-cyan:#8ba6ff; --q-teal:#7f9bf8; --q-navy:#efefef;
  --q-up:#2c54d6; --q-down:#d0443c; --q-amber:#b9852a;
  --q-grad:#8ba6ff; --q-grad-up:#8ba6ff; --q-grad-down:#d0443c; --q-glow:none;
}
html,body{ background:var(--bg)!important; background-image:none!important; }
[data-theme="dark"] body::before{ display:none!important; }
.main{ border-inline:0!important; box-shadow:none !important; }

/* ---- باکس‌ها: پیش‌فرض «آزاد» (بدون قاب)؛ فقط محتوای فرم/جدول قاب می‌گیرد ---- */
.card{ background:transparent!important; border:0!important; border-radius:0!important; box-shadow:none !important; backdrop-filter:none!important; }
.card::before{ display:none!important; }
.card.card-pad{ padding:6px 0; }
.card:has(input,select,textarea,table,.table-wrap,.ai-mode-card),
.card.boxed,.connect-card{ background:var(--surface)!important; border:1px solid var(--border)!important; border-radius:16px!important; }
.card.card-pad:has(input,select,textarea,table,.table-wrap,.ai-mode-card){ padding:16px; }
.card:has(table,.table-wrap){ overflow:hidden; }
@media (hover:hover){ .card:hover{ transform:none!important; box-shadow:none !important; } }
.card-title{ font-size:13px; font-weight:700; color:var(--text-dim); }
.kpi-card{ background:transparent!important; border:0!important; padding:6px 0!important; box-shadow:none !important; }

/* ---- دکمه‌ها: فقط یکی پررنگ؛ بقیه کم‌رنگ ---- */
.btn{ border-radius:12px; font-weight:700; transition:background .2s,border-color .2s,filter .2s; }
.btn-primary,[data-theme="dark"] .btn-primary{ background:var(--accent)!important; color:var(--on-ice)!important; border:0; box-shadow:none !important; }
:root[data-theme="light"] .btn-primary{ color:var(--on-ice)!important; }
.btn-primary:hover{ filter:brightness(1.08); transform:none; }
.btn-outline,.btn-ghost{ background:transparent; border:1px solid var(--border); color:var(--text); }
.btn-outline:hover,.btn-ghost:hover{ background:var(--surface-hover); border-color:var(--border-strong); }
.chip,.tab-btn{ background:transparent; border:1px solid transparent; color:var(--text-dim); padding:6px 12px; font-size:12px; border-radius:10px; transition:background .2s,color .2s; }
.chip:hover,.tab-btn:hover{ transform:none; color:var(--text); background:var(--surface-hover); border-color:transparent; }
.chip.active,.tab-btn.active{ background:var(--accent-soft-strong)!important; color:var(--accent-text)!important; border-color:transparent; box-shadow:none !important; }
.q-seg{ background:var(--bg-soft); border:1px solid var(--border-soft); }
.q-seg button.active{ background:var(--surface-hover)!important; color:var(--accent-text)!important; box-shadow:none !important; }
.cn-step.on i,.cn-card b{ background:var(--accent)!important; color:var(--on-ice)!important; box-shadow:none !important; transform:none; }

/* ---- ورودی‌ها و سوییچ ---- */
input,select,textarea,.input{ background:var(--bg-soft); border:1px solid var(--border); }
:root[data-theme="light"] input,:root[data-theme="light"] .input{ background:#fff; }
input:focus,.input:focus{ border-color:var(--accent)!important; box-shadow:0 0 0 3px var(--accent-soft) !important; }
.switch .track{ background:var(--border-strong); }
.switch input:checked + .track{ background:var(--accent); box-shadow:none; }

/* ---- نوار بالا و پایین ---- */
html[data-theme] .topbar{ background:var(--bg)!important; border-bottom:1px solid var(--border-soft)!important; box-shadow:none !important; backdrop-filter:none!important; padding:10px 16px!important; }
.icon-btn,.menu-btn{ background:transparent; border:1px solid transparent; width:38px; height:38px; border-radius:12px; }
.icon-btn:hover,.menu-btn:hover{ transform:none; background:var(--surface-hover); border-color:transparent; box-shadow:none; }
.q-brand i,.q-brand .fa{ display:none; }
.q-brand b{ background:none!important; -webkit-text-fill-color:currentColor!important; color:var(--text); font-size:16px; letter-spacing:.14em; }
.q-brand img{ width:28px; height:28px; }
html[data-theme] .bottom-nav{ background:var(--surface)!important; border:1px solid var(--border)!important; border-radius:20px; padding:6px 8px; backdrop-filter:none; box-shadow:0 12px 30px -14px #000000a0; }
.bottom-nav .bn-item{ color:var(--text-faint); }
.bottom-nav .bn-item.active{ color:var(--accent-text); }
.bottom-nav .bn-item.active .ic{ transform:none; filter:none; color:var(--accent-text); }
.bottom-nav .bn-item.active::after{ background:var(--accent); width:14px; margin-left:-7px; }

  }
  function size(){

    cv.width=w*dpr; cv.height=h*dpr; cv.style.width=w+"px"; cv.style.height=h+"px"; ctx.setTransform(dpr,0,0,dpr,0,0);

    var tr=tag.getBoundingClientRect(); flatY=tr.bottom+16;

  /* ---------- پارالاکس سه‌بعدی ---------- */
  var tx=0,ty=0,cxr=0,cyr=0;
  W.addEventListener("pointermove",function(e){ ty=(e.clientX/w-.5)*34; tx=-(e.clientY/h-.5)*34; },{passive:true});
  W.addEventListener("deviceorientation",function(e){ if(e.gamma==null) return; ty=clamp(e.gamma,-30,30)*.9; tx=-clamp((e.beta||45)-45,-30,30)*.7; },{passive:true});

  /* ---------- حلقه‌ی اصلی ---------- */
  var shocked=false;
  function frame(now){
    if(gone) return;
    var t=now-t0;
    cxr+=(tx+Math.cos(t/1100)*5-cxr)*.08; cyr+=(ty+Math.sin(t/900)*7-cyr)*.08;
    d3.style.transform="rotateX("+cxr.toFixed(2)+"deg) rotateY("+cyr.toFixed(2)+"deg)";
    if(!shocked&&t>TSHOCK){ shocked=true; core.classList.add("flash"); }

    ctx.clearRect(0,0,w,h);
    var rot=t*.00045, cr=Math.cos(rot), sr=Math.sin(rot);
    var R=72+(t>TSHOCK?26*Math.exp(-(t-TSHOCK)/260):0), n=P.length, X=new Array(n), Y=new Array(n), Q=new Array(n);
    for(var i=0;i<n;i++){
      var p=P[i], q=clamp((t-p.d)/p.u,0,1), e=1-Math.pow(1-q,3);

      var x=lerp(p.x0,cx+x3*R,e), y=lerp(p.y0,cy+p.sy*R,e), dep=(z3+1)/2;
      X[i]=x; Y[i]=y; Q[i]=q;
      var a=Math.min(1,q*2.5)*(.3+.65*dep);
      ctx.fillStyle="rgba(139,166,255,"+a.toFixed(3)+")"; ctx.beginPath(); ctx.arc(x,y,.9+1.5*dep,0,6.2832); ctx.fill();
    }
    if(t>700){
      ctx.lineWidth=.7;
      for(var a1=0;a1<n;a1++){ if(Q[a1]<.85) continue;
        for(var b=a1+1;b<n;b++){ if(Q[b]<.85) continue; var dx=X[a1]-X[b], dy=Y[a1]-Y[b], d2=dx*dx+dy*dy;
          if(d2<1500){ ctx.strokeStyle="rgba(139,166,255,"+(.16*(1-d2/1500)).toFixed(3)+")"; ctx.beginPath(); ctx.moveTo(X[a1],Y[a1]); ctx.lineTo(X[b],Y[b]); ctx.stroke(); } } }
    }
    [0,150].forEach(function(dl,k){
      var q=(t-TSHOCK-dl)/1200; if(q<0||q>1) return;
      var rr=lerp(40,Math.max(w,h)*.75,1-Math.pow(1-q,3));
      ctx.strokeStyle="rgba(139,166,255,"+((k?.18:.5)*(1-q)).toFixed(3)+")"; ctx.lineWidth=k?1:1.6; ctx.beginPath(); ctx.arc(cx,cy,rr,0,6.2832); ctx.stroke();
    });
    // نمودار زنده → خط صاف زیر شعار
    if(t>2150&&!morphDone){ var m=clamp((t-2150)/550,0,1); chartD(eio(m)); if(m>=1) morphDone=true; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- پرواز لوگو به جای اصلی‌اش (نوار بالا یا صفحه‌ی ورود) ---------- */
  // لوگو منتظر می‌ماند تا برنامه صفحه را بسازد؛ بعد به لوگوی همان صفحه می‌نشیند.
  function findTarget(){
    var sel=[".q-brand img",".wl-logo",".q-orb .q-logo"];
    for(var i=0;i<sel.length;i++){ var n=D.querySelector(sel[i]); if(n){ var r=n.getBoundingClientRect(); if(r.width>4) return n; } }
    return null;
  }
  function reveal(){
    if(revealed) return; revealed=true;
    startApp();
    var tw=performance.now();
    (function wait(){
      if(gone) return;
      var tg=findTarget();
      if(tg){ depart(tg); return; }
      if(performance.now()-tw>4500){ depart(null); return; }
      requestAnimationFrame(wait);
    })();
  }
  function depart(tg){
    var cr=core.getBoundingClientRect(), size0=cr.width;
    var fly=D.createElement("div"); fly.className="sp-flyer";
    var im=core.querySelector("img"), c2=null;
    if(im){ c2=D.createElement("img"); c2.src=im.src; c2.alt=""; fly.appendChild(c2); }
    fly.style.width=fly.style.height=size0+"px"; fly.style.transform="translate("+cr.left+"px,"+cr.top+"px)";
    D.body.appendChild(fly); mark.style.visibility="hidden"; el.classList.add("leaving");
    function done(){ showAll(); fly.style.transition="opacity .25s"; fly.style.opacity="0"; el.classList.add("out"); setTimeout(function(){ fly.remove(); },300); setTimeout(remove,700); }
    if(!tg){ done(); return; }
    hideT(tg);
    var sx=cr.left+cr.width/2, sy=cr.top+cr.height/2, t0f=null, last=null;
    function step(now){
      if(gone) return;
      if(t0f===null) t0f=now;
      var r=tg.getBoundingClientRect();
      if(r.width>0) last={left:r.left,top:r.top,width:r.width,height:r.height};
      r=last||{left:W.innerWidth/2-14,top:14,width:28,height:28};
      var p=clamp((now-t0f)/900,0,1), e=eio(p);
      var tcx=r.left+r.width/2, tcy=r.top+r.height/2, sz=lerp(size0,Math.max(r.width,r.height),e);
      fly.style.width=fly.style.height=sz+"px";
      fly.style.transform="translate("+(lerp(sx,tcx,e)-sz/2).toFixed(1)+"px,"+(lerp(sy,tcy,e)-sz/2).toFixed(1)+"px)";
      fly.style.setProperty("--sph",(1-e).toFixed(3)); // کره‌ی پشت لوگو رفته‌رفته محو می‌شود
      if(c2){ var ins=lerp(20,0,e); c2.style.inset=ins.toFixed(1)+"%"; c2.style.width=c2.style.height=(100-2*ins).toFixed(1)+"%"; }
      if(p<1) requestAnimationFrame(step); else done();
    }
    requestAnimationFrame(step);
  }
  el.addEventListener("click",reveal);
  setTimeout(reveal,3000);
  setTimeout(function(){ if(!gone) remove(); },14000); // شبکه‌ی اطمینان: صفحه‌ی آغازین هرگز گیر نمی‌کند
})();
</script>

<script>

// توابع کمکی عمومی: قالب‌بندی عدد، تاریخ، ابزارهای DOM

const Utils = (() => {

  function formatNumber(value, { decimals = 2, compact = false } = {}){
    if(value === null || value === undefined || Number.isNaN(value)) return "—";
    const num = Number(value);
    if(compact){
      const abs = Math.abs(num);
      if(abs >= 1e9) return (num/1e9).toLocaleString("en-US",{maximumFractionDigits:2}) + " میلیارد";
      if(abs >= 1e6) return (num/1e6).toLocaleString("en-US",{maximumFractionDigits:2}) + " میلیون";
      if(abs >= 1e3) return (num/1e3).toLocaleString("en-US",{maximumFractionDigits:1}) + " هزار";
    }
    return num.toLocaleString(numberLocale(), { maximumFractionDigits: decimals, minimumFractionDigits: 0 });
  }

  // نرخ تتر (تومان) از آخرین پاسخ واقعی بازار؛ اگر موجود نباشد null و قیمت تتری نمایش داده نمی‌شود
  let _usdtRate = null;
  function setUsdtRate(v){ _usdtRate = (Number(v) > 0) ? Number(v) : null; }
  function usdtRate(){ return _usdtRate; }

  function numberLocale(){
    const fmt = (typeof State !== "undefined") ? State.get().settings.numberFormat : "latin";
    return fmt === "fa" ? "fa-IR" : "en-US";
  }

  function formatPrice(value, currency = "تومان"){
    if(value === null || value === undefined || Number.isNaN(value)) return "—";
    let num = Number(value);
    let unitLabel = currency;

    const priceUnit = (typeof State !== "undefined") ? State.get().settings.priceUnit : "irt";
    if(priceUnit === "usdt"){
      if(!usdtRate()) return "—";
      num = num / usdtRate();
      if(currency === "تومان") unitLabel = "تتر";
    }

    let decimals = 2;
    if(priceUnit === "usdt"){
      decimals = num >= 1 ? 2 : 4;
    }else{
      if(num >= 1000) decimals = 0;
      else if(num < 1) decimals = 4;
    }
    const formatted = num.toLocaleString(numberLocale(), { maximumFractionDigits: decimals });
    return unitLabel ? `${formatted} ${unitLabel}` : formatted;
  }

  function formatPercent(value){
    if(value === null || value === undefined || Number.isNaN(value)) return "—";
    const num = Number(value);
    const sign = num > 0 ? "+" : "";
    return `${sign}${num.toFixed(2)}٪`;
  }

  function formatDateTime(isoString){
    if(!isoString) return "—";
    const d = new Date(isoString);
    if(Number.isNaN(d.getTime())) return "—";
    const fmt = new Intl.DateTimeFormat("fa-IR", {
      year:"numeric", month:"2-digit", day:"2-digit",
      hour:"2-digit", minute:"2-digit"
    });
    return fmt.format(d);
  }

  function formatDate(isoString){
    if(!isoString) return "—";
    const d = new Date(isoString);
    if(Number.isNaN(d.getTime())) return "—";
    return new Intl.DateTimeFormat("fa-IR", { year:"numeric", month:"2-digit", day:"2-digit" }).format(d);
  }

  function timeAgo(isoString){
    if(!isoString) return "—";
    const d = new Date(isoString);
    const diffSec = Math.floor((Date.now() - d.getTime())/1000);
    if(diffSec < 10) return "همین الان";
    if(diffSec < 60) return `${diffSec} ثانیه پیش`;
    const diffMin = Math.floor(diffSec/60);
    if(diffMin < 60) return `${diffMin} دقیقه پیش`;
    const diffHr = Math.floor(diffMin/60);
    if(diffHr < 24) return `${diffHr} ساعت پیش`;
    const diffDay = Math.floor(diffHr/24);
    return `${diffDay} روز پیش`;
  }

  function el(tag, attrs = {}, children = []){
    const node = document.createElement(tag);
    for(const [k,v] of Object.entries(attrs)){
      if(k === "class") node.className = v;
      else if(k === "html") node.innerHTML = v;
      else if(k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
      else if(v !== false && v !== null && v !== undefined) node.setAttribute(k, v);
    }
    (Array.isArray(children) ? children : [children]).forEach(c => {
      if(c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);

    return node;
  }

  function debounce(fn, wait = 250){
    let t;

      clearTimeout(t);
      t = setTimeout(() => fn(...args), wait);
    };
  }

  function initials(name){
    if(!name) return "—";
    return name.trim().slice(0,2);
  }

  function maskSecret(value, visibleStart = 4, visibleEnd = 4){
    if(!value) return "";
    if(value.length <= visibleStart + visibleEnd) return "•".repeat(value.length);

  }

  function maskPhone(phone){
    if(!phone) return "—";

    if(digits.length < 6) return phone;
    return digits.slice(0,4) + "***" + digits.slice(-3);

  function friendlyError(err, fallback){
    const def = fallback || "مشکلی پیش آمد. لطفاً دوباره تلاش کنید.";
    const msg = err && err.message;
    if(isUserSafe(msg)) return msg.trim();

    const st = err && err.status;
    if(st === 429) return "تعداد درخواست‌ها زیاد است. چند لحظه صبر کنید و دوباره تلاش کنید.";
    if(st >= 500) return "سرویس موقتاً در دسترس نیست. کمی بعد دوباره تلاش کنید.";
    return def;
  }

  return { friendlyError, friendlyText, setUsdtRate, formatNumber, formatPrice, formatPercent, formatDateTime, formatDate, timeAgo, el, debounce, initials, maskSecret, maskPhone };
})();

const Q = {
  E: Utils.el,
  reduced: () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches,
  countUp(el, to, render, dur = 1200){
    if(!isFinite(to) || Q.reduced()){ el.textContent = render(to); return; }
    const t0 = performance.now();
    const step = (t) => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4); el.textContent = render(to * e); if(p < 1 && document.body.contains(el)) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  },
  section(title, linkText, onLink){
    return Utils.el("div", { class:"q-section" }, [Utils.el("h3", {}, title), linkText ? Utils.el("button", { onClick:onLink }, linkText) : null]);
  },
  orb(big){ return Utils.el("div", { class:"q-orb" + (big ? " big" : "") }, [Utils.el("i", { class:"o3" }), Utils.el("i", { class:"o2" }), Utils.el("img", { class:"q-logo", src:"img/logo.png", alt:"QAIRO" })]); },
  chg(v){
    if(v === null || v === undefined) return Utils.el("span", { class:"q-chg" }, "—");
    return Utils.el("span", { class:`q-chg ${v >= 0 ? "up" : "down"}` }, Utils.formatPercent(v));
  },
  coinRow(c, withSpark = true){
    const E = Utils.el;
    const row = E("div", { class:"q-row", onClick: () => Router.go(`coin/${c.id}`) }, [
      UI.coinAvatar(c.symbol, 40, c.icon || c.image || c.logo),
      E("div", { class:"q-id" }, [E("div", { class:"q-nm" }, c.name), E("div", { class:"q-sy" }, c.symbol)]),
      withSpark ? E("div", { class:"q-sp" }, E("canvas", { "data-key":"row_" + c.id })) : null,
      E("div", { class:"q-pr" }, [E("div", { class:"p num" }, Utils.formatPrice(c.price, "")), E("div", { class:`c ${(c.change24h ?? 0) >= 0 ? "up" : "down"}` }, Utils.formatPercent(c.change24h))]),
    ]);
    return row;
  },
  paintSparks(root, coins){
    const ids = coins.map(c => c.id);
    if(!ids.length) return;
    Api.getSparklines(ids).then(sp => {
      coins.forEach(c => { const cv = root.querySelector(`canvas[data-key="row_${c.id}"]`); const pts = sp.data && sp.data[c.id]; if(cv && pts) Charts.sparkline(cv, pts, (c.change24h ?? 0) >= 0); });
    }).catch(() => {});
  },
};

function ic(name, extraClass = ""){

  return extraClass ? svg.replace('class="ic"', `class="ic ${extraClass}"`) : svg;

// فقط تنظیمات غیرحساس (تم، واحد قیمت، بازه به‌روزرسانی و ...) در
// localStorage ذخیره می‌شوند. وضعیت اتصال و هر داده مرتبط با حساب
// صرافی فقط در حافظه (در طول یک نشست مرورگر) نگه‌داری می‌شود و با
// رفرش صفحه از بین می‌رود — دقیقاً همان رفتاری که از یک معماری امن
// مبتنی بر نشست سمت سرور انتظار می‌رود.
// ===================================================================

const STORAGE_KEY = "nx_dashboard_settings_v1";

const State = (() => {
  const listeners = new Set();

  function loadSettings(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultSettings();
      return { ...defaultSettings(), ...JSON.parse(raw) };
    }catch(e){
      return defaultSettings();
    }
  }

  function defaultSettings(){
    return {
      theme: "dark",
      priceUnit: "irt",        // irt | usdt
      numberFormat: "latin",   // latin | fa
      refreshInterval: 60,     // ثانیه
      notifyPriceAlerts: true,
      notifyConnection: true,
      language: "fa",
    };
  }

  function persistSettings(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store.settings)); }catch(e){ /* ignore */ }
  }

  const store = {
    route: { name:"auth-phone", params:{} },
    account: { loggedIn:false, phone:null },
    connection: { status:"disconnected", exchangeName:null, connectedAt:null, lastChecked:null },
    settings: loadSettings(),
    sidebarOpen: false,
  };

  function get(){ return store; }

  function set(patch){
    for(const [k,v] of Object.entries(patch)){
      if(typeof v === "object" && v !== null && !Array.isArray(v) && typeof store[k] === "object"){
        store[k] = { ...store[k], ...v };
      }else{
        store[k] = v;
      }
    }
    if("settings" in patch) persistSettings();
    emit();
  }

  function subscribe(fn){
    listeners.add(fn);
    return () => listeners.delete(fn);
  }

  function emit(){
    listeners.forEach(fn => fn(store));
  }

  return { get, set, subscribe };
})();
// ===================================================================
// لایه اتصال به سرور (Cloudflare Worker) — بدون هیچ داده آزمایشی
// ===================================================================
// آدرس Worker از config.js می‌آید (خالی = همین دامنه). هیچ کلید صرافی در مرورگر وجود ندارد.
const API_BASE = String(window.__API_BASE__ || "").replace(/\/$/, "");

const Api = (() => {
  // توکن نشست (کوتاه‌مدت، ۱۲ ساعت) در sessionStorage می‌ماند تا با رفرش صفحه دوباره پیامک نخواهید؛ با بستن تب پاک می‌شود.
  // کلید صرافی، رمز عبور و کد پیامکی هرگز در هیچ storage ذخیره نمی‌شوند.
  const SESS_KEY = "nx_session_v1";
  let sessionToken = null;
  function clearSession(){ sessionToken = null; try{ sessionStorage.removeItem(SESS_KEY); }catch(e){ /* ignore */ } }
  function setSession(s){
    sessionToken = s.token;
    try{ sessionStorage.setItem(SESS_KEY, JSON.stringify({ token:s.token, expiresAt:s.expiresAt, phone:s.phone || null })); }catch(e){ /* ignore */ }
    State.set({ account: { loggedIn:true, phone:s.phone || null } });
  }

  async function request(path, { method = "GET", body, auth = true } = {}){
    const headers = { Accept: "application/json" };
    if(body !== undefined) headers["Content-Type"] = "application/json";
    if(auth && sessionToken) headers.Authorization = "Bearer " + sessionToken;
    let res;
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 35000); // جلوگیری از اسکلتون بی‌پایان
    try{
      res = await fetch(API_BASE + path, { method, headers, signal: ctl.signal, body: body !== undefined ? JSON.stringify(body) : undefined });
    }catch(e){
      const timedOut = e && e.name === "AbortError";
      const err = new Error(timedOut ? "پاسخی از سرور نرسید. لطفاً چند لحظه بعد دوباره تلاش کنید." : "اتصال به سرور برقرار نشد. اینترنت خود را بررسی کنید و دوباره تلاش کنید.");
      err.code = timedOut ? "TIMEOUT" : "NETWORK"; throw err;
    }finally{ clearTimeout(timer); }
    let json = null;
    try{ json = await res.json(); }catch(e){ /* غیر JSON */ }
    if(!res.ok || !json || json.ok !== true){
      const e = (json && json.error) || {};
      const err = new Error(Utils.friendlyError({ message:e.message, status:res.status }));
      err.rawMessage = e.message || ("HTTP " + res.status);
      err.code = e.code || ("HTTP_" + res.status); err.status = res.status; err.detail = e;
      if(res.status === 401 && err.code === "SESSION_INVALID"){
        clearSession();
        State.set({ account: { loggedIn:false, phone:null }, connection: { status:"disconnected", exchangeName:null, connectedAt:null, lastChecked:null } });
        window.dispatchEvent(new Event("hashchange")); // مسیریاب را به صفحه ورود برمی‌گرداند
      }
      throw err;
    }
    return json;
  }
  const wrap = (json) => ({ data: json.data, meta: json.meta || null, fetchedAt: json.fetchedAt, isMock: false });
  const get = async (path) => wrap(await request(path));

  const authPost = (path, body) => request(path, { method:"POST", body, auth:false }).then(j => j.data);

  // اتصال واقعی به صرافی: کلید فقط یک‌بار به سرور می‌رود؛ سرور با یک درخواست واقعی به صرافی آن را آزمایش و رمزنگاری‌شده ذخیره می‌کند
  async function connect(apiKey){
    const json = await request("/api/connect", { method:"POST", body:{ apiKey } });
    State.set({ connection: { status:"connected", exchangeName:"صرافی متصل", connectedAt:new Date().toISOString(), lastChecked:new Date().toISOString() } });
    return json.data;
  }
  async function disconnectExchange(){
    await request("/api/disconnect", { method:"POST", body:{} });
    return checkConnection();
  }
  // اتصال حساب روبیکا (کد ورود از طریق ربات روبیکا)
  const rubikaStatus = () => request("/api/rubika/status").then(j => j.data);
  const rubikaStart = () => request("/api/rubika/link/start", { method:"POST", body:{} }).then(j => j.data);
  const rubikaDisconnect = () => request("/api/rubika/disconnect", { method:"POST", body:{} }).then(j => j.data);
  // خروج از حساب برنامه (پایان نشست)
  async function disconnect(){
    clearSession();
    State.set({ connection: { status:"disconnected", exchangeName:null, connectedAt:null, lastChecked:null } });
    return { ok:true };
  }
  async function checkConnection(){
    if(!sessionToken) return State.get().connection;
    try{
      const j = await request("/api/session/check");
      const now = new Date().toISOString();
      State.set({ connection: j.data.exchangeKeyConfigured
        ? { status:"connected", exchangeName:"صرافی متصل", connectedAt:j.data.keyConnectedAt || State.get().connection.connectedAt || now, lastChecked:now, serverIp:j.data.serverIp || null, canStoreKey:j.data.canStoreKey !== false }
        : { status:"disconnected", exchangeName:null, connectedAt:null, lastChecked:now, serverIp:j.data.serverIp || null, keyUnreadable:!!j.data.keyUnreadable, canStoreKey:j.data.canStoreKey !== false } });
    }catch(e){ /* در قطعی شبکه، زمان آخرین بررسی موفق تغییر نمی‌کند */ }
    return State.get().connection;
  }
  async function restore(){
    try{
      const raw = sessionStorage.getItem(SESS_KEY); if(!raw) return false;
      const sv = JSON.parse(raw);
      if(!sv.token || !(sv.expiresAt > Date.now())){ clearSession(); return false; }
      sessionToken = sv.token; State.set({ account: { loggedIn:true, phone:sv.phone || null } });
      await checkConnection(); return State.get().account.loggedIn;
    }catch(e){ clearSession(); return false; }
  }

  async function getMarketList(){
    const res = await get("/api/market");
    if(res.meta && res.meta.stale){
      if(!Api._staleShown){ Api._staleShown = true; Toast.info("قیمت‌ها قدیمی‌اند", "صرافی موقتاً درخواست را رد کرد؛ آخرین قیمت دریافت‌شده نمایش داده می‌شود: " + Utils.timeAgo(res.fetchedAt)); }
    }else Api._staleShown = false;
    const usdt = res.data.find(c => c.id === "usdt");
    Utils.setUsdtRate(usdt ? usdt.price : null);
    return res;
  }
  async function getCoin(id){
    const res = await getMarketList();
    return { ...res, data: res.data.find(c => c.id === id) || null };
  }
  const getCoinHistory   = (id, range) => get(`/api/history/${encodeURIComponent(id)}?range=${range}`);
  const getSparklines    = (ids) => get(`/api/sparklines?ids=${ids.join(",")}`);
  const getOrderbook     = (id) => get(`/api/orderbook/${encodeURIComponent(id)}`);
  const getPortfolioSummary = () => get("/api/portfolio");
  const getPortfolioHistory = (range) => get(`/api/portfolio/history?range=${range}`);
  const getWalletAssets  = () => get("/api/wallets");
  const getOpenOrders    = () => get("/api/orders/open");
  const getProfile       = () => get("/api/profile");

  async function getTransactions(filters = {}){
    const res = await get("/api/orders/history");
    const rows = res.data.filter(t =>
      (!filters.type   || filters.type   === "all" || t.type   === filters.type) &&
      (!filters.coin   || filters.coin   === "all" || t.coin   === filters.coin) &&
      (!filters.status || filters.status === "all" || t.status === filters.status));
    return { ...res, data: rows };
  }

  // --- سفارش‌گذاری (همه‌ی اعتبارسنجی و تصمیم‌ها سمت سرور است) ---
  const getTradeConfig = () => get("/api/trade/config");
  const previewOrder   = (order) => request("/api/trade/preview", { method:"POST", body:{ order } }).then(j => j.data);
  const submitOrder    = (order, clientOrderId, confirmToken) =>
    request("/api/trade/submit", { method:"POST", body:{ order, clientOrderId, confirmToken } }).then(j => j.data);
  const getOrderStatus = (id) => request("/api/trade/status", { method:"POST", body:{ id } }).then(j => j.data);

  // --- هوش مصنوعی معاملاتی (همه‌ی منطق و ریسک سمت سرور) ---
  const aiGet  = (path) => request("/api/trading" + path).then(j => j.data);
  const aiCall = (method, path, body) => request("/api/trading" + path, { method, body: body === undefined ? {} : body }).then(j => j.data);

  const api = { aiGet, aiCall, authPost, setSession, restore, connect, disconnect, disconnectExchange, rubikaStatus, rubikaStart, rubikaDisconnect, checkConnection, getMarketList, getCoin, getCoinHistory, getSparklines, getOrderbook,
    getPortfolioSummary, getPortfolioHistory, getWalletAssets, getOpenOrders, getProfile, getTransactions,
    getTradeConfig, previewOrder, submitOrder, getOrderStatus };
  return api;
})();

// -------------------------------------------------------------------
// این بخش مسئول ثبت‌نام/ورود با شماره موبایل ایرانی است — کاملاً
// مجزا از اتصال به صرافی (که در api.js مدیریت می‌شود). در نسخه واقعی
// باید با یک سرویس پیامکی و بک‌اند احراز هویت واقعی جایگزین شود؛

const AuthFlow = {
  phone: null,
  otpVerified: false,
  otpToken: null,       // اثبات موقت تأیید شماره (فقط در حافظه)
  hasAccount: null,     // آیا برای این شماره قبلاً حساب ساخته شده؟
  resetAllowed: false,
  resendAfterSec: 60,
  otpLength: 6,
  intent: null,         // "login" | "register" — فقط برای متن‌ها؛ تصمیم واقعی را سرور می‌گیرد (hasAccount)
};

// ورود و ثبت‌نام واقعی: همه‌ی کارها (ارسال پیامک، بررسی کد، رمز) سمت سرور انجام می‌شود.
const AppAuth = (() => {
  function isValidIranianPhone(phone){
    return /^09\d{9}$/.test((phone || "").trim());
  }
  const toEn = (v) => String(v || "").replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 0x06F0)).replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x0660)).trim();
  const fail = (code, message) => { const err = new Error(message); err.code = code; return err; };

  async function sendOtp(phone){
    phone = toEn(phone);
    if(!isValidIranianPhone(phone)) throw fail("INVALID_PHONE", "شماره موبایل باید با ۰۹ شروع شود و ۱۱ رقم باشد.");
    const r = await Api.authPost("/api/auth/otp/send", { phone });
    AuthFlow.phone = phone; AuthFlow.otpVerified = false; AuthFlow.otpToken = null; AuthFlow.hasAccount = null; AuthFlow.resetAllowed = false;
    AuthFlow.resendAfterSec = r.resendAfterSec || 60; AuthFlow.otpLength = r.length || 6;
    return { ok:true };
  }

  async function verifyOtp(code){
    code = toEn(code);
    if(!new RegExp("^\\d{" + AuthFlow.otpLength + "}$").test(code)) throw fail("INVALID_OTP", `کد تایید ${AuthFlow.otpLength} رقمی را به‌درستی وارد کنید.`);
    const r = await Api.authPost("/api/auth/otp/verify", { phone: AuthFlow.phone, code });
    AuthFlow.otpToken = r.otpToken; AuthFlow.hasAccount = !!r.hasAccount; AuthFlow.resetAllowed = !!r.resetAllowed; AuthFlow.otpVerified = true;
    return { ok:true };
  }

  function finish(session){
    Api.setSession(session);
    AuthFlow.otpToken = null; AuthFlow.otpVerified = false; // توکن یک‌بار مصرف بود
    return { ok:true };
  }
  async function createAccount(password){
    if(!password || password.length < 8) throw fail("WEAK_PASSWORD", "رمز عبور باید حداقل ۸ کاراکتر باشد.");
    return finish(await Api.authPost("/api/auth/register", { phone: AuthFlow.phone, otpToken: AuthFlow.otpToken, password }));
  }
  async function login(password){
    if(!password) throw fail("BAD_PASSWORD", "رمز عبور را وارد کنید.");
    return finish(await Api.authPost("/api/auth/login", { phone: AuthFlow.phone, otpToken: AuthFlow.otpToken, password }));
  }
  async function resetPassword(password){
    if(!password || password.length < 8) throw fail("WEAK_PASSWORD", "رمز عبور باید حداقل ۸ کاراکتر باشد.");
    return finish(await Api.authPost("/api/auth/reset", { phone: AuthFlow.phone, otpToken: AuthFlow.otpToken, password }));
  }

  function logout(){
    AuthFlow.phone = null; AuthFlow.otpVerified = false; AuthFlow.otpToken = null; AuthFlow.hasAccount = null;
    State.set({ account: { loggedIn:false, phone:null } });
  }

  return { isValidIranianPhone, sendOtp, verifyOtp, createAccount, login, resetPassword, logout };
})();

const Toast = (() => {
  let host = null;

  function ensureHost(){
    if(host) return host;
    host = Utils.el("div", { class:"toast-host" });
    document.body.appendChild(host);
    return host;
  }

  const ICONS = { success:"check", error:"alert", info:"info" };

  function show(type, title, desc = "", timeout = 4200){
    ensureHost();
    const node = Utils.el("div", { class:`toast ${type}` }, [
      Utils.el("div", { html: ic(ICONS[type] || "info") }),
      Utils.el("div", {}, [
        Utils.el("div", { style:"font-weight:700;margin-bottom:2px;" }, title),
        desc ? Utils.el("div", { class:"text-faint" }, desc) : null,
      ])
    ]);
    host.appendChild(node);
    setTimeout(() => {
      node.style.transition = "opacity .2s ease, transform .2s ease";
      node.style.opacity = "0";
      node.style.transform = "translateY(6px)";
      setTimeout(() => node.remove(), 200);
    }, timeout);
  }

  return {
    success:(t,d) => show("success", t, d),
    error:(t,d) => show("error", t, d),
    info:(t,d) => show("info", t, d),
  };
})();

// کمک‌تابع‌های رسم نمودار (بر پایه Chart.js)
// ===================================================================

const Charts = (() => {
  const instances = new Map();

  function cssVar(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function destroy(key){
    if(instances.has(key)){
      instances.get(key).destroy();
      instances.delete(key);
    }
  }

  function lineChart(key, canvas, points, { color, currency = "تومان", fill = true, minimal = false } = {}){
    if(!canvas || typeof Chart === "undefined"){ destroy(key); return null; }
    // اگر نمودار با همین کلید روی همین بوم هست، فقط داده‌ها را نرم به‌روز کن
    const existing = instances.get(key);
    if(existing && existing.canvas === canvas){
      existing.data.labels = points.map(p => p.t);
      existing.data.datasets[0].data = points.map(p => p.v);
      existing.update();
      return existing;
    }
    destroy(key);
    const accent = color || cssVar("--accent") || "#8ba6ff";
    const grid = cssVar("--border-soft") || "#1c1c1c";
    const textFaint = cssVar("--text-faint") || "#6b6b6b";

    const ctx = canvas.getContext("2d");
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.clientHeight || 220);
    gradient.addColorStop(0, accent + "26");
    gradient.addColorStop(0.6, accent + "0a");
    gradient.addColorStop(1, accent + "00");

    const chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: points.map(p => p.t),
        datasets: [{
          data: points.map(p => p.v),
          borderColor: accent,
          backgroundColor: (fill && !minimal) ? gradient : "transparent",
          borderWidth: 2.5,
          borderCapStyle: "round",
          pointRadius: (ctx) => ctx.dataIndex === points.length - 1 ? 4 : 0,
          pointBackgroundColor: accent,
          pointBorderColor: "#fff",
          pointBorderWidth: 1.5,
          pointHoverRadius: 5,
          pointHoverBackgroundColor: accent,
          pointHoverBorderColor: "#fff",
          tension: 0.35,
          fill,
        }]
      },
      options: {
        responsive:true,
        maintainAspectRatio:false,
        interaction:{ mode:"index", intersect:false, axis:"x" },
        animation:{ duration:1050, easing:"easeOutQuart", delay:(context) => context.type === "data" ? Math.min(context.dataIndex * 42, 720) : 0 },
        transitions:{ active:{ animation:{ duration:180 } }, resize:{ animation:{ duration:250 } } },
        plugins:{
          legend:{ display:false },
          tooltip:{
            rtl:true,
            backgroundColor: cssVar("--surface") || "#121212",
            borderColor: accent,
            borderWidth:1,
            titleColor: textFaint,
            bodyColor: cssVar("--text") || "#f4f7fb",
            caretPadding:8,
            cornerRadius:12,
            boxPadding:4,
            titleFont:{ family:"Vazirmatn", size:11 },
            bodyFont:{ family:"Vazirmatn", size:12, weight:"700" },
            padding:10,
            displayColors:false,
            callbacks:{
              title:(items) => Utils.formatDateTime(items[0].label),
              label:(item) => Utils.formatPrice(item.raw, currency),
            }
          }
        },
        scales:{
          x:{ display:false },
          y:{
            display:!minimal,
            position:"right",
            grid:{ color: grid, drawTicks:false },
            border:{ display:false },
            ticks:{
              color: textFaint,
              font:{ family:"Vazirmatn", size:10 },
              maxTicksLimit:4,
              callback:(v) => Utils.formatNumber(v, { compact:true }),
            }
          }
        },
        elements:{ line:{ capBezierPoints:true } }
      }
    });
    instances.set(key, chart);
    return chart;
  }


  // ---------------------------------------------------------------
  // نمودار کندل‌استیک (بدون افزونه‌ی بیرونی؛ روی Chart.js رسم می‌شود)
  // ورودی: یا نقطه‌های {t,o,h,l,c} (کندل واقعی از سرور) یا نقطه‌های قیمتی {t,v}
  // که در این حالت به کندل تبدیل می‌شوند.
  // ---------------------------------------------------------------
  const CANDLE_UP = "#8ba6ff", CANDLE_DOWN = "#e5534b";

  function toCandles(points, target = 48){
    if(!points || !points.length) return [];
    if(points[0].o !== undefined && points[0].c !== undefined){
      return points.map(p => ({ t:p.t, o:+p.o, h:+p.h, l:+p.l, c:+p.c }));
    }
    const n = points.length;
    const size = Math.max(2, Math.ceil(n / target));
    const out = [];
    for(let i = 0; i < n; i += size){
      const chunk = points.slice(i, i + size);
      const vals = chunk.map(x => +x.v);
      const o = out.length ? out[out.length - 1].c : vals[0];
      const c = vals[vals.length - 1];
      out.push({ t:chunk[chunk.length - 1].t, o, c, h:Math.max(o, ...vals), l:Math.min(o, ...vals) });
    }
    return out;
  }

  function candleChart(key, canvas, points, { currency = "" } = {}){
    destroy(key);
    if(!canvas || typeof Chart === "undefined") return null;
    const candles = toCandles(points);
    if(candles.length < 2) return null;

    const grid = cssVar("--border-soft") || "#1c1c1c";
    const textFaint = cssVar("--text-faint") || "#6b6b6b";
    const reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    const lo = Math.min(...candles.map(x => x.l)), hi = Math.max(...candles.map(x => x.h));
    const pad = (hi - lo || hi * 0.01 || 1) * 0.08;
    const last = candles[candles.length - 1];
    const fmt = (v) => Utils.formatPrice(v, currency).trim();

    const plugin = {
      id: "qCandles",
      afterInit(chart){ chart.$p = reduced ? 1 : 0; },
      afterDatasetsDraw(chart){
        const { ctx, chartArea, scales } = chart;
        const x = scales.x, y = scales.y;
        const prog = chart.$p == null ? 1 : chart.$p;
        const slot = chartArea.width / candles.length;
        const w = Math.max(2, Math.min(14, slot * 0.62));
        const shown = Math.ceil(candles.length * prog);
        ctx.save();
        ctx.beginPath(); ctx.rect(chartArea.left, chartArea.top - 4, chartArea.width, chartArea.height + 8); ctx.clip();

        // خط قیمت آخر
        const ly = y.getPixelForValue(last.c);
        ctx.setLineDash([4, 4]); ctx.lineWidth = 1; ctx.strokeStyle = (last.c >= last.o ? CANDLE_UP : CANDLE_DOWN) + "99";
        ctx.beginPath(); ctx.moveTo(chartArea.left, ly); ctx.lineTo(chartArea.right, ly); ctx.stroke(); ctx.setLineDash([]);

        // خط راهنمای کندل انتخاب‌شده
        const act = chart.tooltip && chart.tooltip.getActiveElements ? chart.tooltip.getActiveElements() : [];
        if(act.length){
          const ax = x.getPixelForValue(act[0].index);
          ctx.strokeStyle = textFaint + "66"; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(ax, chartArea.top); ctx.lineTo(ax, chartArea.bottom); ctx.stroke();
        }

        for(let i = 0; i < shown; i++){
          const k = candles[i], cx = x.getPixelForValue(i);
          const up = k.c >= k.o, col = up ? CANDLE_UP : CANDLE_DOWN;
          const yh = y.getPixelForValue(k.h), yl = y.getPixelForValue(k.l);
          const yo = y.getPixelForValue(k.o), yc = y.getPixelForValue(k.c);
          ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = Math.max(1, Math.min(2, w * 0.18)); ctx.lineCap = "round";
          ctx.beginPath(); ctx.moveTo(cx, yh); ctx.lineTo(cx, yl); ctx.stroke();
          const top = Math.min(yo, yc), h = Math.max(2, Math.abs(yo - yc));
          const r = Math.min(2.5, w / 3);
          ctx.beginPath();
          if(ctx.roundRect) ctx.roundRect(cx - w / 2, top, w, h, r); else ctx.rect(cx - w / 2, top, w, h);
          ctx.fill();
        }
        ctx.restore();
      },
    };

    const chart = new Chart(canvas.getContext("2d"), {
      type: "line",
      data: {
        labels: candles.map(k => k.t),
        datasets: [{ data: candles.map(k => k.c), borderColor: "transparent", backgroundColor: "transparent", borderWidth: 0, pointRadius: 0, pointHoverRadius: 0, pointHitRadius: 12 }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false, axis: "x" },
        layout: { padding: { left: 4, right: 2 } },
        animation: reduced ? false : {
          duration: 900, easing: "easeOutQuart",
          onProgress: (a) => { chart.$p = 1 - Math.pow(1 - Math.min(1, a.currentStep / a.numSteps), 3); },
          onComplete: () => { chart.$p = 1; },
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            rtl: true,
            backgroundColor: cssVar("--surface") || "#121212",
            borderColor: cssVar("--accent") || "#8ba6ff", borderWidth: 1,
            titleColor: textFaint, bodyColor: cssVar("--text") || "#f4f7fb",
            caretPadding: 8, cornerRadius: 12, boxPadding: 4, padding: 10, displayColors: false,
            titleFont: { family: "Vazirmatn", size: 11 }, bodyFont: { family: "Vazirmatn", size: 12, weight: "700" },
            callbacks: {
              title: (items) => Utils.formatDateTime(items[0].label),
              label: (item) => { const k = candles[item.dataIndex]; return ["باز: " + fmt(k.o), "بالا: " + fmt(k.h), "پایین: " + fmt(k.l), "بسته: " + fmt(k.c)]; },
            },
          },
        },
        scales: {
          x: { display: false, offset: true },
          y: {
            position: "right", min: lo - pad, max: hi + pad,
            grid: { color: grid, drawTicks: false }, border: { display: false },
            ticks: { color: textFaint, font: { family: "Vazirmatn", size: 10 }, maxTicksLimit: 5, callback: (v) => Utils.formatNumber(v, { compact: true }) },
          },
        },
      },
      plugins: [plugin],
    });
    instances.set(key, chart);
    return chart;
  }

  function sparkline(canvas, points, positive = true){
    if(!canvas || typeof Chart === "undefined") return null;
    const key = "spark_" + (canvas.dataset.key || Math.random());
    destroy(key);
    const color = positive ? (cssVar("--green") || "#8ba6ff") : (cssVar("--red") || "#e5534b");
    const sCtx = canvas.getContext("2d");
    const sGrad = sCtx.createLinearGradient(0, 0, 0, canvas.clientHeight || 32);
    sGrad.addColorStop(0, color + "40");
    sGrad.addColorStop(1, color + "00");
    const chart = new Chart(sCtx, {
      type:"line",
      data:{
        labels:points.map((_,i) => i),
        datasets:[{ data:points.map(p => p.v), borderColor:color, backgroundColor:sGrad, fill:true, borderWidth:2, pointRadius:0, tension:0.4 }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{enabled:false} },
        scales:{ x:{display:false}, y:{display:false} },
        elements:{ line:{ borderJoinStyle:"round" } }
      }
    });
    instances.set(key, chart);
    return chart;
  }

  return { lineChart, candleChart, toCandles, sparkline, destroy };
})();

const UI = (() => {

  function stateBox({ icon = "info", title, desc, actionLabel, onAction }){

    ]);

  function mockFlag(){
    return Utils.el("span", { class:"mock-flag" }, [
      Utils.el("span", { html: ic("info") }),
      "داده آزمایشی",
    ]);
  }

  function changeBadge(value){
    if(value === null || value === undefined) return Utils.el("span", { class:"badge badge-gray" }, "—");
    const positive = value >= 0;
    return Utils.el("span", { class:`badge ${positive ? "badge-green" : "badge-red"}` }, [
      Utils.el("span", { html: ic(positive ? "trendUp" : "trendDown") }),
      Utils.formatPercent(value),
    ]);
  }

  // تولید یک رنگ ثابت و متمایز برای هر نماد ارز (حس برند بیشتر نسبت به رنگ یکسان)
  function coinHue(symbol){
    const s = symbol || "?";
    let hash = 0;
    for(let i=0;i<s.length;i++) hash = (hash * 31 + s.charCodeAt(i)) % 360;
    return hash;
  }

  // لوگوی واقعی هر ارز: اول از پوشه‌ی خودِ سایت (img/coins/btc.png)، بعد از CDN؛
  // اگر هیچ‌کدام نبود، حروف اول نماد روی رنگ مخصوص همان ارز نشان داده می‌شود.
  const COIN_ICON_SOURCES = [
    (c) => `img/coins/${c}.png`,
    (c) => `https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/128/color/${c}.png`,
    (c) => `https://assets.coincap.io/assets/icons/${c}@2x.png`,
  ];
  const coinIconCache = new Map(); // نماد → نشانی لوگوی سالم، یا null اگر هیچ منبعی نداشت
  function coinBase(symbol){
    const s = String(symbol || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    return s.replace(/(irt|usdt|tmn)$/, "") || s;
  }

  function coinAvatar(symbol, size = 28, imageUrl){
    const letters = (symbol || "?").replace(/[^A-Za-z]/g,"").slice(0,3) || "?";
    const hue = coinHue(symbol);
    const bg = `linear-gradient(135deg, hsl(${hue} 72% 52%), hsl(${(hue+40)%360} 72% 42%))`;
    const glow = `0 3px 10px -2px hsl(${hue} 72% 45% / .55), inset 0 1px 0 #ffffff30`;
    const box = Utils.el("div", {
      class:"coin-ic",
      style:`width:${size}px;height:${size}px;font-size:${Math.round(size*0.36)}px;background:${bg};box-shadow:${glow};color:#ffffffe8;`,
    });
    const base = coinBase(symbol);
    const showLetters = () => { box.textContent = letters; };
    const cached = coinIconCache.get(base);
    if(!base || (cached === null && !imageUrl)){ showLetters(); return box; }

    const urls = imageUrl ? [imageUrl] : [];
    if(cached) urls.push(cached); else COIN_ICON_SOURCES.forEach(f => urls.push(f(base)));
    const img = document.createElement("img");
    img.className = "coin-img"; img.alt = ""; img.decoding = "async"; img.draggable = false;
    let i = 0;
    const next = () => {
      if(i >= urls.length){ if(!imageUrl) coinIconCache.set(base, null); img.remove(); showLetters(); return; }
      img.src = urls[i++];
    };
    img.onload = () => {
      if(!imageUrl) coinIconCache.set(base, img.currentSrc || img.src);
      box.style.background = "transparent"; box.style.boxShadow = "0 2px 8px -3px #0008";
    };
    img.onerror = next;
    box.appendChild(img);
    next();
    return box;
  }

  function statusBadge(status){
    const map = {
      "موفق": "badge-green", "در انتظار": "badge-amber", "ناموفق": "badge-red",
      "connected": "badge-green", "disconnected": "badge-gray", "checking": "badge-blue",
    };
    const labelMap = { connected:"متصل", disconnected:"قطع شده", checking:"در حال بررسی" };
    return Utils.el("span", { class:`badge ${map[status] || "badge-gray"}` }, [
      Utils.el("span", { class:"badge-dot" }),
      Utils.el("span", { class:"badge-label" }, labelMap[status] || status),
    ]);
  }

  // منوی کشویی سفارشی — جایگزین <select> بومی که در اندروید/iOS با
  // ظاهر سیستم‌عامل (نه تم برنامه) باز می‌شود.
  // options: [{value, label}] | onChange(value) | title: عنوان بالای ورق کشویی
  function dropdown({ value, options, onChange, title }){
    let current = value;

    const labelOf = (v) => {
      const opt = options.find(o => String(o.value) === String(v));
      return opt ? opt.label : "";
    };

    const triggerLabel = Utils.el("span", {}, labelOf(current));
    const trigger = Utils.el("button", { type:"button", class:"dropdown-trigger" }, [
      triggerLabel,
      Utils.el("span", { class:"chev", html: ic("chevronDown") }),
    ]);

    function openSheet(){
      trigger.classList.add("open");
      const backdrop = Utils.el("div", {
        class:"dropdown-sheet-backdrop",
        onClick:(e) => { if(e.target === backdrop) close(); },
      });
      const sheet = Utils.el("div", { class:"dropdown-sheet" });
      if(title) sheet.appendChild(Utils.el("div", { class:"dropdown-sheet-title" }, title));
      options.forEach(opt => {
        const isSel = String(opt.value) === String(current);
        const row = Utils.el("div", { class:`dropdown-option ${isSel ? "selected" : ""}` }, [
          Utils.el("span", {}, opt.label),
          Utils.el("span", { class:"radio" }),
        ]);
        row.addEventListener("click", () => {
          current = opt.value;
          triggerLabel.textContent = opt.label;
          close();
          onChange(opt.value);
        });
        sheet.appendChild(row);
      });
      backdrop.appendChild(sheet);
      document.body.appendChild(backdrop);
      function close(){ trigger.classList.remove("open"); backdrop.remove(); }
    }

    trigger.addEventListener("click", openSheet);
    return trigger;
  }

  return { skeleton, skeletonCard, skeletonRow, skeletonRows, skeletonChart, skeletonHead, stateBox, empty, errorState, loading, mockFlag, changeBadge, coinAvatar, statusBadge, dropdown };
})();

const Router = (() => {
  const routes = [
    { pattern: /^welcome$/,        name:"welcome",       page:() => PageWelcome },
    { pattern: /^auth-phone$/,     name:"auth-phone",    page:() => PageAuthPhone },
    { pattern: /^auth-otp$/,       name:"auth-otp",      page:() => PageAuthOtp },
    { pattern: /^auth-password$/,  name:"auth-password", page:() => PageAuthPassword },
    { pattern: /^connect$/,        name:"connect",  page:() => PageConnect },
    { pattern: /^dashboard$/,      name:"dashboard",page:() => PageDashboard },
    { pattern: /^market$/,         name:"market",   page:() => PageMarket },
    { pattern: /^coin\/([\w-]+)$/, name:"coin",     page:() => PageCoin },
    { pattern: /^trade(?:\/([\w-]+))?$/, name:"trade", page:() => PageTrade },
    { pattern: /^wallet$/,         name:"wallet",   page:() => PageWallet },
    { pattern: /^history$/,        name:"history",  page:() => PageHistory },
    { pattern: /^profile$/,        name:"profile",  page:() => PageProfile },
    { pattern: /^ai$/,             name:"ai",       page:() => PageAI },
    { pattern: /^settings$/,       name:"settings", page:() => PageSettings },
  ];

  function current(){
    const hash = (location.hash || "#welcome").replace(/^#\/?/, "");
    for(const r of routes){
      const m = hash.match(r.pattern);
      if(m) return { name:r.name, page:r.page(), params:{ id: m[1] } };
    }
    return { name:"dashboard", page:PageDashboard, params:{} };
  }

  function go(path){
    const target = "#/" + path.replace(/^#\/?/, "");
    // اگر هش همان است، مرورگر رویداد hashchange نمی‌دهد؛ مثلاً صفحه‌ی اتصال روی مسیر dashboard نمایش داده می‌شود و بعد از اتصال موفق باید دوباره رندر شود
    if(location.hash === target) window.dispatchEvent(new HashChangeEvent("hashchange"));
    else location.hash = target;
  }

  function start(onChange){
    window.addEventListener("hashchange", () => onChange(current()));
    onChange(current());
  }

  return { go, current, start };
})();

function heartOrb(){

  const svgNS = "http://www.w3.org/2000/svg";
  const lines = [];
  for(let a = 0; a < 360; a += 30){

    lines.push(`<line x1="${(120 + Math.cos(rad) * r1).toFixed(1)}" y1="${(120 + Math.sin(rad) * r1).toFixed(1)}" x2="${(120 + Math.cos(rad) * r2).toFixed(1)}" y2="${(120 + Math.sin(rad) * r2).toFixed(1)}"/><circle cx="${(120 + Math.cos(rad) * r2).toFixed(1)}" cy="${(120 + Math.sin(rad) * r2).toFixed(1)}" r="2.6"/>`);
  }
  const web = E("div", { class:"hv-web", html:`<svg viewBox="0 0 240 240" xmlns="${svgNS}" fill="none" stroke="currentColor" stroke-width="1">${lines.join("")}<circle cx="120" cy="120" r="96" stroke-dasharray="2 5"/><circle cx="120" cy="120" r="112" stroke-opacity=".5"/></svg>` });
  return E("div", { class:"q-heart", "aria-hidden":"true" }, [

    E("div", { class:"hv-sphere" }, [E("i", { class:"hv-shine" }), E("img", { src:"img/ai.png", alt:"" })]),
  ]);

          E("i", { class:"wl-sep" }),

        ]),
      ]),
      heartOrb(),
      E("div", { class:"wl-actions" }, [
        E("button", { class:"btn btn-primary btn-block wl-btn", onClick: go("login") }, "ورود"),
        E("button", { class:"btn btn-outline btn-block wl-btn", onClick: go("register") }, "ثبت نام"),
        E("div", { class:"q-tagline fa", style:"margin-top:6px;color:var(--q-blue2);" }, "آینده مالی، با هوش مصنوعی"),
      ]),
    );
    const fit = () => PageWelcome.fitBrand(container.querySelector(".wl-brand"));
    requestAnimationFrame(fit);
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  },
  // هم‌قد و هم‌عرض کردن Qairo و کایــرو بر اساس ابعاد واقعی حروف (نه جعبه متن)
  fitBrand(root){
    if(!root || !root.isConnected) return;
    const bL = root.querySelector(".wl-b-l b"), bR = root.querySelector(".wl-b-r .fa"), sep = root.querySelector(".wl-sep");
    if(!bL || !bR) return;
    // ریست
    bL.style.letterSpacing = ""; bL.style.marginRight = ""; bR.style.transform = ""; sep.style.transform = "";
    const ctx = document.createElement("canvas").getContext("2d");
    const fs = parseFloat(getComputedStyle(bL).fontSize) || 30;
    const ls0 = fs * 0.12;
    const ink = (el, text, ls) => {
      const cs = getComputedStyle(el);
      ctx.font = cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
      if("letterSpacing" in ctx) ctx.letterSpacing = (ls||0) + "px";
      const m = ctx.measureText(text);
      return { w:m.actualBoundingBoxLeft + m.actualBoundingBoxRight, asc:m.actualBoundingBoxAscent, desc:m.actualBoundingBoxDescent };
    };
    const base = (el) => {   // محل خط پایه (baseline) نسبت به بالای root
      const mk = document.createElement("span");
      mk.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline;";
      el.appendChild(mk);
      const y = mk.getBoundingClientRect().top - root.getBoundingClientRect().top;
      mk.remove();
      return y;
    };
    const L = ink(bL, "Qairo", ls0), R = ink(bR, bR.textContent, 0);
    const hL = L.asc + L.desc, hR = R.asc + R.desc;
    if(!(hL>0 && hR>0 && L.w>0 && R.w>0)) return;
    const s = hL / hR;                 // هم‌قد شدن (نسبت یکسان در طول و ارتفاع)
    const wR = R.w * s;
    const W = Math.max(L.w, wR);       // عرض هدف: بلندترین
    // Qairo: اگر کوتاه‌تر بود فاصله حروف را زیاد کن
    const ls = ls0 + (W - L.w) / 4;
    bL.style.letterSpacing = ls + "px"; bL.style.marginRight = (-ls) + "px";
    // کایرو: اگر کوتاه‌تر بود افقی بکش
    const sx = s * (W / wR);
    const baseL = base(bL);
    const baseR = base(bR);
    const cL = baseL + (L.desc - L.asc) / 2;
    const cR = baseR + (R.desc - R.asc) * s / 2;
    const bRrect = bR.getBoundingClientRect(), rootTop = root.getBoundingClientRect().top;
    bR.style.transformOrigin = "0px " + (baseR - (bRrect.top - rootTop)) + "px";
    bR.style.transform = "translateY(" + (cL - cR) + "px) scale(" + sx + "," + s + ")";
    // خط وسط: هم‌قد و هم‌مرکز با حروف
    sep.style.height = hL + "px";
    const sr = sep.getBoundingClientRect();
    sep.style.transform = "translateY(" + (cL - ((sr.top - rootTop) + sr.height / 2)) + "px)";
  }
};

قابل اجرا در مرجع صالح رسیدگی خواهد شد.", "۱۷-۳. هیچ‌یک از مفاد این قرارداد به معنای اسقاط حقوق قانونی آمره طرفین نیست."]}, {"t": "تأیید نهایی", "p": ["کاربر با پذیرش این قرارداد تأیید می‌کند که:", "۱. شرایط استفاده از QAIRO را مطالعه کرده است.", "۲. از امکان انجام معاملات خودکار بدون تأیید جداگانه هر سفارش آگاه است.", "۳. می‌داند هیچ سودی تضمین نشده و احتمال زیان مالی وجود دارد.", "۴. از نحوه تعیین سرمایه اختصاص‌یافته به هوش مصنوعی آگاه است.", "۵. می‌داند سهم QAIRO معادل ۵ درصد سود خالص مثبت و تحقق‌یافته معاملات هوش مصنوعی در هر روز است.", "۶. می‌داند معاملات دستی او مشمول سهم QAIRO نیستند.", "۷. از محدودیت‌های مجوز برداشت و استفاده از آن برای دریافت سهم خدمات QAIRO آگاه است.", "۸. می‌داند توقف QAIRO لزوماً سفارش‌های باز را لغو نمی‌کند.", "۹. سیاست حریم خصوصی را مطالعه کرده است.", "۱۰. می‌داند حقوق قانونی غیرقابل اسقاط او محفوظ است."]}], "foot": ["تاریخ و ساعت پذیرش: ثبت‌شده در سامانه", "نسخه قرارداد: ثبت‌شده در سامانه", "شناسه پذیرش: ثبت‌شده در سامانه"]};
  // متن «سیاست حریم خصوصی» — اگر پر شود، دکمه‌ی آن در پایین صفحه نمایش داده می‌شود. همان ساختار بالا.
  const PRIVACY = null;

  const FA = "۰۱۲۳۴۵۶۷۸۹";
  const toFa = (n) => String(n).replace(/\d/g, d => FA[d]);
  const E = (...a) => Utils.el(...a);

  let sheet = null, keyHandler = null, prevOverflow = "";

  function close(){
    if(!sheet) return;
    sheet.remove(); sheet = null;
    document.body.style.overflow = prevOverflow;
    if(keyHandler){ document.removeEventListener("keydown", keyHandler); keyHandler = null; }
  }

  function para(x){
    if(typeof x !== "string") return E("p", { class:"warn" }, x.warn);
    const m = x.match(/^([۰-۹]+(?:-[۰-۹]+)?\.)\s*([\s\S]*)$/);
    return m ? E("p", {}, [E("span", { class:"q-legal-cn" }, m[1]), m[2]]) : E("p", {}, x);
  }
  function metaBox(lines){
    const box = E("div", { class:"q-legal-meta" });
    lines.forEach(l => {
      const i = l.indexOf(":");
      box.appendChild(i > 0 ? E("div", {}, [E("span", {}, l.slice(0, i)), E("b", {}, l.slice(i + 1).trim())]) : E("div", {}, l));
    });
    return box;
  }
  function renderDoc(doc){
    const wrap = E("div", { class:"q-legal-doc" });
    wrap.appendChild(E("h1", { class:"q-legal-title" }, doc.title));
    if(doc.sub) wrap.appendChild(E("div", { class:"q-legal-sub" }, doc.sub));
    if(doc.meta) wrap.appendChild(metaBox(doc.meta));
    (doc.lead || []).forEach(t => wrap.appendChild(E("p", { class:"q-legal-lead" }, t)));
    (doc.sections || []).forEach((sec, i) => {
      const box = E("section", { class:"q-legal-sec" }, [
        E("div", { class:"q-legal-sec-h" }, [E("span", { class:"q-legal-num" }, toFa(i + 1)), E("h3", {}, sec.t)]),
      ]);
      (sec.p || []).forEach(x => box.appendChild(para(x)));
      wrap.appendChild(box);
    });
    if(doc.final) wrap.appendChild(E("div", { class:"q-legal-final" }, [E("h3", {}, doc.final.t), E("p", {}, doc.final.p)]));
    if(doc.foot) wrap.appendChild(metaBox(doc.foot));
    return wrap;
  }

  function open(view){
    if(sheet) return;
    let cur = view || "summary";
    prevOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";

    const titleEl = E("h2", {});
    const scroll = E("div", { class:"q-legal-scroll" });
    const bar = E("div", { class:"q-legal-bar" });
    sheet = E("div", { class:"q-legal", role:"dialog", "aria-modal":"true", "aria-label":"قوانین و مقررات QAIRO" }, [
      E("div", { class:"q-legal-top" }, [E("button", { class:"q-legal-x", type:"button", "aria-label":"بستن", onClick:close }, "✕"), titleEl]),
      scroll, bar,
    ]);

    function paint(){
      scroll.innerHTML = ""; bar.innerHTML = "";
      const doc = cur === "full" ? FULL : cur === "privacy" ? PRIVACY : SUMMARY;
      titleEl.textContent = cur === "full" ? "قرارداد کامل" : cur === "privacy" ? "سیاست حریم خصوصی" : "قوانین و مقررات";
      const holder = E("div", { class:"q-legal-doc" });
      if(cur === "summary"){
        holder.appendChild(E("button", { class:"btn btn-outline q-legal-switch", type:"button", onClick:() => { cur = "full"; paint(); } }, "قرارداد کامل"));
      } else {
        holder.appendChild(E("button", { class:"btn btn-outline q-legal-switch", type:"button", onClick:() => { cur = "summary"; paint(); } }, "بازگشت به خلاصه توافق‌نامه"));
      }
      scroll.appendChild(holder);
      if(doc) holder.appendChild(renderDoc(doc));
      else holder.appendChild(E("div", { class:"q-legal-empty" }, "این متن به‌زودی در همین‌جا قرار می‌گیرد."));
      scroll.scrollTop = 0;

      bar.appendChild(E("button", { class:"btn btn-primary", type:"button", onClick:close }, "می‌پذیرم و ادامه می‌دهم"));
      bar.appendChild(E("button", { class:"btn btn-ghost", type:"button", onClick:close }, "انصراف"));
      if(PRIVACY && cur !== "privacy") bar.appendChild(E("button", { class:"btn btn-outline btn-priv", type:"button", onClick:() => { cur = "privacy"; paint(); } }, "مشاهده سیاست حریم خصوصی"));
    }
    paint();
    document.body.appendChild(sheet);
    keyHandler = (e) => { if(e.key === "Escape") close(); };
    document.addEventListener("keydown", keyHandler);
  }

  return { open, close };
})();

const PageAuthOtp = {
  mount(container){
    let status = "idle";
    let errorMsg = "";
    let countdown = AuthFlow.resendAfterSec || 60;
    let timer = null;
    const card = authShellStart(container);

    function startCountdown(){
      clearInterval(timer);
      countdown = AuthFlow.resendAfterSec || 60;
      timer = setInterval(() => {
        countdown -= 1;
        const el = card.querySelector("#resendBtn");
        if(el) el.textContent = countdown > 0 ? `ارسال مجدد (${countdown})` : "ارسال مجدد کد";
        if(countdown <= 0) clearInterval(timer);
      }, 1000);
    }

    function paint(){
      while(card.children.length > 1) card.removeChild(card.lastChild);

      card.appendChild(Utils.el("h1", { class:"connect-title" }, "کد تایید را وارد کنید"));
      card.appendChild(Utils.el("p", { class:"connect-desc" },
        `کد ${AuthFlow.otpLength || 6} رقمی ارسال‌شده به شماره ${AuthFlow.phone || ""} را وارد کنید. کد تا ۲ دقیقه معتبر است.`
      ));

      const field = Utils.el("div", { class:"field" }, [
        Utils.el("label", { for:"otpInput" }, "کد تایید"),
        Utils.el("div", { class:"input-wrap" }, [
          Utils.el("input", {
            id:"otpInput", class:"input", type:"text", inputmode:"numeric",
            placeholder:"— — — — — —", maxlength:"6", autocomplete:"one-time-code",
            style:"direction:ltr;text-align:center;letter-spacing:8px;font-size:18px;font-weight:700;",
          }),
        ]),
        status === "error" ? Utils.el("span", { class:"field-error" }, [Utils.el("span",{html:ic("alert")}), errorMsg]) : null,
      ]);
      card.appendChild(field);

      const btn = Utils.el("button", {
        class:"btn btn-primary btn-block", style:"margin-top:16px;height:44px;",
        disabled: status === "loading" ? "true" : false,
        onClick: handleVerify,
      }, status === "loading" ? [Utils.el("span",{class:"spin"}), "در حال بررسی…"] : "تایید کد");
      card.appendChild(btn);

      card.appendChild(Utils.el("div", { style:"display:flex;justify-content:space-between;margin-top:16px;" }, [
        Utils.el("button", { class:"btn btn-ghost btn-sm", onClick: () => { clearInterval(timer); Router.go("auth-phone"); } }, "تغییر شماره"),
        Utils.el("button", {
          id:"resendBtn", class:"btn btn-outline btn-sm",
          disabled: countdown > 0 ? "true" : false,
          onClick: handleResend,
        }, countdown > 0 ? `ارسال مجدد (${countdown})` : "ارسال مجدد کد"),
      ]));

      startCountdown();
    }

    async function handleVerify(){
      const input = card.querySelector("#otpInput");
      const code = input.value.trim();
      status = "loading"; errorMsg = ""; paint();
      try{
        await AppAuth.verifyOtp(code);
        clearInterval(timer);
        Router.go("auth-password");
      }catch(e){
        status = "error";
        errorMsg = Utils.friendlyError(e, "کد وارد شده نامعتبر است.");
        paint();
      }
    }

    async function handleResend(){
      try{
        await AppAuth.sendOtp(AuthFlow.phone);
        Toast.info("کد دوباره ارسال شد", "");
        startCountdown();
      }catch(e){ Toast.error("ارسال مجدد انجام نشد", Utils.friendlyError(e)); }
    }

    paint();
  }
};
