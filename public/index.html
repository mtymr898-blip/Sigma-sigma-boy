const PageMarket = {
  async mount(container){
    container.innerHTML = "";
    let allCoins = [];
    let query = "";
    let marketFilter = "all";
    let sortKey = "volume24h";
    let sortDir = "desc";
    let pageSize = 6;
    let visibleCount = pageSize;
    let loadError = false;

    container.appendChild(Utils.el("div", { class:"page-head" }, [
      Utils.el("div", {}, [
        Utils.el("h1", {}, "بازار ارزهای دیجیتال"),
        Utils.el("div", { class:"sub" }, "قیمت‌های لحظه‌ای بازار تومانی والکس"),
      ]),
      Utils.el("button", { class:"btn btn-ghost btn-sm", id:"mkRefresh", html:"" }, [Utils.el("span",{html:ic("refresh")}), " به‌روزرسانی"]),
    ]));

    const toolbar = Utils.el("div", { class:"market-toolbar" });
    container.appendChild(toolbar);

    const card = Utils.el("div", { class:"card card-pad" });
    container.appendChild(card);
    card.appendChild(UI.skeletonRows(7));

    container.querySelector("#mkRefresh").addEventListener("click", load);

    function buildToolbar(){
      toolbar.innerHTML = "";
      toolbar.appendChild(Utils.el("div", { class:"search-wrap" }, [
        Utils.el("span", { html: ic("search") }),
        Utils.el("input", {
          class:"input", placeholder:"جست‌وجوی نام یا نماد ارز…",
          value:query,
          onInput: Utils.debounce((e) => { query = e.target.value; visibleCount = pageSize; renderTable(); }, 200),
        }),
      ]));
      toolbar.appendChild(Utils.el("div", { style:"display:flex;gap:6px;flex-wrap:wrap;" }, [
        chip("all","همه بازارها"), chip("IRT","بازار تومانی"),
      ]));
    }

    function chip(val, label){
      return Utils.el("button", {
        class:`chip ${marketFilter===val?"active":""}`,
        onClick: () => { marketFilter = val; visibleCount = pageSize; buildToolbar(); renderTable(); }
      }, label);
    }

    async function load(){
      card.innerHTML = "";
      card.appendChild(UI.skeletonRows(7));
      try{
        const res = await Api.getMarketList();
        allCoins = res.data.map(c => ({ ...c, _spark: null }));
        loadError = false;
        buildToolbar();
        renderTable(false);
        Api.getSparklines(allCoins.map(c => c.id)).then(sp => {
          allCoins.forEach(c => { c._spark = (sp.data && sp.data[c.id]) || null; });
          renderTable(false);
        }).catch(() => {});
      }catch(e){
        loadError = true;
        card.innerHTML = "";
        card.appendChild(UI.errorState("دریافت بازار ناموفق بود", e.message, load));
      }
    }

    function applyFilters(){
      let rows = allCoins.filter(c => {
        if(marketFilter !== "all" && !c.symbol.includes(marketFilter)) return false;
        if(query && !(c.name.includes(query) || c.symbol.toLowerCase().includes(query.toLowerCase()))) return false;
        return true;
      });
      rows.sort((a,b) => {
        const d = sortDir === "asc" ? 1 : -1;
        return (a[sortKey] - b[sortKey]) * d;
      });
      return rows;
    }

    function setSort(key){
      if(sortKey === key) sortDir = sortDir === "asc" ? "desc" : "asc";
      else { sortKey = key; sortDir = "desc"; }
      renderTable();
    }

    function renderTable(isMock){
      card.innerHTML = "";
      const rows = applyFilters();

      card.appendChild(Utils.el("div", { class:"card-head" }, [
        Utils.el("div", { class:"card-title" }, [
          `${rows.length} ارز `,
          isMock ? UI.mockFlag() : null,
        ]),
      ]));

      if(rows.length === 0){
        card.appendChild(UI.empty("نتیجه‌ای یافت نشد", "عبارت جست‌وجو یا فیلتر انتخاب‌شده را تغییر دهید."));
        return;
      }

      const th = (label, key, opt) => Utils.el("th", {
        class: `${key ? "sortable" : ""} ${opt ? "col-opt" : ""}`.trim(),
        onClick: key ? () => setSort(key) : null,
      }, [label, key && sortKey===key ? Utils.el("span", { html: ic(sortDir==="asc"?"chevronDown":"chevronDown") }) : ""]);

      const wrap = Utils.el("div", { class:"table-wrap" });
      const table = Utils.el("table", { class:"tbl" }, [
        Utils.el("thead", {}, Utils.el("tr", {}, [
          th("نام ارز"), th("نماد", null, true),
          th("قیمت فعلی","price"), th("تغییر ۲۴ساعته","change24h"),
          th("بالاترین ۲۴ساعته", null, true), th("پایین‌ترین ۲۴ساعته", null, true),
          th("حجم معاملات","volume24h", true), th("روند"), th("", null, true),
        ])),
      ]);
      const tbody = Utils.el("tbody");
      rows.slice(0, visibleCount).forEach(c => {
        const tr = Utils.el("tr", { onClick: () => Router.go(`coin/${c.id}`) }, [
          Utils.el("td", {}, Utils.el("div", { class:"cell-asset" }, [UI.coinAvatar(c.symbol), Utils.el("span", {}, c.name)])),
          Utils.el("td", { class:"num text-dim col-opt" }, c.symbol),
          Utils.el("td", { class:"num" }, Utils.formatPrice(c.price, "")),
          Utils.el("td", {}, UI.changeBadge(c.change24h)),
          Utils.el("td", { class:"num text-dim col-opt" }, Utils.formatPrice(c.high24h, "")),
          Utils.el("td", { class:"num text-dim col-opt" }, Utils.formatPrice(c.low24h, "")),
          Utils.el("td", { class:"num text-dim col-opt" }, Utils.formatNumber(c.volume24h, { compact:true })),
          Utils.el("td", {}, Utils.el("canvas", { class:"sparkline", "data-key":c.id })),
          Utils.el("td", { class:"col-opt" }, Utils.el("button", { class:"btn btn-ghost btn-sm" }, "جزئیات")),
        ]);
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      card.appendChild(wrap);

      if(visibleCount < rows.length){
        card.appendChild(Utils.el("div", { style:"text-align:center;margin-top:14px;" },
          Utils.el("button", { class:"btn btn-outline btn-sm", onClick: () => { visibleCount += pageSize; renderTable(); } }, "نمایش موارد بیشتر")
        ));
      }

      requestAnimationFrame(() => {
        rows.slice(0, visibleCount).forEach(c => {
          const canvas = wrap.querySelector(`canvas[data-key="${c.id}"]`);
          if(canvas && c._spark) Charts.sparkline(canvas, c._spark, (c.change24h ?? 0) >= 0);
        });
      });
    }

    load();
  }
};

      headCard.appendChild(UI.errorState("دریافت اطلاعات ارز ناموفق بود", e.message, () => PageCoin.mount(container, params)));

          UI.coinAvatar(coin.symbol, 46),
          Utils.el("div", {}, [
            Utils.el("div", { style:"display:flex;align-items:center;gap:8px;" }, [
              Utils.el("h2", { style:"font-size:17px;" }, coin.name),
              isMock ? UI.mockFlag() : null,

          ]),
        ]),
        Utils.el("div", { style:"text-align:left;" }, [
          Utils.el("div", { class:"coin-price-row" }, [
            Utils.el("div", { class:"coin-price num" }, Utils.formatPrice(coin.price, "")),
            UI.changeBadge(coin.change24h),
          ]),
          Utils.el("div", { class:"text-faint", style:"font-size:11.5px;margin-top:4px;" },
            `آخرین به‌روزرسانی: ${Utils.timeAgo(coinFetchedAt)}`),
        ]),
      ]));
      headCard.appendChild(Utils.el("div", { class:"coin-stats-row" }, [
        stat("بالاترین ۲۴ساعته", Utils.formatPrice(coin.high24h, "")),
        stat("پایین‌ترین ۲۴ساعته", Utils.formatPrice(coin.low24h, "")),
        stat("حجم معاملات ۲۴ساعته", Utils.formatNumber(coin.volume24h, { compact:true })),
      ]));
    }

    function stat(label, value){
      return Utils.el("div", { class:"coin-stat" }, [
        Utils.el("div", { class:"lbl" }, label),
        Utils.el("div", { class:"val num" }, value),
      ]);
    }

    function renderChart(histRes, coin){
      chartCard.innerHTML = "";
      const points = histRes.data;

      chartCard.appendChild(Utils.el("div", { class:"coin-chart-controls" }, [
        Utils.el("div", { class:"card-title" }, [
          `نمودار قیمت `,
          histRes.isMock ? UI.mockFlag() : null,
        ]),
        Utils.el("div", { class:"range-tabs" }, ["7d","30d","90d"].map(r =>
          Utils.el("button", {
            class:`chip ${r===range?"active":""}`,
            onClick: async () => {
              range = r;
              const wrap = chartCard.querySelector(".chart-canvas-wrap");
              if(wrap) wrap.innerHTML = "";
              if(wrap) wrap.appendChild(UI.skeleton("100%","100%","border-radius:14px;"));
              let hRes; try{ hRes = await Api.getCoinHistory(coinId, range); }catch(e){ hRes = { data:[] }; }
              renderChart(hRes, coin);
            }
          }, r === "7d" ? "۷ روز" : r === "30d" ? "۳۰ روز" : "۹۰ روز")
        )),
      ]));

      if(!points || points.length < 2){
        chartCard.appendChild(UI.empty("داده تاریخی کافی در دسترس نیست", "اطلاعات این بازه هنوز از صرافی دریافت نشده است."));
        return;
      }

      const first = points[0].v, last = points[points.length-1].v;
      const pct = ((last-first)/first)*100;
      chartCard.appendChild(Utils.el("div", { style:"margin:6px 0 2px;" }, [
        Utils.el("span", { class:`num ${pct>=0?"up":"down"}`, style:"font-size:13px;font-weight:700;" }, Utils.formatPercent(pct)),
        Utils.el("span", { class:"text-faint", style:"font-size:12px;" }, ` در بازه انتخاب‌شده`),
      ]));

      const wrap = Utils.el("div", { class:"chart-canvas-wrap" }, [ Utils.el("canvas", { id:"coinChart" }) ]);
      chartCard.appendChild(wrap);
      requestAnimationFrame(() => {
        Charts.lineChart("coinChart", document.getElementById("coinChart"), points, { color: pct>=0 ? null : getComputedStyle(document.documentElement).getPropertyValue("--red"), currency:"" });
      });
    }

    function renderSide(coin, walletRes, ordersRes){
      sideCol.innerHTML = "";

      const holding = walletRes ? (walletRes.data || []).find(a => a.coinId === coin.id) : null;
      const holdCard = Utils.el("div", { class:"card card-pad" }, [
        Utils.el("div", { class:"card-title" }, "موجودی شما از این ارز"),
      ]);
      if(holding){
        holdCard.appendChild(Utils.el("div", { style:"margin-top:10px;" }, [
          Utils.el("div", { class:"num", style:"font-size:19px;font-weight:700;" }, `${Utils.formatNumber(holding.total,{decimals:6})} ${holding.symbol}`),
          Utils.el("div", { class:"text-faint", style:"font-size:12px;margin-top:4px;" }, `≈ ${Utils.formatPrice(holding.valueIrt, "")}`),
        ]));
      }else{
        holdCard.appendChild(walletRes ? UI.empty("موجودی از این ارز ندارید", "") : UI.empty("موجودی در دسترس نیست", "دریافت اطلاعات کیف پول ممکن نشد."));
      }
      sideCol.appendChild(holdCard);

      const mine = ordersRes ? (ordersRes.data || []).filter(o => o.coin === coin.id.toUpperCase()) : null;
      const ordersCard = Utils.el("div", { class:"card card-pad" }, [
        Utils.el("div", { class:"card-title" }, "سفارش‌های باز مرتبط"),
        mine === null ? UI.empty("سفارش‌ها در دسترس نیست", "دریافت سفارش‌های باز ممکن نشد.")
          : mine.length === 0 ? UI.empty("سفارش فعالی برای این ارز نیست", "")
          : Utils.el("div", {}, mine.map(o => Utils.el("div", { class:"info-row" }, [
              Utils.el("span", { class:"k" }, `${o.type} ${Utils.formatNumber(o.amount, { decimals:6 })}`),
              Utils.el("span", { class:"v num" }, o.desc),
            ]))),
        Utils.el("button", { class:"btn btn-outline btn-sm", style:"margin-top:12px;", onClick:() => Router.go(`trade/${coin.id}`) }, "خرید / فروش این ارز"),
      ]);
      sideCol.appendChild(ordersCard);
    }
  }
};

const PageTrade = {
  async mount(container, params){
    container.innerHTML = "";
    container.appendChild(Utils.el("div", { class:"page-head" }, [
      Utils.el("div", {}, [
        Utils.el("h1", {}, "خرید و فروش"),
        Utils.el("div", { class:"sub" }, "آماده‌سازی و ثبت سفارش در بازار تومانی والکس"),
      ]),
    ]));
    const body = Utils.el("div");
    container.appendChild(body);
    body.appendChild(UI.skeletonRows(5));

    let coins = [], cfg = null, assets = null, book = null;
    const st = { coinId: (params && params.id) || "btc", side:"buy", execution:"limit", amount:"", price:"" };
    let busy = false;

    try{
      const [mRes, cRes, wRes] = await Promise.all([
        Api.getMarketList(),
        Api.getTradeConfig().catch(() => null),
        Api.getWalletAssets().catch(() => null),
      ]);
      coins = mRes.data; cfg = cRes && cRes.data; assets = wRes && wRes.data;
    }catch(e){
      body.innerHTML = "";
      body.appendChild(UI.errorState("دریافت اطلاعات بازار ناموفق بود", e.message, () => PageTrade.mount(container, params)));
      return;
    }
    if(!coins.find(c => c.id === st.coinId)) st.coinId = coins[0].id;
    if(TradePrefill.value){ // پیشنهاد هوش مصنوعی: مقادیر پر می‌شوند ولی کاملاً قابل ویرایش‌اند
      const pf = TradePrefill.value; TradePrefill.value = null;
      if(coins.find(c => c.id === pf.coinId)) st.coinId = pf.coinId;
      st.side = pf.side === "sell" ? "sell" : "buy"; st.execution = "limit";
      st.amount = String(pf.qty || ""); st.price = String(pf.price || "");
      st.aiNote = `این مقادیر پیشنهاد هوش مصنوعی هستند (${st.side === "buy" ? "خرید" : "فروش"} ${st.coinId.toUpperCase()}). می‌توانید هر کدام را تغییر دهید؛ سفارش فقط پس از پیش‌نمایش و تأیید خودتان ثبت می‌شود.`;
    }
    loadBook();

    const coin = () => coins.find(c => c.id === st.coinId);
    const fmtAmount = (n) => { let s = Number(n).toFixed(8); return s.includes(".") ? s.replace(/0+$/,"").replace(/\.$/,"") : s; };

    async function loadBook(){
      try{ book = (await Api.getOrderbook(st.coinId)).data; }catch(e){ book = null; }
      paint();
    }

      const key = st.side === "buy" ? "irt" : st.coinId;
      const a = assets.find(x => x.coinId === key);
      const v = a ? a.available : 0;
      return { value:v, text: st.side === "buy" ? Utils.formatPrice(v, "تومان") : `${Utils.formatNumber(v,{decimals:8})} ${st.coinId.toUpperCase()}` };
    }

    function estimate(){
      const amt = Number(st.amount); const c = coin();
      if(!(amt > 0)) return null;
      if(st.execution === "limit"){ const p = Number(st.price); return p > 0 ? amt * p : null; }
      const unit = (st.side === "buy" ? c.bestSell : c.bestBuy) || c.price; return amt * unit;
    }

    function paint(){

            : "ثبت سفارش واقعی روی سرور غیرفعال است. می‌توانید سفارش را آماده و پیش‌نمایش کنید، اما ارسال نمی‌شود."),

        Utils.el("div", { html: ic("bot") }), Utils.el("p", {}, st.aiNote)]));

      const grid = Utils.el("div", { class:"coin-grid" });
      const form = Utils.el("div", { class:"card card-pad" });
      const side = Utils.el("div", { style:"display:flex;flex-direction:column;gap:14px;" });
      grid.append(form, side); body.appendChild(grid);

        Utils.el("label", {}, "بازار"),
        UI.dropdown({ value: st.coinId, title:"انتخاب بازار", options: coins.map(x => ({ value:x.id, label:`${x.name} (${x.symbol})` })),
          onChange:(v) => { st.coinId = v; st.price = ""; loadBook(); } }),
      ]));
      form.appendChild(Utils.el("div", { class:"tabs", style:"margin-top:12px;" }, [
        Utils.el("button", { class:`tab-btn ${st.side==="buy"?"active":""}`, onClick:() => { st.side = "buy"; paint(); } }, "خرید"),
        Utils.el("button", { class:`tab-btn ${st.side==="sell"?"active":""}`, onClick:() => { st.side = "sell"; paint(); } }, "فروش"),
      ]));
      form.appendChild(Utils.el("div", { class:"tabs", style:"margin-top:8px;" }, [
        Utils.el("button", { class:`tab-btn ${st.execution==="limit"?"active":""}`, onClick:() => { st.execution = "limit"; paint(); } }, "سفارش محدود"),
        Utils.el("button", { class:`tab-btn ${st.execution==="market"?"active":""}`, onClick:() => { st.execution = "market"; paint(); } }, "سفارش بازار"),
      ]));

      const amountInput = Utils.el("input", { class:"input num", inputmode:"decimal", placeholder:"مثلاً 0.001", value: st.amount, autocomplete:"off",
        onInput:(e) => { st.amount = e.target.value.trim(); updateEstimate(); } });
      form.appendChild(Utils.el("div", { class:"field", style:"margin-top:12px;" }, [
        Utils.el("label", {}, `مقدار (${st.coinId.toUpperCase()})`), amountInput,
      ]));

      if(st.execution === "limit"){
        const priceInput = Utils.el("input", { class:"input num", inputmode:"decimal", placeholder:"قیمت هر واحد به تومان", value: st.price, autocomplete:"off",
          onInput:(e) => { st.price = e.target.value.trim(); updateEstimate(); } });
        form.appendChild(Utils.el("div", { class:"field", style:"margin-top:12px;" }, [
          Utils.el("label", {}, "قیمت (تومان)"), priceInput,
          Utils.el("button", { class:"btn btn-ghost btn-sm", style:"margin-top:6px;align-self:flex-start;",
            onClick:() => { st.price = String(c.price); priceInput.value = st.price; updateEstimate(); } }, "قیمت لحظه‌ای بازار"),
        ]));
      }

      const est = Utils.el("div", { class:"info-row", style:"margin-top:12px;" });
      form.appendChild(est);
      function updateEstimate(){
        const e = estimate();
        est.innerHTML = "";
        est.append(Utils.el("span", { class:"k" }, st.execution === "limit" ? "مبلغ سفارش" : "مبلغ تقریبی سفارش"),
          Utils.el("span", { class:"v num" }, e === null ? "—" : Utils.formatPrice(e, "تومان")));
      }
      updateEstimate();

      form.appendChild(Utils.el("div", { class:"info-row" }, [
        Utils.el("span", { class:"k" }, st.side === "buy" ? "موجودی تومانی قابل‌استفاده" : "موجودی قابل‌فروش"),
        Utils.el("span", { class:"v num" }, balanceInfo().text),
      ]));

      const msg = Utils.el("div", { class:"connect-status error", style:"display:none;margin-top:10px;" });
      form.appendChild(msg);
      form.appendChild(Utils.el("button", { class:"btn btn-primary btn-block", style:"margin-top:14px;height:44px;", disabled: busy ? "true" : false,
        onClick: async () => {
          const o = { coinId: st.coinId, side: st.side, execution: st.execution, amount: st.amount, price: st.execution === "limit" ? st.price : null };
          const bal = balanceInfo(); const e = estimate();
          const fail = (t) => { msg.style.display = ""; msg.textContent = t; };
          if(!(Number(o.amount) > 0)) return fail("مقدار را وارد کنید.");
          if(o.execution === "limit" && !(Number(o.price) > 0)) return fail("قیمت را وارد کنید.");
          if(bal.value !== null){
            if(st.side === "sell" && Number(o.amount) > bal.value) return fail("مقدار از موجودی قابل‌فروش بیشتر است.");
            if(st.side === "buy" && e !== null && e > bal.value) return fail("مبلغ سفارش از موجودی تومانی بیشتر است.");
          }
          msg.style.display = "none";
          try{ openPreview(await Api.previewOrder(o)); }
          catch(err){ fail(err.message); }
        } }, "پیش‌نمایش سفارش"));

      // ستون کناری: قیمت و دفتر سفارش‌ها
      side.appendChild(Utils.el("div", { class:"card card-pad" }, [
        Utils.el("div", { class:"card-title" }, `${c.name} — قیمت لحظه‌ای`),
        Utils.el("div", { class:"coin-price num", style:"margin-top:8px;" }, Utils.formatPrice(c.price, "")),
        Utils.el("div", { class:"text-faint", style:"font-size:12px;margin-top:4px;" },
          `خرید ${Utils.formatPrice(c.bestSell, "")} · فروش ${Utils.formatPrice(c.bestBuy, "")}`),
      ]));
      const bookCard = Utils.el("div", { class:"card card-pad" }, [ Utils.el("div", { class:"card-title" }, "دفتر سفارش‌ها") ]);
      if(!book || (!book.bids.length && !book.asks.length)){
        bookCard.appendChild(UI.empty("دفتر سفارش در دسترس نیست", ""));
      }else{
        const col = (title, rows) => Utils.el("div", { style:"flex:1;min-width:0;" }, [
          Utils.el("div", { class:"text-faint", style:"font-size:12px;margin:8px 0 4px;" }, title),
          ...rows.slice(0,6).map(r => Utils.el("div", { class:"info-row" }, [
            Utils.el("span", { class:"k num" }, Utils.formatPrice(r.price, "")),
            Utils.el("span", { class:"v num text-dim" }, Utils.formatNumber(r.amount, { decimals:6 })),
          ])),
        ]);
        bookCard.appendChild(Utils.el("div", { style:"display:flex;gap:14px;" }, [ col("خریداران", book.bids), col("فروشندگان", book.asks) ]));
      }
      side.appendChild(bookCard);
    }

    function openPreview(pv){
      const sm = pv.summary;
      const backdrop = Utils.el("div", { class:"modal-backdrop" });
      const modal = Utils.el("div", { class:"modal" });
      backdrop.appendChild(modal);
      let confirmed = false, sending = false, done = false;

      const row = (k, v) => Utils.el("div", { class:"info-row" }, [ Utils.el("span", { class:"k" }, k), Utils.el("span", { class:"v num" }, v) ]);

      function render(result){
        modal.innerHTML = "";
        modal.appendChild(Utils.el("h3", {}, result ? "نتیجه‌ی سفارش" : "تأیید نهایی سفارش"));
        if(result){
          modal.appendChild(Utils.el("p", {}, result.text));
          if(result.row){
            modal.appendChild(row("شناسه سفارش", result.row.id));
            modal.appendChild(row("وضعیت (از والکس)", result.row.status));
          }
          modal.appendChild(Utils.el("div", { class:"modal-actions" }, [
            Utils.el("button", { class:"btn btn-outline", onClick:() => backdrop.remove() }, "بستن"),
            result.ok ? Utils.el("button", { class:"btn btn-primary", onClick:() => { backdrop.remove(); Router.go("history"); } }, "تاریخچه سفارش‌ها") : null,
          ]));
          return;
        }
        modal.appendChild(row("بازار", sm.market));
        modal.appendChild(row("جهت", sm.side === "buy" ? "خرید" : "فروش"));
        modal.appendChild(row("نوع سفارش", sm.execution === "limit" ? "محدود (Limit)" : "بازار (Market)"));
        modal.appendChild(row("مقدار", `${sm.amount} ${st.coinId.toUpperCase()}`));
        modal.appendChild(row("قیمت", sm.price ? Utils.formatPrice(Number(sm.price), "تومان") : "بهترین قیمت بازار"));
        modal.appendChild(row(sm.execution === "limit" ? "مبلغ سفارش" : "مبلغ تقریبی", Utils.formatPrice(sm.estimateIrt, "تومان")));
        (pv.warnings || []).forEach(w => modal.appendChild(Utils.el("p", { class:"text-faint", style:"font-size:12px;margin-top:8px;" }, w)));

        if(!pv.tradingEnabled){
          modal.appendChild(Utils.el("div", { class:"notice-box", style:"margin-top:12px;" }, [
            Utils.el("div", { html: ic("shield") }),
            Utils.el("p", {}, "ثبت سفارش واقعی روی سرور غیرفعال است؛ این فقط یک پیش‌نمایش است و هیچ سفارشی ارسال نمی‌شود."),
          ]));
          modal.appendChild(Utils.el("div", { class:"modal-actions" }, [
            Utils.el("button", { class:"btn btn-outline", onClick:() => backdrop.remove() }, "بستن") ]));
          return;
        }
        const chk = Utils.el("input", { type:"checkbox", onChange:(e) => { confirmed = e.target.checked; send.disabled = !confirmed || sending; } });
        modal.appendChild(Utils.el("label", { style:"display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:13px;cursor:pointer;" }, [
          chk, Utils.el("span", {}, "مطمئنم که این یک سفارش واقعی با پول واقعی است و جزئیات بالا را بررسی کرده‌ام."),
        ]));
        const send = Utils.el("button", { class:"btn btn-primary", disabled:"true", onClick: async () => {
          if(sending || done || !confirmed) return;       // جلوگیری از کلیک تکراری
          sending = true; send.disabled = true; send.textContent = "در حال ارسال…";
          try{
            const r = await Api.submitOrder(pv.order, pv.clientOrderId, pv.confirmToken);
            done = true; render({ ok:true, text:r.message, row:r.order });
          }catch(err){
            done = true; // هر نتیجه‌ی غیرموفق → برای تلاش دوباره باید پیش‌نمایش جدید ساخته شود
            render({ ok:false, text:err.message });
          }
        } }, "تأیید و ارسال سفارش");
        modal.appendChild(Utils.el("div", { class:"modal-actions" }, [
          Utils.el("button", { class:"btn btn-outline", onClick:() => backdrop.remove() }, "انصراف"), send ]));
      }
      render();
      document.body.appendChild(backdrop);
    }

    paint();
  }
};

const NOBITEX_OFFICIAL_URL = "https://wallex.ir";

const PageWallet = {
  async mount(container){
    container.innerHTML = "";
    let hideValues = false;
    let query = "";
    let assets = [];
    let coinMap = {};

    container.appendChild(Utils.el("div", { class:"page-head" }, [
      Utils.el("div", {}, [
        Utils.el("h1", {}, "کیف پول"),
        Utils.el("div", { class:"sub" }, "مشاهده موجودی دارایی‌ها — بدون امکان واریز یا برداشت از داخل برنامه"),
      ]),
      Utils.el("button", { class:"btn btn-primary btn-sm", onClick: openChargeModal }, "شارژ حساب"),
    ]));

    const summary = Utils.el("div", { class:"wallet-summary" });
    const card = Utils.el("div", { class:"card card-pad" });
    container.append(summary, card);

    for(let i=0;i<3;i++) summary.appendChild(UI.skeletonCard());
    card.appendChild(UI.skeletonRows(5));

    try{
      const [walletRes, marketRes] = await Promise.all([ Api.getWalletAssets(), Api.getMarketList() ]);
      assets = walletRes.data;
      coinMap = Object.fromEntries(marketRes.data.map(c => [c.id, c]));
      renderSummary(walletRes.isMock);
      renderTable(walletRes.isMock);
    }catch(e){
      summary.innerHTML = "";
      card.innerHTML = "";
      card.appendChild(UI.errorState("دریافت دارایی‌ها ناموفق بود", e.message, () => PageWallet.mount(container)));
    }

    const sumOf = (fn) => assets.reduce((s,a) => s + (a.valueIrt === null ? 0 : fn(a)), 0);
    const unpriced = () => assets.filter(a => a.valueIrt === null).length;

    function renderSummary(isMock){
      summary.innerHTML = "";
      const totalValue = sumOf(a => a.valueIrt);
      const availValue = sumOf(a => a.available * a.priceIrt);
      const lockedValue = sumOf(a => a.locked * a.priceIrt);

      const items = [
        { label:"ارزش کل دارایی‌ها", value:totalValue, ic:"wallet" },
        { label:"موجودی قابل‌استفاده", value:availValue, ic:"zap", color:"blue" },
        { label:"موجودی درگیر سفارش", value:lockedValue, ic:"clock", color:"amber" },
      ];
      items.forEach((it, idx) => {
        summary.appendChild(Utils.el("div", { class:"card kpi-card" }, [
          Utils.el("div", { class:"kpi-top" }, [
            Utils.el("div", { class:`kpi-ic ${it.color||""}`, html: ic(it.ic) }),
            (idx === 0 && isMock) ? UI.mockFlag() : null,
          ]),
          Utils.el("div", { class:"kpi-label" }, it.label),
          Utils.el("div", { class:"kpi-value num" }, hideValues ? "••••••" : Utils.formatPrice(it.value, "")),
        ]));
      });
    }

    function renderTable(isMock){
      card.innerHTML = "";
      card.appendChild(Utils.el("div", { class:"card-head", style:"flex-wrap:wrap;gap:10px;" }, [
        Utils.el("div", { class:"search-wrap" }, [
          Utils.el("span", { html: ic("search") }),
          Utils.el("input", {
            class:"input", placeholder:"جست‌وجوی دارایی…", value:query,
            onInput: Utils.debounce((e) => { query = e.target.value; renderTable(isMock); }, 200),
          }),
        ]),
        Utils.el("button", { class:"btn btn-ghost btn-sm", onClick: () => { hideValues = !hideValues; renderSummary(isMock); renderTable(isMock); } },
          [Utils.el("span", { html: ic(hideValues ? "eyeOff" : "eye") }), hideValues ? " نمایش مقادیر" : " پنهان‌کردن مقادیر"]),
      ]));

      const rows = assets.filter(a => !query || a.name.includes(query) || a.symbol.toLowerCase().includes(query.toLowerCase()));

      if(assets.length === 0){
        card.appendChild(UI.empty("دارایی‌ای در حساب شما یافت نشد", "پس از واریز، دارایی‌های شما اینجا نمایش داده می‌شود."));
        return;
      }
      if(rows.length === 0){
        card.appendChild(UI.empty("نتیجه‌ای یافت نشد", "نام یا نماد دیگری را جست‌وجو کنید."));
        return;
      }

      const wrap = Utils.el("div", { class:"table-wrap" });
      const table = Utils.el("table", { class:"tbl" }, [
        Utils.el("thead", {}, Utils.el("tr", {}, [
          Utils.el("th", {}, "نام ارز"), Utils.el("th", {}, "موجودی کل"),
          Utils.el("th", { class:"col-opt" }, "قابل‌استفاده"), Utils.el("th", { class:"col-opt" }, "قفل‌شده"),
          Utils.el("th", { class:"col-opt" }, "قیمت واحد"), Utils.el("th", {}, "ارزش تقریبی"), Utils.el("th", {}, "تغییر ۲۴ساعته"),
        ])),
      ]);
      const tbody = Utils.el("tbody");
      rows.forEach(a => {
        const price = a.priceIrt;
        const value = a.valueIrt;
        tbody.appendChild(Utils.el("tr", { onClick: () => { if(coinMap[a.coinId]) Router.go(`coin/${a.coinId}`); } }, [
          Utils.el("td", {}, Utils.el("div", { class:"cell-asset" }, [UI.coinAvatar(a.symbol), Utils.el("span", {}, a.name)])),
          Utils.el("td", { class:"num" }, hideValues ? "••••" : Utils.formatNumber(a.total,{decimals:6})),
          Utils.el("td", { class:"num text-dim col-opt" }, hideValues ? "••••" : Utils.formatNumber(a.available,{decimals:6})),
          Utils.el("td", { class:"num text-dim col-opt" }, hideValues ? "••••" : Utils.formatNumber(a.locked,{decimals:6})),
          Utils.el("td", { class:"num text-dim col-opt" }, hideValues ? "••••" : Utils.formatPrice(price, "")),
          Utils.el("td", { class:"num" }, hideValues ? "••••" : Utils.formatPrice(value, "")),
          Utils.el("td", {}, UI.changeBadge(a.change24h)),
        ]));
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      card.appendChild(wrap);
      if(unpriced() > 0) card.appendChild(Utils.el("div", { class:"text-faint", style:"margin-top:12px;font-size:12px;" }, `قیمت ${unpriced()} دارایی در دسترس نیست و در مجموع ارزش‌ها لحاظ نشده است.`));
    }

    function openChargeModal(){
      const backdrop = Utils.el("div", { class:"modal-backdrop", onClick:(e) => { if(e.target===backdrop) backdrop.remove(); } });
      backdrop.appendChild(Utils.el("div", { class:"modal" }, [
        Utils.el("h3", {}, "انتقال به وب‌سایت صرافی"),
        Utils.el("p", {}, "برای شارژ حساب، به وب‌سایت رسمی صرافی متصل‌شده هدایت می‌شوید. این برنامه هیچ اطلاعات بانکی یا پرداختی را دریافت نمی‌کند."),
        Utils.el("div", { class:"modal-actions" }, [
          Utils.el("button", { class:"btn btn-outline", onClick: () => backdrop.remove() }, "انصراف"),
          Utils.el("button", { class:"btn btn-primary", onClick: () => {
            window.open(NOBITEX_OFFICIAL_URL, "_blank", "noopener");
            backdrop.remove();
          }}, [Utils.el("span",{html:ic("externalLink")}), " رفتن به وب‌سایت صرافی"]),
        ]),
      ]));
      document.body.appendChild(backdrop);
    }
  }
};

// دکمه‌ی شناور هوش مصنوعی + صفحه‌ی گزارش (گفتگوی فقط‌خواندنی)
// • کاربر نمی‌تواند پیام بفرستد؛ فقط گزارش‌های موتور را می‌خواند.
// • حالت خودکار (Paper/Live): گزارش همه‌ی خرید و فروش‌ها و هشدارها
// • حالت تحلیل و پیشنهاد: چه ارزی، چقدر، کی بفروشد + دکمه‌ی انتقال به صفحه‌ی خرید با مقادیر پرشده

const TradePrefill = { value: null };

const AIChat = (() => {
  const E = Utils.el;
  const SEEN_KEY = "aiChatSeenAt"; // فقط یک زمان‌نگار (نه داده‌ی حساس)
  let fab = null, panel = null, feedEl = null, timer = null, badgeTimer = null, last = null, open = false;

  const getSeen = () => { try{ return localStorage.getItem(SEEN_KEY); }catch(_){ return null; } };
  const setSeen = (v) => { try{ if(v) localStorage.setItem(SEEN_KEY, v); }catch(_){ /* بی‌اهمیت */ } };

  function goToTrade(action){
    TradePrefill.value = action;
    close();
    const target = "#/trade/" + action.coinId;
    if(location.hash === target) window.dispatchEvent(new HashChangeEvent("hashchange"));
    else Router.go("trade/" + action.coinId);
  }

  function messageEl(m, isLastSuggestion){
    const sev = m.severity || "info";
    const box = E("div", { class:`ai-msg ai-msg-${sev} ${m.kind === "suggestion_past" || m.kind === "analysis" ? "ai-msg-dim" : ""}` });
    box.appendChild(E("div", { class:"ai-msg-head" }, [E("span", { class:"ai-msg-title" }, m.title), E("span", { class:"ai-msg-time num" }, Utils.formatDateTime(m.t))]));
    (m.lines || []).forEach(l => box.appendChild(E("div", { class:"ai-msg-line" }, l)));
    if(m.sellPlan && m.sellPlan.length){
      box.appendChild(E("div", { class:"ai-msg-sub" }, m.kind === "suggestion" && m.action && m.action.side === "sell" ? "چرا فروش؟" : "کی بفروشید؟"));
      box.appendChild(E("ul", { class:"ai-reasons" }, m.sellPlan.map(x => E("li", {}, x))));
    }
    (m.notes || []).forEach(n => box.appendChild(E("div", { class:"ai-msg-note" }, n)));
    if(m.action && m.kind === "suggestion"){
      const a = m.action;
      const btn = E("button", { class:`btn btn-sm ${a.side === "buy" ? "btn-primary" : "btn-danger-ghost"} ai-msg-btn`, onClick:() => goToTrade(a) },
        a.side === "buy" ? "پیشنهاد: برو به صفحه‌ی خرید با این مقادیر" : "پیشنهاد: برو به صفحه‌ی فروش با این مقادیر");
      if(!isLastSuggestion) btn.classList.add("ai-msg-btn-old");
      box.appendChild(btn);
      box.appendChild(E("div", { class:"ai-msg-note" }, "مقادیر در صفحه‌ی خرید پر می‌شوند و می‌توانید تغییرشان دهید؛ سفارش فقط با تأیید خودتان ثبت می‌شود."));
    }
    return E("div", { class:"ai-msg-row" }, [E("div", { class:"ai-avatar", html: ic("bot") }), box]);
  }

  function renderFeed(data){
    if(!feedEl) return;
    const nearBottom = feedEl.scrollHeight - feedEl.scrollTop - feedEl.clientHeight < 80;
    const first = !feedEl.dataset.ready;
    feedEl.innerHTML = "";
    const modeFa = data.mode === "live" ? "معامله‌ی واقعی" : data.mode === "paper" ? "معامله‌ی آزمایشی" : "تحلیل و پیشنهاد";
    feedEl.appendChild(E("div", { class:"ai-chat-intro" }, data.mode === "suggest"
      ? `حالت «${modeFa}»: من فقط تحلیل می‌کنم و پیشنهاد می‌دهم؛ هیچ سفارشی ثبت نمی‌شود. تصمیم نهایی با شماست و هیچ سودی تضمین نیست.`
      : `حالت «${modeFa}»${data.running ? "" : " (موتور متوقف است)"}: همه‌ی خرید و فروش‌ها و هشدارها اینجا گزارش می‌شود.${data.killed ? " توقف اضطراری فعال است." : ""}`));
    if(!data.messages.length) feedEl.appendChild(E("div", { class:"ai-chat-empty" }, data.emptyHint));
    const lastSug = [...data.messages].reverse().find(m => m.kind === "suggestion");
    data.messages.forEach(m => feedEl.appendChild(messageEl(m, lastSug && m.id === lastSug.id)));
    feedEl.dataset.ready = "1";
    if(first || nearBottom) feedEl.scrollTop = feedEl.scrollHeight;
  }

  async function load(){
    try{
      last = await Api.aiGet("/feed");
      if(!document.body.contains(fab)) return stop();
      if(open) renderFeed(last);
      updateBadge();
    }catch(e){
      if(open && feedEl){ feedEl.innerHTML = ""; feedEl.appendChild(E("div", { class:"ai-chat-empty" }, "دریافت گزارش هوش مصنوعی ممکن نشد: " + ((e && e.message) || "خطا"))); }
    }
  }

  function updateBadge(){
    if(!fab || !last) return;
    if(getSeen() === null) setSeen(last.serverTime); // سابقه‌ی قدیمی نشانگر ایجاد نکند
    const seen = getSeen();
    const unread = !open && last.latestImportantAt && seen && Date.parse(last.latestImportantAt) > Date.parse(seen);
    fab.classList.toggle("has-unread", !!unread);
  }

  function openPanel(){
    if(open) return; open = true;
    panel = E("div", { class:"ai-chat", role:"dialog", "aria-label":"گزارش هوش مصنوعی معاملاتی" });
    feedEl = E("div", { class:"ai-chat-feed" });
    panel.append(
      E("div", { class:"ai-chat-head" }, [
        E("div", { class:"ai-avatar", html: ic("bot") }),
        E("div", { style:"flex:1;min-width:0;" }, [E("div", { style:"font-weight:700;" }, "هوش مصنوعی معاملاتی"), E("div", { class:"text-faint", style:"font-size:12px;" }, "گزارش‌ها فقط برای مشاهده‌اند")]),
        E("button", { class:"ai-chat-x", "aria-label":"بستن", html: ic("close"), onClick: close }),
      ]),
      feedEl,
      E("div", { class:"ai-chat-foot" }, [
        E("input", { class:"input", disabled:"disabled", placeholder:"ارسال پیام ممکن نیست — این صفحه فقط گزارش نمایش می‌دهد" }),
        E("button", { class:"btn btn-primary btn-sm", disabled:"disabled" }, "ارسال"),
      ]),
    );
    document.body.appendChild(panel);
    feedEl.appendChild(UI.skeletonRows(4));
    fab.classList.add("open"); fab.classList.remove("has-unread");
    if(last){ renderFeed(last); setSeen(last.serverTime); }
    load().then(() => { if(last) setSeen(last.serverTime); });
    timer = setInterval(load, 15000);
  }
  function close(){
    if(!open) return; open = false;
    if(last) setSeen(last.serverTime);
    if(timer){ clearInterval(timer); timer = null; }
    if(panel){ panel.remove(); panel = null; feedEl = null; }
    if(fab) fab.classList.remove("open");
  }
  function stop(){ close(); if(badgeTimer){ clearInterval(badgeTimer); badgeTimer = null; } }

  function mount(host){
    stop(); last = null;
    fab = E("button", { class:"ai-fab", "aria-label":"گزارش هوش مصنوعی معاملاتی", title:"هوش مصنوعی معاملاتی", html: ic("bot") + '<span class="ai-fab-dot"></span>', onClick:() => (open ? close() : openPanel()) });
    host.appendChild(fab);
    load();
    badgeTimer = setInterval(() => { if(!document.body.contains(fab)){ stop(); return; } if(!open) load(); }, 60000);
  }
  return { mount, close };
})();

    updateConnBadge();
  }

  function openSidebar(){ document.querySelector(".sidebar").classList.add("open"); document.querySelector(".sidebar-scrim").classList.add("open"); }
  function closeSidebar(){ document.querySelector(".sidebar")?.classList.remove("open"); document.querySelector(".sidebar-scrim")?.classList.remove("open"); }

  function updateConnBadge(){
    const badge = document.getElementById("connBadge");
    const lastUpdate = document.getElementById("lastUpdate");
    if(!badge) return;
    badge.innerHTML = "";
    badge.appendChild(UI.statusBadge(State.get().connection.status));
    if(lastUpdate){
      lastUpdate.textContent = State.get().connection.lastChecked
        ? `به‌روزرسانی ${Utils.timeAgo(State.get().connection.lastChecked)}`
        : "";
    }
  }

  function setActiveNav(name){
    document.querySelectorAll(".nav-item[data-key]").forEach(n => n.classList.toggle("active", n.dataset.key === name));
    document.querySelectorAll(".bn-item[data-key]").forEach(n => n.classList.toggle("active", n.dataset.key === name));
    const title = document.getElementById("pageTitle");
    if(title) title.textContent = PAGE_TITLES[name] || "";
  }

  let currentRoute = null;

  async function refreshCurrentPage(){
    const btn = document.getElementById("refreshBtn");
    if(btn) btn.classList.add("spin");
    await Api.checkConnection();
    updateConnBadge();
    if(currentRoute) await currentRoute.page.mount(document.getElementById("pageContent"), currentRoute.params);
    if(btn) btn.classList.remove("spin");
    Toast.success("به‌روزرسانی شد", "اطلاعات صفحه به‌روزرسانی شد.");
  }

  async function handleLogout(){
    await Api.disconnect();
    AppAuth.logout();
    closeSidebar();
    Router.go("auth-phone");
  }

  function playPageEnter(el){
    if(!el) return;
    el.classList.remove("page-enter");
    void el.offsetWidth; // اجبار به reflow تا انیمیشن دوباره اجرا شود
    el.classList.add("page-enter");
  }

  function startAutoRefresh(){
    if(refreshTimer) clearInterval(refreshTimer);
    const sec = State.get().settings.refreshInterval || 60;
    refreshTimer = setInterval(async () => {
      if(State.get().connection.status !== "connected") return;
      await Api.checkConnection();
      updateConnBadge();
    }, sec * 1000);
  }

  const AUTH_ROUTES = ["auth-phone", "auth-otp", "auth-password"];

  function onRouteChange(route){
    const accountReady = State.get().account.loggedIn;
    const exchangeConnected = State.get().connection.status === "connected";

    // مرحله ۱: ابتدا باید وارد حساب برنامه شود (شماره موبایل → کد → رمز)
    if(!accountReady){
      if(refreshTimer) clearInterval(refreshTimer);
      if(route.name === "auth-otp" && !AuthFlow.phone){ Router.go("auth-phone"); return; }
      if(route.name === "auth-password" && !AuthFlow.otpVerified){ Router.go("auth-phone"); return; }
      root.innerHTML = "";
      const page = route.name === "auth-otp" ? PageAuthOtp
        : route.name === "auth-password" ? PageAuthPassword
        : PageAuthPhone;
      page.mount(root);
      return;
    }

    // مرحله ۲: بعد از ورود، باید حساب صرافی متصل شود
    if(!exchangeConnected){
      if(refreshTimer) clearInterval(refreshTimer);
      root.innerHTML = "";
      PageConnect.mount(root);
      return;
    }

    // مرحله ۳: هر دو انجام شده — اگر کاربر دستی به مسیرهای ورود/اتصال برگردد، به داشبورد هدایتش کن
    if(AUTH_ROUTES.includes(route.name) || route.name === "connect"){
      Router.go("dashboard");
      return;
    }

    if(!root.querySelector(".shell")) buildShell();
    currentRoute = route;
    setActiveNav(route.name);
    updateConnBadge();
    const content = document.getElementById("pageContent");
    route.page.mount(content, route.params);
    playPageEnter(content);
  }

  function init(){
    ThemeManager.apply();
    Router.start(onRouteChange);
    startAutoRefresh();
    State.subscribe((s) => {
      updateConnBadge();
    });
  }

  return { init };
})();

document.addEventListener("DOMContentLoaded", App.init);
</script>
</body>
</html>
