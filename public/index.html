    const rbPost = (path, extra) => Api.authPost(path, Object.assign({ phone: AuthFlow.phone, otpToken: AuthFlow.otpToken }, extra || {}));
    const rbBot = () => "\u2066@" + ((rb.st && rb.st.botUsername) || "Qairobot") + "\u2069"; // ایزوله‌ی LTR تا @ در متن راست‌به‌چپ جابه‌جا نشود
    async function rbLoad(){
      if(!AuthFlow.otpToken || rb.tokenGone) return;
      try{
        const st = await rbPost("/api/auth/rubika/status");
        if(rb.first === null) rb.first = st.status;
        rb.st = st; if(st.status !== "pending") rb.start = null; rb.err = "";
      }catch(e){
        if(e && e.code === "OTP_TOKEN_INVALID") rb.tokenGone = true;
        else if(!rb.st) rb.st = { available:false };
      }
      rbPaint();
    }
    async function rbStart(){
      if(rb.busy) return;
      const pwEl = card.querySelector("#pwInput"); const pw = pwEl ? pwEl.value : "";
      if(mode === "login" && !pw){ rb.err = "برای اتصال روبیکا به حساب موجود، ابتدا رمز عبور را در کادر بالا وارد کنید."; rbPaint(); if(pwEl) pwEl.focus(); return; }
      rb.busy = true; rb.err = ""; rbPaint();
      try{
        const r = await rbPost("/api/auth/rubika/start", mode === "login" ? { password: pw } : {});
        rb.start = r; rb.st = { available:true, status:"pending", botUsername:r.botUsername, pendingExpiresAt:r.expiresAt };
      }catch(e){
        if(e && e.code === "ALREADY_CONNECTED"){ rb.busy = false; await rbLoad(); return; }
        if(e && e.code === "OTP_TOKEN_INVALID") rb.tokenGone = true;
        else rb.err = Utils.friendlyError(e, "شروع اتصال روبیکا انجام نشد.");
      }
      rb.busy = false; rbPaint();
    }
    function rbReveal(){ // در موبایل کارت زیر فرم است؛ بعد از شروع/اتصال به آن اسکرول می‌کنیم تا کد و دکمه‌ها دیده شوند
      requestAnimationFrame(() => { try{ rbBox.scrollIntoView({ block:"nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }catch(_){} });
    }
    function rbPaint(){
      const prevKind = rbBox.dataset.kind || "";
      rbBox.innerHTML = "";
      const st = rb.st; if(!st || st.available === false) return;
      rbBox.dataset.kind = st.status;
      if(prevKind !== st.status && (st.status === "pending" || st.status === "connected")) rbReveal();
      const head = (icon, title, sub) => E("div", { class:"rbl-head" }, [E("span", { class:"rbl-ic", html: ic(icon) }), E("div", { style:"min-width:0;flex:1;" }, [E("div", { class:"rbl-title" }, title), sub ? E("div", { class:"rbl-sub" }, sub) : null])]);
      const err = rb.err ? E("div", { class:"rbl-err" }, [E("span", { html: ic("alert") }), E("span", {}, rb.err)]) : null;
      if(st.status === "connected"){
        const already = rb.first === "connected";
        rbBox.appendChild(E("div", { class:"rbl ok" }, [head("check", already ? "کد ورود شما در روبیکا ارسال می‌شود" : "حساب روبیکا متصل شد ✓", already ? "حساب روبیکای شما قبلاً متصل شده است." : "از این پس کد ورود در ربات " + rbBot() + " برایتان ارسال می‌شود، نه پیامک.")]));
        return;
      }
      if(st.status === "pending" || rb.start){
        if(rb.tokenGone){ rbBox.appendChild(E("div", { class:"rbl" }, [head("clock", "اعتبار تأیید شماره تمام شد", "اگر اتصال را انجام داده‌اید، بعد از ورود وضعیت آن را در «تنظیمات» می‌بینید.")])); return; }
        const sx = rb.start;
        const until = st.pendingExpiresAt ? new Date(st.pendingExpiresAt).toLocaleTimeString("fa-IR", { hour:"2-digit", minute:"2-digit" }) : "";
        const copyBtn = sx && E("button", { type:"button", class:"btn btn-ghost btn-sm", onClick: () => { try{ navigator.clipboard.writeText(sx.code.replace(/-/g, "")); Toast.success("کد کپی شد"); }catch(_){} } }, [E("span", { html: ic("copy") }), " کپی کد"]);
        const openBtn = sx && sx.link && E("a", { class:"btn btn-primary btn-sm", href: sx.link, target:"_blank", rel:"noopener noreferrer" }, [E("span", { html: ic("externalLink") }), " باز کردن ربات"]);
        rbBox.appendChild(E("div", { class:"rbl" }, [
          head("plug", "اتصال حساب روبیکا", "این مراحل را انجام دهید؛ همین‌جا خودکار متصل می‌شوید."),
          E("ul", { class:"rbl-steps" }, [
            E("li", {}, [E("b", {}, "۱"), E("span", {}, sx && sx.link ? "روی «باز کردن ربات» بزنید و در روبیکا Start کنید." : "ربات " + rbBot() + " را در روبیکا باز کنید و Start بزنید.")]),
            E("li", {}, [E("b", {}, "۲"), E("span", {}, "اگر ربات اتصال را تأیید نکرد، کد زیر را در چت ربات بفرستید.")]),
          ]),
          sx ? E("div", { class:"rbl-code" }, sx.code) : E("div", { class:"rbl-sub", style:"margin-top:10px;" }, "کد اتصال قبلاً نمایش داده شده؛ برای کد تازه «کد جدید» را بزنید."),
          E("div", { class:"rbl-actions" }, [openBtn, copyBtn, E("button", { type:"button", class:"btn btn-ghost btn-sm", disabled: rb.busy ? "true" : false, onClick: rbStart }, "کد جدید")]),
          E("div", { class:"rbl-wait" }, [E("span", { class:"rbl-dot" }), E("span", {}, "در انتظار اتصال…" + (until ? " (کد تا ساعت " + until + " معتبر است)" : ""))]),
          err,
        ]));
        return;
      }
      // متصل نیست / قطع شده
      rbBox.appendChild(E("div", { class:"rbl" }, [
        head("plug", "کد ورود را در روبیکا بگیرید", "به‌جای پیامک، دفعات بعد کد ورود را در ربات " + rbBot() + " دریافت کنید. اتصال فقط چند ثانیه طول می‌کشد." + (mode === "login" ? " برای امنیت، رمز عبور حساب را در کادر بالا وارد کنید." : "")),
        E("div", { class:"rbl-actions" }, [E("button", { type:"button", class:"btn btn-primary btn-sm", disabled: rb.busy ? "true" : false, onClick: rbStart }, rb.busy ? [E("span", { class:"spin" }), " در حال آماده‌سازی…"] : [E("span", { html: ic("plug") }), " اتصال حساب روبیکا"])]),
        err,
      ]));
    }
    const rbOnVisible = () => { if(!document.hidden && rb.st && rb.st.status === "pending" && !rb.busy) rbLoad(); };
    document.addEventListener("visibilitychange", rbOnVisible);
    const rbTimer = setInterval(() => {
      if(!card.isConnected || !AuthFlow.otpToken){ clearInterval(rbTimer); document.removeEventListener("visibilitychange", rbOnVisible); return; }
      if(rb.st && rb.st.status === "pending" && !rb.busy && !document.hidden) rbLoad();
    }, 2500);
    rbLoad();

    function paint(){
      while(card.children.length > 1) card.removeChild(card.lastChild);
      const needConfirm = mode !== "login";
      card.appendChild(Utils.el("h1", { class:"connect-title" }, mode === "register" ? "انتخاب رمز عبور" : mode === "login" ? "ورود با رمز عبور" : "رمز عبور جدید"));
      if(AuthFlow.intent === "login" && mode === "register") card.appendChild(Utils.el("div", { class:"connect-status loading", style:"margin:0 0 12px;" }, "با این شماره هنوز حسابی ساخته نشده؛ رمز عبور انتخاب کنید تا ثبت‌نام کامل شود."));
      if(AuthFlow.intent === "register" && mode === "login") card.appendChild(Utils.el("div", { class:"connect-status loading", style:"margin:0 0 12px;" }, "این شماره قبلاً ثبت‌نام کرده است؛ با رمز عبور خود وارد شوید."));
      card.appendChild(Utils.el("p", { class:"connect-desc" },
        mode === "register" ? "شماره شما تأیید شد. یک رمز عبور برای ورودهای بعدی انتخاب کنید (حداقل ۸ کاراکتر)."
        : mode === "login" ? `شماره ${AuthFlow.phone || ""} تأیید شد. رمز عبور حساب خود را وارد کنید.`
        : "یک رمز عبور جدید برای حساب خود انتخاب کنید."));

      const pwField = Utils.el("div", { class:"field" }, [
        Utils.el("label", { for:"pwInput" }, "رمز عبور"),
        Utils.el("div", { class:"input-wrap" }, [
          Utils.el("input", { id:"pwInput", class:"input", type: showPw ? "text" : "password", placeholder: needConfirm ? "حداقل ۸ کاراکتر" : "رمز عبور", autocomplete: needConfirm ? "new-password" : "current-password" }),
          Utils.el("div", { class:"input-actions" }, [
            Utils.el("button", { class:"input-icon-btn", type:"button", html: ic(showPw ? "eyeOff" : "eye"), onClick: () => { showPw = !showPw; const v = card.querySelector("#pwInput").value; paint(); card.querySelector("#pwInput").value = v; } }),
          ]),
        ]),
        needConfirm ? null : (status === "error" ? Utils.el("span", { class:"field-error" }, [Utils.el("span",{html:ic("alert")}), errorMsg]) : null),
      ]);
      card.appendChild(pwField);
      if(needConfirm){
        card.appendChild(Utils.el("div", { class:"field", style:"margin-top:14px;" }, [
          Utils.el("label", { for:"pwConfirmInput" }, "تکرار رمز عبور"),
          Utils.el("div", { class:"input-wrap" }, [Utils.el("input", { id:"pwConfirmInput", class:"input", type: showPw ? "text" : "password", placeholder:"رمز عبور را دوباره وارد کنید", autocomplete:"new-password" })]),
          status === "error" ? Utils.el("span", { class:"field-error" }, [Utils.el("span",{html:ic("alert")}), errorMsg]) : null,
        ]));
      }
      card.appendChild(Utils.el("button", {
        class:"btn btn-primary btn-block", style:"margin-top:16px;height:44px;",
        disabled: status === "loading" ? "true" : false, onClick: handleSubmit,
      }, status === "loading" ? [Utils.el("span",{class:"spin"}), mode === "login" ? "در حال ورود…" : "در حال ذخیره…"] : (mode === "register" ? "ثبت‌نام و ورود" : mode === "login" ? "ورود" : "تغییر رمز و ورود")));
      if(mode !== "reset") card.appendChild(rbBox);
      if(mode === "login" && AuthFlow.resetAllowed){
        card.appendChild(Utils.el("div", { style:"text-align:center;margin-top:12px;" }, [
          Utils.el("button", { class:"btn btn-ghost btn-sm", onClick: () => { mode = "reset"; status = "idle"; errorMsg = ""; paint(); } }, "رمز عبور را فراموش کرده‌ام"),
        ]));
      }
      card.appendChild(Utils.el("div", { style:"text-align:center;margin-top:8px;" }, [
        Utils.el("button", { class:"btn btn-ghost btn-sm", onClick: () => Router.go("auth-phone") }, "تغییر شماره"),
      ]));
    }

    async function handleSubmit(){
      const pw = card.querySelector("#pwInput").value;
      const confirmEl = card.querySelector("#pwConfirmInput");
      if(confirmEl && pw !== confirmEl.value){ status = "error"; errorMsg = "رمز عبور و تکرار آن یکسان نیستند."; paint(); return; }
      status = "loading"; errorMsg = ""; paint();
      try{
        if(mode === "register") await AppAuth.createAccount(pw);
        else if(mode === "login") await AppAuth.login(pw);
        else await AppAuth.resetPassword(pw);
        await Api.checkConnection(); // اگر کلید صرافی قبلاً روی سرور ذخیره/تنظیم شده باشد، مستقیم به داشبورد می‌رویم
        Toast.success(mode === "register" ? "خوش آمدید" : "ورود موفق", mode === "register" ? "حساب شما ساخته شد." : "با موفقیت وارد شدید.");
        Router.go("dashboard");
      }catch(e){
        status = "error";
        errorMsg = Utils.friendlyError(e, "عملیات با خطا مواجه شد.");
        if(e && (e.code === "OTP_TOKEN_INVALID")){ AuthFlow.otpVerified = false; }
        paint();
      }
    }

    paint();
  }
};

// مراحل راهنما از اینجا قابل ویرایش هستند — در صورت تغییر فرایند
// رسمی صرافی، فقط کافیست متن همین آرایه به‌روز شود.
const CONNECT_GUIDE_STEPS = [
  "در پنل رسمی صرافی بخش مدیریت API را باز کنید و «ساخت API» بزنید. دسترسی «برداشت» را فعال نکنید. برای فقط دیدن اطلاعات «خواندن» کافی است؛ برای سفارش‌گذاری و معامله خودکار، «معامله» را هم فعال کنید.",
  "در بخش «IPهای مجاز» آدرس IP سرور برنامه را وارد کنید تا کلید فقط از همین سرور کار کند.",
  "کلید ساخته‌شده را در مرحله‌ی آخر همین راهنما وارد کنید. سرور همان لحظه با یک درخواست واقعی به صرافی آن را آزمایش می‌کند؛ اگر پذیرفته شد، رمزنگاری‌شده روی سرور ذخیره می‌شود و دیگر به مرورگر برنمی‌گردد.",
  "کلید حداکثر ۹۰ روز از تاریخ ساخت اعتبار دارد؛ بعد از انقضا کلید جدید بسازید و دوباره اینجا وارد کنید.",
];

const EXCHANGE_API_GUIDE_URL = "https://developers.wallex.ir";
const EXCHANGE_SITE_URL = "https://wallex.ir";

// راهنمای گام‌به‌گام اتصال صرافی (بعد از ثبت‌نام / ورود، تا وقتی کلید معتبر ثبت نشده باز می‌ماند)
const PageConnect = {
  mount(container){
    const E = Utils.el;
    const STEPS = ["شروع", "ساخت کلید", "امنیت کلید", "اتصال"];
    let step = 0, dir = 1, showKey = false;
    let status = "idle"; // idle | loading | success | error
    let errorMsg = "";
    let draft = "";

    const card = authShellStart(container);
    const body = E("div", { class:"cn-body" });
    card.appendChild(body);

    const dots = () => E("div", { class:"cn-steps" }, STEPS.map((l, i) => E("div", { class:"cn-step" + (i === step ? " on" : i < step ? " done" : ""), onClick: () => { if(i < step || status === "idle") go(i); } }, [
      E("i", {}, i < step ? "✓" : String(i + 1)), E("span", {}, l)])));

    function go(n){ if(status === "loading") return; dir = n >= step ? 1 : -1; step = Math.max(0, Math.min(STEPS.length - 1, n)); status = "idle"; errorMsg = ""; paint(); }

    function point(icon, text){ return E("div", { class:"cn-point" }, [E("span", { class:"cn-pi", html: ic(icon) }), E("p", {}, text)]); }

    function stepView(){
      if(step === 0) return E("div", {}, [
        E("h1", { class:"connect-title" }, "اتصال به حساب صرافی"),
        E("p", { class:"connect-desc" }, "برای نمایش دارایی‌ها و تحلیل بازار، QAIRO باید با کلید API خودِ شما به صرافی وصل شود. ساخت کلید حدود ۲ دقیقه طول می‌کشد؛ همین‌جا قدم‌به‌قدم راهنمایی‌تان می‌کنیم."),
        point("shield", "کلید فقط سطح دسترسی‌ای را دارد که خودتان انتخاب می‌کنید. این برنامه امکان برداشت وجه ندارد."),
        point("lock", "کلید شما فقط یک‌بار به سرور می‌رسد، رمزنگاری‌شده ذخیره می‌شود و دیگر به مرورگر برنمی‌گردد."),
        point("bolt", "بعد از وارد کردن کلید، یک درخواست واقعی به صرافی زده می‌شود و در صورت معتبر بودن، حساب شما متصل می‌شود."),
      ]);
      if(step === 1) return E("div", {}, [
        E("h1", { class:"connect-title" }, "کلید API را در صرافی بسازید"),
        E("p", { class:"connect-desc" }, "این کار را در وب‌سایت یا پنل رسمی صرافی انجام دهید."),
        E("div", { class:"cn-card" }, [E("b", {}, "۱"), E("p", {}, CONNECT_GUIDE_STEPS[0])]),
        E("div", { class:"cn-links" }, [
          E("a", { class:"btn btn-outline btn-sm", href:EXCHANGE_SITE_URL, target:"_blank", rel:"noopener" }, "باز کردن صرافی"),
          E("a", { class:"btn btn-ghost btn-sm", href:EXCHANGE_API_GUIDE_URL, target:"_blank", rel:"noopener" }, "راهنمای رسمی API"),
        ]),
      ]);
      if(step === 2) return E("div", {}, [
        E("h1", { class:"connect-title" }, "کلید را امن نگه دارید"),
        E("div", { class:"cn-card" }, [E("b", {}, "۲"), E("p", {}, CONNECT_GUIDE_STEPS[1])]),
        (State.get().connection.serverIp ? E("div", { class:"cn-ip", onClick: () => { try{ navigator.clipboard.writeText(State.get().connection.serverIp); Toast.success("کپی شد", "IP سرور کپی شد."); }catch(e){} } }, [E("span", {}, "IP سرور (برای کپی بزنید)"), E("b", { class:"num", style:"direction:ltr;" }, State.get().connection.serverIp)]) : null),
        E("div", { class:"cn-card" }, [E("b", {}, "۳"), E("p", {}, CONNECT_GUIDE_STEPS[3])]),
        E("div", { class:"cn-card" }, [E("b", {}, "🔒"), E("p", {}, "کلید شما رمزنگاری‌شده و فقط برای حساب خودتان ذخیره می‌شود و هیچ‌جا در برنامه یا برای کاربران دیگر نمایش داده نمی‌شود. هر زمان خواستید از تنظیمات «قطع اتصال» بزنید تا کلید از سرور حذف شود.")]),
        E("div", { class:"notice-box" }, [E("div", { html: ic("alert") }), E("div", {}, [E("p", {}, "هرگز کلید را در چت، پیام‌رسان یا شبکه‌های اجتماعی نفرستید؛ هر کسی آن را داشته باشد به حساب شما دسترسی دارد.")])]),
      ]);
      return E("div", {}, [
        E("h1", { class:"connect-title" }, "کلید را وارد کنید"),
        E("p", { class:"connect-desc" }, CONNECT_GUIDE_STEPS[2]),
        E("div", { class:"field" }, [
          E("label", { for:"apiKeyInput" }, "کلید API صرافی"),
          E("div", { class:"input-wrap api-field" }, [
            E("input", { id:"apiKeyInput", class:"input", type: showKey ? "text" : "password", placeholder:"کلید را اینجا paste کنید", autocomplete:"off", spellcheck:"false", value:draft,
              style:"direction:ltr;text-align:left;", onInput: (e) => { draft = e.target.value; } }),
            E("div", { class:"input-actions" }, [E("button", { class:"input-icon-btn", type:"button", html: ic(showKey ? "eyeOff" : "eye"),
              onClick: () => { showKey = !showKey; const i = document.getElementById("apiKeyInput"); i.type = showKey ? "text" : "password"; } })]),
          ]),
          E("span", { class:"field-hint" }, "این مقدار در مرورگر ذخیره نمی‌شود."),
        ]),
        statusView(),
      ]);
    }

    function statusView(){
      if(status === "loading") return E("div", { class:"connect-status loading" }, [E("span", { class:"spin", style:"width:14px;height:14px;border-width:2px;" }), "در حال آزمایش کلید با صرافی…"]);
      if(status === "success") return E("div", { class:"connect-status success" }, [E("span", { html: ic("check") }), "اتصال به صرافی برقرار شد. در حال انتقال به داشبورد…"]);
      if(status === "error") return E("div", { class:"connect-status error" }, [E("span", { html: ic("alert") }), errorMsg || "اتصال برقرار نشد. دوباره تلاش کنید."]);
      return null;
    }

    async function handleConnect(){
      const value = draft.trim();
      if(!value){ status = "error"; errorMsg = "کلید API صرافی را وارد کنید."; paint(); return; }
      status = "loading"; errorMsg = ""; paint();
      try{
        const r = await Api.connect(value);
        draft = ""; status = "success"; paint();
        Toast.success("به صرافی متصل شدید", `کلید پذیرفته شد (کلید …${r.hint})؛ ${r.assets} دارایی در حساب دیده شد.`);
        setTimeout(() => Router.go("dashboard"), 900);
      }catch(e){
        status = "error"; errorMsg = Utils.friendlyError(e, "خطایی در اتصال رخ داد."); paint();
      }
    }

    function paint(){
      body.innerHTML = "";
      body.appendChild(dots());
      if(State.get().connection.canStoreKey === false) body.appendChild(E("div", { class:"connect-status error", style:"margin:0 0 12px;" }, [E("span", { html: ic("alert") }), "ذخیره‌ی کلید موقتاً غیرفعال است (تنظیمات امنیتی سرور کامل نیست). لطفاً با مدیر سرویس تماس بگیرید."]));
      if(State.get().connection.keyUnreadable) body.appendChild(E("div", { class:"connect-status error", style:"margin:0 0 12px;" }, [E("span", { html: ic("alert") }), "کلید ذخیره‌شده‌ی شما قابل استفاده نیست. لطفاً کلید API را دوباره وارد کنید."]));
      const view = E("div", { class:"cn-view " + (dir > 0 ? "fwd" : "back") }, stepView());
      body.appendChild(view);
      const last = step === STEPS.length - 1;
      const nav = E("div", { class:"cn-nav" }, [
        step > 0 ? E("button", { class:"btn btn-outline", disabled: status === "loading" ? "true" : false, onClick: () => go(step - 1) }, "قبلی") : null,
        last
          ? E("button", { class:"btn btn-primary", style:"flex:1;height:46px;", disabled: (status === "loading" || status === "success") ? "true" : false, onClick: handleConnect }, status === "loading" ? "در حال آزمایش…" : "اتصال به صرافی")
          : E("button", { class:"btn btn-primary", style:"flex:1;height:46px;", onClick: () => go(step + 1) }, step === 0 ? "شروع راهنما" : "مرحله‌ی بعد"),
      ]);
      body.appendChild(nav);
      const foot = E("div", { class:"cn-foot" }, [
        step < STEPS.length - 1 ? E("button", { class:"btn btn-ghost btn-sm", onClick: () => go(STEPS.length - 1) }, "کلید دارم، رد کردن راهنما") : null,
        E("button", { class:"btn btn-ghost btn-sm", onClick: async () => { await Api.disconnect(); AppAuth.logout(); Router.go("welcome"); } }, "خروج از حساب برنامه"),
      ]);
      body.appendChild(foot);
      if(last && status === "error"){ const i = document.getElementById("apiKeyInput"); if(i) i.focus(); }
    }
    paint();
  }
};

// • با لمس هر پیشنهاد، همان بخش مستقیم باز می‌شود
// • پیشنهادهای «پیشرفته» فقط وقتی دیده می‌شوند که حالت پیشرفته‌ی هوش مصنوعی روشن باشد

  const PERIOD_MS = 4 * 60 * 60 * 1000;   // هر ۴ ساعت مجموعه‌ی پیشنهادها عوض می‌شود
  const SLIDE_MS = 5500;                  // مدت نمایش هر پیشنهاد
  const COUNT = 5;
  const MAX_PER_GROUP = 2;                // از هر بخش حداکثر ۲ پیشنهاد در یک مجموعه

  // route: مسیر مقصد | ai: تب صفحه‌ی هوش مصنوعی | mk: فیلتر اولیه‌ی بازار | adv: فقط در حالت پیشرفته

    { g:"trade",  icon:"trendUp", title:"فروش بخشی از دارایی",    desc:"هر وقت خواستید، بخشی از ارزهایتان را تبدیل به تومان کنید.", route:"trade" },
    { g:"market", icon:"signals", title:"نبض بازار",              desc:"قیمت و تغییرات ۲۴ ساعته‌ی همه‌ی ارزها را ببینید.", route:"market" },
    { g:"market", icon:"trendUp", title:"ارزهای در حال رشد",      desc:"ارزهایی که در ۲۴ ساعت گذشته بیشترین رشد را داشته‌اند.", route:"market", mk:"up" },
    { g:"market", icon:"trendDown", title:"ارزهای افت‌کرده",      desc:"ببینید کدام ارزها در ۲۴ ساعت گذشته بیشتر افت کرده‌اند.", route:"market", mk:"down" },
    { g:"market", icon:"bolt",    title:"پرمعامله‌ترین ارزها",    desc:"ارزهایی که بیشترین حجم معامله را دارند.", route:"market", mk:"vol" },
    { g:"market", icon:"hash",    title:"بازار تومانی",           desc:"فقط جفت‌ارزهای تومانی را مرور کنید.", route:"market", mk:"irt" },
    { g:"market", icon:"search",  title:"جست‌وجوی ارز",           desc:"نام یا نماد هر ارز را جست‌وجو کنید و قیمتش را ببینید.", route:"market" },
    { g:"ai",     icon:"bot",     title:"وضعیت هوش مصنوعی",       desc:"ببینید QAIRO AI الان بازار را چطور تحلیل می‌کند.", route:"ai", ai:"status" },
    { g:"ai",     icon:"signals", title:"سیگنال‌های امروز",       desc:"فرصت‌های خرید و فروش که هوش مصنوعی پیدا کرده است.", route:"ai", ai:"signals" },
    { g:"ai",     icon:"zap",     title:"پیشنهادهای هوش مصنوعی",  desc:"پیشنهادهای تازه را مرور کنید؛ تصمیم نهایی با شماست.", route:"ai", ai:"signals" },
    { g:"ai",     icon:"history", title:"معاملات هوش مصنوعی",     desc:"گزارش معاملاتی که موتور انجام داده یا پیشنهاد کرده.", route:"ai", ai:"trades" },
    { g:"ai",     icon:"settings",title:"تنظیمات هوش مصنوعی",     desc:"حالت کار و محدودیت‌های هوش مصنوعی را مشخص کنید.", route:"ai", ai:"settings" },
    { g:"ai",     icon:"shield",  title:"کنترل و ایمنی",          desc:"وضعیت موتور و توقف اضطراری را از اینجا بررسی کنید.", route:"ai", ai:"status" },
    { g:"ai",     icon:"clock",   title:"سفارش هوشمند و DCA",     desc:"خرید تدریجی و خودکار در بازه‌های زمانی دلخواه.", route:"ai", ai:"smart", adv:true },
    { g:"ai",     icon:"refresh", title:"خرید پله‌ای (DCA)",      desc:"به‌جای یک خرید بزرگ، در چند مرحله وارد بازار شوید.", route:"ai", ai:"smart", adv:true },
    { g:"ai",     icon:"chat",    title:"بک‌تست استراتژی",        desc:"استراتژی را روی داده‌ی گذشته آزمایش کنید.", route:"ai", ai:"backtest", adv:true },
    { g:"wallet", icon:"wallet",  title:"دارایی‌های من",          desc:"موجودی هر ارز و ارزش کل دارایی‌هایتان را ببینید.", route:"wallet" },
    { g:"wallet", icon:"pie",     title:"ترکیب سبد دارایی",       desc:"ببینید سهم هر ارز از کل دارایی‌تان چقدر است.", route:"wallet" },
    { g:"wallet", icon:"eye",     title:"موجودی قابل‌استفاده",    desc:"مقدار قابل خرید و سفارش‌های باز را بررسی کنید.", route:"wallet" },
    { g:"history",icon:"history", title:"تاریخچه تراکنش‌ها",      desc:"همه‌ی خرید، فروش و واریز و برداشت‌هایتان یک‌جا.", route:"history" },
    { g:"history",icon:"copy",    title:"مرور معاملات گذشته",     desc:"معاملات قبلی را بازبینی کنید و نتیجه‌شان را ببینید.", route:"history" },
    { g:"profile",icon:"profile", title:"پروفایل",                desc:"اطلاعات حساب و وضعیت اتصال خود را مدیریت کنید.", route:"profile" },
    { g:"profile",icon:"lock",    title:"امنیت حساب",             desc:"بخش‌های امنیتی و اتصال به صرافی را بررسی کنید.", route:"profile" },
    { g:"settings",icon:"moon",   title:"تم برنامه",              desc:"بین حالت تیره و روشن جابه‌جا شوید.", route:"settings" },
    { g:"settings",icon:"hash",   title:"واحد نمایش قیمت",        desc:"قیمت‌ها را به تومان یا تتر ببینید.", route:"settings" },
    { g:"settings",icon:"bell",   title:"اعلان تغییر قیمت",       desc:"با اعلان‌ها از تغییرات مهم بازار باخبر شوید.", route:"settings" },
    { g:"settings",icon:"refresh",title:"به‌روزرسانی خودکار",     desc:"بازه‌ی تازه‌شدن اطلاعات بازار را تنظیم کنید.", route:"settings" },
  ];

  const isAdvanced = () => { try{ return localStorage.getItem("aiViewMode") === "advanced"; }catch(_){ return false; } };
  const seedNow = () => Math.floor(Date.now() / PERIOD_MS);

  // تولیدکننده‌ی عدد تصادفی قابل‌تکرار (با seed یکسان، ترتیب یکسان)
  function rng(seed){
    let a = (seed * 2654435761) >>> 0;
    return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  function pick(seed){
    const pool = POOL.filter(s => !s.adv || isAdvanced());
    const r = rng(seed), a = pool.slice();
    for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    const out = [], cnt = {};
    for(const s of a){ if((cnt[s.g] || 0) >= MAX_PER_GROUP) continue; cnt[s.g] = (cnt[s.g] || 0) + 1; out.push(s); if(out.length === COUNT) break; }
    for(const s of a){ if(out.length >= COUNT) break; if(!out.includes(s)) out.push(s); }
    return out;
  }

  function open(s){
    if(s.ai) PageAI.presetTab = s.ai;
    if(s.mk) PageMarket.presetMode = s.mk;
    Router.go(s.route);
  }

  function build(){
    let seed = seedNow(), items = pick(seed), idx = 0, dir = 1, timer = null, held = false;

    const prevBtn = E("button", { class:"hs-prev", type:"button", "aria-label":"پیشنهاد قبلی", html: ic("chevronLeft") });
    const nextBtn = E("button", { class:"hs-next", type:"button", "aria-label":"پیشنهاد بعدی", html: ic("chevronLeft") });
    const view = E("div", { class:"hs-view", role:"button", tabindex:"0" });
    const foot = E("div", { class:"hs-foot" });
    const panel = E("div", { class:"card hs-panel" }, [
      E("div", { class:"hs-head" }, [E("span", { class:"hs-label" }, "پیشنهاد برای شما"), E("div", { class:"hs-nav" }, [prevBtn, nextBtn])]),
      view, foot,
    ]);

    function paint(){
      const s = items[idx];
      view.innerHTML = "";
      view.appendChild(E("div", { class:`hs-slide ${dir < 0 ? "from-r" : ""}` }, [
        E("div", { class:"hs-ico", html: ic(s.icon) }),
        E("div", { class:"hs-txt" }, [E("div", { class:"hs-title" }, s.title), E("div", { class:"hs-desc" }, s.desc)]),
        E("span", { class:"hs-go", html: ic("chevronLeft") }),
      ]));
      foot.innerHTML = "";
      items.forEach((_, i) => foot.appendChild(E("button", { class:`hs-dot ${i === idx ? "active" : ""}`, type:"button", "aria-label":`پیشنهاد ${i + 1}`, onClick:() => { dir = i >= idx ? 1 : -1; idx = i; paint(); schedule(); } })));
      // نوار پیشرفت زیر پنل؛ با هر بار ساخته شدن، انیمیشن از اول شروع می‌شود
      const old = panel.querySelector(".hs-bar"); if(old) old.remove();
      panel.appendChild(E("i", { class:"hs-bar", style:`animation-duration:${SLIDE_MS}ms` }));
    }

    function move(d){
      // اگر بازه‌ی ۴ ساعته عوض شده، مجموعه‌ی جدید بیاید
      const sn = seedNow();
      if(sn !== seed){ seed = sn; items = pick(seed); idx = 0; dir = 1; }
      else{ dir = d; idx = (idx + d + items.length) % items.length; }
      paint();
    }

    function schedule(){
      clearTimeout(timer);
      if(held) return;
      timer = setTimeout(() => {
        if(!panel.isConnected) return;               // کاربر از صفحه رفته؛ متوقف شو
        if(document.hidden || held){ schedule(); return; }
        move(1); schedule();
      }, SLIDE_MS);
    }
    function hold(v){
      held = v; panel.classList.toggle("paused", v);
      if(v) clearTimeout(timer); else { paint(); schedule(); }
    }

    prevBtn.addEventListener("click", (e) => { e.stopPropagation(); move(-1); schedule(); });
    nextBtn.addEventListener("click", (e) => { e.stopPropagation(); move(1); schedule(); });

    // لمس / کشیدن انگشت: کشیدن به چپ = بعدی، کشیدن به راست = قبلی؛ لمس ساده = باز کردن همان بخش
    let x0 = null, y0 = 0, moved = false;
    view.addEventListener("pointerdown", (e) => { x0 = e.clientX; y0 = e.clientY; moved = false; if(e.pointerType === "mouse") return; held = true; clearTimeout(timer); panel.classList.add("paused"); });
    view.addEventListener("pointerup", (e) => {
      if(x0 === null) return;
      const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
      if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){ moved = true; held = false; panel.classList.remove("paused"); move(dx < 0 ? 1 : -1); schedule(); }
      else{ held = false; panel.classList.remove("paused"); schedule(); }
    });
    view.addEventListener("pointercancel", () => { x0 = null; held = false; panel.classList.remove("paused"); schedule(); });
    view.addEventListener("click", () => { if(moved){ moved = false; return; } open(items[idx]); });
    view.addEventListener("keydown", (e) => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); open(items[idx]); } else if(e.key === "ArrowLeft"){ move(1); schedule(); } else if(e.key === "ArrowRight"){ move(-1); schedule(); } });
    // ماوس (دسکتاپ): با رفتن روی پنل متوقف می‌شود
    panel.addEventListener("mouseenter", () => hold(true));
    panel.addEventListener("mouseleave", () => hold(false));

    paint(); schedule();
    return panel;
  }

  return { build, POOL, pick };
})();

const PageDashboard = {
  async mount(container){
    container.innerHTML = "";

    ]));

    const MODE_FA = { suggest:"تحلیل و پیشنهاد", paper:"معامله‌ی آزمایشی", live:"معامله‌ی واقعی" };
    const status = E("div", { class:"q-ai-sub" }, "در حال دریافت وضعیت…");
    const aiRow = E("div", { class:"card q-ai-strip", role:"button", tabindex:"0", onClick: () => Router.go("ai") }, [
      E("span", { class:"q-dot" }),
      E("div", { class:"q-ai-txt" }, [E("div", { class:"q-ai-title" }, "هوش مصنوعی"), status]),
      E("span", { class:"chev", html: ic("chevronLeft") }),
    ]);
    root.appendChild(aiRow);
    Api.aiGet("/status").then(st => {
      aiRow.classList.toggle("on", !!st.running && !st.killed);
      aiRow.classList.toggle("kill", !!st.killed);
      const buys = Object.values(st.analysis || {}).filter(a => a.signal === "buy").length;
      status.textContent = st.killed ? "توقف اضطراری فعال است."
        : st.mode === "suggest"
          ? (buys ? `الان ${buys} پیشنهاد خرید فعال دارم.` : "فعلاً پیشنهاد خریدی ندارم؛ بازار را زیر نظر دارم.")
          : `حالت «${MODE_FA[st.mode]}»؛ ${st.counts.open} موقعیت باز.${st.running ? "" : " (متوقف)"}`;
    }).catch(() => { status.textContent = "وضعیت در دسترس نیست."; });

    // ۴) بازار: فهرست کوتاه
    root.appendChild(Q.section("بازار", "همه", () => Router.go("market")));
    const list = E("div", { class:"q-list" }, UI.skeletonRows(4));
    root.appendChild(list);

    let range = "7d";
    const [summaryS, historyS, marketS] = await Promise.allSettled([
      Api.getPortfolioSummary(), Api.getPortfolioHistory(range), Api.getMarketList(),
    ]);

    function renderPortfolio(){
      pfCard.innerHTML = "";
      if(summaryS.status !== "fulfilled"){ pfCard.appendChild(UI.errorState("دریافت اطلاعات حساب ناموفق بود", Utils.friendlyError(summaryS.reason), () => PageDashboard.mount(container))); return; }
      const s = summaryS.value.data;
      const total = E("span", { class:"num" }, "0");
      const hasChg = s.change24hPercent !== undefined && s.change24hPercent !== null;
      pfCard.appendChild(E("div", { class:"q-hero-top" }, [
        E("div", { class:"q-lbl" }, ["ارزش دارایی‌ها ", summaryS.value.isMock ? UI.mockFlag() : null]),
        hasChg ? E("span", { class:`q-chg ${s.change24hPercent >= 0 ? "up" : "down"}` }, Utils.formatPercent(s.change24hPercent)) : null,
      ]));
      pfCard.appendChild(E("div", { class:"q-total" }, [total, E("small", {}, State.get().settings.priceUnit === "usdt" ? "تتر" : "تومان")]));
      Q.countUp(total, s.totalValueIrt, (v) => Utils.formatPrice(v, "").trim());
      pfCard.appendChild(E("div", { class:"q-spark-wrap chart-canvas-wrap" }, E("canvas", { id:"portfolioChart" })));
      const ranges = [["24h", "۲۴ ساعت"], ["7d", "۷ روز"], ["30d", "۳۰ روز"]];
      const bar = E("div", { class:"q-ranges" }, ranges.map(([r, l]) => E("button", {
        class:`chip ${r === range ? "active" : ""}`,
        onClick: async (ev) => {
          range = r; bar.querySelectorAll(".chip").forEach(c => c.classList.remove("active")); ev.currentTarget.classList.add("active");
          let h; try{ h = await Api.getPortfolioHistory(range); }catch(e){ h = { data:[] }; }
          drawChart(h);
        } }, l)));
      pfCard.appendChild(bar);
      // آمار فرعی: کم‌رنگ و در یک ردیف
      pfCard.appendChild(E("div", { class:"q-hero-stats" }, [
        ["قابل‌استفاده", Utils.formatPrice(s.availableValueIrt, "")],
        ["دارایی‌ها", Utils.formatNumber(s.assetCount)],
        ["سفارش باز", Utils.formatNumber(s.openOrders)],
      ].map(([l, v]) => E("div", {}, [E("small", {}, l), E("b", { class:"num" }, v)]))));
      if(historyS.status === "fulfilled") drawChart(historyS.value);
    }
    function drawChart(h){
      const pts = h && h.data;
      const cv = document.getElementById("portfolioChart");
      if(!cv) return;
      if(!pts || pts.length < 2){ Charts.destroy("portfolioChart"); const w = cv.parentElement; w.innerHTML = ""; w.appendChild(E("div", { class:"text-faint", style:"text-align:center;padding:34px 8px;font-size:12px;" }, "داده‌ی کافی برای نمودار نیست")); return; }
      requestAnimationFrame(() => Charts.lineChart("portfolioChart", cv, pts, { currency:"تومان", minimal:true }));
    }
    renderPortfolio();

    if(marketS.status === "fulfilled"){
      const coins = marketS.value.data;
      list.innerHTML = "";
      const top = [...coins].sort((a, b) => Math.abs(b.change24h) - Math.abs(a.change24h)).slice(0, 5);
      top.forEach(c => list.appendChild(Q.coinRow(c)));
      if(!top.length) list.appendChild(UI.empty("بازاری یافت نشد", ""));
      Q.paintSparks(root, top);
      State.set({ connection: { lastChecked: new Date().toISOString() } });
    }else{
      list.innerHTML = "";
      list.appendChild(UI.errorState("دریافت اطلاعات بازار ناموفق بود", Utils.friendlyError(marketS.reason), () => PageDashboard.mount(container)));
    }
  }
};

const PageMarket = {
  async mount(container){

    let allCoins = [], query = "", mode = (() => { const m = PageMarket.presetMode || "all"; PageMarket.presetMode = null; return m; })(), pageSize = 8, visible = pageSize;

      E("input", { class:"input", placeholder:"جست‌وجوی نام یا نماد ارز…", onInput: Utils.debounce((e) => { query = e.target.value.trim(); visible = pageSize; paint(); }, 180) }),
    ]);

    function paintFilters(){
      filters.innerHTML = "";
      MODES.forEach(([k, l]) => filters.appendChild(E("button", { class:`chip ${mode === k ? "active" : ""}`, onClick: () => { mode = k; visible = pageSize; paintFilters(); paint(); } }, l)));

      if(mode === "up") r = r.filter(c => c.change24h > 0).sort((a, b) => b.change24h - a.change24h);
      else if(mode === "down") r = r.filter(c => c.change24h < 0).sort((a, b) => a.change24h - b.change24h);
      else if(mode === "irt") r = r.filter(c => c.symbol.includes("IRT")).sort((a, b) => b.volume24h - a.volume24h);
      else r = r.sort((a, b) => b.volume24h - a.volume24h);
      return r;
    }
    function paint(){
      list.innerHTML = "";
      const r = rows();
      if(!r.length){ list.appendChild(UI.empty("نتیجه‌ای یافت نشد", "عبارت جست‌وجو یا فیلتر را تغییر دهید.")); return; }
      const shown = r.slice(0, visible);
      shown.forEach(c => list.appendChild(Q.coinRow(c)));
      if(visible < r.length) list.appendChild(E("button", { class:"btn btn-outline btn-block", onClick: () => { visible += pageSize; paint(); } }, "نمایش موارد بیشتر"));
      requestAnimationFrame(() => {
        shown.forEach(c => { const cv = list.querySelector(`canvas[data-key="row_${c.id}"]`); if(cv && c._spark) Charts.sparkline(cv, c._spark, (c.change24h ?? 0) >= 0); });
      });
    }
    async function load(){
      try{
        const res = await Api.getMarketList();
        allCoins = res.data.map(c => ({ ...c, _spark:null }));
        paintFilters(); paint();
        Api.getSparklines(allCoins.map(c => c.id)).then(sp => { allCoins.forEach(c => { c._spark = (sp.data && sp.data[c.id]) || null; }); paint(); }).catch(() => {});
      }catch(e){
        list.innerHTML = ""; list.appendChild(UI.errorState("دریافت بازار ناموفق بود", Utils.friendlyError(e), load));
      }
    }
    load();
  }
};

const PageCoin = {

    root.append(top, priceBox, chartCard, statsBox, sideCol);

        UI.coinAvatar(coin.symbol, 44, coin.icon || coin.image || coin.logo),

      );
      priceBox.innerHTML = "";
      const p = E("div", { class:"q-bigprice num" }, "0");
      priceBox.append(p, E("div", { style:"display:flex;gap:10px;align-items:center;margin:0 2px;" }, [
        E("span", { class:`q-chg ${(coin.change24h ?? 0) >= 0 ? "up" : "down"}`, style:"font-size:14px;" }, Utils.formatPercent(coin.change24h) + " (۲۴ساعت)"),
        E("span", { class:"text-faint", style:"font-size:11px;" }, `به‌روزرسانی ${Utils.timeAgo(fetchedAt)}`),
      ]));
      Q.countUp(p, coin.price, (v) => Utils.formatPrice(v, "").trim(), 900);
    }
    function stats(coin){
      statsBox.innerHTML = "";
      const s = (l, v) => E("div", { class:"q-stat" }, [E("div", { class:"l" }, l), E("div", { class:"v num" }, v)]);
      statsBox.appendChild(E("div", { class:"q-stats" }, [
        s("بالاترین ۲۴س", Utils.formatPrice(coin.high24h, "")), s("پایین‌ترین ۲۴س", Utils.formatPrice(coin.low24h, "")), s("حجم ۲۴س", Utils.formatNumber(coin.volume24h, { compact:true }))]));
    }
    function renderChart(histRes, coin){
      chartCard.innerHTML = "";
      const ranges = [["7d", "۷ روز"], ["30d", "۳۰ روز"], ["90d", "۹۰ روز"]];
      bar = E("div", { class:"range-tabs", style:"padding:0 6px;" }, ranges.map(([r, l]) => E("button", {
        class:`chip ${r === range ? "active" : ""}`, style:"padding:5px 13px;font-size:11.5px;",
        onClick: async () => { range = r; let h; try{ h = await Api.getCoinHistory(coinId, r); }catch(e){ h = { data:[] }; } renderChart(h, coin); } }, l)));
      const views = E("div", { class:"range-tabs", style:"padding:0 6px;" }, [["candle", "کندل"], ["line", "خطی"]].map(([v, l]) => E("button", {
        class:`chip ${v === view ? "active" : ""}`, style:"padding:5px 13px;font-size:11.5px;",
        onClick: () => { view = v; renderChart(histRes, coin); } }, l)));
      chartCard.appendChild(E("div", { style:"display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;" }, [bar, views]));
      const pts = (histRes.data || []).map(p => (p.v === undefined && p.c !== undefined) ? Object.assign({}, p, { v:p.c }) : p);
      if(!pts || pts.length < 2){ chartCard.appendChild(UI.empty("داده‌ی تاریخی کافی در دسترس نیست", "")); return; }
      const pct = ((pts[pts.length - 1].v - pts[0].v) / pts[0].v) * 100;
      chartCard.appendChild(E("div", { class:"chart-canvas-wrap" }, E("canvas", { id:"coinChart" })));
      // کندل وقتی نقطه‌ی کافی (یا کندل واقعی از سرور) هست؛ وگرنه نمودار خطی
      const canCandle = view === "candle" && (pts[0].o !== undefined || pts.length >= 12);
      requestAnimationFrame(() => {
        const cv = document.getElementById("coinChart");
        if(canCandle) Charts.candleChart("coinChart", cv, pts, { currency:"" });
        else Charts.lineChart("coinChart", cv, pts, { color: pct >= 0 ? "#8ba6ff" : "#e5534b", currency:"", minimal:false });
      });
    }
    function side(coin, walletRes, ordersRes){
      sideCol.innerHTML = "";
      const holding = walletRes ? (walletRes.data || []).find(a => a.coinId === coin.id) : null;
      sideCol.appendChild(E("div", { class:"card card-pad" }, [E("div", { class:"card-title" }, "موجودی شما"),
        holding ? E("div", { style:"margin-top:8px;" }, [E("div", { class:"num", style:"font-size:18px;font-weight:800;" }, `${Utils.formatNumber(holding.total, { decimals:6 })} ${holding.symbol}`), E("div", { class:"text-faint", style:"font-size:12px;" }, `≈ ${Utils.formatPrice(holding.valueIrt, "")}`)])
        : (walletRes ? UI.empty("از این ارز موجودی ندارید", "") : UI.empty("موجودی در دسترس نیست", ""))]));
      const mine = ordersRes ? (ordersRes.data || []).filter(o => o.coin === coin.id.toUpperCase()) : null;
      sideCol.appendChild(E("div", { class:"card card-pad" }, [E("div", { class:"card-title" }, "سفارش‌های باز"),
        mine === null ? UI.empty("سفارش‌ها در دسترس نیست", "") : mine.length === 0 ? UI.empty("سفارش فعالی ندارید", "")
        : E("div", {}, mine.map(o => E("div", { class:"info-row" }, [E("span", {}, `${o.type} ${Utils.formatNumber(o.amount, { decimals:6 })}`), E("span", { class:"num" }, o.desc)])))]));
      sideCol.appendChild(E("div", { style:"height:70px;" }));
    }
    function mountTradeBar(coin){
      document.querySelectorAll(".q-trade-bar").forEach(n => n.remove());
      const go = (side) => () => { TradePrefill.value = { coinId:coin.id, side }; Router.go("trade/" + coin.id); };
      const bar = E("div", { class:"q-trade-bar" }, [E("button", { class:"q-buy", onClick:go("buy") }, "خرید"), E("button", { class:"q-sell", onClick:go("sell") }, "فروش")]);
      document.body.appendChild(bar);
    }
  }
};

const PageTrade = {

    if(TradePrefill.value){ // پیشنهاد هوش مصنوعی: مقادیر پر می‌شوند ولی کاملاً قابل ویرایش‌اند
      const pf = TradePrefill.value; TradePrefill.value = null;
      if(coins.find(c => c.id === pf.coinId)) st.coinId = pf.coinId;
      st.side = pf.side === "sell" ? "sell" : "buy"; st.execution = "limit";
      st.amount = String(pf.qty || ""); st.price = String(pf.price || "");
      st.aiNote = `این مقادیر پیشنهاد هوش مصنوعی هستند (${st.side === "buy" ? "خرید" : "فروش"} ${st.coinId.toUpperCase()}). می‌توانید هر کدام را تغییر دهید؛ سفارش فقط پس از پیش‌نمایش و تأیید خودتان ثبت می‌شود.`;
    }
    loadBook();

    const coin = () => coins.find(c => c.id === st.coinId);
    const fmtAmount = (n) => { let s = Number(n).toFixed(8); return s.includes(".") ? s.replace(/0+$/,"").replace(/\.$/,"") : s; };

    async function loadBook(){
      try{ book = (await Api.getOrderbook(st.coinId)).data; }catch(e){ book = null; }
      paint();
    }

    function balanceInfo(){
      if(!assets) return { text:"نامشخص (دریافت موجودی ممکن نشد)", value:null };
      const key = st.side === "buy" ? "irt" : st.coinId;
      const a = assets.find(x => x.coinId === key);
      const v = a ? a.available : 0;
      return { value:v, text: st.side === "buy" ? Utils.formatPrice(v, "تومان") : `${Utils.formatNumber(v,{decimals:8})} ${st.coinId.toUpperCase()}` };
    }

    function estimate(){
      const amt = Number(st.amount); const c = coin();
      if(!(amt > 0)) return null;
      if(st.execution === "limit"){ const p = Number(st.price); return p > 0 ? amt * p : null; }
      const unit = (st.side === "buy" ? c.bestSell : c.bestBuy) || c.price; return amt * unit;
    }

    function paint(){
      body.innerHTML = "";
      const c = coin();
      const enabled = cfg && cfg.tradingEnabled;
      body.appendChild(Utils.el("div", { class:"notice-box", style:"margin-bottom:14px;" }, [
        Utils.el("div", { html: ic("shield") }),
        Utils.el("p", {}, !cfg

            ? "ثبت سفارش واقعی روی سرور فعال است. هر سفارش با پول واقعی انجام می‌شود و پیش از ارسال باید صریحاً تأیید شود."
            : "ثبت سفارش واقعی روی سرور غیرفعال است. می‌توانید سفارش را آماده و پیش‌نمایش کنید، اما ارسال نمی‌شود."),

        Utils.el("div", { html: ic("bot") }), Utils.el("p", {}, st.aiNote)]));

      const grid = Utils.el("div", { class:"coin-grid" });
      const form = Utils.el("div", { class:"card card-pad" });
      const side = Utils.el("div", { style:"display:flex;flex-direction:column;gap:14px;" });
      grid.append(form, side); body.appendChild(grid);

      form.appendChild(Utils.el("div", { class:"field" }, [
        Utils.el("label", {}, "بازار"),
        UI.dropdown({ value: st.coinId, title:"انتخاب بازار", options: coins.map(x => ({ value:x.id, label:`${x.name} (${x.symbol})` })),
          onChange:(v) => { st.coinId = v; st.price = ""; loadBook(); } }),
      ]));
      form.appendChild(Utils.el("div", { class:"tabs", style:"margin-top:12px;" }, [
        Utils.el("button", { class:`tab-btn ${st.side==="buy"?"active":""}`, onClick:() => { st.side = "buy"; paint(); } }, "خرید"),
        Utils.el("button", { class:`tab-btn ${st.side==="sell"?"active":""}`, onClick:() => { st.side = "sell"; paint(); } }, "فروش"),
      ]));
      form.appendChild(Utils.el("div", { class:"tabs", style:"margin-top:8px;" }, [
        Utils.el("button", { class:`tab-btn ${st.execution==="limit"?"active":""}`, onClick:() => { st.execution = "limit"; paint(); } }, "سفارش محدود"),
        Utils.el("button", { class:`tab-btn ${st.execution==="market"?"active":""}`, onClick:() => { st.execution = "market"; paint(); } }, "سفارش بازار"),
      ]));

      const amountInput = Utils.el("input", { class:"input num", inputmode:"decimal", placeholder:"مثلاً 0.001", value: st.amount, autocomplete:"off",
        onInput:(e) => { st.amount = e.target.value.trim(); updateEstimate(); } });
      form.appendChild(Utils.el("div", { class:"field", style:"margin-top:12px;" }, [
        Utils.el("label", {}, `مقدار (${st.coinId.toUpperCase()})`), amountInput,

          onInput:(e) => { st.price = e.target.value.trim(); updateEstimate(); } });
        form.appendChild(Utils.el("div", { class:"field", style:"margin-top:12px;" }, [
          Utils.el("label", {}, "قیمت (تومان)"), priceInput,
          Utils.el("button", { class:"btn btn-ghost btn-sm", style:"margin-top:6px;align-self:flex-start;",
            onClick:() => { st.price = String(c.price); priceInput.value = st.price; updateEstimate(); } }, "قیمت لحظه‌ای بازار"),
        ]));
      }

      const est = Utils.el("div", { class:"info-row", style:"margin-top:12px;" });
      form.appendChild(est);
      function updateEstimate(){
        const e = estimate();
        est.innerHTML = "";
        est.append(Utils.el("span", { class:"k" }, st.execution === "limit" ? "مبلغ سفارش" : "مبلغ تقریبی سفارش"),
          Utils.el("span", { class:"v num" }, e === null ? "—" : Utils.formatPrice(e, "تومان")));
      }
      updateEstimate();

      form.appendChild(Utils.el("div", { class:"info-row" }, [
        Utils.el("span", { class:"k" }, st.side === "buy" ? "موجودی تومانی قابل‌استفاده" : "موجودی قابل‌فروش"),
        Utils.el("span", { class:"v num" }, balanceInfo().text),
      ]));

      const msg = Utils.el("div", { class:"connect-status error", style:"display:none;margin-top:10px;" });
      form.appendChild(msg);
      form.appendChild(Utils.el("button", { class:"btn btn-primary btn-block", style:"margin-top:14px;height:44px;", disabled: busy ? "true" : false,
        onClick: async () => {
          const o = { coinId: st.coinId, side: st.side, execution: st.execution, amount: st.amount, price: st.execution === "limit" ? st.price : null };

          if(o.execution === "limit" && !(Number(o.price) > 0)) return fail("قیمت را وارد کنید.");
          if(bal.value !== null){
            if(st.side === "sell" && Number(o.amount) > bal.value) return fail("مقدار از موجودی قابل‌فروش بیشتر است.");
            if(st.side === "buy" && e !== null && e > bal.value) return fail("مبلغ سفارش از موجودی تومانی بیشتر است.");
          }
          msg.style.display = "none";
          try{ openPreview(await Api.previewOrder(o)); }

      // ستون کناری: قیمت و دفتر سفارش‌ها
      side.appendChild(Utils.el("div", { class:"card card-pad" }, [
        Utils.el("div", { class:"card-title" }, `${c.name} — قیمت لحظه‌ای`),
        Utils.el("div", { class:"coin-price num", style:"margin-top:8px;" }, Utils.formatPrice(c.price, "")),
        Utils.el("div", { class:"text-faint", style:"font-size:12px;margin-top:4px;" },

      const backdrop = Utils.el("div", { class:"modal-backdrop" });

      backdrop.appendChild(modal);
      let confirmed = false, sending = false, done = false;

      const row = (k, v) => Utils.el("div", { class:"info-row" }, [ Utils.el("span", { class:"k" }, k), Utils.el("span", { class:"v num" }, v) ]);

      function render(result){
        modal.innerHTML = "";
        modal.appendChild(Utils.el("h3", {}, result ? "نتیجه‌ی سفارش" : "تأیید نهایی سفارش"));
        if(result){
          modal.appendChild(Utils.el("p", {}, result.text));
          if(result.row){
            modal.appendChild(row("شناسه سفارش", result.row.id));

          modal.appendChild(Utils.el("div", { class:"modal-actions" }, [
            Utils.el("button", { class:"btn btn-outline", onClick:() => backdrop.remove() }, "بستن"),

          ]));
          return;
        }
        modal.appendChild(row("بازار", sm.market));
        modal.appendChild(row("جهت", sm.side === "buy" ? "خرید" : "فروش"));
        modal.appendChild(row("نوع سفارش", sm.execution === "limit" ? "محدود (Limit)" : "بازار (Market)"));
        modal.appendChild(row("مقدار", `${sm.amount} ${st.coinId.toUpperCase()}`));
        modal.appendChild(row("قیمت", sm.price ? Utils.formatPrice(Number(sm.price), "تومان") : "بهترین قیمت بازار"));
        modal.appendChild(row(sm.execution === "limit" ? "مبلغ سفارش" : "مبلغ تقریبی", Utils.formatPrice(sm.estimateIrt, "تومان")));
        (pv.warnings || []).forEach(w => modal.appendChild(Utils.el("p", { class:"text-faint", style:"font-size:12px;margin-top:8px;" }, w)));

        if(!pv.tradingEnabled){
          modal.appendChild(Utils.el("div", { class:"notice-box", style:"margin-top:12px;" }, [
            Utils.el("div", { html: ic("shield") }),
            Utils.el("p", {}, "ثبت سفارش واقعی روی سرور غیرفعال است؛ این فقط یک پیش‌نمایش است و هیچ سفارشی ارسال نمی‌شود."),
          ]));
          modal.appendChild(Utils.el("div", { class:"modal-actions" }, [
            Utils.el("button", { class:"btn btn-outline", onClick:() => backdrop.remove() }, "بستن") ]));
          return;
        }
        const chk = Utils.el("input", { type:"checkbox", onChange:(e) => { confirmed = e.target.checked; send.disabled = !confirmed || sending; } });
        modal.appendChild(Utils.el("label", { style:"display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:13px;cursor:pointer;" }, [
          chk, Utils.el("span", {}, "مطمئنم که این یک سفارش واقعی با پول واقعی است و جزئیات بالا را بررسی کرده‌ام."),
        ]));
        const send = Utils.el("button", { class:"btn btn-primary", disabled:"true", onClick: async () => {

const PageSettings = {
  mount(container){
    container.innerHTML = "";
    container.appendChild(Utils.el("div", { class:"page-head" }, [
      Utils.el("div", {}, [
        Utils.el("h1", {}, "تنظیمات"),
        Utils.el("div", { class:"sub" }, "شخصی‌سازی نمایش و رفتار برنامه"),
      ]),
    ]));

    const s = State.get().settings;
    const card = Utils.el("div", { class:"q-set-group q-stagger" });
    container.appendChild(card);

    // ---- اتصال حساب روبیکا: وضعیت‌ها = متصل نیست / در انتظار اتصال / متصل / قطع اتصال ----
    const rubikaBox = Utils.el("div", {});
    const rb = { st:null, start:null, busy:false, confirmDisc:false };
    const RB_BADGE = { not_connected:["badge-gray","حساب روبیکا متصل نیست"], pending:["badge-amber","در انتظار اتصال"], connected:["badge-green","حساب روبیکا متصل است"], disconnected:["badge-gray","قطع اتصال"] };
    async function rbLoad(){ try{ rb.st = await Api.rubikaStatus(); if(rb.st.status !== "pending") rb.start = null; }catch(e){ if(!rb.st) rb.st = { available:false }; } rbPaint(); }
    async function rbAct(fn, okTitle){
      if(rb.busy) return; rb.busy = true; rb.confirmDisc = false; rbPaint();
      try{ const r = await fn(); if(r && r.code){ rb.start = r; rb.st = { available:true, status:"pending", botUsername:r.botUsername, pendingExpiresAt:r.expiresAt }; } else { rb.start = null; await rbLoad(); } if(okTitle) Toast.success(okTitle); }
      catch(e){ Toast.error("عملیات انجام نشد", Utils.friendlyError(e)); }
      rb.busy = false; rbPaint();
    }
    function rbPaint(){
      rubikaBox.innerHTML = "";
      const st = rb.st; if(!st || st.available === false) return; // در سرور فعال نیست یا هنوز بارگذاری نشده
      const kind = RB_BADGE[st.status] ? st.status : "not_connected";
      const btn = (label, cls, onClick) => Utils.el("button", { class:"btn btn-sm " + cls, disabled: rb.busy ? "disabled" : null, onClick }, label);
      const actions = [Utils.el("span", { class:"badge " + RB_BADGE[kind][0] }, RB_BADGE[kind][1])];
      if(kind === "connected"){
        actions.push(rb.confirmDisc
          ? btn("تأیید قطع اتصال", "btn-danger-ghost", () => rbAct(Api.rubikaDisconnect, "اتصال روبیکا قطع شد"))
          : btn("قطع اتصال", "btn-ghost", () => { rb.confirmDisc = true; rbPaint(); setTimeout(() => { if(rb.confirmDisc){ rb.confirmDisc = false; rbPaint(); } }, 5000); }));
      } else if(kind === "pending"){
        actions.push(btn("کد جدید", "btn-ghost", () => rbAct(Api.rubikaStart)), btn("لغو", "btn-ghost", () => rbAct(Api.rubikaDisconnect)));
      } else {
        actions.push(btn("اتصال", "btn-primary", () => rbAct(Api.rubikaStart)));
      }
      const desc = kind === "connected" ? "کد ورود به‌جای پیامک در ربات روبیکا برایتان ارسال می‌شود"
        : kind === "pending" ? "ربات را در روبیکا Start کنید یا کد اتصال را برای آن بفرستید"
        : kind === "disconnected" ? (st.disconnectReason === "bot_stopped" ? "اتصال قطع شد (ربات در روبیکا متوقف شد)" : st.disconnectReason === "delivery_failed" ? "اتصال قطع شد (ارسال پیام به این چت ممکن نبود)" : "اتصال قطع شد؛ کد ورود دوباره با پیامک می‌آید")
        : "کد ورود از طریق ربات روبیکا دریافت کنید";
      rubikaBox.appendChild(settingRow("اتصال حساب روبیکا", desc, Utils.el("div", { style:"display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;" }, actions)));
      if(kind === "pending"){
        const sx = rb.start;
        const copyBtn = sx && Utils.el("button", { class:"btn btn-ghost btn-sm", onClick: () => { try{ navigator.clipboard.writeText(sx.code.replace(/-/g, "")); Toast.success("کپی شد"); }catch(_){} } }, "کپی کد");

    );
    document.body.appendChild(panel);
    feedEl.appendChild(UI.skeletonRows(4));
    fab.classList.add("open"); fab.classList.remove("has-unread");
    if(last){ renderFeed(last); setSeen(last.serverTime); }
    load().then(() => { if(last) setSeen(last.serverTime); });
    timer = setInterval(load, 15000);
  }
  function close(){
    if(!open) return; open = false;
    if(last) setSeen(last.serverTime);
    if(timer){ clearInterval(timer); timer = null; }
    if(panel){ panel.remove(); panel = null; feedEl = null; }
    if(fab) fab.classList.remove("open");
  }
  function stop(){ close(); if(badgeTimer){ clearInterval(badgeTimer); badgeTimer = null; } }

  function mount(host){
    stop(); last = null;
    fab = E("button", { class:"ai-fab", "aria-label":"گزارش هوش مصنوعی معاملاتی", title:"هوش مصنوعی معاملاتی", html: ic("bot") + '<span class="ai-fab-dot"></span>', onClick:() => (open ? close() : openPanel()) });
    host.appendChild(fab);
    load();
    badgeTimer = setInterval(() => { if(!document.body.contains(fab)){ stop(); return; } if(!open) load(); }, 60000);
  }
  return { mount, close };
})();

const App = (() => {
  const root = document.getElementById("app");
  let refreshTimer = null;

  function buildShell(){
    root.innerHTML = "";
    root.className = ""; // کلاس connect-shell (با padding:24px) از صفحه‌ی ورود/اتصال نباید روی داشبورد بماند

    const scrim = Utils.el("div", { class:"sidebar-scrim", onClick: closeSidebar });
    const sidebar = Utils.el("aside", { class:"sidebar" });
    sidebar.appendChild(Utils.el("div", { class:"brand" }, [
      Utils.el("div", { class:"brand-mark" }, Utils.el("img", { src:"img/logo.png", alt:"QAIRO" })),
      Utils.el("div", {}, [
        Utils.el("div", { class:"brand-name" }, "QAIRO"),
      ]),
    ]));

    const navGroup = Utils.el("div", { class:"nav-group" });
    NAV_ITEMS.forEach((item, index) => {
      navGroup.appendChild(Utils.el("div", {
        class:"nav-item nx-nav-reveal", "data-key":item.key,
        style:`--nx-nav-delay:${120 + index * 75}ms`,
        html: ic(item.icon) + `<span>${item.label}</span>`,
        onClick: () => { Router.go(item.key); closeSidebar(); },
      }));
    });
    sidebar.appendChild(navGroup);

    sidebar.appendChild(Utils.el("div", { class:"sidebar-foot" }, [
      Utils.el("div", { class:"nav-item", html: ic("unlink") + `<span>قطع اتصال و خروج</span>`, onClick: handleLogout }),
    ]));

    const sidebarLayer = Utils.el("div", { class:"sidebar-layer" }, [sidebar]);

    const main = Utils.el("main", { class:"main" });
    const topbar = Utils.el("header", { class:"topbar" }, [
      Utils.el("div", { class:"topbar-left" }, [
        Utils.el("button", { class:"menu-btn", html: ic("menu"), onClick: openSidebar }),
        Utils.el("div", { class:"topbar-title" }, [
          Utils.el("div", { class:"q-brand" }, [
            Utils.el("img", { src:"img/logo.png", alt:"" }),
            Utils.el("b", {}, "Qairo"), Utils.el("i", {}, "|"), Utils.el("span", { class:"fa" }, "کایــرو"),
          ]),
          Utils.el("small", { class:"q-page-sub", id:"pageTitle" }, ""),
        ]),
      ]),
      Utils.el("div", { class:"topbar-right" }, [
        Utils.el("span", { id:"connBadge" }),
        Utils.el("button", { class:"icon-btn", title:"پروفایل", html: ic("profile"), onClick: () => Router.go("profile") }),
      ]),
    ]);

    const content = Utils.el("div", { class:"content", id:"pageContent" });
    main.append(topbar, content);

    const bottomNav = Utils.el("nav", { class:"bottom-nav" });
    ["dashboard","market","ai","wallet","settings"].forEach(key => {
      const item = NAV_ITEMS.find(n => n.key === key);
      const center = key === "ai";
      bottomNav.appendChild(Utils.el("div", {
        class:"bn-item" + (center ? " bn-center" : ""), "data-key":key,
        html: center ? `<div class="bn-orb"><img src="img/ai.png" alt="AI"></div><span class="bn-lbl">${item.label}</span>` : ic(item.icon) + `<span>${item.label}</span>`,
        onClick: () => Router.go(key),
      }));
    });

    const shell = Utils.el("div", { class:"shell" }, [main, sidebarLayer]);
    root.append(shell, scrim, bottomNav);
    shell.classList.add("nx-shell-enter"); bottomNav.classList.add("nx-shell-enter");
    window.setTimeout(() => { shell.classList.remove("nx-shell-enter"); bottomNav.classList.remove("nx-shell-enter"); }, 1100);
    AIChat.mount(root); // دکمه‌ی شناور گزارش هوش مصنوعی

    updateConnBadge();
  }

  function openSidebar(){ document.querySelector(".sidebar").classList.add("open"); document.querySelector(".sidebar-scrim").classList.add("open"); }
  function closeSidebar(){ document.querySelector(".sidebar")?.classList.remove("open"); document.querySelector(".sidebar-scrim")?.classList.remove("open"); }

  function updateConnBadge(){
    const badge = document.getElementById("connBadge");
    const lastUpdate = document.getElementById("lastUpdate");
    if(!badge) return;
    badge.innerHTML = "";
    badge.appendChild(UI.statusBadge(State.get().connection.status));
    if(lastUpdate){
      lastUpdate.textContent = State.get().connection.lastChecked
        ? `به‌روزرسانی ${Utils.timeAgo(State.get().connection.lastChecked)}`
        : "";
    }
  }

  function setActiveNav(name){
    const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.querySelectorAll(".nav-item[data-key]").forEach((n, i) => {
      const active = n.dataset.key === name; n.classList.toggle("active", active);
      if(active) n.setAttribute("aria-current", "page"); else n.removeAttribute("aria-current");
      n.classList.remove("nx-nav-stagger"); n.style.setProperty("--nx-nav-delay", `${Math.min(i * 32, 320)}ms`);
      if(!reducedMotion){ void n.offsetWidth; n.classList.add("nx-nav-stagger"); }
    });
    document.querySelectorAll(".bn-item[data-key]").forEach(n => {
      const active = n.dataset.key === name; n.classList.toggle("active", active);
      if(active) n.setAttribute("aria-current", "page"); else n.removeAttribute("aria-current");
    });
    const title = document.getElementById("pageTitle");
    if(title) title.textContent = name === "dashboard" ? "" : (PAGE_TITLES[name] || "");
  }

  let currentRoute = null;

  async function refreshCurrentPage(){
    const btn = document.getElementById("refreshBtn");
    if(btn) btn.classList.add("spin");
    await Api.checkConnection();
    updateConnBadge();
    if(currentRoute) await currentRoute.page.mount(document.getElementById("pageContent"), currentRoute.params);
    if(btn) btn.classList.remove("spin");
    Toast.success("به‌روزرسانی شد", "اطلاعات صفحه به‌روزرسانی شد.");
  }

  async function handleLogout(){
    await Api.disconnect();
    AppAuth.logout();
    closeSidebar();
    Router.go("welcome");
  }

  let pageTransitionToken = 0;

  function playPageEnter(el){
    if(!el) return;
    el.classList.remove("page-enter", "nx-assembling");
    const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const pieces = Array.from(el.children);
    el.querySelectorAll("tbody tr").forEach((row, i) => {
      row.classList.remove("nx-row-reveal");
      row.style.setProperty("--nx-row-delay", `${Math.min(i * 42, 720)}ms`);
      if(!reduced){ void row.offsetWidth; row.classList.add("nx-row-reveal"); }
    });
    el.querySelectorAll(".chart-canvas-wrap, .chart-container, .chart-wrap, .portfolio-chart-wrap").forEach((chart, i) => {
      chart.style.setProperty("--nx-chart-delay", `${120 + Math.min(i * 70, 280)}ms`);
    });
    el.querySelectorAll("button, .btn, [role=button]").forEach(btn => btn.classList.add("nx-interactive"));
    pieces.forEach((piece, i) => {
      piece.classList.add("nx-piece");
      piece.style.setProperty("--nx-delay", `${Math.min(i * 85, 680)}ms`);
      piece.style.setProperty("--nx-duration", `${680 + Math.min(i * 25, 180)}ms`);
      Array.from(piece.children).forEach((child, j) => { // اجزای داخلی هر بخش، کوتاه و پشت‌سرهم ظاهر می‌شوند
        if(child.nodeType === 1 && !child.matches("script,style")){
          child.classList.add("nx-child");
          child.style.setProperty("--nx-child-delay", `${90 + j * 65}ms`);
        }
      });
    });
    void el.offsetWidth;
    if(!reduced) el.classList.add("nx-assembling");
    if(!reduced) window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function startAutoRefresh(){
    if(refreshTimer) clearInterval(refreshTimer);
    const sec = State.get().settings.refreshInterval || 60;
    refreshTimer = setInterval(async () => {
      if(State.get().connection.status !== "connected") return;
      await Api.checkConnection();
      updateConnBadge();
    }, sec * 1000);
  }

  const AUTH_ROUTES = ["welcome", "auth-phone", "auth-otp", "auth-password"];

  function onRouteChange(route){
    const accountReady = State.get().account.loggedIn;
    const exchangeConnected = State.get().connection.status === "connected";

    // مرحله ۱: ابتدا باید وارد حساب برنامه شود (شماره موبایل → کد → رمز)
    if(!accountReady){
      if(refreshTimer) clearInterval(refreshTimer);
      if(route.name === "auth-otp" && !AuthFlow.phone){ Router.go("auth-phone"); return; }
      if(route.name === "auth-password" && !AuthFlow.otpVerified){ Router.go("auth-phone"); return; }
      root.innerHTML = "";
      const page = route.name === "welcome" ? PageWelcome
        : route.name === "auth-otp" ? PageAuthOtp
        : route.name === "auth-password" ? PageAuthPassword
        : PageAuthPhone;
      page.mount(root);
      return;
    }

    // مرحله ۲: بعد از ورود، باید حساب صرافی متصل شود
    if(!exchangeConnected){
      if(refreshTimer) clearInterval(refreshTimer);
      root.innerHTML = "";
      PageConnect.mount(root);
      return;
    }

    // مرحله ۳: هر دو انجام شده — اگر کاربر دستی به مسیرهای ورود/اتصال برگردد، به داشبورد هدایتش کن
    if(AUTH_ROUTES.includes(route.name) || route.name === "connect"){
      Router.go("dashboard");
      return;
    }

    if(!root.querySelector(".shell")) buildShell();
    const previousRoute = currentRoute;
    currentRoute = route;
    document.querySelectorAll(".q-trade-bar").forEach(n => n.remove());
    setActiveNav(route.name);
    updateConnBadge();
    const content = document.getElementById("pageContent");
    const routeToken = ++pageTransitionToken;
    const mountNext = () => {
      if(routeToken !== pageTransitionToken) return; // مسیر جدیدتری آمده؛ این یکی را رها کن
      route.page.mount(content, route.params);
      playPageEnter(content);
      content.classList.remove("nx-page-exit");
      content.classList.add("nx-page-enter");
      window.setTimeout(() => content.classList.remove("nx-page-enter"), 760);
    };
    const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(!reduced && content.childElementCount && previousRoute && previousRoute.name !== route.name){
      content.classList.remove("nx-page-enter"); content.classList.add("nx-page-exit");
      window.setTimeout(mountNext, 190);
    } else {
      mountNext();
    }
  }

  async function init(){
    ThemeManager.apply();
    await Api.restore(); // اگر نشست معتبر (۱۲ ساعته) در همین تب باشد، بدون پیامک دوباره وارد می‌شویم
    Router.start(onRouteChange);
    startAutoRefresh();
    State.subscribe((s) => {
      updateConnBadge();
    });
  }

  return { init };
})();

window.__qairoStart = () => { if(window.__qairoStarted) return; window.__qairoStarted = true; App.init(); };
// اگر به هر دلیل اسپلش شروع را صدا نزد، برنامه خودش بالا بیاید
window.addEventListener("load", () => setTimeout(() => window.__qairoStart(), 8000));
</script>
</body>
</html>
