<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QAIRO — هوش مصنوعی معاملات ارز دیجیتال</title>
<meta name="description" content="داشبورد شخصی مدیریت و تحلیل دارایی‌های ارز دیجیتال">
<meta name="theme-color" content="#040818">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   توکن‌های طراحی
   =================================================================== */
:root{
  --bg:            #080b13;
  --bg-soft:       #0c1019;
  --surface:       #141c2e;
  --surface-raised:#182236;
  --surface-2:     #1a243899;
  --surface-hover: #1e2a42;
  --border:        #2a3550;
  --border-soft:   #212c44;
  --border-strong: #37456655;

  --accent:        #1ed4bf;
  --accent-strong: #0eb8a3;
  --accent-dim:    #129688;
  --accent-soft:   #1ed4bf1f;
  --accent-soft-strong: #1ed4bf33;
  --blue:          #5b93ff;
  --blue-soft:     #5b93ff1f;

  --green:         #29c080;
  --green-strong:  #1fa06a;
  --green-soft:    #29c0801f;
  --red:           #ea4f60;
  --red-strong:    #d23f50;
  --red-soft:      #ea4f601f;
  --amber:         #e2a23c;
  --amber-soft:    #e2a23c1f;

  --text:          #eef2f9;
  --text-dim:      #9aa7c4;
  --text-faint:    #4d5872;

  --radius-sm:     9px;
  --radius-md:     13px;
  --radius-lg:     18px;

  --shadow-card:   0 1px 0 0 #ffffff08 inset, 0 1px 0 0 #00000030, 0 14px 34px -16px #000000a0;
  --shadow-raised: 0 1px 0 0 #ffffff0c inset, 0 24px 60px -20px #000000c0, 0 2px 8px -2px #00000090;
  --shadow-pop:    0 30px 80px -24px #000000e0, 0 2px 10px -2px #000000a0;

  --sidebar-w:     248px;
  --topbar-h:      72px;

  --ease: cubic-bezier(.4,0,.2,1);
  --ease-pop: cubic-bezier(.2,.9,.3,1.2);
}

[data-theme="light"]{
  --bg:            #eef1f7;
  --bg-soft:       #e7ebf3;
  --surface:       #ffffff;
  --surface-raised:#ffffff;
  --surface-2:     #ffffffcc;
  --surface-hover: #f1f4fa;
  --border:        #d8dfec;
  --border-soft:   #e4e9f2;
  --border-strong: #c4ccdd88;
  --accent:        #0ea89a;
  --accent-strong: #0b8f84;
  --accent-dim:    #0a7a71;
  --accent-soft:   #0ea89a1f;
  --accent-soft-strong: #0ea89a38;
  --blue-soft:     #3568e01f;
  --green:         #1aa366;
  --green-strong:  #148a56;
  --green-soft:    #1aa3661e;
  --red:           #d8394d;
  --red-strong:    #c22b3e;
  --red-soft:      #d8394d1a;
  --amber-soft:    #c7860f22;
  --text:          #141b2c;
  --text-dim:      #5c6782;
  --text-faint:    #8891a8;
  --shadow-card:   0 1px 0 0 #ffffff inset, 0 1px 2px 0 #1a233a10, 0 16px 32px -18px #1a233a30;
  --shadow-raised: 0 1px 0 0 #ffffff inset, 0 30px 60px -20px #1a233a40;
  --shadow-pop:    0 30px 70px -20px #1a233a55;
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; max-width:100%; overflow-x:hidden; }
body{
  margin:0;
  width:100%;
  touch-action:pan-y;
  background:
    radial-gradient(1200px 600px at 100% -8%, #1ed4bf0d, transparent 55%),
    radial-gradient(900px 500px at -10% 15%, #5b93ff08, transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  font-family:"Vazirmatn", "Vazirmatn FD", sans-serif;
  font-size:15px;
  line-height:1.7;
  direction:rtl;
  -webkit-font-smoothing:antialiased;
  transition:background-color .25s var(--ease), color .25s var(--ease);
}

img{ max-width:100%; display:block; }
button{ font-family:inherit; }
input,select{ font-family:inherit; }
a{ color:inherit; text-decoration:none; }

::selection{ background:var(--accent-soft-strong); color:var(--accent); }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
::-webkit-scrollbar-thumb:hover{ background:var(--text-faint); }

:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
  border-radius:4px;
  transition:outline-offset .1s var(--ease);
}

.num{
  direction:ltr;
  unicode-bidi:isolate;
  font-variant-numeric:tabular-nums;
}

.mono-num{
  direction:ltr;
  unicode-bidi:isolate;
  font-variant-numeric:tabular-nums;
}

h1,h2,h3,h4{ margin:0; font-weight:700; letter-spacing:0; }
p{ margin:0; }

.text-dim{ color:var(--text-dim); }
.text-faint{ color:var(--text-faint); }
.text-green{ color:var(--green); }
.text-red{ color:var(--red); }

.up{ color:var(--green); }
.down{ color:var(--red); }

.sr-only{
  position:absolute; width:1px; height:1px;
  padding:0; margin:-1px; overflow:hidden;
  clip:rect(0,0,0,0); white-space:nowrap; border:0;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}
/* ===================================================================
   اسکلت برنامه
   =================================================================== */
#app{ min-height:100%; max-width:100vw; overflow-x:hidden; }

@keyframes page-enter-anim{ from{ opacity:0; transform:translateY(22px) scale(.98); } to{ opacity:1; transform:none; } }
.page-enter > *{ animation:page-enter-anim .5s var(--ease-pop) both; }
.page-enter > *:nth-child(1){ animation-delay:.02s; }
.page-enter > *:nth-child(2){ animation-delay:.08s; }
.page-enter > *:nth-child(3){ animation-delay:.14s; }
.page-enter > *:nth-child(4){ animation-delay:.2s; }
.page-enter > *:nth-child(n+5){ animation-delay:.25s; }

/* ---------- صفحه اتصال (بدون سایدبار) ---------- */
.connect-shell{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(1100px 500px at 85% -10%, #1ed4bf1c, transparent 60%),
    radial-gradient(900px 500px at 10% 110%, #5b93ff14, transparent 60%),
    transparent;
}

/* ---------- داشبورد (با سایدبار) ---------- */
.shell{
  display:grid;
  grid-template-columns: 1fr var(--sidebar-w);
  min-height:100vh;
}

/* در دسکتاپ این لایه خودش ستون دوم گرید .shell است (یک جعبه‌ی
   معمولی)؛ سایدبار داخلش کل عرض/ارتفاع را پر می‌کند. تنها زیر ۸۶۰px
   این لایه به یک جعبه‌ی fixed تمام‌صفحه تبدیل می‌شود تا سایدبار واقعاً
   نسبت به صفحه‌نمایش (نه نسبت به کل سند قابل‌اسکرول) جابه‌جا شود —
   از display:contents به‌عمد استفاده نشده چون در برخی WebViewها
   به‌درستی پشتیبانی نمی‌شود. */
.sidebar-layer{ grid-column:2; }

.sidebar{
  width:100%;
  border-inline-start:1px solid var(--border-soft);
  background:linear-gradient(180deg, var(--bg-soft), var(--bg));
  padding:20px 16px;
  display:flex;
  flex-direction:column;
  gap:4px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:8px 10px 22px;
}
.brand-mark{
  width:36px; height:36px; border-radius:11px;
  background:linear-gradient(135deg, var(--accent), var(--blue));
  display:flex; align-items:center; justify-content:center;
  color:#04201c; font-weight:700; font-size:15px;
  flex:none;
  box-shadow:0 1px 0 0 #ffffff40 inset, 0 6px 16px -6px #1ed4bf80;
}
.brand-name{ font-weight:700; font-size:15px; }
.brand-sub{ font-size:11px; color:var(--text-faint); margin-top:1px; }

.nav-group{ margin-bottom:10px; }
.nav-label{
  font-size:11px; color:var(--text-faint); padding:10px 10px 6px;
}
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:11px 13px;
  border-radius:var(--radius-sm);
  color:var(--text-dim);
  font-size:13.5px;
  font-weight:500;
  cursor:pointer;
  transition:background .15s var(--ease), color .15s var(--ease), transform .15s var(--ease);
  position:relative;
}
.nav-item .ic{ width:18px; height:18px; flex:none; opacity:.75; transition:opacity .15s var(--ease); }
.nav-item:hover{ background:var(--surface-hover); color:var(--text); transform:translateX(-2px); }
[dir="rtl"] .nav-item:hover{ transform:translateX(2px); }
.nav-item:hover .ic{ opacity:1; }
.nav-item.active{
  background:linear-gradient(90deg, var(--accent-soft-strong), var(--accent-soft) 70%, transparent);
  color:var(--accent);
  font-weight:700;
}
.nav-item.active .ic{ opacity:1; }
.nav-item.active::before{
  content:"";
  position:absolute; inset-inline-end:-16px; top:50%; transform:translateY(-50%);
  width:3px; height:20px; border-radius:3px;
  background:var(--accent);
  box-shadow:0 0 10px 1px var(--accent-soft-strong);
}

.sidebar-foot{
  margin-top:auto;
  padding-top:14px;
  border-top:1px solid var(--border-soft);
}

/* ---------- محتوای اصلی ---------- */
.main{
  grid-column:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:var(--topbar-h);
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  gap:14px;
  padding:0 26px;
  background:var(--bg-soft);
  border-bottom:1px solid var(--border-soft);
  box-shadow:0 1px 0 0 var(--border-soft);
}
.topbar-left{ display:flex; align-items:center; gap:13px; min-width:0; flex:1 1 auto; overflow:hidden; }
.topbar-title{
  font-size:18px; font-weight:800; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; min-width:0;
  letter-spacing:-.01em;
}
.topbar-right{ display:flex; align-items:center; gap:9px; flex:none; }

.menu-btn{
  display:none;
  width:38px; height:38px; border-radius:var(--radius-sm);
  align-items:center; justify-content:center;
  background:var(--surface-hover); border:1px solid var(--border);
  color:var(--text); cursor:pointer;
}

.content{
  flex:1;
  padding:26px 26px 96px;
  max-width:1280px;
  width:100%;
  margin:0 auto;
}

.page-head{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:12px; margin-bottom:22px; flex-wrap:wrap;
}
.page-head h1{ font-size:23px; letter-spacing:-.01em; }
.page-head .sub{ font-size:13px; color:var(--text-faint); margin-top:5px; }

/* ---------- نوار پایین موبایل ---------- */
.bottom-nav{
  display:none;
  position:fixed; inset-inline:0; bottom:0; z-index:30;
  background:var(--bg-soft);
  border-top:1px solid var(--border-soft);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom));
  justify-content:space-around;
}
.bottom-nav .bn-item{
  display:flex; flex-direction:column; align-items:center; gap:4px;
  font-size:10.5px; color:var(--text-faint); font-weight:600;
  padding:7px 10px; border-radius:12px; cursor:pointer;
  transition:background .15s var(--ease), color .15s var(--ease);
}
.bottom-nav .bn-item.active{ color:var(--accent); background:var(--accent-soft); }
.bottom-nav .bn-item .ic{ width:19px; height:19px; }
.bottom-nav .bn-item .ic *{ stroke-width:2.2; }

/* ---------- واکنش‌گرایی ---------- */
@media (max-width: 1020px){
  .sidebar{ width:220px; }
}

@media (max-width: 860px){
  .shell{ grid-template-columns:1fr; }
  /* لایه‌ی مخصوص سایدبار: خودش واقعاً نسبت به viewport فیکس و overflow:hidden
     است، تا سایدبار بسته (که با transform به بیرون می‌رود) هرگز باعث
     اسکرول افقی کل صفحه نشود و همیشه نسبت به صفحه‌نمایش (نه کل سند) ثابت
     بماند — بدون این‌که روی نوار پایین یا toastها که باید دقیقاً نسبت
     به viewport فیکس بمانند اثر بگذارد. */
  .sidebar-layer{
    grid-column:auto;
    position:fixed; inset:0; z-index:50;
    overflow:hidden; pointer-events:none;
  }
  .sidebar{
    position:absolute; inset-inline-end:0; top:0; height:100%;
    width:260px; pointer-events:auto;
    transform:translateX(104%);
    transition:transform .28s var(--ease);
    box-shadow:-20px 0 50px -20px #00000080;
  }
  [dir="rtl"] .sidebar{ transform:translateX(-104%); }
  .sidebar.open{ transform:translateX(0); }
  .sidebar-scrim{
    display:none; position:fixed; inset:0; background:#00000066;
    z-index:40;
  }
  .sidebar-scrim.open{ display:block; }
  .menu-btn{ display:inline-flex; }
  .main{ grid-column:1; }
  .content{ padding:16px 14px 90px; }
  .bottom-nav{ display:flex; }
}

@media (max-width: 520px){
  .topbar{ padding:0 14px; gap:8px; }
  .topbar-title{ font-size:14.5px; }
  #lastUpdate{ display:none; }
}

@media (max-width: 400px){
  .topbar-right{ gap:6px; }
  #connBadge .badge-label{ display:none; }
  #connBadge .badge{ padding:7px; }
}
/* ===================================================================
   کامپوننت‌های پایه
   =================================================================== */

.card{
  background:linear-gradient(180deg, var(--surface-raised), var(--surface));
  border:1px solid var(--border-soft);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
  transition:border-color .2s var(--ease), box-shadow .2s var(--ease), transform .2s var(--ease);
}
.card-pad{ padding:22px; }
.card-head{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; margin-bottom:16px;
}
.card-title{ font-size:14.5px; font-weight:600; letter-spacing:.01em; }
.card-title .sub{ font-size:11.5px; color:var(--text-faint); font-weight:400; margin-top:2px; }

.kpi-card{ transition:transform .2s var(--ease-pop), border-color .2s var(--ease), box-shadow .2s var(--ease); }
.kpi-card:hover{ transform:translateY(-3px); border-color:var(--border-strong); box-shadow:var(--shadow-raised); }

/* ---------- دکمه‌ها ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  height:40px; padding:0 17px;
  border-radius:var(--radius-sm);
  border:1px solid transparent;
  font-size:13.5px; font-weight:600;
  cursor:pointer;
  transition:transform .14s var(--ease), background .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease), opacity .15s, filter .15s;
  white-space:nowrap;
}
.btn:active{ transform:scale(.96); }
.btn:disabled{ opacity:.42; filter:saturate(.5); cursor:not-allowed; transform:none; box-shadow:none; }

.btn-primary{
  background:linear-gradient(180deg, var(--accent), var(--accent-strong));
  color:#04201c;
  box-shadow:0 1px 0 0 #ffffff33 inset, 0 8px 20px -10px #1ed4bf70;
}
.btn-primary:hover:not(:disabled){ filter:brightness(1.07); box-shadow:0 1px 0 0 #ffffff33 inset, 0 10px 26px -10px #1ed4bf90; transform:translateY(-1px); }

.btn-ghost{ background:var(--surface-hover); color:var(--text); border-color:var(--border); }
.btn-ghost:hover:not(:disabled){ background:var(--border-soft); border-color:var(--border-strong); }

.btn-outline{ background:transparent; color:var(--text-dim); border-color:var(--border); }
.btn-outline:hover:not(:disabled){ color:var(--text); border-color:var(--accent-dim); background:var(--accent-soft); }

.btn-danger-ghost{ background:var(--red-soft); color:var(--red); }
.btn-danger-ghost:hover:not(:disabled){ background:#ea4f602e; }

.btn-sm{ height:33px; padding:0 13px; font-size:12.5px; }
.btn-icon{ width:40px; padding:0; flex:none; }
.btn-block{ width:100%; }

.btn .spin{
  width:14px; height:14px; border-radius:50%;
  border:2px solid currentColor; border-inline-end-color:transparent;
  animation:spin .7s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---------- فرم‌ها ---------- */
.field{ display:flex; flex-direction:column; gap:7px; }
.field label{ font-size:12.5px; color:var(--text-dim); font-weight:600; }
.field-hint{ font-size:11.5px; color:var(--text-faint); }
.field-error{ font-size:11.5px; color:var(--red); display:flex; align-items:center; gap:5px; }

.input-wrap{ position:relative; display:flex; align-items:center; }
.input{
  width:100%; height:46px;
  background:var(--bg-soft);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  color:var(--text);
  padding:0 14px;
  font-size:13.5px;
  outline:none;
  transition:border-color .15s var(--ease), background .15s var(--ease), box-shadow .15s var(--ease);
}
.input::placeholder{ color:var(--text-faint); }
.input:focus{ border-color:var(--accent); background:var(--surface); box-shadow:0 0 0 3px var(--accent-soft); }
.input.has-error{ border-color:var(--red); }
.input-wrap.api-field .input{ padding-left:84px; font-family:monospace; letter-spacing:.3px; direction:ltr; text-align:left; }
.input-actions{
  position:absolute; left:8px; top:50%; transform:translateY(-50%);
  display:flex; gap:4px;
}
.input-icon-btn{
  width:28px; height:28px; border-radius:7px;
  display:flex; align-items:center; justify-content:center;
  background:transparent; border:none; color:var(--text-faint);
  cursor:pointer; transition:background .15s var(--ease), color .15s var(--ease);
}
.input-icon-btn:hover{ background:var(--surface-hover); color:var(--text); }

.select{
  height:40px; border-radius:var(--radius-sm);
  background:var(--bg-soft); border:1px solid var(--border);
  color:var(--text); padding:0 11px; font-size:13px; outline:none;
  transition:border-color .15s var(--ease);
}
.select:focus{ border-color:var(--accent); }

/* ---------- منوی کشویی سفارشی (جایگزین select بومی) ---------- */
.dropdown-trigger{
  height:40px; min-width:128px;
  display:inline-flex; align-items:center; justify-content:space-between; gap:10px;
  padding:0 13px; border-radius:var(--radius-sm);
  background:var(--bg-soft); border:1px solid var(--border);
  color:var(--text); font-size:13px; font-weight:600; cursor:pointer;
  transition:border-color .15s var(--ease), background .15s var(--ease);
}
.dropdown-trigger:hover{ border-color:var(--border-strong); background:var(--surface-hover); }
.dropdown-trigger.open{ border-color:var(--accent); }
.dropdown-trigger .chev{ width:14px; height:14px; color:var(--text-faint); flex:none; transition:transform .2s var(--ease); }
.dropdown-trigger.open .chev{ transform:rotate(180deg); color:var(--accent); }

.dropdown-sheet-backdrop{
  position:fixed; inset:0; background:#050811dd; backdrop-filter:blur(4px);
  display:flex; align-items:flex-end; justify-content:center; z-index:300;
  animation:backdrop-in .2s var(--ease);
}
.dropdown-sheet{
  width:100%; max-width:480px;
  background:var(--surface-raised); border:1px solid var(--border); border-bottom:none;
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  padding:6px 0 calc(10px + env(safe-area-inset-bottom));
  max-height:72vh; overflow-y:auto;
  box-shadow:var(--shadow-pop);
  animation:sheet-in .28s var(--ease-pop);
}
@keyframes sheet-in{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
.dropdown-sheet-title{ font-size:12.5px; font-weight:700; color:var(--text-faint); padding:14px 20px 8px; }
.dropdown-option{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:15px 20px; font-size:14px; font-weight:600; color:var(--text); cursor:pointer;
  transition:background .12s var(--ease);
  border-top:1px solid var(--border-soft);
}
.dropdown-sheet-title + .dropdown-option{ border-top:none; }
.dropdown-option:first-child{ border-top:none; }
.dropdown-option:hover{ background:var(--surface-hover); }
.dropdown-option.selected{ color:var(--accent); }
.dropdown-option .radio{
  width:20px; height:20px; border-radius:50%; border:2px solid var(--border-strong);
  flex:none; position:relative; transition:border-color .15s var(--ease);
}
.dropdown-option.selected .radio{ border-color:var(--accent); }
.dropdown-option.selected .radio::after{
  content:""; position:absolute; inset:3px; border-radius:50%; background:var(--accent);
}

.search-wrap{ position:relative; flex:1; min-width:180px; }
.search-wrap > span{
  position:absolute; inset-inline-start:13px; top:50%; transform:translateY(-50%);
  width:16px; height:16px; color:var(--text-faint); pointer-events:none;
  display:flex;
}
.search-wrap .input{ padding-inline-start:38px; }

/* ---------- نشان‌ها ---------- */
.badge{
  display:inline-flex; align-items:center; gap:6px;
  font-size:11.5px; font-weight:700;
  padding:6px 12px; border-radius:999px;
  letter-spacing:.01em;
}
.badge-dot{ width:7px; height:7px; border-radius:50%; background:currentColor; flex:none; box-shadow:0 0 0 3px currentColor22; }
.badge-green{ background:var(--green-soft); color:var(--green); }
.badge-red{ background:var(--red-soft); color:var(--red); }
.badge-amber{ background:var(--amber-soft); color:var(--amber); }
.badge-blue{ background:var(--blue-soft); color:var(--blue); }
.badge-gray{ background:var(--surface-hover); color:var(--text-dim); }

.chip{
  display:inline-flex; align-items:center; gap:6px;
  height:33px; padding:0 14px; border-radius:999px;
  background:var(--surface-hover); border:1px solid var(--border);
  color:var(--text-dim); font-size:12.5px; cursor:pointer;
  transition:all .15s var(--ease);
}
.chip.active{ background:var(--accent-soft-strong); color:var(--accent); border-color:transparent; box-shadow:inset 0 0 0 1px var(--accent-dim)44; }
.chip:hover:not(.active){ color:var(--text); border-color:var(--border-strong); }

/* ---------- جدول ---------- */
.table-wrap{
  overflow-x:auto;
  background:
    linear-gradient(to left, var(--surface) 0%, transparent 24px) left / 24px 100% no-repeat local,
    linear-gradient(to right, var(--surface) 0%, transparent 24px) right / 24px 100% no-repeat local,
    linear-gradient(to left, #0007, transparent 24px) left / 24px 100% no-repeat scroll,
    linear-gradient(to right, #0007, transparent 24px) right / 24px 100% no-repeat scroll;
}
table.tbl{ width:100%; border-collapse:collapse; font-size:13px; min-width:640px; }
.tbl thead th{
  text-align:start; font-weight:600; color:var(--text-faint);
  font-size:11px; letter-spacing:.03em;
  padding:0 15px 12px; white-space:nowrap;
  border-bottom:1px solid var(--border-soft);
}
.tbl tbody td{ padding:15px; border-top:1px solid var(--border-soft); white-space:nowrap; }
.tbl tbody tr{ transition:background .12s var(--ease); cursor:pointer; }
.tbl tbody tr:hover{ background:var(--surface-hover); }
.tbl tbody tr:hover td:first-child{ box-shadow:inset 2px 0 0 var(--accent); }
.tbl .cell-asset{ display:flex; align-items:center; gap:10px; cursor:pointer; }
.coin-ic{
  width:29px; height:29px; border-radius:50%; flex:none;
  display:flex; align-items:center; justify-content:center;
  font-size:10.5px; font-weight:700; color:#fff;
  box-shadow:0 2px 6px -1px #00000060, inset 0 1px 0 #ffffff30;
}
.tbl th.sortable{ cursor:pointer; user-select:none; transition:color .15s var(--ease); }
.tbl th.sortable:hover{ color:var(--text); }
.tbl th.sortable .ic{ width:11px; height:11px; opacity:.6; vertical-align:middle; margin-inline-start:3px; }

/* ستون‌های غیرضروری که در موبایل حذف می‌شوند تا اسکرول افقی تا حد
   ممکن کم یا حذف شود؛ جدول هم به‌جای عرض ثابت، عرض واقعی کارت را پر می‌کند. */
@media (max-width:760px){
  .col-opt{ display:none; }
  table.tbl{ min-width:0; width:100%; }
  .tbl thead th{ padding:0 8px 11px; font-size:10.5px; }
  .tbl tbody td{ padding:13px 8px; font-size:12.5px; }
  .coin-ic{ width:25px; height:25px; font-size:9.5px; }

  /* جدول تا لبه‌ی کارت باز می‌شود تا بیشترین عرض ممکن را بگیرد؛
     ستون اول و آخر با padding جبرانی با بقیه محتوای کارت هم‌تراز می‌مانند. */
  .card-pad .table-wrap{
    margin-inline:-22px;
    width:calc(100% + 44px);
  }
  .tbl thead th:first-child, .tbl tbody td:first-child{ padding-inline-start:22px; }
  .tbl thead th:last-child, .tbl tbody td:last-child{ padding-inline-end:22px; }
}

@media (max-width:420px){
  .card-pad{ padding:17px; }
  .card-pad .table-wrap{ margin-inline:-17px; width:calc(100% + 34px); }
  .tbl thead th:first-child, .tbl tbody td:first-child{ padding-inline-start:17px; }
  .tbl thead th:last-child, .tbl tbody td:last-child{ padding-inline-end:17px; }
}

/* ---------- وضعیت‌های خالی / خطا / بارگذاری ---------- */
.state-box{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:10px;
  padding:50px 20px;
  color:var(--text-dim);
}
.state-box .ic{ width:36px; height:36px; color:var(--text-faint); margin-bottom:4px; }
.state-box .title{ font-size:14.5px; font-weight:700; color:var(--text); }
.state-box .desc{ font-size:12.5px; color:var(--text-faint); max-width:320px; }

.skel{
  background:linear-gradient(90deg, var(--surface-hover) 25%, var(--border-soft) 37%, var(--surface-hover) 63%);
  background-size:400% 100%;
  animation:skel-sheen 1.4s ease infinite;
  border-radius:8px;
}
@keyframes skel-sheen{ 0%{ background-position:100% 50%; } 100%{ background-position:0 50%; } }

.toast-host{
  position:fixed; bottom:22px; inset-inline-end:22px; z-index:200;
  display:flex; flex-direction:column; gap:9px; max-width:340px;
}
@media (max-width:860px){ .toast-host{ bottom:76px; inset-inline-end:14px; inset-inline-start:14px; max-width:none; } }
.toast{
  display:flex; align-items:flex-start; gap:10px;
  background:var(--surface-raised); border:1px solid var(--border);
  border-radius:var(--radius-md); padding:14px 15px;
  box-shadow:var(--shadow-pop);
  font-size:12.5px;
  animation:toast-in .32s var(--ease-pop);
}
@keyframes toast-in{ from{ opacity:0; transform:translateY(14px) scale(.96); } to{ opacity:1; transform:none; } }
.toast .ic{ width:17px; height:17px; flex:none; margin-top:1px; }
.toast.success .ic{ color:var(--green); }
.toast.error .ic{ color:var(--red); }
.toast.info .ic{ color:var(--blue); }

/* ---------- نشانگر داده آزمایشی ---------- */
.mock-flag{
  display:inline-flex; align-items:center; gap:4px;
  font-size:10px; color:var(--amber);
  background:var(--amber-soft); padding:3px 7px; border-radius:6px;
  font-weight:600; letter-spacing:.01em;
  line-height:1;
}
.mock-flag .ic{ width:10px; height:10px; }
.mock-flag .ic *{ stroke-width:2.4; }

/* ---------- تب‌ها ---------- */
.tabs{ display:flex; gap:4px; background:var(--bg-soft); padding:4px; border-radius:11px; border:1px solid var(--border-soft); width:fit-content; }
.tab-btn{
  padding:9px 15px; border-radius:8px; font-size:12.5px; font-weight:600;
  color:var(--text-faint); cursor:pointer; border:none; background:transparent;
  display:flex; align-items:center; gap:6px;
  transition:background .15s var(--ease), color .15s var(--ease);
}
.tab-btn .ic{ width:14px; height:14px; }
.tab-btn.active{ background:var(--surface-raised); color:var(--text); box-shadow:0 1px 0 var(--border), 0 4px 10px -4px #00000060; }

/* ---------- سوییچ ---------- */
.switch{ position:relative; width:44px; height:25px; flex:none; }
.switch input{ opacity:0; width:0; height:0; position:absolute; }
.switch .track{
  position:absolute; inset:0; background:var(--border); border-radius:999px;
  cursor:pointer; transition:background .18s var(--ease);
}
.switch .thumb{
  position:absolute; width:19px; height:19px; border-radius:50%; background:#fff;
  top:3px; inset-inline-start:3px; transition:inset-inline-start .18s var(--ease-pop);
  box-shadow:0 2px 4px -1px #00000050;
}
.switch input:checked + .track{ background:var(--accent); }
.switch input:checked + .track .thumb{ inset-inline-start:22px; }

/* ---------- ردیف تنظیمات ---------- */
.set-row{
  display:flex; align-items:center; justify-content:space-between;
  gap:14px; padding:17px 2px;
  border-top:1px solid var(--border-soft);
}
.set-row:first-child{ border-top:none; }
.set-row .label{ font-size:13.5px; font-weight:600; }
.set-row .desc{ font-size:11.5px; color:var(--text-faint); margin-top:3px; }

/* ---------- مودال ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:#050811dd; backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; z-index:300;
  padding:20px;
  animation:backdrop-in .2s var(--ease);
}
@keyframes backdrop-in{ from{ opacity:0; } to{ opacity:1; } }
.modal{
  background:var(--surface-raised); border:1px solid var(--border);
  border-radius:var(--radius-lg); width:100%; max-width:420px;
  padding:24px; box-shadow:var(--shadow-pop);
  animation:modal-in .28s var(--ease-pop);
}
@keyframes modal-in{ from{ opacity:0; transform:scale(.92) translateY(8px); } to{ opacity:1; transform:none; } }
.modal h3{ font-size:16px; margin-bottom:9px; }
.modal p{ font-size:13px; color:var(--text-dim); line-height:1.85; }
.modal-actions{ display:flex; gap:10px; margin-top:22px; }
.modal-actions .btn{ flex:1; }

.icon-btn{
  width:38px; height:38px; border-radius:var(--radius-sm);
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--surface-hover); border:1px solid var(--border);
  color:var(--text-dim); cursor:pointer;
  transition:background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease), transform .15s var(--ease);
}
.icon-btn:hover{ color:var(--text); border-color:var(--border-strong); transform:translateY(-1px); }
.icon-btn:active{ transform:scale(.94); }
.icon-btn .ic{ width:17px; height:17px; }

hr.sep{ border:none; border-top:1px solid var(--border-soft); margin:18px 0; }
/* ===================================================================
   صفحه اتصال
   =================================================================== */
.connect-card{ width:100%; max-width:460px; animation:card-rise .4s var(--ease-pop); }
@keyframes card-rise{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }

.connect-logo{
  display:flex; align-items:center; gap:11px; justify-content:center;
  margin-bottom:24px;
}
.connect-logo .brand-mark{ width:42px; height:42px; border-radius:13px; font-size:18px; }
.connect-logo-text{ text-align:right; }
.connect-logo-text b{ font-size:16px; display:block; }
.connect-logo-text span{ font-size:11px; color:var(--text-faint); }

.connect-title{ text-align:center; font-size:20px; margin-bottom:7px; }
.connect-desc{ text-align:center; font-size:13px; color:var(--text-dim); margin-bottom:26px; line-height:1.95; }

.guide-toggle{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 15px; background:var(--bg-soft); border:1px solid var(--border-soft);
  border-radius:var(--radius-sm); cursor:pointer; font-size:12.5px; font-weight:700;
  color:var(--text-dim); margin-bottom:14px;
  transition:border-color .15s var(--ease), color .15s var(--ease);
}
.guide-toggle:hover{ color:var(--text); border-color:var(--border-strong); }
.guide-steps{
  list-style:none; margin:-2px 0 18px; padding:15px 15px 13px;
  display:flex; flex-direction:column; gap:13px;
  border-inline-start:2px solid var(--accent-soft-strong);
  margin-inline-start:4px;
  background:var(--bg-soft);
  border-start-end-radius:var(--radius-sm);
  border-end-end-radius:var(--radius-sm);
}
.guide-steps li{
  display:flex; gap:11px; font-size:12.5px; color:var(--text-dim); line-height:1.9;
}
.guide-num{
  flex:none; width:21px; height:21px; border-radius:50%;
  background:var(--accent-soft-strong); color:var(--accent); font-size:10.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center; margin-top:1px;
}

.notice-box{
  display:flex; gap:11px; padding:14px 15px;
  background:linear-gradient(135deg, var(--amber-soft), transparent);
  border:1px solid #e2a23c35;
  border-radius:var(--radius-sm); margin-bottom:20px;
}
.notice-box .ic{ width:17px; height:17px; color:var(--amber); flex:none; margin-top:1px; }
.notice-box p{ font-size:12px; color:var(--text-dim); line-height:1.9; font-weight:600; }
.notice-box ul{ margin:7px 0 0; padding-inline-start:18px; font-size:12px; color:var(--text-dim); line-height:2.05; font-weight:400; }

.connect-status{
  display:flex; align-items:center; gap:10px;
  padding:13px 14px; border-radius:var(--radius-sm);
  font-size:12.5px; margin-top:16px; font-weight:600;
}
.connect-status.loading{ background:var(--blue-soft); color:var(--blue); }
.connect-status.success{ background:var(--green-soft); color:var(--green); }
.connect-status.error{ background:var(--red-soft); color:var(--red); }

.connect-foot{
  text-align:center; margin-top:20px; font-size:11.5px; color:var(--text-faint);
}
.connect-foot a{ color:var(--accent); font-weight:600; }

/* ===================================================================
   داشبورد
   =================================================================== */
.kpi-grid{
  display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px; margin-bottom:18px;
}
.kpi-card{ padding:19px 20px; min-width:0; }
.kpi-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.kpi-ic{
  width:38px; height:38px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  background:var(--accent-soft); color:var(--accent);
  box-shadow:inset 0 0 0 1px var(--accent-dim)33;
}
.kpi-ic.blue{ background:var(--blue-soft); color:var(--blue); box-shadow:inset 0 0 0 1px #5b93ff33; }
.kpi-ic.green{ background:var(--green-soft); color:var(--green); box-shadow:inset 0 0 0 1px var(--green-strong)33; }
.kpi-ic.amber{ background:var(--amber-soft); color:var(--amber); box-shadow:inset 0 0 0 1px #e2a23c33; }
.kpi-label{ font-size:12px; color:var(--text-faint); margin-bottom:8px; font-weight:500; }
.kpi-value{ font-size:25px; font-weight:800; letter-spacing:-.01em; }
.kpi-change{ font-size:11.5px; margin-top:8px; display:flex; align-items:center; gap:4px; font-weight:700; }

.dash-grid{ display:grid; grid-template-columns:2fr 1fr; gap:16px; align-items:start; }

.chart-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:6px; }
.chart-value{ font-size:27px; font-weight:800; letter-spacing:-.01em; }
.chart-value-sub{ font-size:12.5px; margin-top:4px; font-weight:700; }
.chart-canvas-wrap{ height:260px; margin-top:16px; position:relative; }
.range-tabs{ display:flex; gap:4px; }

.mini-list{ display:flex; flex-direction:column; }
.mini-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 9px; border-top:1px solid var(--border-soft);
  border-radius:9px; margin:0 -9px; cursor:pointer;
  transition:background .15s var(--ease);
}
.mini-row:hover{ background:var(--surface-hover); }
.mini-row:first-child{ border-top:none; padding-top:3px; }
.mini-left{ display:flex; align-items:center; gap:11px; min-width:0; }
.mini-name{ font-size:13px; font-weight:700; }
.mini-sym{ font-size:11px; color:var(--text-faint); margin-top:1px; }
.mini-right{ text-align:left; }
.mini-price{ font-size:13px; font-weight:700; margin-bottom:5px; }

/* ===================================================================
   بازار
   =================================================================== */
.market-toolbar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:18px;
}
.sparkline{ width:88px; height:32px; }

/* ===================================================================
   صفحه ارز
   =================================================================== */
.coin-head{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
.coin-id{ display:flex; align-items:center; gap:13px; }
.coin-price-row{ display:flex; align-items:baseline; gap:11px; flex-wrap:wrap; }
.coin-price{ font-size:31px; font-weight:800; letter-spacing:-.01em; }
.coin-stats-row{ display:flex; gap:26px; flex-wrap:wrap; margin-top:16px; }
.coin-stat .lbl{ font-size:11px; color:var(--text-faint); margin-bottom:5px; font-weight:500; }
.coin-stat .val{ font-size:14px; font-weight:700; }

.coin-grid{ display:grid; grid-template-columns:2fr 1fr; gap:16px; align-items:start; }
.coin-chart-controls{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px; }

/* ===================================================================
   کیف پول
   =================================================================== */
.wallet-summary{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:18px; }
.wallet-head-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

/* ===================================================================
   پروفایل
   =================================================================== */
.profile-head{ display:flex; align-items:center; gap:17px; margin-bottom:24px; flex-wrap:wrap; }
.avatar{
  width:60px; height:60px; border-radius:50%;
  background:linear-gradient(135deg, var(--accent), var(--blue));
  display:flex; align-items:center; justify-content:center;
  font-size:21px; font-weight:700; color:#fff; flex:none;
  box-shadow:0 4px 14px -4px #1ed4bf60, inset 0 1px 0 #ffffff30;
}
.info-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 2px; border-top:1px solid var(--border-soft); }
.info-row:first-child{ border-top:none; }
.info-row .k{ font-size:12.5px; color:var(--text-faint); font-weight:500; }
.info-row .v{ font-size:13.5px; font-weight:700; }

.profile-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }

/* ===================================================================
   واکنش‌گرایی صفحات
   =================================================================== */
@media (max-width:1020px){
  .kpi-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
  .dash-grid{ grid-template-columns:1fr; }
  .coin-grid{ grid-template-columns:1fr; }
  .profile-grid{ grid-template-columns:1fr; }
  .wallet-summary{ grid-template-columns:repeat(3,1fr); gap:12px; }
}
@media (max-width:860px){
  .kpi-grid{ gap:12px; }
  .wallet-summary{ gap:10px; }
}
@media (max-width:620px){
  .kpi-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px; }
  .kpi-card{ padding:15px 14px; }
  .kpi-value{ font-size:19px; overflow-wrap:anywhere; }
  .kpi-top{ gap:6px; }
  .wallet-summary{ grid-template-columns:1fr; gap:12px; }
  .coin-price{ font-size:24px; }
  .chart-value{ font-size:21px; }
}

/* ---------- هوش مصنوعی معاملاتی ---------- */
.ai-banner{ margin-bottom:0; }
.ai-grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
.ai-grid2 .field{ margin-top:0 !important; }
.ai-modes{ display:grid; gap:10px; }
.ai-mode-card{ border:1.5px solid var(--border); border-radius:var(--radius-md); padding:12px 14px; cursor:pointer; background:var(--surface); transition:border-color .15s var(--ease), background .15s var(--ease); }
.ai-mode-card:hover{ background:var(--surface-hover); }
.ai-mode-card.selected{ border-color:var(--accent); background:var(--accent-soft); }
.ai-mode-card.locked{ opacity:.65; }
.ai-kv{ display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-top:1px solid var(--border-soft); font-size:13px; }
.ai-kv:first-of-type{ border-top:none; }
.ai-reasons{ margin:10px 0 0; padding-inline-start:20px; font-size:12.5px; line-height:1.9; color:var(--text-dim); }
details > summary{ list-style:none; }
@media (max-width:760px){ .ai-grid2{ grid-template-columns:1fr; } }

/* ---------- دکمه‌ی شناور و گزارش هوش مصنوعی ---------- */
.ai-fab{ position:fixed; left:16px; bottom:calc(86px + env(safe-area-inset-bottom)); z-index:40; width:54px; height:54px; border-radius:50%; border:none; cursor:pointer;
  background:linear-gradient(145deg,#2f7bff,#1a5df0); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 22px rgba(30,100,255,.45); transition:transform .15s var(--ease); }
.ai-fab:hover{ transform:scale(1.06); }
.ai-fab .ic{ width:26px; height:26px; } .ai-fab .ic *{ stroke-width:1.9; }
.ai-fab-dot{ display:none; position:absolute; top:3px; inset-inline-end:3px; width:13px; height:13px; border-radius:50%; background:#ff4d5e; border:2px solid #fff; }
.ai-fab.has-unread .ai-fab-dot{ display:block; }
.ai-fab.open{ background:linear-gradient(145deg,#4b556b,#343d52); box-shadow:none; }
.ai-chat{ position:fixed; z-index:55; inset-inline:0; bottom:0; height:84vh; display:flex; flex-direction:column; background:var(--bg-soft); border:1px solid var(--border); border-radius:18px 18px 0 0; box-shadow:0 -10px 40px rgba(0,0,0,.35); }
.ai-chat-head{ display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--border-soft); }
.ai-chat-x{ flex:none; width:36px; height:36px; display:flex; align-items:center; justify-content:center; background:var(--surface); border:1px solid var(--border); color:var(--text); cursor:pointer; border-radius:10px; }
.ai-chat-x .ic{ width:18px; height:18px; }
.ai-chat-x:hover{ background:var(--surface-hover); }
.ai-chat-feed{ flex:1; overflow-y:auto; padding:12px 12px 16px; display:flex; flex-direction:column; gap:12px; }

.ai-avatar .ic{ width:18px; height:18px; }
.ai-msg-row{ display:flex; gap:8px; align-items:flex-start; }
.ai-msg{ flex:1; min-width:0; background:var(--surface); border:1px solid var(--border-soft); border-inline-start:4px solid var(--accent); border-radius:6px 14px 14px 14px; padding:10px 12px; }
.ai-msg-good{ border-inline-start-color:var(--green); } .ai-msg-bad{ border-inline-start-color:var(--red); } .ai-msg-warn{ border-inline-start-color:#e9a63c; }

.ai-msg-head{ display:flex; justify-content:space-between; gap:8px; align-items:baseline; flex-wrap:wrap; }

/* ===================================================================
   ظاهر جدید (الهام‌گرفته از طرح NEXTRA): عمق، درخشش، تایپوگرافی و حرکت
   فقط ظاهر است؛ هیچ داده یا منطقی ندارد. رنگ‌های تیره فقط برای تم تیره
   اعمال می‌شوند تا تم روشن خراب نشود.
   =================================================================== */
:root[data-theme="dark"]{
  --bg:#050a19; --bg-soft:#07112a; --surface:#111c31; --surface-raised:#172641; --surface-hover:#213653;
  --border:#344665; --border-soft:#293954; --border-strong:#2677d966;
  --accent:#35f0d0; --accent-strong:#18d9bc; --accent-dim:#14b99f; --accent-soft:#19e2d01a; --accent-soft-strong:#19e2d033;
  --blue:#78aaff; --blue-soft:#367cff20; --green:#48e6a1; --red:#ff7185; --amber:#ffd166;
  --text:#f5f8ff; --text-dim:#c0cce2; --text-faint:#91a1bf;
  --radius-sm:11px; --radius-md:16px; --radius-lg:21px;
  --shadow-card:0 1px 0 #ffffff0a inset,0 12px 32px -18px #000c,0 0 0 1px #164b8a12;
  --shadow-raised:0 1px 0 #ffffff12 inset,0 18px 44px -18px #000d,0 0 28px #176bff12;
}
:root[data-theme="light"]{
  --accent:#008f83; --accent-strong:#007b72; --accent-dim:#006b64; --blue:#285edb; --green:#087d4c; --red:#c52f49; --amber:#8c5b00;
  --text:#101a2d; --text-dim:#394966; --text-faint:#596a87; --border:#c7d2e4; --border-soft:#dbe3ef;
  --surface:#ffffff; --surface-raised:#f8fbff; --surface-hover:#eaf1fb;
}
:root{ --ease-pop:cubic-bezier(.16,1,.3,1); --motion-ui:260ms; }
body{ font-size:15.5px; line-height:1.8; letter-spacing:0; text-rendering:optimizeLegibility; }
button,.btn,.nav-item,.tab-btn{ font-weight:600; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
::selection{ background:#35f0d055; color:var(--text); }
@media (prefers-contrast:more){ :root[data-theme="dark"]{ --text-dim:#d9e3f5; --text-faint:#b9c8e3; --border:#627392; } :root[data-theme="light"]{ --text-dim:#24334d; --text-faint:#394966; --border:#9eacc2; } }

/* --- پس‌زمینه و قاب‌ها (تم تیره) --- */
[data-theme="dark"] body{
  background:
    radial-gradient(ellipse 720px 480px at 100% 0%,#0754a52b,transparent 70%),
    radial-gradient(ellipse 650px 480px at 0% 30%,#04d9d014,transparent 68%),
    radial-gradient(ellipse 800px 520px at 50% 100%,#163d8b16,transparent 70%),var(--bg);
}
[data-theme="dark"] body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.15;
  background-image:linear-gradient(#4f91ff08 1px,transparent 1px),linear-gradient(90deg,#4f91ff08 1px,transparent 1px);
  background-size:38px 38px;mask-image:linear-gradient(to bottom,#000,transparent 85%);
}
[data-theme="dark"] .sidebar{ background:linear-gradient(180deg,#08142dF5,#060c1df7); box-shadow:inset -1px 0 #ffffff04,12px 0 50px -38px #147aff55; backdrop-filter:blur(18px); }
[data-theme="dark"] .topbar{ background:#071128d9; border-bottom-color:#1c3c6b99; backdrop-filter:blur(20px) saturate(140%); box-shadow:0 8px 28px -22px #267aff99; }
[data-theme="dark"] .bottom-nav{ background:#06112beF; border-top-color:#1c3c6b99; backdrop-filter:blur(22px) saturate(150%); box-shadow:0 -12px 32px -24px #167bff99; }
[data-theme="dark"] .bottom-nav .bn-item.active{ background:linear-gradient(145deg,#0fd9d01c,#367cff24); box-shadow:0 0 18px #167bff0c; }
[data-theme="dark"] .brand-mark{ background:linear-gradient(135deg,#3b7cff 0%,#1679ff 42%,#14e0d0 100%); color:#fff; box-shadow:0 0 0 1px #ffffff24 inset,0 0 24px #187bff70,0 8px 20px #00d7ce20; animation:brand-breathe 5s ease-in-out infinite; }
@keyframes brand-breathe{0%,100%{box-shadow:0 0 0 1px #ffffff24 inset,0 0 20px #187bff55}50%{box-shadow:0 0 0 1px #ffffff40 inset,0 0 30px #18d9df66}}
[data-theme="dark"] .nav-item.active{ background:linear-gradient(100deg,#0fd9d01b,#286cff25 70%,#286cff08); border-color:#1a9cc32a; box-shadow:inset 0 1px #ffffff08,0 5px 18px #006bff0c; }
[data-theme="dark"] .nav-item.active::before{ background:linear-gradient(180deg,#24e7d7,#377cff); box-shadow:0 0 14px #17dcd7a8,0 0 26px #247aff45; }
[data-theme="dark"] .nav-item:hover{ border-color:#2c6cb52b; box-shadow:0 5px 20px #0002; }
[data-theme="dark"] .card{ background:linear-gradient(145deg,#102044f2 0%,#0b1731f5 56%,#091329f8 100%); border-color:#23457799; box-shadow:var(--shadow-card); }
[data-theme="dark"] .card:hover{ border-color:#2875c5a8; box-shadow:0 1px 0 #ffffff0c inset,0 20px 48px -24px #000d,0 0 26px #1678ff13; }
[data-theme="dark"] .btn-primary{ background:linear-gradient(115deg,#18cfc4,#168fff); color:#04152c; box-shadow:0 1px 0 #ffffff55 inset,0 8px 24px -12px #13d8d9aa,0 0 18px #147cff15; }
[data-theme="dark"] .btn-primary:hover{ filter:saturate(1.12) brightness(1.08); box-shadow:0 1px 0 #ffffff66 inset,0 12px 28px -12px #13d8d9bb,0 0 24px #147cff2b; }
[data-theme="dark"] input:focus,[data-theme="dark"] select:focus,[data-theme="dark"] textarea:focus{ border-color:#268bdb!important; box-shadow:0 0 0 3px #258bdb20,0 0 18px #18c9d90c; }
[data-theme="dark"] .tbl tbody tr:hover{ background:#1a3d6b33; }
[data-theme="dark"] canvas{ filter:drop-shadow(0 0 5px rgba(45,212,191,.08)); }
[data-theme="dark"] .toast,[data-theme="dark"] .modal,[data-theme="dark"] .sheet,[data-theme="dark"] .dropdown-menu{ backdrop-filter:blur(20px) saturate(130%); }
.page-head h1{ letter-spacing:-.03em; }
.card{ position:relative; transition:border-color .3s var(--ease),box-shadow .35s var(--ease),transform .35s var(--ease); }
.card::before{ content:""; position:absolute; inset:0 14px auto; height:1px; pointer-events:none; background:linear-gradient(90deg,transparent,#5c9dff66,#20e4d455,transparent); opacity:.6; }
[data-theme="light"] .card::before{ display:none; }
@media (hover:hover) and (pointer:fine){ .card:hover{ transform:translateY(-2px); } }
.nav-item{ border:1px solid transparent; transition:background .24s var(--ease),color .24s var(--ease),transform .24s var(--ease),border-color .24s var(--ease),box-shadow .24s var(--ease); }
.btn{ position:relative; overflow:hidden; isolation:isolate; transition:transform .22s var(--ease-pop),background .25s var(--ease),border-color .25s var(--ease),box-shadow .25s var(--ease),filter .25s var(--ease); }
.btn::after{ content:""; position:absolute; inset:-80% -30%; z-index:-1; pointer-events:none; background:linear-gradient(110deg,transparent 38%,#ffffff22 50%,transparent 62%); transform:translateX(-130%); transition:transform .7s var(--ease); }
.btn:hover::after{ transform:translateX(130%); }
.btn-primary:hover{ transform:translateY(-1px); }
.btn:active,.tab-btn:active{ transform:scale(.97); }
input,select,textarea,.input{ transition:border-color .25s var(--ease),box-shadow .25s var(--ease),background .25s var(--ease); }
.tbl tbody tr{ transition:background .22s var(--ease),transform .22s var(--ease); }
.bottom-nav .bn-item{ transition:color .22s var(--ease),background .22s var(--ease),transform .22s var(--ease); }
html{ scroll-behavior:smooth; }
@media (max-width:520px){ .card{ border-radius:17px; } .card-pad{ padding:17px; } .page-head h1{ font-size:21px; } }
@media (max-width:860px){ .content{ padding-inline:14px; } .page-head{ align-items:flex-start; } .nav-item:hover{ transform:none; } }

/* --- کارت‌های داشبورد --- */
.kpi-grid{ gap:18px; margin-bottom:22px; }
.kpi-card{ position:relative; overflow:hidden; isolation:isolate; padding:21px 22px; }
.kpi-card:after{ content:""; position:absolute; z-index:-1; width:130px; height:130px; border-radius:50%; inset-inline-end:-58px; bottom:-72px; background:var(--kpi-glow,#18cbbd); opacity:.13; filter:blur(24px); pointer-events:none; }
[data-theme="dark"] .kpi-card{ border:1px solid #4b80b944; background:linear-gradient(145deg,var(--surface) 0%,color-mix(in srgb,var(--surface) 82%,#12347d) 100%); }
[data-theme="dark"] .kpi-card:first-child{ background:radial-gradient(240px 150px at 100% 0%,#19d8d31e,transparent 72%),linear-gradient(135deg,#0c2447,var(--surface)); border-color:#1dd8d34a; }
[data-theme="dark"] .kpi-card:first-child .kpi-value{ text-shadow:0 0 22px #27d9d522; }
[data-theme="dark"] .kpi-card:hover{ border-color:#20b9d688; box-shadow:0 18px 40px -20px #000e,0 0 28px #13c9d91b; }
.kpi-card:first-child .kpi-value{ font-size:clamp(22px,2vw,29px); }
.kpi-card:hover{ transform:translateY(-4px) scale(1.008); }
.kpi-ic{ width:42px; height:42px; border-radius:14px; box-shadow:inset 0 0 0 1px #ffffff0d,0 5px 16px #0002; }
.kpi-label{ font-size:12.5px; color:var(--text-dim); letter-spacing:.01em; }
.kpi-value{ line-height:1.35; font-variant-numeric:tabular-nums; }
.kpi-change{ gap:6px; flex-wrap:wrap; }
.dash-grid{ grid-template-columns:minmax(0,1.75fr) minmax(280px,1fr); gap:18px; }
[data-theme="dark"] .dash-grid>.card{ border:1px solid #5488c52b; box-shadow:0 14px 34px #02081722,inset 0 1px #ffffff08; }
.chart-head{ padding-bottom:12px; border-bottom:1px solid var(--border-soft); }
.chart-value{ font-size:clamp(24px,2vw,31px); font-variant-numeric:tabular-nums; }
.chart-canvas-wrap{ height:290px; margin-top:20px; }
.mini-row{ padding:13px 10px; transition:background .2s ease,transform .2s ease,border-color .2s ease; }
.mini-row:hover{ transform:translateX(-3px); background:linear-gradient(90deg,transparent,#23c9d20b); }
.mini-price{ font-variant-numeric:tabular-nums; }
@media(max-width:1100px){ .dash-grid{ grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr); } .chart-canvas-wrap{ height:260px; } }
@media(max-width:860px){ .dash-grid{ grid-template-columns:1fr; } .kpi-grid{ gap:12px; } .kpi-card{ padding:17px; } }

/* --- کارت وضعیت واقعی هوش مصنوعی در داشبورد (داده از موتور خوانده می‌شود) --- */
.ai-status-panel{ position:relative; overflow:hidden; margin:2px 0 15px; padding:15px; border-radius:15px; border:1px solid #1dd8b93b; cursor:pointer; background:radial-gradient(180px 90px at 100% 0%,#13d8b71a,transparent 70%),var(--surface-raised); transition:border-color .25s var(--ease),transform .25s var(--ease); }
.ai-status-panel:hover{ border-color:#1dd8b97a; transform:translateY(-1px); }
.ai-status-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
.ai-status-title{ display:flex; align-items:center; gap:9px; font-size:13px; font-weight:800; }
.ai-pulse{ width:9px; height:9px; border-radius:50%; background:#2ce6b6; box-shadow:0 0 0 4px #2ce6b61c,0 0 14px #2ce6b6; animation:aiPulse 2s ease-in-out infinite; }
.ai-pulse.is-off{ background:#8493b2; box-shadow:0 0 0 4px #8493b21a; animation:none; }
.ai-pulse.is-kill{ background:#ff5c70; box-shadow:0 0 0 4px #ff5c7022,0 0 14px #ff5c70; }
.ai-live-badge{ font-size:10px; font-weight:800; color:#49eac2; background:#1dd8b91c; border:1px solid #1dd8b938; border-radius:999px; padding:4px 8px; }
.ai-status-desc{ font-size:11.5px; line-height:1.8; color:var(--text-dim); }
.ai-status-foot{ display:flex; gap:7px; flex-wrap:wrap; margin-top:12px; }
.ai-stat-pill{ font-size:10.5px; padding:5px 8px; border-radius:8px; background:#ffffff08; color:var(--text-dim); border:1px solid #ffffff0b; }
[data-theme="light"] .ai-stat-pill{ background:#0000000a; border-color:#0000000f; }
@keyframes aiPulse{0%,100%{opacity:1;box-shadow:0 0 0 4px #2ce6b61c,0 0 14px #2ce6b6}50%{opacity:.65;box-shadow:0 0 0 7px #2ce6b60b,0 0 7px #2ce6b6}}

/* --- حرکت: ورود پوسته، منو و صفحه (یک سامانه‌ی واحد) --- */
@keyframes nx-assemble-in{0%{opacity:0;transform:translate3d(0,24px,0) scale(.985)}100%{opacity:1;transform:translate3d(0,0,0) scale(1)}}
@keyframes nx-shell-in{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
@keyframes nxNavReveal{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
@keyframes nxRowReveal{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes nxPageEnter{from{opacity:0;transform:translateY(12px) scale(.995)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes nxPageExit{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-7px) scale(.997)}}
@keyframes nx-nav-stagger{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
@keyframes nx-chart-arrive{from{opacity:.25;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
#pageContent{ min-height:55vh; transform-origin:top center; }
#pageContent.nx-assembling > .nx-piece{ animation:nx-assemble-in var(--nx-duration,680ms) var(--ease-pop) both; animation-delay:var(--nx-delay,0ms); }
#pageContent.nx-assembling .nx-child{ animation:nx-assemble-in 560ms var(--ease-pop) both; animation-delay:var(--nx-child-delay,80ms); }
.shell.nx-shell-enter .sidebar-layer{ animation:nx-shell-in 650ms var(--ease-pop) both; }
.shell.nx-shell-enter .main{ animation:nx-shell-in 650ms var(--ease-pop) 90ms both; }
.shell.nx-shell-enter .topbar{ animation:nx-assemble-in 700ms var(--ease-pop) 180ms both; }
.bottom-nav.nx-shell-enter{ animation:nx-shell-in 600ms var(--ease-pop) 260ms both; }
.nx-nav-reveal{ animation:nxNavReveal .48s cubic-bezier(.2,.75,.25,1) both; animation-delay:var(--nx-nav-delay,0ms); }
.sidebar .nav-item.nx-nav-stagger{ animation:nx-nav-stagger .42s cubic-bezier(.2,.75,.25,1) both; animation-delay:var(--nx-nav-delay,0ms); }
.nx-row-reveal{ animation:nxRowReveal .42s cubic-bezier(.2,.75,.25,1) both; animation-delay:var(--nx-row-delay,0ms); }
.nx-page-enter{ animation:nxPageEnter .62s cubic-bezier(.2,.75,.25,1) both; }
.nx-page-exit{ animation:nxPageExit .18s ease-in both; pointer-events:none; }
#pageContent .chart-canvas-wrap,#pageContent .chart-container,#pageContent .chart-wrap,#pageContent .portfolio-chart-wrap{ animation:nx-chart-arrive .7s cubic-bezier(.16,1,.3,1) both; animation-delay:var(--nx-chart-delay,120ms); }
.nx-interactive{ transition:transform .18s ease,box-shadow .22s ease,background-color .22s ease,border-color .22s ease,filter .22s ease; transform-origin:center; }
.nx-interactive:active{ transform:scale(.975); }
button,.btn,[role=button]{ -webkit-tap-highlight-color:transparent; }
@media (prefers-reduced-motion:reduce){
  html{ scroll-behavior:auto; }
  .brand-mark{ animation:none!important; } .card:hover,.kpi-card:hover{ transform:none; } .ai-pulse{ animation:none!important; }
  #pageContent.nx-assembling>.nx-piece,#pageContent.nx-assembling .nx-child,.shell.nx-shell-enter .sidebar-layer,.shell.nx-shell-enter .main,.shell.nx-shell-enter .topbar,.bottom-nav.nx-shell-enter,
  .nx-nav-reveal,.nx-row-reveal,.nx-page-enter,.nx-page-exit,.sidebar .nav-item.nx-nav-stagger,#pageContent .chart-canvas-wrap,#pageContent .chart-container,#pageContent .chart-wrap,#pageContent .portfolio-chart-wrap{ animation:none!important; }
  .nx-interactive{ transition:none!important; }
}
/* ===================================================================
   QAIRO — سیستم طراحی جدید (چیدمان موبایل‌محور، شیشه‌ای، درخشان)
   این لایه آخرین لایه‌ی CSS است و ظاهر کل برنامه را بازتعریف می‌کند.
   =================================================================== */
:root, :root[data-theme="dark"]{
  --q-bg:#040818; --q-bg2:#070d29; --q-card:#0c1636; --q-card2:#101d47;
  --q-line:#22377a66; --q-line2:#3a5bd433;
  --q-blue:#2f6bff; --q-blue2:#4d8bff; --q-violet:#7a4dff; --q-cyan:#27d6ee;
  --q-up:#1fe08f; --q-down:#ff4d6d; --q-amber:#ffc24d;
  --q-grad:linear-gradient(115deg,#2f6bff 0%,#5a5cff 55%,#7a4dff 100%);
  --q-grad-up:linear-gradient(115deg,#12c77a,#2be39a);
  --q-grad-down:linear-gradient(115deg,#ff3b64,#ff6a85);
  --q-glow:0 0 0 1px #4d8bff22,0 10px 34px -14px #2f6bffaa;
  --q-col:520px;

  --bg:var(--q-bg); --bg-soft:var(--q-bg2); --surface:var(--q-card); --surface-raised:var(--q-card2);
  --surface-hover:#16265a; --border:#2a3f86; --border-soft:#1b2c66; --border-strong:#3a5bd455;
  --accent:#4d8bff; --accent-strong:#2f6bff; --accent-dim:#2a55c9; --accent-soft:#2f6bff1f; --accent-soft-strong:#2f6bff3a;
  --blue:#6ea0ff; --blue-soft:#2f6bff22; --green:#1fe08f; --green-soft:#1fe08f1c; --red:#ff5d7a; --red-soft:#ff4d6d1c;
  --amber:#ffc24d; --amber-soft:#ffc24d1c;
  --text:#f4f7ff; --text-dim:#b4c1e6; --text-faint:#7f90c0;
  --radius-sm:12px; --radius-md:16px; --radius-lg:22px;
  --shadow-card:0 1px 0 #ffffff0d inset,0 14px 36px -20px #000d;
  --ease-pop:cubic-bezier(.16,1,.3,1);
}
:root[data-theme="light"]{
  --q-bg:#eef2fb; --q-bg2:#e6ecf9; --q-card:#ffffff; --q-card2:#f5f8ff; --q-line:#c9d5f0; --q-line2:#d9e2f6;
  --bg:#eef2fb; --bg-soft:#e6ecf9; --surface:#fff; --surface-raised:#f7f9ff; --surface-hover:#eaf0ff;
  --border:#c9d5f0; --border-soft:#dbe4f7; --accent:#2f6bff; --accent-strong:#2557d6; --accent-soft:#2f6bff18; --accent-soft-strong:#2f6bff2e;
  --text:#0e1838; --text-dim:#3b4a75; --text-faint:#6a789f; --green:#0a9d63; --red:#d6304f; --amber:#a76a00;
  --shadow-card:0 1px 0 #fff inset,0 10px 28px -18px #1a2a6a40;
}

/* ---------- پایه ---------- */
html{ background:var(--q-bg); }
body{
  font-size:14.5px; line-height:1.75; overflow-x:hidden;
  background:
    radial-gradient(520px 380px at 85% -4%,#2f6bff30,transparent 70%),
    radial-gradient(460px 360px at 0% 28%,#7a4dff24,transparent 70%),
    radial-gradient(600px 420px at 50% 108%,#27d6ee14,transparent 70%),var(--q-bg);
  background-attachment:fixed;
}
[data-theme="light"] body{ background:radial-gradient(520px 380px at 85% -4%,#2f6bff1c,transparent 70%),var(--q-bg); background-attachment:fixed; }
[data-theme="dark"] body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:-1; opacity:.5;
  background-image:
    radial-gradient(1.2px 1.2px at 20% 30%,#ffffff55,transparent),
    radial-gradient(1px 1px at 70% 12%,#9db8ff66,transparent),
    radial-gradient(1px 1px at 40% 78%,#ffffff40,transparent),
    radial-gradient(1.4px 1.4px at 88% 64%,#7aa6ff66,transparent),
    radial-gradient(1px 1px at 10% 90%,#ffffff40,transparent);
  background-size:380px 380px; animation:q-stars 60s linear infinite; mask-image:none;
}
@keyframes q-stars{ to{ background-position:380px 380px; } }
.num{ font-feature-settings:"tnum"; }

/* ---------- پوسته: ستون موبایل، منو کشویی ---------- */
.shell{ display:block; min-height:100vh; }
.main{ max-width:var(--q-col); margin:0 auto; position:relative; }
.content{ max-width:var(--q-col); padding:6px 16px 128px; }
.sidebar-layer{ position:fixed; inset:0; z-index:60; overflow:hidden; pointer-events:none; grid-column:auto; }
.sidebar{
  position:absolute; inset-inline-end:0; top:0; height:100%; width:min(300px,84vw); pointer-events:auto;
  transform:translateX(-104%); transition:transform .45s var(--ease-pop);
  background:linear-gradient(180deg,#0a1436f5,#050a20fa); border:0; border-inline-start:1px solid var(--q-line);
  backdrop-filter:blur(22px); padding:22px 16px; box-shadow:-30px 0 70px -30px #000;
}
[dir="rtl"] .sidebar{ inset-inline-end:auto; inset-inline-start:0; right:0; left:auto; transform:translateX(104%); }
.sidebar.open{ transform:translateX(0)!important; }
.sidebar-scrim{ background:#02050fb3; backdrop-filter:blur(4px); z-index:55; display:block; opacity:0; pointer-events:none; transition:opacity .35s ease; }
.sidebar-scrim.open{ opacity:1; pointer-events:auto; }
.menu-btn{ display:inline-flex!important; }
[data-theme="light"] .sidebar{ background:#fff; }

.brand{ padding:6px 6px 22px; gap:12px; }
.brand-mark{ width:42px; height:42px; border-radius:14px; background:var(--q-grad)!important; color:#fff!important; box-shadow:0 0 0 1px #ffffff26 inset,0 0 26px #4d6bffaa; animation:q-breathe 4.5s ease-in-out infinite; }
.brand-mark svg{ width:24px; height:24px; }
.brand-name{ font-size:17px; font-weight:800; letter-spacing:.14em; font-family:"Inter","Vazirmatn",sans-serif; }
.brand-sub{ font-size:10.5px; color:var(--text-faint); }
@keyframes q-breathe{ 0%,100%{ box-shadow:0 0 0 1px #ffffff26 inset,0 0 18px #4d6bff88; } 50%{ box-shadow:0 0 0 1px #ffffff40 inset,0 0 34px #7a4dffcc; } }
.nav-item{ border-radius:14px; padding:12px 14px; font-size:13.5px; border:1px solid transparent; }
.nav-item .ic{ width:20px; height:20px; }
.nav-item.active{ background:linear-gradient(100deg,#2f6bff30,#7a4dff1f); border-color:#4d6bff55; color:#fff; box-shadow:0 0 22px -8px #2f6bffaa; }
.nav-item.active::before{ background:var(--q-grad); box-shadow:0 0 14px #4d6bffcc; }

/* ---------- نوار بالا ---------- */
.topbar{
  height:auto; min-height:64px; padding:14px 16px 8px; background:transparent!important; border:0!important; box-shadow:none!important; backdrop-filter:none!important;
  max-width:var(--q-col); margin:0 auto; position:sticky; top:0; z-index:20;
}
.topbar::before{ content:""; position:absolute; inset:0 0 -8px; background:linear-gradient(180deg,var(--q-bg) 40%,transparent); z-index:-1; pointer-events:none; opacity:.92; }
.topbar-title{ font-size:19px; font-weight:800; letter-spacing:-.01em; }
.topbar-left{ gap:12px; }
.icon-btn,.menu-btn{
  width:40px; height:40px; border-radius:13px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
  background:linear-gradient(145deg,#14214f,#0b1534); border:1px solid var(--q-line); color:var(--text);
  transition:transform .25s var(--ease-pop),box-shadow .3s,border-color .3s;
}
[data-theme="light"] .icon-btn,[data-theme="light"] .menu-btn{ background:#fff; }
.icon-btn:hover,.menu-btn:hover{ transform:translateY(-2px); border-color:#4d8bff88; box-shadow:0 8px 20px -10px #2f6bffcc; }
.icon-btn:active,.menu-btn:active{ transform:scale(.92); }
.icon-btn .ic,.menu-btn .ic{ width:19px; height:19px; }
#lastUpdate{ display:none; }
#connBadge .badge{ padding:6px 9px; }
#connBadge .badge-label{ display:none; }

/* ---------- نوار پایین شناور ---------- */
.bottom-nav{
  display:flex!important; inset-inline:auto; left:50%; right:auto; transform:translateX(-50%); width:min(calc(100% - 22px),calc(var(--q-col) - 12px));
  bottom:calc(10px + env(safe-area-inset-bottom)); border-radius:26px; padding:8px 8px; gap:2px; justify-content:space-between; align-items:flex-end;
  background:linear-gradient(180deg,#0f1b45ee,#08112fF2)!important; border:1px solid var(--q-line)!important; border-top:1px solid #4d8bff44!important;
  backdrop-filter:blur(22px) saturate(150%); box-shadow:0 20px 50px -14px #000,0 0 40px -16px #2f6bffaa; z-index:40;
}
[data-theme="light"] .bottom-nav{ background:#ffffffee!important; }
.bottom-nav .bn-item{ flex:1; min-width:0; position:relative; font-size:10.5px; padding:8px 4px; border-radius:18px; color:var(--text-faint); background:transparent; transition:color .3s,transform .35s var(--ease-pop); }
.bottom-nav .bn-item .ic{ width:22px; height:22px; transition:transform .4s var(--ease-pop),filter .3s; }
.bottom-nav .bn-item.active{ background:transparent!important; color:#fff; box-shadow:none!important; }
.bottom-nav .bn-item.active .ic{ transform:translateY(-3px) scale(1.12); color:var(--q-blue2); filter:drop-shadow(0 0 8px #4d8bffcc); }
.bottom-nav .bn-item.active::after{ content:""; position:absolute; bottom:1px; left:50%; width:18px; height:3px; margin-left:-9px; border-radius:3px; background:var(--q-grad); box-shadow:0 0 10px #4d8bff; animation:q-pop .5s var(--ease-pop); }
@keyframes q-pop{ from{ transform:scaleX(0); opacity:0; } to{ transform:scaleX(1); opacity:1; } }
.bottom-nav .bn-item.bn-center{ flex:none; width:62px; margin-top:-26px; padding:0; }
.bn-center .bn-orb{ width:56px; height:56px; border-radius:50%; margin:0 auto; display:flex; align-items:center; justify-content:center; color:#fff; background:var(--q-grad); box-shadow:0 0 0 4px #070d29,0 0 0 5px #4d8bff55,0 10px 28px -4px #4d6bff; animation:q-orb 3.4s ease-in-out infinite; }
.bn-center .bn-orb .ic{ width:25px; height:25px; transform:none!important; filter:none!important; color:#fff!important; }
.bn-center span.bn-lbl{ display:block; text-align:center; margin-top:4px; }
.bn-center.active .bn-orb{ filter:brightness(1.15); }
.bottom-nav .bn-center.active::after{ display:none; }
@keyframes q-orb{ 0%,100%{ box-shadow:0 0 0 4px #070d29,0 0 0 5px #4d8bff55,0 10px 24px -6px #4d6bff; } 50%{ box-shadow:0 0 0 4px #070d29,0 0 0 8px #7a4dff33,0 12px 34px -4px #7a4dff; } }

/* ---------- کارت‌ها ---------- */
.card{
  background:linear-gradient(150deg,#101d4acc 0%,#0a1536e6 60%,#081029f2 100%); border:1px solid var(--q-line); border-radius:22px; box-shadow:var(--shadow-card);
  backdrop-filter:blur(10px); transition:border-color .35s,box-shadow .4s,transform .4s var(--ease-pop);
}
[data-theme="light"] .card{ background:#fff; backdrop-filter:none; }
.card::before{ content:""; position:absolute; inset:0 20px auto; height:1px; background:linear-gradient(90deg,transparent,#6ea0ff77,#7a4dff66,transparent); opacity:.8; }
@media (hover:hover){ .card:hover{ border-color:#4d8bff66; box-shadow:0 18px 44px -22px #000,0 0 30px -12px #2f6bffaa; transform:translateY(-2px); } }
.card-pad{ padding:18px; }
.card-head{ margin-bottom:12px; }
.card-title{ font-size:14.5px; font-weight:800; }
.page-head{ margin:4px 0 16px; }
.page-head h1{ font-size:21px; }
.page-head .sub{ font-size:12px; line-height:1.7; }

/* دکمه‌ها */
.btn{ border-radius:15px; font-weight:700; letter-spacing:0; transition:transform .3s var(--ease-pop),box-shadow .3s,filter .3s,background .3s,border-color .3s; }
.btn-primary,[data-theme="dark"] .btn-primary{ background:var(--q-grad); color:#fff; border:0; box-shadow:0 1px 0 #ffffff40 inset,0 12px 26px -12px #4d6bffcc; }
.btn-primary:hover{ filter:brightness(1.12); transform:translateY(-2px); }
.btn-outline,.btn-ghost{ background:#ffffff08; border:1px solid var(--q-line); color:var(--text); }
.btn-outline:hover,.btn-ghost:hover{ background:#2f6bff22; border-color:#4d8bff88; }
.btn-danger-ghost{ border-color:#ff4d6d55; color:#ff7d93; background:#ff4d6d12; }
.btn-block{ width:100%; }
.btn-sm{ border-radius:12px; }

.chip,.tab-btn{
  border-radius:999px; border:1px solid var(--q-line); background:#ffffff06; color:var(--text-dim); padding:7px 15px; font-size:12.5px; font-weight:700; cursor:pointer;
  transition:all .3s var(--ease-pop); white-space:nowrap;
}
.chip:hover,.tab-btn:hover{ border-color:#4d8bff88; color:var(--text); transform:translateY(-1px); }
.chip.active,.tab-btn.active{ background:var(--q-grad); border-color:transparent; color:#fff; box-shadow:0 8px 20px -10px #4d6bffcc; }
.tabs{ display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:2px; }
.tabs::-webkit-scrollbar{ display:none; }
.range-tabs{ display:flex; gap:6px; flex-wrap:wrap; }

.badge{ border-radius:999px; font-weight:800; }
.badge-green{ background:var(--green-soft); color:var(--green); }
.badge-red{ background:var(--red-soft); color:var(--red); }
.badge-amber{ background:var(--amber-soft); color:var(--amber); }
.badge-blue{ background:var(--blue-soft); color:var(--blue); }

input,select,textarea,.input{
  background:#08122d; border:1px solid var(--q-line); border-radius:15px; color:var(--text); transition:border-color .3s,box-shadow .3s;
}
[data-theme="light"] input,[data-theme="light"] .input{ background:#f5f8ff; }
input:focus,.input:focus{ outline:none; border-color:#4d8bff!important; box-shadow:0 0 0 3px #2f6bff30,0 0 22px -8px #2f6bff!important; }
.field label{ font-size:12.5px; color:var(--text-dim); font-weight:700; }

.switch .track{ background:#1b2a5e; border:1px solid var(--q-line); transition:background .35s; }
.switch input:checked + .track{ background:var(--q-grad); border-color:transparent; box-shadow:0 0 16px -2px #4d6bffcc; }

.modal,.dropdown-sheet{ background:linear-gradient(160deg,#101d4a,#0a1233); border:1px solid var(--q-line); border-radius:24px; }
[data-theme="light"] .modal,[data-theme="light"] .dropdown-sheet{ background:#fff; }
.modal-backdrop,.dropdown-sheet-backdrop{ background:#02050fb8; backdrop-filter:blur(6px); }
.toast{ border-radius:16px; background:#0e1a42ee; border:1px solid var(--q-line); }

.skel{ background:linear-gradient(90deg,#14214f 0%,#1d2f6b 50%,#14214f 100%); background-size:200% 100%; animation:q-shimmer 1.4s linear infinite; border-radius:10px; }
@keyframes q-shimmer{ to{ background-position:-200% 0; } }

.coin-ic{ border-radius:50%; font-weight:800; display:flex; align-items:center; justify-content:center; flex:none; }
.mock-flag{ border-radius:999px; }

/* ---------- جدول‌ها → لیست کارتی ---------- */
.table-wrap{ overflow:visible; }
.tbl{ width:100%; border-collapse:separate; border-spacing:0 8px; }
.tbl thead{ display:none; }
.tbl tbody tr{ background:linear-gradient(150deg,#0f1c47aa,#0a1535cc); border:1px solid var(--q-line2); cursor:pointer; transition:transform .3s var(--ease-pop),border-color .3s,background .3s; }
.tbl tbody td{ padding:12px 10px; border:0; }
.tbl tbody td:first-child{ border-radius:0 16px 16px 0; }
.tbl tbody td:last-child{ border-radius:16px 0 0 16px; }
.tbl tbody tr:hover{ transform:translateX(-3px); background:#16265acc; }
.col-opt{ display:none; }
[data-theme="light"] .tbl tbody tr{ background:#f5f8ff; }

.cell-asset{ display:flex; align-items:center; gap:10px; font-weight:700; }

/* ---------- گفت‌وگو/نمای AI شناور ---------- */
.ai-fab{ display:none!important; }
.ai-chat{ border-radius:24px; background:linear-gradient(170deg,#101d4aF5,#070d29fa); border:1px solid var(--q-line); backdrop-filter:blur(20px); }

/* ===================================================================
   اجزای اختصاصی QAIRO
   =================================================================== */
.q-hello{ display:flex; align-items:center; justify-content:space-between; margin:2px 2px 14px; }
.q-hello h2{ font-size:20px; font-weight:800; }
.q-hello p{ font-size:12px; color:var(--text-faint); margin-top:2px; }

/* Orb (هسته‌ی هوش مصنوعی) */
.q-orb{ position:relative; width:84px; height:84px; flex:none; }
.q-orb i{ position:absolute; inset:0; border-radius:50%; }
.q-orb .o1{ background:radial-gradient(circle at 35% 30%,#b9a4ff,#5a5cff 45%,#1a2f9a 78%,#0a1236); box-shadow:0 0 36px #6a5cffaa,inset 0 0 20px #ffffff30; animation:q-float 5s ease-in-out infinite; }
.q-orb .o2{ border:1.5px solid #6ea0ff88; inset:-8px; animation:q-spin 9s linear infinite; border-top-color:transparent; border-left-color:transparent; }
.q-orb .o3{ border:1px dashed #a78bff66; inset:-16px; animation:q-spin 16s linear infinite reverse; }
.q-orb b{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:27px; font-weight:800; font-family:"Inter",sans-serif; text-shadow:0 0 14px #fff; z-index:2; }
@keyframes q-spin{ to{ transform:rotate(360deg); } }
@keyframes q-float{ 0%,100%{ transform:translateY(0) scale(1); } 50%{ transform:translateY(-4px) scale(1.04); } }
.q-orb.big{ width:150px; height:150px; margin:8px auto; }
.q-orb.big b{ font-size:50px; }

.q-ai-core{
  position:relative; overflow:hidden; display:flex; align-items:center; gap:16px; padding:18px 16px; cursor:pointer; border-radius:24px;
  background:radial-gradient(260px 160px at 100% 0%,#7a4dff55,transparent 70%),radial-gradient(240px 160px at 0% 100%,#2f6bff55,transparent 70%),linear-gradient(150deg,#14235f,#0a1238);
  border:1px solid #5a7bff66; box-shadow:0 20px 50px -22px #4d6bffcc;
}
.q-ai-core::after{ content:""; position:absolute; inset:0; background:linear-gradient(110deg,transparent 40%,#ffffff18 50%,transparent 60%); transform:translateX(-120%); animation:q-sheen 5.5s ease-in-out infinite; pointer-events:none; }
@keyframes q-sheen{ 0%,55%{ transform:translateX(-120%); } 100%{ transform:translateX(120%); } }
.q-ai-core .q-body{ flex:1; min-width:0; position:relative; z-index:1; }
.q-ai-core h3{ font-size:15.5px; font-weight:800; }
.q-ai-core small{ display:block; font-size:11px; color:var(--text-dim); margin:2px 0 8px; }
.q-ai-core .q-status{ font-size:11.5px; color:var(--text-dim); line-height:1.8; margin-bottom:10px; min-height:20px; }
.q-ai-core .q-cta{ display:block; width:100%; text-align:center; padding:10px; border-radius:14px; font-weight:800; font-size:13px; color:#fff; background:var(--q-grad); box-shadow:0 10px 24px -10px #4d6bff; border:0; cursor:pointer; transition:transform .3s var(--ease-pop),filter .3s; }
.q-ai-core .q-cta:hover{ transform:translateY(-2px); filter:brightness(1.1); }
.q-live{ display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:999px; background:#1fe08f1c; color:var(--q-up); }
.q-live::before{ content:""; width:7px; height:7px; border-radius:50%; background:currentColor; box-shadow:0 0 10px currentColor; animation:q-blink 1.8s infinite; }
.q-live.off{ background:#7f90c022; color:var(--text-faint); } .q-live.off::before{ animation:none; }
.q-live.kill{ background:#ff4d6d1f; color:var(--q-down); }
@keyframes q-blink{ 50%{ opacity:.35; } }

.q-portfolio{ margin-top:14px; padding:18px; position:relative; overflow:hidden; }
.q-portfolio .q-lbl{ font-size:12px; color:var(--text-dim); }
.q-portfolio .q-total{ font-size:clamp(25px,7.2vw,33px); font-weight:800; margin:2px 0 0; letter-spacing:-.01em; line-height:1.35; }
.q-portfolio .q-total small{ font-size:13px; color:var(--text-dim); font-weight:600; margin-inline-start:6px; }
.q-chg{ display:inline-flex; align-items:center; gap:5px; font-weight:800; font-size:13px; direction:ltr; }
.q-chg.up{ color:var(--q-up); } .q-chg.down{ color:var(--q-down); }
.q-chg .ic{ width:14px; height:14px; }
.q-spark-wrap{ height:118px; margin:6px -6px -8px; }
.q-ranges{ display:flex; gap:6px; margin-top:10px; }

.q-section{ margin:18px 2px 10px; display:flex; align-items:center; justify-content:space-between; }
.q-section h3{ font-size:14.5px; font-weight:800; }
.q-section a,.q-section button{ background:none; border:0; color:var(--q-blue2); font-size:12px; font-weight:700; cursor:pointer; }

.q-tri{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.q-mini{ padding:12px 10px; border-radius:18px; text-align:center; cursor:pointer; background:linear-gradient(150deg,#101d4acc,#0a1536e6); border:1px solid var(--q-line); transition:transform .35s var(--ease-pop),border-color .3s,box-shadow .3s; }
.q-mini:hover{ transform:translateY(-4px); border-color:#4d8bff88; box-shadow:0 14px 30px -16px #2f6bff; }
.q-mini .q-h{ display:flex; align-items:center; justify-content:center; gap:6px; font-weight:800; font-size:12.5px; }
.q-mini .q-p{ font-size:12px; margin-top:6px; }
.q-mini .ic{ width:16px; height:16px; flex:none; }
.q-mini .q-h{ white-space:nowrap; font-size:11.5px; }
.q-mini .q-sp{ display:block; height:30px; }
.bn-center .bn-lbl{ white-space:nowrap; }
.q-mini canvas{ height:30px!important; margin-top:4px; }

.q-tools{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.q-tool{ display:flex; flex-direction:column; align-items:center; gap:7px; padding:12px 4px 10px; border-radius:18px; cursor:pointer; background:linear-gradient(150deg,#101d4acc,#0a1536e6); border:1px solid var(--q-line); font-size:11px; font-weight:700; color:var(--text-dim); text-align:center; line-height:1.5; transition:transform .35s var(--ease-pop),border-color .3s,color .3s,box-shadow .3s; }
.q-tool:hover{ transform:translateY(-4px); color:#fff; border-color:#4d8bff88; box-shadow:0 14px 28px -14px #2f6bff; }
.q-tool .q-ti{ width:40px; height:40px; border-radius:14px; display:flex; align-items:center; justify-content:center; color:#fff; background:linear-gradient(145deg,#2f6bff55,#7a4dff44); border:1px solid #6ea0ff55; box-shadow:0 0 18px -6px #4d6bff; }
.q-tool .q-ti .ic{ width:20px; height:20px; }
.q-tool:nth-child(2) .q-ti{ background:linear-gradient(145deg,#27d6ee44,#2f6bff44); }
.q-tool:nth-child(3) .q-ti{ background:linear-gradient(145deg,#1fe08f44,#27d6ee33); }
.q-tool:nth-child(4) .q-ti{ background:linear-gradient(145deg,#ffc24d44,#ff6a8544); }

/* لیست‌های ارز */
.q-list{ display:flex; flex-direction:column; gap:9px; }
.q-row{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:18px; cursor:pointer; background:linear-gradient(150deg,#0f1c47b3,#0a1535d9); border:1px solid var(--q-line2); transition:transform .35s var(--ease-pop),border-color .3s,background .3s,box-shadow .3s; }
[data-theme="light"] .q-row,[data-theme="light"] .q-mini,[data-theme="light"] .q-tool{ background:#fff; }
.q-row:hover{ transform:translateX(-4px); border-color:#4d8bff77; background:#15275fcc; box-shadow:0 12px 26px -16px #2f6bff; }
.q-row:active{ transform:scale(.985); }
.q-row .q-id{ flex:1; min-width:0; }
.q-row .q-nm{ font-weight:800; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.q-row .q-sy{ font-size:11px; color:var(--text-faint); direction:ltr; text-align:right; }
.q-row .q-sp{ width:64px; height:30px; flex:none; }
.q-row .q-pr{ text-align:left; min-width:92px; }
.q-row .q-pr .p{ font-weight:800; font-size:13px; direction:ltr; }
.q-row .q-pr .c{ font-size:11.5px; font-weight:800; direction:ltr; }
.up,.q-up{ color:var(--q-up); } .down,.q-down{ color:var(--q-down); }

.q-search{ position:relative; margin-bottom:12px; }
.q-search .ic{ position:absolute; inset-inline-start:15px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--text-faint); pointer-events:none; }
.q-search input{ width:100%; padding:13px 44px 13px 14px; height:48px; border-radius:18px; font-size:13.5px; }
.q-filters{ display:flex; gap:8px; overflow-x:auto; padding:2px 1px 12px; scrollbar-width:none; }
.q-filters::-webkit-scrollbar{ display:none; }

/* جزئیات ارز */
.q-coin-top{ display:flex; align-items:center; gap:12px; margin:4px 2px 4px; }
.q-coin-top .q-id{ flex:1; }
.q-coin-top h2{ font-size:17px; font-weight:800; }
